# Pinned GitHub Actions registry for the CI workflow generator
# (devops/ci/generate_workflows.py).
#
# Every action referenced by a generated workflow resolves to a
# full-commit-SHA entry here, so generated workflows share one reviewed
# pin table instead of hand-pinning independently. The generator fails
# closed when a `uses` key is missing here or not pinned to a 40 character
# SHA.
#
# Scope note (WI-14): this registry enumerates every actions/* dependency
# used across ALL workflows in .github/workflows/ today, including the
# hand-written ones listed as `unmanaged` in workflows.toml. Only the entries
# consumed by workflows.toml's [[workflow]] blocks are resolved by the
# generator; the rest document the pins already in use elsewhere so a future
# migration has a ready-made table. Local composite actions
# (./.github/actions/*) are not pinned by SHA and are not listed here.

[checkout]
uses = "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"
comment = "v7.0.0"

