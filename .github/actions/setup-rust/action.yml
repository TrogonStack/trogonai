name: Setup Rust
description: Install the mise-pinned Rust toolchain and required rustup components

inputs:
  dylint-toolchain-dir:
    description: Directory containing the rust-toolchain.toml for repo Dylint rules
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

    - name: Install Rust components
      shell: bash
      run: mise run --skip-tools github-actions:rust-components

    - name: Install Dylint Rust components
      shell: bash
      env:
        DYLINT_TOOLCHAIN_DIR: ${{ inputs.dylint-toolchain-dir }}
      run: mise run --skip-tools github-actions:rust-dylint-toolchain
