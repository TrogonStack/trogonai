name: Enforce Cargo license
description: Validate Cargo workspace package license metadata

inputs:
  working-directory:
    description: Cargo workspace directory
    required: false
    default: rsworkspace
  expected-license:
    description: Expected SPDX license expression
    required: false
    default: Apache-2.0

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EXPECTED_LICENSE: ${{ inputs.expected-license }}
      run: |
        metadata_path="${RUNNER_TEMP:-/tmp}/cargo-metadata.json"
        cargo metadata --no-deps --format-version 1 > "$metadata_path"

        METADATA_PATH="$metadata_path" python3 <<'PY'
        import json
        import os
        import sys
        import tomllib

        with open(os.environ["METADATA_PATH"], encoding="utf-8") as metadata_file:
          metadata = json.load(metadata_file)

        expected_license = os.environ["EXPECTED_LICENSE"]
        violations = []

        for package in metadata["packages"]:
          with open(package["manifest_path"], "rb") as manifest_file:
            manifest = tomllib.load(manifest_file)
          declared_license = manifest.get("package", {}).get("license")
          if package.get("license") != expected_license or declared_license != expected_license:
            violations.append(
              f'{package["manifest_path"]}: license is {package.get("license") or "missing"}'
            )

        if violations:
          print(
            f'Every Rust crate must declare license = "{expected_license}" in Cargo.toml.',
            file=sys.stderr,
          )
          print("\n".join(violations), file=sys.stderr)
          sys.exit(1)
        PY
