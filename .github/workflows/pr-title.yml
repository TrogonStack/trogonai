name: PR Title Lint

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            chore
            feat
            refactor
            ci
          requireScope: false
          disallowScopes: ""
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            should start with a lowercase letter.
          ignoreLabels: |
            bot
            dependencies
            autorelease: pending
