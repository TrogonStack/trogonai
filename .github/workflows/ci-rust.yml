name: CI Rust

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Rebuilds the shared Rust caches on main without waiting for a Rust change.
  workflow_dispatch:

concurrency:
  group: ci-rust-${{ github.ref }}
  # main runs are the only ones that save the shared caches every PR restores.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  MISE_TASK_RUN_AUTO_INSTALL: 'false'
  # Source-built mise tools (dylint-link, cargo-component, ...) fetch crates from
  # crates.io during install; raise retry tolerance for spurious network errors.
  CARGO_NET_RETRY: '10'
  # Debug info is most of the test target; without it the saved caches fit the
  # repository cache quota instead of evicting each other.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

permissions:
  contents: read

jobs:
  changes:
    name: Select Rust checks
    uses: ./.github/workflows/ci-selection.yml
    permissions:
      contents: read
      pull-requests: read
      # Only the runner selection job uses it, to read the Baton key on main.
      id-token: write
    with:
      filters: .github/filters/ci.yml
      # Idle runners go to the first names, so these follow job duration, longest
      # first.
      runner-jobs: test build wasm-decider lint
  lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runners).lint }}
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          install-args: rust python cargo:cargo-dylint cargo:dylint-link cargo:cargo-deny
          dylint-toolchain-dir: rsworkspace/dylints/trogonai_dylint

      - name: Enforce crate licenses
        run: mise run --skip-tools github:workflows:ci-rust:enforce-cargo-license

      - name: Enforce TLS policy (ADR#0015)
        run: mise run --skip-tools github:workflows:ci-rust:tls-policy

      - name: Cache dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          workspaces: rsworkspace -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Summarize Rust cache
        run: mise run --skip-tools github:workflows:ci-rust:rust-cache-summary
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}

      - name: Check formatting
        run: mise run --skip-tools github:workflows:ci-rust:fmt

      - name: Test repo Rust policy lints
        run: mise run github:workflows:ci-rust:dylint-tests

      - name: Run repo Rust policy lints
        run: mise run --skip-tools github:workflows:ci-rust:rust-dylint

      - name: Run clippy
        run: mise run --skip-tools github:workflows:ci-rust:clippy

      - name: Run clippy (a2a-gateway, default features)
        run: mise run --skip-tools github:workflows:ci-rust:clippy-a2a-gateway

      - name: Run clippy (a2a-gateway, spicedb)
        run: mise run --skip-tools github:workflows:ci-rust:clippy-a2a-gateway-spicedb

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runners).test }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          install-args: rust python buf cargo:cargo-component cargo:wasm-tools

      - name: Cache dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Bumped with cache-workspace-crates: rust-cache leaves it out of the key
          # and skips saving after an exact hit, so main would keep the old cache.
          prefix-key: v2-rust
          workspaces: rsworkspace -> target
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Summarize Rust cache
        run: mise run --skip-tools github:workflows:ci-rust:rust-cache-summary
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}

      - name: Install coverage tools
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov,nextest

      - name: Install Rust coverage toolchain
        run: mise run --skip-tools github:workflows:ci-rust:coverage-toolchain

      - name: Build decider components for sim fixtures
        run: mise run github:workflows:ci-rust:wasm-components

      - name: Test gateway bootstrap identity
        run: mise run --skip-tools github:workflows:ci-rust:gateway-env-test

      - name: Run tests with coverage
        run: mise run --skip-tools github:workflows:ci-rust:coverage
        env:
          NEXTEST_PROFILE: ci
          # actions/checkout stamps every file with checkout time, so mtime
          # freshness would rebuild the cached workspace crates every run.
          CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'

      - name: Coverage report and gate
        # TODO: Add a fork-safe read-only coverage comparison path; this action writes to
        # _xml_coverage_reports, but fork PR tokens cannot push to the base repo.
        uses: ./.github/actions/coverage-report
        with:
          path: rsworkspace/coverage.xml
          threshold: 95
          fail: true
          publish: true
          diff: true
          diff-branch: main
          diff-storage: _xml_coverage_reports
          # Pull requests are the gate. main only records its baseline, which the
          # action stores only after the gate passes, so failing here once would
          # keep main red until coverage returned to the stale baseline.
          uncovered-statements-increase-failure: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'rust:coverage-baseline-reset') }}
          new-uncovered-statements-failure: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'rust:coverage-baseline-reset') }}
          coverage-rate-reduction-failure: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'rust:coverage-baseline-reset') }}
          togglable-report: true
          report-low-coverage-only: true

      - name: Prepare nested test targets for cache cleanup
        if: always()
        run: mise run --skip-tools github:workflows:ci-rust:test-targets

  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runners).build }}
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Cache dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          workspaces: rsworkspace -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Summarize Rust cache
        run: mise run --skip-tools github:workflows:ci-rust:rust-cache-summary
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}

      - name: Build release
        run: mise run --skip-tools github:workflows:ci-rust:build-release

  wasm-decider:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runners).wasm-decider }}
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          install-args: rust python buf cargo:cargo-component cargo:wasm-tools

      - name: Cache dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          workspaces: rsworkspace -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Summarize Rust cache
        run: mise run --skip-tools github:workflows:ci-rust:rust-cache-summary
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}

      - name: Build decider components
        run: mise run github:workflows:ci-rust:wasm-components

      - name: Assert zero imports and validate
        run: mise run github:workflows:ci-rust:wasm-validate

      - name: Run decider-test suites
        run: mise run github:workflows:ci-rust:decider-test-suites

      # decider-test-suites already runs the stable compile_fail check.
      - name: Run documentation tests
        run: mise run --skip-tools github:workflows:ci-rust:doc-tests

      - name: Test a2a-gateway (default features)
        run: mise run --skip-tools github:workflows:ci-rust:test-a2a-gateway

      - name: Run wasm decider runtime tests
        run: mise run --skip-tools github:workflows:ci-rust:test-decider-wasm-runtime

      - name: Run trogon-decider-nats live JetStream tests
        run: mise run --skip-tools github:workflows:ci-rust:test-decider-nats

  result:
    # Job names like lint and build repeat across workflows, and a skipped job
    # passes a required check even when a cancelled run skipped it, so branch
    # rules require this job instead of each Rust job.
    name: Rust result
    needs: [changes, lint, test, build, wasm-decider]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: false
          cache: false

      - name: Check Rust jobs
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.rust }}
          JOB_RESULTS: ${{ needs.lint.result }} ${{ needs.test.result }} ${{ needs.build.result }} ${{ needs.wasm-decider.result }}
        run: mise run --skip-tools github:workflows:ci-rust:result
