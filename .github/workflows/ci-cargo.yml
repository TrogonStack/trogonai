name: CI Cargo

# Runs the rsworkspace tests that Bazel tags manual or skips: trybuild, nested
# cargo builds, and tests that read files outside their Bazel package. Bazel
# runs everything else.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'rsworkspace/**'
      - 'devops/docker/compose/**'
      - 'proto/**'
      - '.config/mise/config.toml'
      - '.config/mise/mise.lock'
      - '.config/mise/tasks/artifacts/**'
      - '.config/mise/tasks/proto/**'
      - '.config/mise/tasks/rust/**'
      - '.github/actions/setup-rust/**'
      - '.config/mise/tasks/github/actions/setup-rust/**'
      - '.config/mise/tasks/github/workflows/ci-cargo/**'
      - '.github/workflows/ci-cargo.yml'

concurrency:
  group: ci-cargo-${{ github.ref }}
  # main runs are the only ones that save the cache every PR restores.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  MISE_TASK_RUN_AUTO_INSTALL: 'false'
  # Source-built mise tools (cargo-component, wasm-tools) fetch crates from
  # crates.io during install; raise retry tolerance for spurious network errors.
  CARGO_NET_RETRY: '10'
  # Debug info is most of the test target; without it the cache stays small.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

permissions:
  contents: read

jobs:
  bazel-manual-tests:
    name: Cargo-only tests
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          install-args: rust python buf cargo:cargo-component cargo:wasm-tools

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-cargo
          workspaces: rsworkspace -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build decider components
        run: mise run github:workflows:ci-cargo:wasm-components

      - name: Run the tests Bazel does not
        run: mise run --skip-tools github:workflows:ci-cargo:bazel-manual-tests
