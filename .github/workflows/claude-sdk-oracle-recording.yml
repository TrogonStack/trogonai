name: Claude SDK Oracle Recording

on:
  push:
    branches: [yordis/chore-claude-sdk-oracle-recording]

permissions:
  contents: read

env:
  FETCH_LIB: rsworkspace/crates/platform/trogon-claude-agent-sdk/.config/mise/lib/claude-sdk-freshness
  NATIVE_LIB: oracle-recording/native
  R3_NATIVE: "1"
  # The crate's own Python pin (.config/mise/tasks/claude-sdk/ftp-goldens); every oracle run checks it.
  R3_PYTHON: "3.12.16"
  MISE_VERSION: "2026.10.25"

jobs:
  refit:
    # Runs only when the head commit asks for it with `[refit]`.
    if: contains(github.event.head_commit.message, '[refit]')
    # Every fit unit natively: the host's own platform, real spawned programs (the real plutil on darwin, a real
    # reg.exe at the WSL path on linux) and the real clock, as the first call of a process and as a call within the
    # 30-minute window after it, from each caller context the resolve can start in.
    strategy:
      fail-fast: false
      matrix:
        host:
          - { runner: macos-latest, label: darwin-arm64 }
          - { runner: ubuntu-latest, label: linux-x64 }
          - { runner: ubuntu-24.04-arm, label: linux-arm64 }
        call: [first, second]
        context: [toplevel, timer, io, child_exit, immediate, nested]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      R3_CALL: ${{ matrix.call }}
      R3_CONTEXT: ${{ matrix.context }}
      R3_DISCOVERY: "1"
      R3_ONLY: "^(?!(band8|band8c|band8x|mg8x|mg8):)"
      SHARD: ${{ matrix.shard }}
      SHARDS: "4"
      R3_BAND_RUNS: "50"
      R3_ROUND4_PASSES: "60"
      R5_TOPUP_RUNS: "50"
      R5_CHAIN_PASSES: "100"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
          cache: false

      - name: Locate tools
        run: |
          # Outside the checkout, so mise reads no repository config.
          cd "$RUNNER_TEMP"
          mise install "python@$R3_PYTHON"
          py="$(mise exec "python@$R3_PYTHON" -- python3 -c 'import sys; print(sys.executable)' 2>/dev/null \
            || mise exec "python@$R3_PYTHON" -- python -c 'import sys; print(sys.executable)')"
          {
            echo "PY=$py"
            echo "NODE_BIN=$(node -p 'process.execPath')"
            echo "OUT=$RUNNER_TEMP/out"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"

      - name: Install reg.exe at the WSL path
        if: runner.os == 'Linux'
        run: |
          command -v rustc >/dev/null || { sudo apt-get update && sudo apt-get install -y rustc; }
          rustc --edition 2021 -O -o "$RUNNER_TEMP/reg.exe" "$NATIVE_LIB/registry_stand_in.rs"
          sudo install -D -m 0755 "$RUNNER_TEMP/reg.exe" /mnt/c/Windows/System32/reg.exe

      - name: Check the fixture bytes
        run: |
          bash oracle-recording/check_fixture_bytes.sh "$GITHUB_WORKSPACE" "$OUT"

      - name: Describe the host
        run: |
          {
            node -p 'JSON.stringify({version: process.version, platform: process.platform, arch: process.arch, v8: process.versions.v8, now: Date.now()})'
            "$PY" --version
            uname -a || true
            ls -l /mnt/c/Windows/System32/reg.exe /usr/bin/plutil 2>/dev/null || true
          } | tee "$OUT/host.txt"

      - name: Fetch the pinned package
        run: |
          "$PY" -I "$FETCH_LIB/fetch_pinned_typescript.py" "$RUNNER_TEMP/package"

      - name: Fit every unit natively
        run: |
          "$PY" -I oracle-recording/r3.py "$NATIVE_LIB" "$NODE_BIN" "$RUNNER_TEMP/package" "$OUT/r3.json" "$SHARD" "$SHARDS" 2> >(tee "$OUT/r3.log" >&2)

      - name: Keep the oracle output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-refit-${{ matrix.host.label }}-${{ matrix.call }}-${{ matrix.context }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 7

  windows:
    # The Windows native discovery: platform win32, SYSTEMROOT under each run root and the stand-in reg.exe a real
    # child spawned through execFile, every call position and caller context.
    if: contains(github.event.head_commit.message, '[refit]')
    strategy:
      fail-fast: false
      matrix:
        call: [first, second]
        context: [toplevel, timer, io, child_exit, immediate, nested]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      R3_CALL: ${{ matrix.call }}
      R3_CONTEXT: ${{ matrix.context }}
      SHARD: ${{ matrix.shard }}
      SHARDS: "8"
      R3_BAND_RUNS: "50"
      R3_ROUND4_PASSES: "60"
      R5_TOPUP_RUNS: "50"
      R5_CHAIN_PASSES: "100"
    steps:
      # Fixtures and goldens are read as committed, never with CRLF.
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
          cache: false

      - name: Locate tools
        run: |
          # Outside the checkout, so mise reads no repository config.
          cd "$RUNNER_TEMP"
          mise install "python@$R3_PYTHON"
          py="$(mise exec "python@$R3_PYTHON" -- python3 -c 'import sys; print(sys.executable)' 2>/dev/null \
            || mise exec "python@$R3_PYTHON" -- python -c 'import sys; print(sys.executable)')"
          {
            echo "PY=$py"
            echo "NODE_BIN=$(node -p 'process.execPath')"
            echo "OUT=$RUNNER_TEMP/out"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"

      - name: Build the reg.exe stand-in
        run: |
          rustc --edition 2021 -O -o "$RUNNER_TEMP/reg.exe" "$NATIVE_LIB/registry_stand_in.rs"
          echo "STUB=$RUNNER_TEMP/reg.exe" >> "$GITHUB_ENV"

      - name: Check the fixture bytes
        run: |
          bash oracle-recording/check_fixture_bytes.sh "$GITHUB_WORKSPACE" "$OUT"

      - name: Describe the host
        run: |
          {
            node -p 'JSON.stringify({version: process.version, platform: process.platform, arch: process.arch, v8: process.versions.v8, now: Date.now()})'
            "$PY" --version
            uname -a || true
          } | tee "$OUT/host.txt"

      - name: Fetch the pinned package
        run: |
          "$PY" -I "$FETCH_LIB/fetch_pinned_typescript.py" "$RUNNER_TEMP/package"

      - name: Fit every Windows unit natively
        run: |
          "$PY" -I oracle-recording/r3.py "$NATIVE_LIB" "$NODE_BIN" "$RUNNER_TEMP/package" "$OUT/r3.json" "$SHARD" "$SHARDS" 2> >(tee "$OUT/r3.log" >&2)

      - name: Keep the oracle output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-windows-${{ matrix.call }}-${{ matrix.context }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 7

  wsl:
    # The organization and held units under a real WSL 2 kernel: Node runs natively inside the distribution and the
    # SDK's own /proc/version read sees the kernel, which every org run asserts. The distribution is imported from a
    # pinned Ubuntu rootfs; oracle-recording/wsl_job.sh runs inside it.
    if: contains(github.event.head_commit.message, '[refit]')
    strategy:
      fail-fast: false
      matrix:
        call: [first, second]
        context: [toplevel, timer, io, child_exit, immediate, nested]
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      # The checkout is copied into the distribution, so it keeps the committed line endings.
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision WSL 2 with Ubuntu 24.04
        run: |
          $ErrorActionPreference = 'Stop'
          $rootfs = Join-Path $env:RUNNER_TEMP 'rootfs.tar.gz'
          Invoke-WebRequest -Uri 'https://cloud-images.ubuntu.com/wsl/releases/noble/20240423/ubuntu-noble-wsl-amd64-wsl.rootfs.tar.gz' -OutFile $rootfs
          $hash = (Get-FileHash $rootfs -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '8251e27ffff381a4af5f41dcb94d867de3e0d9774a9241908ab34555d99315ea') { throw "rootfs checksum $hash" }
          wsl --import oracle (Join-Path $env:RUNNER_TEMP 'wsl-oracle') $rootfs --version 2
          if ($LASTEXITCODE -ne 0) { throw "wsl --import exited $LASTEXITCODE" }
          wsl -d oracle -u root -e sh -c "printf '[automount]\nroot = /winmnt/\n[interop]\nappendWindowsPath = false\n' > /etc/wsl.conf"
          if ($LASTEXITCODE -ne 0) { throw "wsl.conf exited $LASTEXITCODE" }
          wsl --terminate oracle
          wsl --list --verbose

      - name: Fit the organization units under WSL
        run: |
          $checkout = (wsl -d oracle -u root -e wslpath -u "$env:GITHUB_WORKSPACE").Trim()
          $out = (wsl -d oracle -u root -e wslpath -u "$env:RUNNER_TEMP").Trim() + '/wsl-out'
          wsl -d oracle -u root -e bash -euo pipefail "$checkout/oracle-recording/wsl_job.sh" refit $checkout $out '${{ matrix.call }}' '${{ matrix.context }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep the oracle output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-wsl-${{ matrix.call }}-${{ matrix.context }}
          path: ${{ runner.temp }}/wsl-out
          if-no-files-found: warn
          retention-days: 7

  goldens:
    # Every golden recorder natively, through record.py, starting from the committed golden of the host so each
    # change shows as a diff.
    strategy:
      fail-fast: false
      matrix:
        host:
          - { runner: macos-latest, label: darwin-arm64, suffix: "" }
          - { runner: ubuntu-latest, label: linux-x64, suffix: _linux_x64 }
          - { runner: ubuntu-24.04-arm, label: linux-arm64, suffix: _linux_arm64 }
        call: [first, second]
        context: [toplevel, timer, io, child_exit, immediate, nested]
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      R3_CALL: ${{ matrix.call }}
      R3_CONTEXT: ${{ matrix.context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
          cache: false

      - name: Locate tools
        run: |
          # Outside the checkout, so mise reads no repository config.
          cd "$RUNNER_TEMP"
          mise install "python@$R3_PYTHON"
          py="$(mise exec "python@$R3_PYTHON" -- python3 -c 'import sys; print(sys.executable)')"
          {
            echo "PY=$py"
            echo "NODE_BIN=$(node -p 'process.execPath')"
            echo "OUT=$RUNNER_TEMP/out"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out/goldens"

      - name: Install reg.exe at the WSL path
        if: runner.os == 'Linux'
        run: |
          command -v rustc >/dev/null || { sudo apt-get update && sudo apt-get install -y rustc; }
          rustc --edition 2021 -O -o "$RUNNER_TEMP/reg.exe" "$NATIVE_LIB/registry_stand_in.rs"
          sudo install -D -m 0755 "$RUNNER_TEMP/reg.exe" /mnt/c/Windows/System32/reg.exe

      - name: Check the fixture bytes
        run: |
          bash oracle-recording/check_fixture_bytes.sh "$GITHUB_WORKSPACE" "$OUT"

      - name: Describe the host
        run: |
          {
            node -p 'JSON.stringify({version: process.version, platform: process.platform, arch: process.arch, v8: process.versions.v8, now: Date.now()})'
            "$PY" --version
            uname -a || true
          } | tee "$OUT/host.txt"

      - name: Fetch the pinned packages
        run: |
          "$PY" -I "$FETCH_LIB/fetch_pinned_typescript.py" "$RUNNER_TEMP/package"
          "$PY" -I "$FETCH_LIB/fetch_pinned_python.py" "$RUNNER_TEMP/python"
          "$PY" -m venv "$RUNNER_TEMP/venv"
          "$PY" -c 'import sys, tomllib; print("\n".join(tomllib.load(open(sys.argv[1], "rb"))["project"]["dependencies"]))' \
            "$RUNNER_TEMP/python/pyproject.toml" > "$RUNNER_TEMP/requirements.txt"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --no-cache-dir --disable-pip-version-check -r "$RUNNER_TEMP/requirements.txt"
          echo "PYTHON_SDK=$RUNNER_TEMP/python/src" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/venv/bin/python" --version | tee -a "$OUT/host.txt"

      - name: Record every golden natively
        run: |
          failed=0
          record() {
            local recorder="$1" golden="$2"
            cp "$NATIVE_LIB/committed/$golden" "$OUT/goldens/$golden"
            if ! "$RUNNER_TEMP/venv/bin/python" -I "$NATIVE_LIB/record.py" "$recorder" "$OUT/goldens/$golden.tally.json" \
                "$NODE_BIN" "$RUNNER_TEMP/package" "$OUT/goldens/$golden" 2> >(tee "$OUT/goldens/$golden.log" >&2); then
              echo "$recorder failed" | tee -a "$OUT/goldens/failures.txt"
              failed=1
            fi
            diff -u "$NATIVE_LIB/committed/$golden" "$OUT/goldens/$golden" > "$OUT/goldens/$golden.diff" || true
          }
          record ts_settings_depth_goldens.py "ts_settings_depth${{ matrix.host.suffix }}.json"
          record ts_managed_settings_goldens.py "ts_managed_settings${{ matrix.host.suffix }}.json"
          record ts_settings_merge_goldens.py ts_settings_merge.json
          record ts_settings_file_goldens.py ts_settings_files.json
          record settings_stand_in_goldens.py settings_stand_ins.json
          exit "$failed"

      - name: Keep the recorded goldens
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-goldens-${{ matrix.host.label }}-${{ matrix.call }}-${{ matrix.context }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 7

  wsl-goldens:
    # The managed organization goldens under a real WSL 2 kernel, starting from the committed linux x64 golden.
    strategy:
      fail-fast: false
      matrix:
        call: [first, second]
        context: [toplevel, timer, io, child_exit, immediate, nested]
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      # The checkout is copied into the distribution, so it keeps the committed line endings.
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision WSL 2 with Ubuntu 24.04
        run: |
          $ErrorActionPreference = 'Stop'
          $rootfs = Join-Path $env:RUNNER_TEMP 'rootfs.tar.gz'
          Invoke-WebRequest -Uri 'https://cloud-images.ubuntu.com/wsl/releases/noble/20240423/ubuntu-noble-wsl-amd64-wsl.rootfs.tar.gz' -OutFile $rootfs
          $hash = (Get-FileHash $rootfs -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '8251e27ffff381a4af5f41dcb94d867de3e0d9774a9241908ab34555d99315ea') { throw "rootfs checksum $hash" }
          wsl --import oracle (Join-Path $env:RUNNER_TEMP 'wsl-oracle') $rootfs --version 2
          if ($LASTEXITCODE -ne 0) { throw "wsl --import exited $LASTEXITCODE" }
          wsl -d oracle -u root -e sh -c "printf '[automount]\nroot = /winmnt/\n[interop]\nappendWindowsPath = false\n' > /etc/wsl.conf"
          if ($LASTEXITCODE -ne 0) { throw "wsl.conf exited $LASTEXITCODE" }
          wsl --terminate oracle
          wsl --list --verbose

      - name: Record the organization goldens under WSL
        run: |
          $checkout = (wsl -d oracle -u root -e wslpath -u "$env:GITHUB_WORKSPACE").Trim()
          $out = (wsl -d oracle -u root -e wslpath -u "$env:RUNNER_TEMP").Trim() + '/wsl-out'
          wsl -d oracle -u root -e bash -euo pipefail "$checkout/oracle-recording/wsl_job.sh" goldens $checkout $out '${{ matrix.call }}' '${{ matrix.context }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep the recorded goldens
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-wsl-goldens-${{ matrix.call }}-${{ matrix.context }}
          path: ${{ runner.temp }}/wsl-out
          if-no-files-found: warn
          retention-days: 7
