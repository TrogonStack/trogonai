          persist-credentials: false

      - name: Provision WSL 2 with Ubuntu 24.04
        run: |
          $ErrorActionPreference = 'Stop'
          $rootfs = Join-Path $env:RUNNER_TEMP 'rootfs.tar.gz'
          Invoke-WebRequest -Uri 'https://cloud-images.ubuntu.com/wsl/releases/noble/20240423/ubuntu-noble-wsl-amd64-wsl.rootfs.tar.gz' -OutFile $rootfs
          $hash = (Get-FileHash $rootfs -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '8251e27ffff381a4af5f41dcb94d867de3e0d9774a9241908ab34555d99315ea') { throw "rootfs checksum $hash" }
          wsl --import oracle (Join-Path $env:RUNNER_TEMP 'wsl-oracle') $rootfs --version 2
          if ($LASTEXITCODE -ne 0) { throw "wsl --import exited $LASTEXITCODE" }
          wsl -d oracle -u root -e sh -c "printf '[automount]\nroot = /winmnt/\n[interop]\nappendWindowsPath = false\n' > /etc/wsl.conf"
          if ($LASTEXITCODE -ne 0) { throw "wsl.conf exited $LASTEXITCODE" }
          wsl --terminate oracle
          wsl --list --verbose

      - name: Record the organization goldens under WSL
        run: |
          $checkout = (wsl -d oracle -u root -e wslpath -u "$env:GITHUB_WORKSPACE").Trim()
          $out = (wsl -d oracle -u root -e wslpath -u "$env:RUNNER_TEMP").Trim() + '/wsl-out'
          wsl -d oracle -u root -e bash -euo pipefail "$checkout/oracle-recording/wsl_job.sh" mg37 $checkout $out '${{ matrix.call }}' toplevel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep the oracle output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-wsl-mg37-${{ matrix.call }}
          path: ${{ runner.temp }}/wsl-out
          if-no-files-found: warn
          retention-days: 7
