  replay54:
    # Runs only when the head commit asks for it with `[replay54]`: the byte-exact replay of job 54's native band40 process
    # for the drop_merge pair (ruling 45 step 2), as registered in registration.md before the run. One job per host and call
    # position takes the driver from this commit, then checks out cbe37448cc (the commit job 54 ran) in the same workspace and
    # runs job 54's own steps and r3.py code from it, adding only the V8 function event log flags. Its output is evidence for
    # the process-history model and never becomes a golden.
    if: contains(github.event.head_commit.message, '[replay54]')
    strategy:
      fail-fast: false
      matrix:
        host:
          - { runner: macos-latest, label: darwin-arm64 }
          - { runner: ubuntu-latest, label: linux-x64 }
          - { runner: ubuntu-24.04-arm, label: linux-arm64 }
        call: [first, second]
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      # Job 54's environment (band40 job, cbe37448cc workflow lines 736-742), one call position per job as there.
      R3_CALL: ${{ matrix.call }}
      R3_CONTEXT: toplevel
      R3_ONLY: "^(pm8:|band40:)"
      R3_EVERY_SHARD: "1"
      # Job 54 ran the drop_merge pair in shard 5 of 16 on every host and call (run log, "SHARD: 5").
      SHARD: "5"
      SHARDS: "16"
    steps:
      # The driver comes from this commit; the tree the process runs from is job 54's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Keep the driver outside the tree
        run: |
          mkdir -p "$RUNNER_TEMP/replay-driver"
          cp oracle-recording/replay54.py oracle-recording/analyze_r.py "$RUNNER_TEMP/replay-driver/"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cbe37448ccda150826db4a536e6c825386620ded
          persist-credentials: false

      - name: Check the tree is job 54's
        run: |
          test "$(git rev-parse HEAD)" = cbe37448ccda150826db4a536e6c825386620ded
          test ! -e oracle-recording/replay54.py

      # The steps below are job 54's band40 steps (cbe37448cc workflow lines 744-799), unchanged.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
          cache: false

      - name: Locate tools
        run: |
          # Outside the checkout, so mise reads no repository config.
          cd "$RUNNER_TEMP"
          mise install "python@$R3_PYTHON"
          py="$(mise exec "python@$R3_PYTHON" -- python3 -c 'import sys; print(sys.executable)' 2>/dev/null \
            || mise exec "python@$R3_PYTHON" -- python -c 'import sys; print(sys.executable)')"
          {
            echo "PY=$py"
            echo "NODE_BIN=$(node -p 'process.execPath')"
            echo "OUT=$RUNNER_TEMP/out"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"

      - name: Install reg.exe at the WSL path
        if: runner.os == 'Linux'
        run: |
          command -v rustc >/dev/null || { sudo apt-get update && sudo apt-get install -y rustc; }
          rustc --edition 2021 -O -o "$RUNNER_TEMP/reg.exe" "$NATIVE_LIB/registry_stand_in.rs"
          sudo install -D -m 0755 "$RUNNER_TEMP/reg.exe" /mnt/c/Windows/System32/reg.exe

      - name: Check the fixture bytes
        run: |
          bash oracle-recording/check_fixture_bytes.sh "$GITHUB_WORKSPACE" "$OUT"

      - name: Describe the host
        run: |
          {
            node -p 'JSON.stringify({version: process.version, platform: process.platform, arch: process.arch, v8: process.versions.v8, now: Date.now()})'
            "$PY" --version
            uname -a || true
            ls -l /mnt/c/Windows/System32/reg.exe /usr/bin/plutil 2>/dev/null || true
          } | tee "$OUT/host.txt"

      - name: Fetch the pinned package
        run: |
          "$PY" -I "$FETCH_LIB/fetch_pinned_typescript.py" "$RUNNER_TEMP/package"

      # Job 54's r3 step, the same command line (run log), from job 54's tree: the exact leg for P-R1.
      - name: Run job 54's band step
        run: |
          "$PY" -I oracle-recording/r3.py "$NATIVE_LIB" "$NODE_BIN" "$RUNNER_TEMP/package" "$OUT/r3.json" "$SHARD" "$SHARDS" 2> >(tee "$OUT/r3.log" >&2)

      - name: Describe the logging flags
        run: |
          # The V8 flags the logged leg adds, as this Node lists them (the job fails when Node does not list one).
          node --v8-options > "$OUT/v8-options.txt"
          grep -n -E -A1 '^ +--(log-function-events|logfile|logfile-per-isolate)( |$)' "$OUT/v8-options.txt" | tee "$OUT/v8-flags.txt"
          test "$(grep -c -E '^ +--(log-function-events|logfile|logfile-per-isolate)( |$)' "$OUT/v8-options.txt")" = 3

      - name: Replay the band process
        run: |
          "$PY" -I "$RUNNER_TEMP/replay-driver/replay54.py" "$NATIVE_LIB" "$NODE_BIN" "$RUNNER_TEMP/package" "$OUT/replay54.json" "$GITHUB_WORKSPACE" 2> >(tee "$OUT/replay54.log" >&2)

      - name: Keep the oracle output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-replay54-${{ matrix.host.label }}-${{ matrix.call }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 14

  model40:
    # Runs only when the head commit asks for it with `[model40]`: what the crate's stage model answers, with the catches
    # it notes, at every offset on the 16-byte grid of each context's interval (PLAN Update 106), for the groups in
    # oracle-recording/model40/scan.jsonl, on the main commit the goldens branch starts from with its patch applied.
    # It also scans the job 47 and job 53 second-call rows (val45.jsonl) and the hist43b and hist43c process-history
    # cells (cells45.jsonl), the validation sets registered for R43-3a (ruling 45 step 1).
    if: contains(github.event.head_commit.message, '[model40]')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cbd2b2fc3ce8d4d9513efc9d09e1aa755987f971
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: scratch
          persist-credentials: false

      - name: Apply the goldens patch
        run: |
          git apply scratch/oracle-recording/model40/model40.patch
          git status --short | wc -l

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Scan the model
        working-directory: rsworkspace
        env:
          SCAN40_ROWS: ${{ github.workspace }}/scratch/oracle-recording/model40/scan.jsonl
          SCAN40_OUT: ${{ runner.temp }}/out/scan-${{ matrix.shard }}.jsonl
          SCAN40_SHARD: ${{ matrix.shard }}
          SCAN40_SHARDS: "4"
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cargo test --release -p trogon-claude-agent-sdk --lib scan40 -- --nocapture 2> >(tee "$RUNNER_TEMP/out/scan.log" >&2)

      - name: Scan the job 47 and job 53 second-call rows
        if: always()
        working-directory: rsworkspace
        env:
          SCAN40_ROWS: ${{ github.workspace }}/scratch/oracle-recording/model40/val45.jsonl
          SCAN40_OUT: ${{ runner.temp }}/out/val-${{ matrix.shard }}.jsonl
          SCAN40_SHARD: ${{ matrix.shard }}
          SCAN40_SHARDS: "4"
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cargo test --release -p trogon-claude-agent-sdk --lib scan40 -- --nocapture 2> >(tee "$RUNNER_TEMP/out/val.log" >&2)

      - name: Scan the process-history cells
        if: always()
        working-directory: rsworkspace
        env:
          SCAN45_ROWS: ${{ github.workspace }}/scratch/oracle-recording/model40/cells45.jsonl
          SCAN45_OUT: ${{ runner.temp }}/out/cells-${{ matrix.shard }}.jsonl
          SCAN45_SHARD: ${{ matrix.shard }}
          SCAN45_SHARDS: "4"
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cargo test --release -p trogon-claude-agent-sdk --lib scan45 -- --nocapture 2> >(tee "$RUNNER_TEMP/out/cells.log" >&2)

      - name: Scan the job 55 rows
        # Ruling 46 rule 2 and Ruling 47: the held-out second-call rows with their primes, once job 55 has recorded them.
        # The rows ship gzipped: the plain file is over the host's per-file limit.
        if: always() && hashFiles('scratch/oracle-recording/model40/j55.jsonl.gz') != ''
        working-directory: rsworkspace
        env:
          SCAN40_ROWS: ${{ runner.temp }}/j55.jsonl
          SCAN40_OUT: ${{ runner.temp }}/out/j55-${{ matrix.shard }}.jsonl
          SCAN40_SHARD: ${{ matrix.shard }}
          SCAN40_SHARDS: "4"
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          gunzip -c "$GITHUB_WORKSPACE/scratch/oracle-recording/model40/j55.jsonl.gz" > "$SCAN40_ROWS"
          cargo test --release -p trogon-claude-agent-sdk --lib scan40 -- --nocapture 2> >(tee "$RUNNER_TEMP/out/j55.log" >&2)

      - name: Run the crate's own tests
        if: always()
        continue-on-error: true
        working-directory: rsworkspace
        run: |
          cargo test --release -p trogon-claude-agent-sdk 2>&1 | tee "$RUNNER_TEMP/out/tests.log"

      - name: Keep the model output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model40-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 7

  score55:
    # Runs only when the head commit asks for it with `[score55]`: the job 55 rows of model40 shards 1 and 2, which the
    # scoring run lost to the job timeout, rescanned as evidence only. The rows are split into 16 shards by the same
    # index rule as scan40; shards 1, 2, 5, 6, 9, 10, 13 and 14 of 16 hold exactly the rows of shards 1 and 2 of 4.
    # Only the scan runs, and its output is kept before anything else, so no shard reaches the job timeout.
    if: contains(github.event.head_commit.message, '[score55]')
