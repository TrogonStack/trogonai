name: cd / canary container images

on:
  push:
    branches:
      - main

# A canary build takes longer than the gap between pushes to main. Cancelling
# the in-progress run meant the image never finished publishing. A queued run
# for an older commit exits before it builds, so only the tip of the branch
# publishes, and a build that has started is left to finish.
concurrency:
  group: canary-container-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  id-token: write
  packages: write

# The binaries restore the CI Rust release cache, whose key hashes these
# variables. Keep them identical to ci-rust.yml or every build starts cold.
env:
  CARGO_TERM_COLOR: always
  MISE_TASK_RUN_AUTO_INSTALL: 'false'
  CARGO_NET_RETRY: '10'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  binary:
    name: Binary (${{ matrix.service }}, ${{ matrix.arch }})
    # Native runners: compiling arm64 under emulation took over an hour.
    # Pinned to 24.04 so the glibc the binaries need stays below the runtime image's.
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ghcr.io/trogonstack/images/trogonai/${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - trogon-gateway
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
          cache: false

      - name: Skip when this commit is no longer the branch tip
        id: tip
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: mise run --skip-tools github:workflows:canary-container-images:canary-is-branch-tip

      - name: Log in to GHCR
        if: steps.tip.outputs.current == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this commit is already published
        if: steps.tip.outputs.current == 'true'
        id: published
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.sha }}
        run: mise run --skip-tools github:workflows:canary-container-images:image-published

      - name: Setup Rust
        if: steps.published.outputs.published == 'false'
        uses: ./.github/actions/setup-rust

      - name: Cache dependencies
        if: steps.published.outputs.published == 'false'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          # The CI Rust build job's key: amd64 restores the release dependencies
          # main already compiled. arm64 has no CI build, so it saves its own.
          shared-key: build
          workspaces: rsworkspace -> target
          save-if: ${{ matrix.arch == 'arm64' }}

      - name: Build release binary
        if: steps.published.outputs.published == 'false'
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_ARCH: ${{ matrix.arch }}
          OUTPUT_DIR: ${{ runner.temp }}/image-binaries
        run: mise run --skip-tools github:workflows:canary-container-images:image-binary

      - name: Upload release binary
        if: steps.published.outputs.published == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-binary-${{ matrix.service }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-binaries
          if-no-files-found: error
          retention-days: 1

  build-and-push:
    name: Build and push (${{ matrix.service }})
    needs: binary
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/trogonstack/images/trogonai/${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - trogon-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
          cache: false

      - name: Skip when this commit is no longer the branch tip
        id: tip
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: mise run --skip-tools github:workflows:canary-container-images:canary-is-branch-tip

      - name: Set up Docker Buildx
        if: steps.tip.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.tip.outputs.current == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this commit is already published
        if: steps.tip.outputs.current == 'true'
        id: published
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.sha }}
        run: mise run --skip-tools github:workflows:canary-container-images:image-published

      - name: Resolve image metadata
        if: steps.published.outputs.published == 'false'
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=canary
            type=sha,format=long,prefix=

      - name: Download release binaries
        if: steps.published.outputs.published == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-binary-${{ matrix.service }}-*
          path: ${{ runner.temp }}/image-binaries
          merge-multiple: true

      - name: Build and push canary image
        if: steps.published.outputs.published == 'false'
        id: build_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: devops/docker/images/${{ matrix.service }}/Dockerfile
          target: prebuilt
          build-contexts: binaries=${{ runner.temp }}/image-binaries
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.service }}-canary
          cache-to: type=gha,scope=${{ matrix.service }}-canary,mode=max
          sbom: true
          provenance: mode=max

      - name: Resolve image digest
        if: steps.tip.outputs.current == 'true'
        id: image
        env:
          DIGEST: ${{ steps.published.outputs.digest || steps.build_image.outputs.digest }}
        run: mise run --skip-tools github:workflows:canary-container-images:image-digest

      - name: Scan image for vulnerabilities
        if: steps.tip.outputs.current == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          scanners: vuln
          format: table
          output: trivy-results.txt
          ignore-unfixed: true
          exit-code: 0

      - name: Generate SBOM
        if: steps.tip.outputs.current == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          artifact-name: sbom-${{ matrix.service }}-spdx
          format: spdx-json

      - name: Document image security audit
        if: steps.tip.outputs.current == 'true'
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_NAME: ${{ env.IMAGE }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RUNTIME_BASE: debian:trixie-20261104-slim
        run: mise run --skip-tools github:workflows:canary-container-images:image-audit-summary