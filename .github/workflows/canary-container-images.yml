name: cd / canary container images

on:
  push:
    branches:
      - main

# A canary build takes longer than the gap between pushes to main. Cancelling
# the in-progress run meant the image never finished publishing. A queued run
# for an older commit exits before it builds, so only the tip of the branch
# publishes, and a build that has started is left to finish.
concurrency:
  group: canary-container-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  id-token: write
  packages: write

# The release cache key hashes these variables, so changing them starts every
# build cold.
env:
  CARGO_TERM_COLOR: always
  MISE_TASK_RUN_AUTO_INSTALL: 'false'
  CARGO_NET_RETRY: '10'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  binary:
    name: Binary (${{ matrix.service }}, ${{ matrix.arch }})
    # Native runners: compiling arm64 under emulation took over an hour.
    # Pinned to 24.04 so the glibc the binaries need stays below the runtime image's.
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ghcr.io/trogonstack/images/trogonai/${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - trogon-gateway
          - trogon-sandbox-aca-worker
          - trogon-sandbox-actor-agent
          - trogon-sandbox-broker
          - trogon-sandbox-credential-broker
          - trogon-sandbox-dashboard
          - trogon-sandbox-daytona-worker
          - trogon-sandbox-docker-worker
          - trogon-sandbox-egress-proxy
          - trogon-sandbox-hyperlight-worker
          - trogon-sandbox-k8s-worker
          - trogon-sandbox-kubevirt-worker
          - trogon-sandbox-modal-worker
          - trogon-sandbox-snapshot-builder
          - trogon-sandbox-ssh-gateway
          - trogon-sandbox-subprocess-worker
          - trogon-sandbox-substrate-worker
          - trogon-sandbox-ws-gateway
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          # Images whose binaries are not one binary named after the image.
          - service: trogon-sandbox-egress-proxy
            binaries: trogon-sandbox-egress-proxy:trogon-sandbox-egress-proxyd
          - service: trogon-sandbox-subprocess-worker
            binaries: >-
              trogon-sandbox-subprocess-worker:trogon-sandbox-subprocess-worker
              trogon-sandbox-egress-proxy:trogon-sandbox-egress-proxyd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: false
          cache: false

      - name: Skip when this commit is no longer the branch tip
        id: tip
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: mise run --skip-tools github:workflows:canary-container-images:canary-is-branch-tip

      - name: Log in to GHCR
        if: steps.tip.outputs.current == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this commit is already published
        if: steps.tip.outputs.current == 'true'
        id: published
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.sha }}
        run: mise run --skip-tools github:workflows:canary-container-images:image-published

      - name: Setup Rust
        if: steps.published.outputs.published == 'false'
        uses: ./.github/actions/setup-rust

      - name: Cache dependencies
        if: steps.published.outputs.published == 'false'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          # No other workflow builds the release profile any more, so each arch
          # saves the release dependencies its next run restores.
          shared-key: build
          workspaces: rsworkspace -> target

      - name: Build release binary
        if: steps.published.outputs.published == 'false'
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_ARCH: ${{ matrix.arch }}
          IMAGE_BINARIES: ${{ matrix.binaries }}
          OUTPUT_DIR: ${{ runner.temp }}/image-binaries
        run: mise run --skip-tools github:workflows:canary-container-images:image-binary

      - name: Upload release binary
        if: steps.published.outputs.published == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-binary-${{ matrix.service }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-binaries
          if-no-files-found: error
          retention-days: 1

  build-and-push:
    name: Build and push (${{ matrix.service }})
    needs: binary
    # One image's failed binary must not hold back the others. An image whose
    # binary is missing fails at its own build step.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/trogonstack/images/trogonai/${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - sandbox-agent
          - sandbox-browser
          - trogon-gateway
          - trogon-sandbox-aca-worker
          - trogon-sandbox-actor-agent
          - trogon-sandbox-broker
          - trogon-sandbox-credential-broker
          - trogon-sandbox-dashboard
          - trogon-sandbox-daytona-worker
          - trogon-sandbox-docker-worker
          - trogon-sandbox-egress-proxy
          - trogon-sandbox-hyperlight-worker
          - trogon-sandbox-k8s-worker
          - trogon-sandbox-kubevirt-worker
          - trogon-sandbox-modal-worker
          - trogon-sandbox-snapshot-builder
          - trogon-sandbox-ssh-gateway
          - trogon-sandbox-subprocess-worker
          - trogon-sandbox-substrate-worker
          - trogon-sandbox-ws-gateway
        include:
          # Images with no Rust binary: built from their Dockerfile alone and
          # checked for their tooling before they are pushed.
          - service: sandbox-agent
            tooling: true
          - service: sandbox-browser
            tooling: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: false
          cache: false

      - name: Skip when this commit is no longer the branch tip
        id: tip
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: mise run --skip-tools github:workflows:canary-container-images:canary-is-branch-tip

      - name: Set up Docker Buildx
        if: steps.tip.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.tip.outputs.current == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this commit is already published
        if: steps.tip.outputs.current == 'true'
        id: published
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.sha }}
        run: mise run --skip-tools github:workflows:canary-container-images:image-published

      - name: Resolve image metadata
        if: steps.published.outputs.published == 'false'
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=canary
            type=sha,format=long,prefix=

      - name: Download release binaries
        if: steps.published.outputs.published == 'false' && !matrix.tooling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-binary-${{ matrix.service }}-*
          path: ${{ runner.temp }}/image-binaries
          merge-multiple: true

      # Build for the runner's platform first and check the tooling the image
      # promises.
      - name: Build image for the tooling check
        if: steps.published.outputs.published == 'false' && matrix.tooling
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: devops/docker/images/${{ matrix.service }}/Dockerfile
          load: true
          tags: ${{ matrix.service }}:check
          cache-from: type=gha,scope=${{ matrix.service }}-canary
          cache-to: type=gha,scope=${{ matrix.service }}-canary,mode=max

      - name: Check the image tooling
        if: steps.published.outputs.published == 'false' && matrix.tooling
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_REF: ${{ matrix.service }}:check
        run: mise run --skip-tools github:workflows:canary-container-images:check-image-tooling

      - name: Build and push tooling image
        if: steps.published.outputs.published == 'false' && matrix.tooling
        id: build_tooling_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: devops/docker/images/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.service }}-canary
          cache-to: type=gha,scope=${{ matrix.service }}-canary,mode=max
          sbom: true
          provenance: mode=max

      - name: Build and push canary image
        if: steps.published.outputs.published == 'false' && !matrix.tooling
        id: build_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: devops/docker/images/${{ matrix.service }}/Dockerfile
          target: prebuilt
          build-contexts: binaries=${{ runner.temp }}/image-binaries
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.service }}-canary
          cache-to: type=gha,scope=${{ matrix.service }}-canary,mode=max
          sbom: true
          provenance: mode=max

      - name: Resolve image digest
        if: steps.tip.outputs.current == 'true'
        id: image
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.published.outputs.digest || steps.build_image.outputs.digest || steps.build_tooling_image.outputs.digest }}
          DIGEST_DIR: ${{ runner.temp }}/image-digests
        run: mise run --skip-tools github:workflows:canary-container-images:image-digest

      # The charts of this commit default to these digests, so the chart job
      # reads them instead of looking the tags up again.
      - name: Upload image digest
        if: steps.tip.outputs.current == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.service }}
          path: ${{ runner.temp }}/image-digests
          if-no-files-found: error
          retention-days: 1

      - name: Scan image for vulnerabilities
        if: steps.tip.outputs.current == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          scanners: vuln
          format: table
          output: trivy-results.txt
          ignore-unfixed: true
          exit-code: 0

      - name: Generate SBOM
        if: steps.tip.outputs.current == 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          artifact-name: sbom-${{ matrix.service }}-spdx
          format: spdx-json

      - name: Document image security audit
        if: steps.tip.outputs.current == 'true'
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_NAME: ${{ env.IMAGE }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RUNTIME_BASE: debian:trixie-20261104-slim
        run: mise run --skip-tools github:workflows:canary-container-images:image-audit-summary

  # Publishes every chart under devops/helm/charts as 0.0.0-sha-<commit>, with
  # the digests of the images this run built or found already published.
  publish-charts:
    name: Publish charts
    needs: build-and-push
    if: ${{ needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: false
          install_args: aqua:helm/helm aqua:mikefarah/yq aqua:oras-project/oras

      - name: Skip when this commit is no longer the branch tip
        id: tip
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: mise run --skip-tools github:workflows:canary-container-images:canary-is-branch-tip

      - name: Download image digests
        if: steps.tip.outputs.current == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/image-digests
          merge-multiple: true

      - name: Publish charts
        if: steps.tip.outputs.current == 'true'
        env:
          COMMIT: ${{ github.sha }}
          DIGEST_DIR: ${{ runner.temp }}/image-digests
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: mise run --skip-tools github:workflows:canary-container-images:publish-charts
