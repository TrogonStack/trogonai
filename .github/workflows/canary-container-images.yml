name: cd / canary container images

on:
  push:
    branches:
      - main

# A canary build takes longer than the gap between pushes to main. Cancelling
# the in-progress run meant the image never finished publishing. A queued run
# for an older commit exits before it builds, so only the tip of the branch
# publishes, and a build that has started is left to finish.
concurrency:
  group: canary-container-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  id-token: write
  packages: write

jobs:
  build-and-push:
    name: Build and push (${{ matrix.service }})
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/trogonstack/images/trogonai/${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - trogon-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Skip when this commit is no longer the branch tip
        id: tip
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --depth=1 origin "${{ github.ref_name }}"
          tip="$(git rev-parse "origin/${{ github.ref_name }}")"
          if [ "$tip" = "${{ github.sha }}" ]; then
            echo "current=true" >>"$GITHUB_OUTPUT"
          else
            echo "current=false" >>"$GITHUB_OUTPUT"
            echo "${{ github.sha }} is behind $tip; not publishing"
          fi

      - name: Install mise
        if: steps.tip.outputs.current == 'true'
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: false
          cache: false

      - name: Set up Docker Buildx
        if: steps.tip.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.tip.outputs.current == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this commit is already published
        if: steps.tip.outputs.current == 'true'
        id: published
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.sha }}
        run: mise run --skip-tools github-actions:image-published

      - name: Resolve image metadata
        if: steps.published.outputs.published == 'false'
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=canary
            type=sha,format=long,prefix=

      - name: Build and push canary image
        if: steps.published.outputs.published == 'false'
        id: build_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: devops/docker/images/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.service }}-canary
          cache-to: type=gha,scope=${{ matrix.service }}-canary,mode=max
          sbom: true
          provenance: mode=max

      - name: Resolve image digest
        if: steps.tip.outputs.current == 'true'
        id: image
        env:
          DIGEST: ${{ steps.published.outputs.digest || steps.build_image.outputs.digest }}
        run: echo "digest=${DIGEST}" >>"$GITHUB_OUTPUT"

      - name: Scan image for vulnerabilities
        if: steps.tip.outputs.current == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          scanners: vuln
          format: table
          output: trivy-results.txt
          ignore-unfixed: true
          exit-code: 0

      - name: Generate SBOM
        if: steps.tip.outputs.current == 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          artifact-name: sbom-${{ matrix.service }}-spdx
          format: spdx-json

      - name: Document image security audit
        if: steps.tip.outputs.current == 'true'
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_NAME: ${{ env.IMAGE }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RUNTIME_BASE: debian:bookworm-20260518-slim
        run: mise run --skip-tools github-actions:image-audit-summary