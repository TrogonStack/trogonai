# Experiment: runs experiments/sandbox-host-call-bench on a KVM-capable GitHub runner.
# Triggers only on pushes to its own branch and is not meant to merge.
name: Experiment sandbox host-call bench

on:
  push:
    branches: [experiments/sandbox-host-call-bench]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open /dev/kvm to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no /dev/kvm on this runner"
          grep -c -w -E 'vmx|svm' /proc/cpuinfo || true
      - name: Bench
        run: experiments/sandbox-host-call-bench/run.sh | tee -a "$GITHUB_STEP_SUMMARY"
