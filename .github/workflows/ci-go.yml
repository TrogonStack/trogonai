name: CI Go

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select Go checks
    uses: ./.github/workflows/ci-selection.yml
    permissions:
      contents: read
      pull-requests: read
      # GitHub checks every job of the called workflow against this, even the
      # runner job this workflow skips, and refuses to start without it.
      id-token: write
    with:
      filters: .github/filters/ci.yml
  verify:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go tooling via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: go buf rust cargo:wasm-tools
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Go workspace
        run: mise run --skip-tools check:go

      - name: Test Go workspace with race detection
        run: mise run --skip-tools test:go:race

      - name: Build Go workspace
        run: mise run --skip-tools build:go
