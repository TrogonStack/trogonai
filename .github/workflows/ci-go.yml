name: CI Go

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select Go checks
    uses: ./.github/workflows/ci-selection.yml
    permissions:
      contents: read
      pull-requests: read
      # GitHub checks every job of the called workflow against this, even the
      # runner job this workflow skips, and refuses to start without it.
      id-token: write
    with:
      filters: .github/filters/ci.yml
  verify:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go tooling via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: go buf rust cargo:wasm-tools
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Go workspace
        run: mise run --skip-tools github:workflows:ci-go:check

      - name: Test Go workspace with race detection
        run: mise run --skip-tools github:workflows:ci-go:test-race

      - name: Build Go workspace
        run: mise run --skip-tools github:workflows:ci-go:build

  result:
    # Job names like lint and build repeat across workflows, and a skipped job
    # passes a required check even when a cancelled run skipped it, so branch
    # rules require this job instead of each Go job.
    name: Go result
    needs: [changes, verify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: false
          cache: false

      - name: Check Go jobs
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.go }}
          JOB_RESULTS: ${{ needs.verify.result }}
        run: mise run --skip-tools github:workflows:ci-go:result
