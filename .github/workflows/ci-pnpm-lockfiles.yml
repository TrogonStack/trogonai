name: CI pnpm Lockfiles

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'docs/package.json'
      - 'docs/pnpm-lock.yaml'
      - 'docs/pnpm-workspace.yaml'
      - 'tsworkspace/**/package.json'
      - 'tsworkspace/pnpm-lock.yaml'
      - 'tsworkspace/pnpm-workspace.yaml'
      - 'tsworkspace/.npmrc'
      - '.config/mise/tasks/github/workflows/ci-pnpm-lockfiles/**'
      - '.github/workflows/ci-pnpm-lockfiles.yml'

concurrency:
  group: ci-pnpm-lockfiles-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: pnpm lockfile (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [docs, tsworkspace]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ matrix.workspace }}/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ${{ matrix.workspace }}/pnpm-lock.yaml

      - name: Install mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false
          cache: false

      - name: Waive the minimum release age policy
        if: contains(github.event.pull_request.labels.*.name, 'pnpm:skip:release-age')
        run: mise run --skip-tools github:workflows:ci-pnpm-lockfiles:waive-release-age

      - name: Install from the lockfile
        env:
          PNPM_WORKSPACE: ${{ matrix.workspace }}
        run: mise run --skip-tools github:workflows:ci-pnpm-lockfiles:install
