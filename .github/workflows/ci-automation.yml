name: CI Automation

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - '.config/mise/tasks/**'
      - '.config/mise/lib/**'
      - 'tests/github_actions/**'
      - '.config/mise/config.toml'
      - '.config/mise/mise.lock'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/**'
      - '.config/mise/tasks/**'
      - '.config/mise/lib/**'
      - 'tests/github_actions/**'
      - '.config/mise/config.toml'
      - '.config/mise/mise.lock'

concurrency:
  group: ci-automation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install automation test tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python node github:rhysd/actionlint
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Validate workflow selection and canary helpers
        run: mise run --skip-tools github:workflows:ci-automation:verify
