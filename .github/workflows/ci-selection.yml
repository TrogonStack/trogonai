name: CI Selection

on:
  workflow_call:
    inputs:
      # Empty skips change selection, and then nothing reads changes.
      filters:
        required: false
        type: string
        default: ''
      # Empty skips runner selection, and then nothing reads runs-on-by-job.
      self-hosted-job-names:
        description: >-
          Job names to place on an idle self-hosted runner when one is free,
          in priority order. Each falls back to a hosted runner otherwise.
        required: false
        type: string
        default: ''
    outputs:
      changes:
        value: ${{ jobs.filter.outputs.changes }}
      # JSON object mapping each job in self-hosted-job-names to its runs-on.
      runs-on-by-job:
        value: ${{ jobs.choose-runner.outputs.runs-on-by-job }}
      # How many of those jobs went to a self-hosted runner.
      self-hosted-count:
        value: ${{ jobs.choose-runner.outputs.self-hosted-count }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Places the jobs named in self-hosted-job-names on an idle self-hosted runner when one
  # is free and on a hosted runner otherwise. Listing self-hosted runners needs the Baton app, whose key
  # is readable from main and from pull requests opened from a branch of this
  # repository. Fork pull requests declare no environment, get no token or
  # runner labels, and stay on hosted runners.
  choose-runner:
    if: ${{ inputs.self-hosted-job-names != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'github-app-baton' || '' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      runs-on-by-job: ${{ steps.choose-runner.outputs.runs-on-by-job }}
      self-hosted-count: ${{ steps.choose-runner.outputs.self-hosted-count }}
    steps:
      # return-empty-token: a failure gives an empty token, and a run that declared
      # no environment reads the provider empty and skips every step. Either
      # way the next step keeps every job on a hosted runner.
      - name: Baton token
        id: baton-token
        uses: TrogonStack/github-actions/actions/github-app-token/gcp-secret-manager@6ae8d6965cca4cc2eb558cb3705d523459ad9ce9 # github-app-token-gcp-secret-manager@v0.0.1
        with:
          on-failure: return-empty-token
          gcp-workload-identity-provider: ${{ vars.BATON_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-project-id: ${{ vars.BATON_PROJECT_ID }}
          gcp-private-key-secret: ${{ vars.BATON_PRIVATE_KEY_SECRET }}
          github-app-client-id: ${{ vars.BATON_APP_CLIENT_ID }}
          # The installation holds no repository, so the token is the
          # organization's: its only permission is reading self-hosted runners.
          permission-organization-self-hosted-runners: read

      # Falls back on its own for a missing token and API errors, so a failure
      # here is a bad input and fails the job rather than leave runs-on unset.
      - name: Choose runner
        id: choose-runner
        uses: TrogonStack/github-actions/actions/runs-on-fallback@a0991af3376f69ef203fe9a8ceab3aa666cf04ec # runs-on-fallback@v0.1.0
        with:
          runner-list-token: ${{ steps.baton-token.outputs.token }}
          self-hosted-labels: ${{ vars.SELF_HOSTED_RUNNER_LABELS }}
          runner-scope: organization
          job-names: ${{ inputs.self-hosted-job-names }}

  filter:
    if: ${{ inputs.filters != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changes: ${{ steps.filter.outputs.changes || '["go","javascript-typescript","rust"]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          persist-credentials: false

      - name: Install selector runtime
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: node@26.3.0
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install selector dependencies
        run: mise run --skip-tools github:workflows:ci-selection:install

      - name: Select affected checks
        id: filter
        env:
          CI_FILTERS: ${{ inputs.filters }}
          GH_TOKEN: ${{ github.token }}
        run: mise run --skip-tools github:workflows:ci-selection:filter
