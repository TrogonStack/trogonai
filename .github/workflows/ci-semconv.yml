name: CI Semconv

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'otel/semconv/**'
      - '.config/mise/config.toml'
      - '.config/mise/mise.lock'
      - '.github/workflows/ci-semconv.yml'
      - '.config/mise/tasks/github/workflows/ci-semconv/**'

concurrency:
  group: ci-semconv-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Weaver via mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: ubi:open-telemetry/weaver
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Check semconv registry and enforce naming policies
        run: mise run --skip-tools github:workflows:ci-semconv:check
