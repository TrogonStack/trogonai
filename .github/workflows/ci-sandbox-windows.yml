name: CI Sandbox Windows

# The Windows isolation code is cfg(windows) only, so the Linux and macOS jobs
# never compile it.
on:
  push:
    branches: [main]
    paths:
      - 'rsworkspace/Cargo.toml'
      - 'rsworkspace/Cargo.lock'
      - 'rsworkspace/rust-toolchain.toml'
      - 'rsworkspace/crates/sandbox/trogon-sandbox-subprocess-worker/**'
      - 'rsworkspace/crates/sandbox/trogon-sandbox-policy-exec/**'
      - 'rsworkspace/crates/sandbox/trogon-sandbox-policy-cli/**'
      - 'rsworkspace/crates/sandbox/trogon-sandbox-fence-helper/**'
      - 'rsworkspace/crates/sandbox/trogon-sandbox-windows-fence/**'
      - 'rsworkspace/crates/sandbox/trogon-sandbox-egress-proxy/**'
      - '.github/actions/setup-rust/**'
      - '.config/mise/tasks/github/actions/setup-rust/**'
      - '.config/mise/tasks/github/workflows/ci-sandbox-windows/**'
      - '.github/workflows/ci-sandbox-windows.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'rsworkspace/Cargo.toml'
      - 'rsworkspace/Cargo.lock'
      - 'rsworkspace/rust-toolchain.toml'
      - 'rsworkspace/crates/sandbox/trogon-sandbox-subprocess-worker/**'
      - 'rsworkspace/crates/sandbox/trogon-sandbox-policy-exec/**'
      - 'rsworkspace/crates/sandbox/trogon-sandbox-policy-cli/**'
      - 'rsworkspace/crates/sandbox/trogon-sandbox-fence-helper/**'
      - 'rsworkspace/crates/sandbox/trogon-sandbox-windows-fence/**'
      - 'rsworkspace/crates/sandbox/trogon-sandbox-egress-proxy/**'
      - '.github/actions/setup-rust/**'
      - '.config/mise/tasks/github/actions/setup-rust/**'
      - '.config/mise/tasks/github/workflows/ci-sandbox-windows/**'
      - '.github/workflows/ci-sandbox-windows.yml'
  workflow_dispatch:

concurrency:
  group: ci-sandbox-windows-${{ github.ref }}
  # main runs are the only ones that save the cache every PR restores.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  MISE_TASK_RUN_AUTO_INSTALL: 'false'
  CARGO_NET_RETRY: '10'
  # Debug info is most of the test target; without it the cache stays small.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

permissions:
  contents: read

jobs:
  check:
    name: Cargo check on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        # Git Bash, so the mise tasks' bash shebang resolves to it.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-sandbox-windows
          workspaces: rsworkspace -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check the Windows sandbox crates
        run: mise run --skip-tools github:workflows:ci-sandbox-windows:check

  appcontainer:
    name: AppContainer enforcement on Windows
    # Launches real AppContainer processes and takes much longer than the
    # check, so it runs on demand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        # Git Bash, so the mise tasks' bash shebang resolves to it.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-sandbox-windows
          workspaces: rsworkspace -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run the Windows sandbox tests
        run: mise run --skip-tools github:workflows:ci-sandbox-windows:appcontainer-tests
