name: CI Bazel Fork Coverage

on:
  workflow_run:
    workflows: [CI Bazel]
    types: [completed]

permissions: {}

concurrency:
  group: bazel-fork-coverage-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  compare:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.head_repository.id != github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      comparison: ${{ steps.compare.outputs.comparison }}
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout coverage tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TrogonStack/github-actions
          ref: 8d32cdde455b381daffbea5133a0319f374989ee
          path: .coverage-tools
          sparse-checkout: actions/coverage-report
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false
          cache: false

      # Keep the interpreter and comparison dependency aligned with the shared action.
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install pycobertura
        uses: insightsengineering/pip-action@905c7a9be173f62965b791e91d0079355d99f19b # v2.0.2
        with:
          packages: pycobertura==3.0.0

      - name: Compare bound fork coverage
        id: compare
        run: mise run --skip-tools github:workflows:ci-bazel-fork-coverage:compare
        env:
          COVERAGE_TOOLS: .coverage-tools/actions/coverage-report
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: compare
    if: ${{ always() && !cancelled() && needs.compare.outputs.comparison != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false
          cache: false

      - name: Publish current comparison
        run: mise run --skip-tools github:workflows:ci-bazel-fork-coverage:publish
        env:
          COVERAGE_COMPARISON: ${{ needs.compare.outputs.comparison }}
          GH_TOKEN: ${{ github.token }}
