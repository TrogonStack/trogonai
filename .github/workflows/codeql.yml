name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  changes:
    name: Select CodeQL languages
    uses: ./.github/workflows/ci-selection.yml
    permissions:
      contents: read
      pull-requests: read
      # GitHub checks every job of the called workflow against this, even the
      # runner job this workflow skips, and refuses to start without it.
      id-token: write
    with:
      filters: .github/filters/codeql.yml
  analyze:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.changes != '[]') }}
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.changes || '["go","javascript-typescript","rust"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: '/language:${{ matrix.language }}'
  result:
    # Languages without changes have no matrix entry and never report a check,
    # so branch rules require this job instead of each language.
    name: CodeQL result
    needs: [changes, analyze]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
          cache: false

      - name: Check CodeQL analysis
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.changes != '[]' }}
          JOB_RESULTS: ${{ needs.analyze.result }}
        run: mise run --skip-tools github:workflows:codeql:result
