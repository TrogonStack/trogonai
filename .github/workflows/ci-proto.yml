name: CI Proto

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    paths:
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'buf.lock'
      - '.mise.toml'
      - '.config/mise/tasks/**'
      - 'tests/proto/**'
      - 'rsworkspace/crates/platform/trogonai-proto/src/gen/**'
      - 'tsworkspace/packages/proto/buf.key-custody.gen.yaml'
      - 'tsworkspace/packages/proto/package.json'
      - 'tsworkspace/packages/proto/src/gen/trogonai/platform/key_custody/**'
      - '.github/workflows/ci-proto.yml'

concurrency:
  group: ci-proto-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install buf via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: buf

      - name: Check buf format
        run: buf format --diff --exit-code proto

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install buf via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: buf

      - name: Lint proto sources
        run: buf lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install buf via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: buf

      - name: Build proto module
        run: buf build

  breaking:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install buf via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: buf

      - name: Read pinned buf version
        id: buf
        run: echo "version=$(buf --version)" >> "$GITHUB_OUTPUT"

      - name: Check for breaking changes against the pull request base
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: ${{ steps.buf.outputs.version }}
          breaking: ${{ !contains(github.event.pull_request.labels.*.name, 'buf skip breaking') && !contains(github.event.pull_request.labels.*.name, 'buf:skip:breaking') }}
          lint: false
          format: false
          pr_comment: false
          push: false
          archive: false

  contract-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install contract validation tools via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: buf python

      - name: Validate protobuf contract fixtures
        run: mise run --skip-tools proto:validate

  generate:
    runs-on: ubuntu-latest
    env:
      # protoc-gen-buffa and protoc-gen-buffa-packaging are source-built mise
      # tools (cargo backend) and fetch crates from crates.io during install;
      # raise retry tolerance for spurious network errors (see ci-rust.yml).
      CARGO_NET_RETRY: '10'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: tsworkspace/package.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: tsworkspace/pnpm-lock.yaml

      - name: Install TypeScript proto generator
        run: pnpm install --frozen-lockfile --filter @trogonai/proto...
        working-directory: tsworkspace

      - name: Install proto codegen toolchain via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: buf rust cargo:protoc-gen-buffa cargo:protoc-gen-buffa-packaging

      - name: Regenerate protobuf bindings
        run: mise run --skip-tools proto:generate

      - name: Assert generated output matches proto sources
        run: mise run --skip-tools github-actions:assert-proto-generated

      - name: Regenerate TypeScript key custody bindings
        run: pnpm --filter @trogonai/proto generate:key-custody
        working-directory: tsworkspace

      - name: Assert TypeScript key custody bindings match proto sources
        run: mise run --skip-tools github-actions:assert-key-custody-proto-generated
