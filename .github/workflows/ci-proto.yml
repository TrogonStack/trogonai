name: CI Proto

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

concurrency:
  group: ci-proto-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select Proto checks
    uses: ./.github/workflows/ci-selection.yml
    permissions:
      contents: read
      pull-requests: read
      # GitHub checks every job of the called workflow against this, even the
      # runner job this workflow skips, and refuses to start without it.
      id-token: write
    with:
      filters: .github/filters/ci.yml
  format:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.proto == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install buf via mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: buf
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Check buf format
        run: mise run --skip-tools github:workflows:ci-proto:format

  lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.proto == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install buf via mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: buf
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint proto sources
        run: mise run --skip-tools github:workflows:ci-proto:lint

  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.proto == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install buf via mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: buf
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Build proto module
        run: mise run --skip-tools github:workflows:ci-proto:build

  breaking:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.proto == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install buf via mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: buf
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Read pinned buf version
        id: buf
        run: mise run --skip-tools github:workflows:ci-proto:buf-version

      - name: Check for breaking changes against the pull request base
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: ${{ steps.buf.outputs.version }}
          breaking: ${{ !contains(github.event.pull_request.labels.*.name, 'buf skip breaking') && !contains(github.event.pull_request.labels.*.name, 'buf:skip:breaking') }}
          lint: false
          format: false
          pr_comment: false
          push: false
          archive: false

  contract-validation:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.proto == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install contract validation tools via mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: buf python
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Validate protobuf contract fixtures
        run: mise run --skip-tools github:workflows:ci-proto:validate

  generate:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.proto == 'true') }}
    runs-on: ubuntu-latest
    env:
      # protoc-gen-buffa and protoc-gen-buffa-packaging are source-built mise
      # tools (cargo backend) and fetch crates from crates.io during install;
      # raise retry tolerance for spurious network errors (see ci-rust.yml).
      CARGO_NET_RETRY: '10'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: tsworkspace/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: tsworkspace/pnpm-lock.yaml

      - name: Install proto codegen toolchain via mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: buf rust cargo:protoc-gen-buffa cargo:protoc-gen-buffa-packaging
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install TypeScript proto generator
        run: mise run --skip-tools github:workflows:ci-proto:install-generator

      - name: Regenerate protobuf bindings
        run: mise run --skip-tools github:workflows:ci-proto:generate

      - name: Assert generated output matches proto sources
        run: mise run --skip-tools github:workflows:ci-proto:assert-proto-generated

      - name: Regenerate TypeScript key custody bindings
        run: mise run --skip-tools github:workflows:ci-proto:generate-key-custody

      - name: Assert TypeScript key custody bindings match proto sources
        run: mise run --skip-tools github:workflows:ci-proto:assert-key-custody-proto-generated

  result:
    # Job names like lint and build repeat across workflows, and a skipped job
    # passes a required check even when a cancelled run skipped it, so branch
    # rules require this job instead of each Proto job.
    name: Proto result
    needs: [changes, format, lint, build, breaking, contract-validation, generate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
          cache: false

      - name: Check Proto jobs
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.proto }}
          JOB_RESULTS: ${{ needs.format.result }} ${{ needs.lint.result }} ${{ needs.build.result }} ${{ needs.contract-validation.result }} ${{ needs.generate.result }} ${{ github.event_name == 'pull_request' && needs.breaking.result || '' }}
        run: mise run --skip-tools github:workflows:ci-proto:result
