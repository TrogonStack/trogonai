name: CI Buf Breaking

# Bazel checks that the Buf module builds, lints and is formatted, but a
# breaking change check compares against the pull request base, which a
# hermetic target has no access to.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.lock'
      - '.config/mise/config.toml'
      - '.config/mise/mise.lock'
      - '.config/mise/tasks/github/workflows/ci-buf-breaking/**'
      - '.github/workflows/ci-buf-breaking.yml'

concurrency:
  group: ci-buf-breaking-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  breaking:
    name: Buf breaking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install buf via mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: buf
          cache_save: false

      - name: Read pinned buf version
        id: buf
        run: mise run --skip-tools github:workflows:ci-buf-breaking:buf-version

      - name: Check for breaking changes against the pull request base
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: ${{ steps.buf.outputs.version }}
          breaking: ${{ !contains(github.event.pull_request.labels.*.name, 'buf skip breaking') && !contains(github.event.pull_request.labels.*.name, 'buf:skip:breaking') }}
          lint: false
          format: false
          pr_comment: false
          push: false
          archive: false
