name: Claude SDK Freshness

on:
  schedule:
    # Weekly, Monday 09:00 UTC. Use '0 9 1 * *' for a monthly check.
    - cron: '0 9 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/claude-sdk-freshness.yml'
      - 'rsworkspace/crates/platform/trogon-claude-agent-sdk/**'
      - '.config/mise/tasks/github/workflows/claude-sdk-freshness/**'
      - 'mise.toml'

permissions:
  contents: read

concurrency:
  group: claude-sdk-freshness-${{ github.event_name == 'pull_request' && github.ref || 'report' }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install inventory tooling
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python node pnpm
          cache: false

      - name: Verify extractors and report-only behavior without upstream credentials
        run: mise run --skip-tools github:workflows:claude-sdk-freshness:test

      - name: Verify generated types match the pinned upstream declarations
        run: mise run --skip-tools github:workflows:claude-sdk-freshness:types

  check:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install inventory tooling
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python node pnpm
          cache: false

      - name: Report upstream changes and synchronize one review issue
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_SDK_FRESHNESS_REPORT_MODE: 'issue'
          CLAUDE_SDK_FRESHNESS_OUT: ${{ runner.temp }}/claude-sdk-freshness-report
          CLAUDE_SDK_FRESHNESS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: mise run --skip-tools github:workflows:claude-sdk-freshness:check

      - name: Retain full inventories and compatibility report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-sdk-freshness-report
          path: ${{ runner.temp }}/claude-sdk-freshness-report
          if-no-files-found: warn
          retention-days: 30
