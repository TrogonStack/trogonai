version: v2
clean: true
# Packages still under active design are excluded from codegen so their shape
# can churn without dragging the Rust workspace along. They stay in the module,
# so `buf format`, `buf lint`, `buf build`, and `buf breaking` still cover them.
# Removing a path here is what promotes a package into the generated crate, and
# because both plugins run with `include_imports: true`, it also pulls that
# package's imports in. The buf.validate annotations these packages carry are
# therefore inert only while the package stays excluded; ADR#0064 makes that
# promotion the moment to decide whether they become enforced.
inputs:
  - directory: .
    exclude_paths:
      - proto/trogonai/agents
      - proto/trogonai/catalog
      - proto/trogonai/connections
      - proto/trogonai/evaluation
      - proto/trogonai/gateway/credentials/commands
      - proto/trogonai/library
      - proto/trogonai/platform/api_keys
      - proto/trogonai/platform/api_keyspaces
      - proto/trogonai/platform/key_custody
      - proto/trogonai/projects
      - proto/trogonai/secrets/credentials
      - proto/trogonai/secrets/v1alpha1
      - proto/trogonai/session
      - proto/trogonai/usage
      - proto/trogonai/workflows
plugins:
  - local: [.config/mise/lib/proto-plugin, protoc-gen-buffa]
    out: rsworkspace/crates/platform/trogonai-proto/src/gen
    include_imports: true
    strategy: all
    opt:
      - json=true
      - unknown_fields=false
  - local: [.config/mise/lib/proto-plugin, protoc-gen-buffa-packaging]
    out: rsworkspace/crates/platform/trogonai-proto/src/gen
    include_imports: true
    strategy: all
