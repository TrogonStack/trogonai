# Reference configuration for a deployed NATS server. Keep its shape: clients
# connect only over TLS with a verified client certificate, accounts come from
# the operator through a full resolver, and the JetStream store is encrypted.
# The server name, paths and limits are placeholders for the deployment.
#
# Everything under /etc/nats/secrets is rendered from OpenBao before the server
# starts and is never committed; README.md lists each file and where it lives.
# devops/docker/compose/services/nats/nats-server.conf runs the same shape for
# local development.

server_name: nats-0

port: 4222
https_port: 8222

include ./secrets/identity.conf

tls {
  cert_file: /etc/nats/secrets/server.pem
  key_file: /etc/nats/secrets/server-key.pem
  ca_file: /etc/nats/secrets/ca.pem
  verify: true
  min_version: "1.3"
  timeout: 2
}

operator: /etc/nats/secrets/operator.jwt
system_account: $SYSTEM_ACCOUNT

resolver {
  type: full
  dir: /data/jwt
  allow_delete: false
  interval: "2m"
  timeout: "1.9s"
}
resolver_preload: $SYSTEM_ACCOUNT_PRELOAD

# jetstream-key.conf sets the store key. The key cannot be rotated in place;
# README.md describes how to move the store to a new key.
jetstream {
  store_dir: /data
  max_memory_store: 1G
  max_file_store: 50G
  cipher: chacha
  include ./secrets/jetstream-key.conf
}
