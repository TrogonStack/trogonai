apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-hyperlight-worker
  namespace: sandbox-hyperlight
data:
  SANDBOX_NATS_URL: "nats://<nats-host>:4222"
  SANDBOX_HYPERLIGHT_COMPONENT_ROOT: "/srv/components"
  SANDBOX_MAX_CONCURRENT_LEASES: "8"
  SANDBOX_MAX_WARM_SANDBOXES: "4"
  SANDBOX_SNAPSHOT_REGISTRY: "<registry-host>:5000"
  SANDBOX_METRICS_ADDR: "0.0.0.0:9102"
  RUST_LOG: "info"
