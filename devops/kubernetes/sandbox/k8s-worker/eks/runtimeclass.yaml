# Kata RuntimeClasses for EKS bare-metal nodes with Kata installed by
# kata-deploy. The nodes carry the sandbox.trogonai.io/kata label and a
# matching NoSchedule taint, so each class both selects and tolerates them.
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-qemu
handler: kata-qemu
scheduling:
  nodeSelector:
    sandbox.trogonai.io/kata: "true"
  tolerations:
    - key: sandbox.trogonai.io/kata
      operator: Equal
      value: "true"
      effect: NoSchedule
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-fc
handler: kata-fc
scheduling:
  nodeSelector:
    sandbox.trogonai.io/kata: "true"
  tolerations:
    - key: sandbox.trogonai.io/kata
      operator: Equal
      value: "true"
      effect: NoSchedule
