apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sandbox-aca-worker.fullname" . }}
  labels:
    {{- include "sandbox-aca-worker.labels" . | nindent 4 }}
data:
  SANDBOX_NATS_URL: {{ include "sandbox-aca-worker.natsUrl" . | quote }}
  SANDBOX_METRICS_ADDR: "0.0.0.0:{{ .Values.metricsPort }}"
{{- with .Values.poolManagementEndpoint }}
  SANDBOX_ACA_POOL_MANAGEMENT_ENDPOINT: {{ . | quote }}
{{- end }}
{{- with .Values.sessionPoolName }}
  SANDBOX_ACA_SESSION_POOL_NAME: {{ . | quote }}
{{- end }}
{{- with .Values.defaultImage }}
  SANDBOX_ACA_DEFAULT_IMAGE: {{ . | quote }}
{{- end }}
{{- with .Values.region }}
  SANDBOX_ACA_REGION: {{ . | quote }}
{{- end }}
{{- with .Values.global.dispatchAuth }}
  SANDBOX_DISPATCH_VERIFY: {{ .verify | quote }}
{{- end }}
