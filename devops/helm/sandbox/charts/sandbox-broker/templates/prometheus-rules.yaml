{{- if .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "sandbox-broker.fullname" . }}-alerts
  labels:
    {{- include "sandbox-broker.labels" . | nindent 4 }}
spec:
  groups:
    - name: sandbox.broker
      rules:
        - alert: BrokerUnsettledFreezes
          expr: sandbox_broker_unsettled_freezes > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Leases with an unsettled pause or resume"
            description: "The broker reconciler gave up settling the pause or resume of one or more leases."
        - alert: BrokerDigestPinMismatch
          expr: increase(sandbox_broker_digest_pin_mismatch_total[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Snapshot restore digest pin mismatch"
            description: "A snapshot restore was refused because its digest did not match the pinned digest."
{{- end }}
