apiVersion: v1
kind: Service
metadata:
  name: {{ include "sandbox-broker.fullname" . }}
  labels:
    {{- include "sandbox-broker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: sandbox-broker
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: metrics
      port: {{ .Values.metricsPort }}
      targetPort: metrics
