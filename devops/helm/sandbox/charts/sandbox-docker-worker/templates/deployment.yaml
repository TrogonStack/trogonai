apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sandbox-docker-worker.fullname" . }}
  labels:
    {{- include "sandbox-docker-worker.labels" . | nindent 4 }}
    sandbox.trogonai.io/egress-enforcement: {{ .Values.egressEnforcement | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-docker-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "sandbox-docker-worker.labels" . | nindent 8 }}
        sandbox.trogonai.io/egress-enforcement: {{ .Values.egressEnforcement | quote }}
    spec:
      serviceAccountName: {{ include "sandbox-docker-worker.fullname" . }}
      containers:
        - name: worker
          image: "{{ .Values.global.imageRegistry }}/trogon-sandbox-docker-worker:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "sandbox-docker-worker.fullname" . }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          {{- with .Values.global.dispatchAuth }}
          env:
            - name: SANDBOX_DISPATCH_PUBLIC_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .publicKeysKey }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            privileged: {{ .Values.privileged }}
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: state
              mountPath: /var/lib/sandbox-docker
          livenessProbe:
            exec:
              command: ["/usr/local/bin/trogon-sandbox-docker-worker", "--help"]
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["/usr/local/bin/trogon-sandbox-docker-worker", "--help"]
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: state
          emptyDir: {}
