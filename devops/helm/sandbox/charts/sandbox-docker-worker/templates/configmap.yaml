apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sandbox-docker-worker.fullname" . }}
  labels:
    {{- include "sandbox-docker-worker.labels" . | nindent 4 }}
data:
  SANDBOX_NATS_URL: {{ include "sandbox-docker-worker.natsUrl" . | quote }}
  SANDBOX_METRICS_ADDR: "0.0.0.0:{{ .Values.metricsPort }}"
  SANDBOX_DOCKER_STATE_DIR: /var/lib/sandbox-docker
  {{- with .Values.egressProxyImage }}
  SANDBOX_EGRESS_PROXY_IMAGE: {{ . | quote }}
  {{- end }}
  SANDBOX_SNAPSHOT_REGISTRY: {{ include "sandbox-docker-worker.registryUrl" . | quote }}
{{- with .Values.global.dispatchAuth }}
  SANDBOX_DISPATCH_VERIFY: {{ .verify | quote }}
{{- end }}
