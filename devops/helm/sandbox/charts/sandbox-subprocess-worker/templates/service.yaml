apiVersion: v1
kind: Service
metadata:
  name: {{ include "sandbox-subprocess-worker.fullname" . }}
  labels:
    {{- include "sandbox-subprocess-worker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandbox-subprocess-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: metrics
      port: {{ .Values.metricsPort }}
      targetPort: metrics
