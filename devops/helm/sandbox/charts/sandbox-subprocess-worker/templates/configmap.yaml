apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sandbox-subprocess-worker.fullname" . }}
  labels:
    {{- include "sandbox-subprocess-worker.labels" . | nindent 4 }}
data:
  SANDBOX_NATS_URL: {{ include "sandbox-subprocess-worker.natsUrl" . | quote }}
  SANDBOX_METRICS_ADDR: "0.0.0.0:{{ .Values.metricsPort }}"
  {{- with .Values.egressProxy }}
  {{- with .bindingTtlSeconds }}
  EGRESS_PROXY_BINDING_TTL_SECS: {{ . | quote }}
  {{- end }}
  {{- with .revalidateIntervalSeconds }}
  EGRESS_PROXY_REVALIDATE_INTERVAL_SECS: {{ . | quote }}
  {{- end }}
  {{- if .resweepLiveFlows }}
  EGRESS_PROXY_RESWEEP_LIVE_FLOWS: "true"
  {{- end }}
  {{- if .requireTerminationForNameOnlyAllows }}
  EGRESS_PROXY_REQUIRE_TERMINATION_FOR_NAME_ONLY: "true"
  {{- end }}
  {{- with .tlsExemptHosts }}
  EGRESS_PROXY_TLS_EXEMPT_HOSTS: {{ join "," . | quote }}
  {{- end }}
  {{- with .tlsExemptAddresses }}
  EGRESS_PROXY_TLS_EXEMPT_ADDRESSES: {{ join "," . | quote }}
  {{- end }}
  {{- end }}
  SANDBOX_WORKSPACE_ROOT: {{ .Values.workspaceRoot | quote }}
  {{- with .Values.agentBinary }}
  SANDBOX_AGENT_BINARY: {{ . | quote }}
  {{- end }}
  {{- with .Values.egressProxyBinary }}
  SANDBOX_EGRESS_PROXY_BINARY: {{ . | quote }}
  {{- end }}
{{- with .Values.global.dispatchAuth }}
  SANDBOX_DISPATCH_VERIFY: {{ .verify | quote }}
{{- end }}
  SANDBOX_REQUIRE_COMMITTED_POLICY: {{ .Values.requireCommittedPolicy | quote }}
