apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sandbox-ws-gateway.fullname" . }}
  labels:
    {{- include "sandbox-ws-gateway.labels" . | nindent 4 }}
data:
  NATS_URL: {{ include "sandbox-ws-gateway.natsUrl" . | quote }}
  SANDBOX_API_KEY_BUCKET: {{ .Values.global.apiKeyBucket | default "sandbox-api-keys" | quote }}
  SANDBOX_METRICS_ADDR: "0.0.0.0:{{ .Values.metricsPort }}"
