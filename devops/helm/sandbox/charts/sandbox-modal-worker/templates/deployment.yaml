apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sandbox-modal-worker.fullname" . }}
  labels:
    {{- include "sandbox-modal-worker.labels" . | nindent 4 }}
    sandbox.trogonai.io/egress-enforcement: {{ .Values.egressEnforcement | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-modal-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "sandbox-modal-worker.labels" . | nindent 8 }}
        sandbox.trogonai.io/egress-enforcement: {{ .Values.egressEnforcement | quote }}
    spec:
      serviceAccountName: {{ include "sandbox-modal-worker.fullname" . }}
      containers:
        - name: worker
          image: "{{ .Values.global.imageRegistry }}/trogon-sandbox-modal-worker:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "sandbox-modal-worker.fullname" . }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          env:
            - name: MODAL_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tokenSecret.name }}
                  key: {{ .Values.tokenSecret.idKey }}
            - name: MODAL_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tokenSecret.name }}
                  key: {{ .Values.tokenSecret.secretKey }}
          {{- with .Values.global.dispatchAuth }}
            - name: SANDBOX_DISPATCH_PUBLIC_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .publicKeysKey }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/trogon-sandbox-modal-worker", "--help"]
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["/usr/local/bin/trogon-sandbox-modal-worker", "--help"]
            initialDelaySeconds: 10
            periodSeconds: 15
