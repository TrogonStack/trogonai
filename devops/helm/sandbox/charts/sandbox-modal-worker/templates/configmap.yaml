apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sandbox-modal-worker.fullname" . }}
  labels:
    {{- include "sandbox-modal-worker.labels" . | nindent 4 }}
data:
  TROGON_SANDBOX_NATS_URL: {{ include "sandbox-modal-worker.natsUrl" . | quote }}
  SANDBOX_METRICS_ADDR: "0.0.0.0:{{ .Values.metricsPort }}"
{{- with .Values.global.dispatchAuth }}
  SANDBOX_DISPATCH_VERIFY: {{ .verify | quote }}
{{- end }}
