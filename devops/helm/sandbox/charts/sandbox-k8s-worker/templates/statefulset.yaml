{{- if eq .Values.workloadKind "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sandbox-k8s-worker.statefulSetName" . }}
  labels:
    {{- include "sandbox-k8s-worker.labels" . | nindent 4 }}
    sandbox.trogonai.io/egress-enforcement: {{ .Values.egressEnforcement | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "sandbox-k8s-worker.fullname" . }}
  # Replicas share no state, so there is no reason to start or stop them in
  # order.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-k8s-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    {{- include "sandbox-k8s-worker.podTemplate" . | nindent 4 }}
{{- end }}
