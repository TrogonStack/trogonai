# promtool unit tests for the snapshot-builder alert rules. check-charts.sh
# renders the chart with release name "ci" and runs this file beside the
# extracted rule files.
rule_files:
  - ci-sandbox-snapshot-builder-alerts.rules.yaml

evaluation_interval: 1m

tests:
  # Failures climbing at 0.2/s for 20 minutes must fire the alert once the
  # 5 minute "for" window has passed.
  - interval: 1m
    input_series:
      - series: 'snapshot_builder_failed_total'
        values: '0+12x30'
    alert_rule_test:
      - eval_time: 3m
        alertname: SnapshotBuilderFailureRateHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: SnapshotBuilderFailureRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Snapshot builder failures above 0.1 per second"
              description: "The snapshot builder is failing exports or registry pushes at an elevated rate."

  # A flat counter never fires.
  - interval: 1m
    input_series:
      - series: 'snapshot_builder_failed_total'
        values: '5x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: SnapshotBuilderFailureRateHigh
        exp_alerts: []
