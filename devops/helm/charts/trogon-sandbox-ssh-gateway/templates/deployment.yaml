apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trogon-sandbox-ssh-gateway.fullname" . }}
  labels:
    {{- include "trogon-sandbox-ssh-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-ssh-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "trogon-sandbox-ssh-gateway.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "trogon-sandbox-ssh-gateway.fullname" . }}
      containers:
        - name: sandbox-ssh-gateway
          image: "{{ .Values.global.imageRegistry }}/trogon-sandbox-ssh-gateway:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --listen=0.0.0.0:{{ .Values.service.port }}
            - --host-key-path=/data/host_key
          envFrom:
            - configMapRef:
                name: {{ include "trogon-sandbox-ssh-gateway.fullname" . }}
          {{- with .Values.global.dispatchAuth }}
          env:
            - name: SANDBOX_DISPATCH_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .signingKeyKey }}
          {{- end }}
          # Audience: public serves clients; private serves /-/liveness, /-/readiness and /metrics to the cluster only.
          ports:
            - name: public
              containerPort: {{ .Values.service.port }}
            - name: private
              containerPort: {{ .Values.metricsPort }}
          volumeMounts:
            - name: host-key
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /-/liveness
              port: private
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /-/liveness
              port: private
            periodSeconds: 30
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /-/readiness
              port: private
            periodSeconds: 10
      volumes:
        - name: host-key
          persistentVolumeClaim:
            claimName: {{ include "trogon-sandbox-ssh-gateway.fullname" . }}-host-key
