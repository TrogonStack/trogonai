apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trogon-sandbox-broker.fullname" . }}
  labels:
    {{- include "trogon-sandbox-broker.labels" . | nindent 4 }}
data:
  SANDBOX_METRICS_ADDR: "0.0.0.0:{{ .Values.metricsPort }}"
  NATS_URL: {{ include "trogon-sandbox-broker.natsUrl" . | quote }}
  SANDBOX_API_KEY_BUCKET: {{ .Values.global.apiKeyBucket | default "sandbox-api-keys" | quote }}
  SANDBOX_QUOTA_BACKEND: {{ .Values.quotaBackend | quote }}
  SANDBOX_IDEMPOTENCY_BACKEND: {{ .Values.idempotencyBackend | quote }}
  SANDBOX_INSECURE_DEV: {{ .Values.insecureDev | quote }}
  {{- if not .Values.insecureDev }}
  SPICEDB_ENDPOINT: {{ include "trogon-sandbox-broker.spicedbEndpoint" . | quote }}
  SANDBOX_SPICEDB_TENANT_RESOURCE_TYPE: {{ .Values.global.spicedb.tenantResourceType | default "sandbox_tenant" | quote }}
  {{- end }}
  SANDBOX_COMMIT_CREDENTIAL_POLICIES: {{ .Values.commitCredentialPolicies | quote }}
