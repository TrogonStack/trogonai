apiVersion: v1
kind: Service
metadata:
  name: {{ include "trogon-sandbox-credential-broker.fullname" . }}
  labels:
    {{- include "trogon-sandbox-credential-broker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandbox-credential-broker
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: private
      port: {{ .Values.metricsPort }}
      targetPort: private
