apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trogon-sandbox-credential-broker.fullname" . }}
  labels:
    {{- include "trogon-sandbox-credential-broker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-credential-broker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "trogon-sandbox-credential-broker.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "trogon-sandbox-credential-broker.fullname" . }}
      containers:
        - name: sandbox-credential-broker
          image: "{{ .Values.global.imageRegistry }}/trogon-sandbox-credential-broker:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "trogon-sandbox-credential-broker.fullname" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            # The root key is read from a Secret the operator creates; it is never a value.
            - name: SANDBOX_KMS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rootKeySecret.name }}
                  key: {{ .Values.rootKeySecret.key }}
          # Audience: private only: this service has no client listener; the port serves /-/liveness, /-/readiness and /metrics to the cluster only.
          ports:
            - name: private
              containerPort: {{ .Values.metricsPort }}
          startupProbe:
            httpGet:
              path: /-/liveness
              port: private
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /-/liveness
              port: private
            periodSeconds: 30
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /-/readiness
              port: private
            periodSeconds: 10
