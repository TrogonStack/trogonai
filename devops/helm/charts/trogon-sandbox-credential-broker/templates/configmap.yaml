apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trogon-sandbox-credential-broker.fullname" . }}
  labels:
    {{- include "trogon-sandbox-credential-broker.labels" . | nindent 4 }}
data:
  NATS_URL: {{ include "trogon-sandbox-credential-broker.natsUrl" . | quote }}
  SANDBOX_METRICS_ADDR: "0.0.0.0:{{ .Values.metricsPort }}"
  SANDBOX_CREDENTIAL_FENCE_MODE: {{ .Values.fenceMode | quote }}
