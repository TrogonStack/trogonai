apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trogon-sandbox-snapshot-builder.fullname" . }}
  labels:
    {{- include "trogon-sandbox-snapshot-builder.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-snapshot-builder
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "trogon-sandbox-snapshot-builder.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "trogon-sandbox-snapshot-builder.fullname" . }}
      containers:
        - name: sandbox-snapshot-builder
          image: {{ include "trogon-sandbox-library.image" (dict "image" .Values.serviceImage "name" "trogon-sandbox-snapshot-builder" "global" .Values.global "path" "trogon-sandbox-snapshot-builder.serviceImage") | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --max-concurrent={{ .Values.maxConcurrent }}
            - --metrics-addr=0.0.0.0:{{ .Values.metricsPort }}
          envFrom:
            - configMapRef:
                name: {{ include "trogon-sandbox-snapshot-builder.fullname" . }}
          {{- with .Values.global.dispatchAuth }}
          env:
            - name: SANDBOX_DISPATCH_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .signingKeyKey }}
          {{- end }}
          # Audience: private only: this service has no client listener; the port serves /-/liveness, /-/readiness and /metrics to the cluster only.
          ports:
            - name: private
              containerPort: {{ .Values.metricsPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /-/liveness
              port: private
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /-/liveness
              port: private
            periodSeconds: 30
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /-/readiness
              port: private
            periodSeconds: 10
