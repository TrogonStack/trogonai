replicaCount: 1
service:
  port: 8443
# Prometheus scrape port; the gateway serves GET /metrics here.
metricsPort: 9443
# Browser origins allowed to call the gateway, matched exactly against the Origin header (for
# example https://app.example.com). Empty allows no cross-origin calls; "*" is not a wildcard.
corsOrigins: []
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# The image this chart deploys, as <repository>:<tag>@<digest>. An empty
# repository means <global.imageRegistry>/<chart name>. Tag and digest have no
# default: the chart published for a commit carries that commit's image, and a
# checkout must set both (see docs/how-to/sandbox/deploy.md).
serviceImage:
  repository: ""
  tag: ""
  digest: ""
