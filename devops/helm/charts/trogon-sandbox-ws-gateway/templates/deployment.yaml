apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trogon-sandbox-ws-gateway.fullname" . }}
  labels:
    {{- include "trogon-sandbox-ws-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-ws-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "trogon-sandbox-ws-gateway.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "trogon-sandbox-ws-gateway.fullname" . }}
      containers:
        - name: sandbox-ws-gateway
          image: "{{ .Values.global.imageRegistry }}/trogon-sandbox-ws-gateway:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --listen=0.0.0.0:{{ .Values.service.port }}
            {{- range .Values.corsOrigins }}
            - --cors-origin={{ . }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "trogon-sandbox-ws-gateway.fullname" . }}
          # Audience: public serves clients; private serves /-/liveness, /-/readiness and /metrics to the cluster only.
          ports:
            - name: public
              containerPort: {{ .Values.service.port }}
            - name: private
              containerPort: {{ .Values.metricsPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /-/liveness
              port: private
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /-/liveness
              port: private
            periodSeconds: 30
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /-/readiness
              port: private
            periodSeconds: 10
