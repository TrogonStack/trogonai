apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trogon-sandbox-ws-gateway.fullname" . }}
  labels:
    {{- include "trogon-sandbox-ws-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-ws-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "trogon-sandbox-ws-gateway.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "trogon-sandbox-ws-gateway.fullname" . }}
      containers:
        - name: sandbox-ws-gateway
          image: "{{ .Values.global.imageRegistry }}/trogon-sandbox-ws-gateway:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --listen=0.0.0.0:{{ .Values.service.port }}
            {{- range .Values.corsOrigins }}
            - --cors-origin={{ . }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "trogon-sandbox-ws-gateway.fullname" . }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
