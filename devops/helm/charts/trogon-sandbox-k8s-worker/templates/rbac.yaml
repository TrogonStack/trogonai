{{- if .Values.rbac.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.k8sNamespace }}
  labels:
    sandbox.trogonai.io/lease-namespace: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  namespace: {{ .Values.k8sNamespace }}
  labels:
    sandbox.trogonai.io/lease-agent: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "trogon-sandbox-k8s-worker.fullname" . }}-lease
  namespace: {{ .Values.k8sNamespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "secrets", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "trogon-sandbox-k8s-worker.fullname" . }}-lease
  namespace: {{ .Values.k8sNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "trogon-sandbox-k8s-worker.fullname" . }}-lease
subjects:
  - kind: ServiceAccount
    name: {{ include "trogon-sandbox-k8s-worker.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "trogon-sandbox-k8s-worker.fullname" . }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "trogon-sandbox-k8s-worker.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "trogon-sandbox-k8s-worker.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "trogon-sandbox-k8s-worker.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
