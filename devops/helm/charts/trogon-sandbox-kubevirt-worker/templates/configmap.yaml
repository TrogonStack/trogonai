apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trogon-sandbox-kubevirt-worker.fullname" . }}
  labels:
    {{- include "trogon-sandbox-kubevirt-worker.labels" . | nindent 4 }}
data:
  SANDBOX_NATS_URL: {{ include "trogon-sandbox-kubevirt-worker.natsUrl" . | quote }}
  SANDBOX_METRICS_ADDR: "0.0.0.0:{{ .Values.metricsPort }}"
  SANDBOX_SNAPSHOT_REGISTRY: {{ include "trogon-sandbox-kubevirt-worker.registryUrl" . | quote }}
  {{- with .Values.image }}
  SANDBOX_KUBEVIRT_IMAGE: {{ . | quote }}
  {{- end }}
  SANDBOX_K8S_NAMESPACE: {{ .Values.k8sNamespace | quote }}
  SANDBOX_WORKER_ID: {{ .Values.workerId | default (include "trogon-sandbox-kubevirt-worker.fullname" .) | quote }}
  SANDBOX_KUBEVIRT_STATE_DIR: {{ .Values.stateDir | quote }}
{{- with .Values.global.dispatchAuth }}
  SANDBOX_DISPATCH_VERIFY: {{ .verify | quote }}
{{- end }}
