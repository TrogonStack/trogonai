apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trogon-sandbox-hyperlight-worker.fullname" . }}
  labels:
    {{- include "trogon-sandbox-hyperlight-worker.labels" . | nindent 4 }}
    sandbox.trogonai.io/egress-enforcement: {{ .Values.egressEnforcement | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-hyperlight-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "trogon-sandbox-hyperlight-worker.labels" . | nindent 8 }}
        sandbox.trogonai.io/egress-enforcement: {{ .Values.egressEnforcement | quote }}
    spec:
      serviceAccountName: {{ include "trogon-sandbox-hyperlight-worker.fullname" . }}
      containers:
        - name: worker
          image: "{{ .Values.global.imageRegistry }}/trogon-sandbox-hyperlight-worker:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "trogon-sandbox-hyperlight-worker.fullname" . }}
          # Audience: private only: this service has no client listener; the port serves /-/liveness, /-/readiness and /metrics to the cluster only.
          ports:
            - name: private
              containerPort: {{ .Values.metricsPort }}
          {{- with .Values.global.dispatchAuth }}
          env:
            - name: SANDBOX_DISPATCH_PUBLIC_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .publicKeysKey }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            privileged: {{ .Values.privileged }}
          volumeMounts:
            - name: kvm
              mountPath: /dev/kvm
          startupProbe:
            httpGet:
              path: /-/liveness
              port: private
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /-/liveness
              port: private
            periodSeconds: 30
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /-/readiness
              port: private
            periodSeconds: 10
      volumes:
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
