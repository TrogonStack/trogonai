apiVersion: v1
kind: Service
metadata:
  name: {{ include "trogon-sandbox-hyperlight-worker.fullname" . }}
  labels:
    {{- include "trogon-sandbox-hyperlight-worker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandbox-hyperlight-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: private
      port: {{ .Values.metricsPort }}
      targetPort: private
