apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trogon-sandbox-hyperlight-worker.fullname" . }}
  labels:
    {{- include "trogon-sandbox-hyperlight-worker.labels" . | nindent 4 }}
data:
  SANDBOX_NATS_URL: {{ include "trogon-sandbox-hyperlight-worker.natsUrl" . | quote }}
  SANDBOX_METRICS_ADDR: "0.0.0.0:{{ .Values.metricsPort }}"
  {{- with .Values.componentRoot }}
  SANDBOX_HYPERLIGHT_COMPONENT_ROOT: {{ . | quote }}
  {{- end }}
  SANDBOX_SNAPSHOT_REGISTRY: {{ include "trogon-sandbox-hyperlight-worker.registryUrl" . | quote }}
{{- with .Values.global.dispatchAuth }}
  SANDBOX_DISPATCH_VERIFY: {{ .verify | quote }}
{{- end }}
