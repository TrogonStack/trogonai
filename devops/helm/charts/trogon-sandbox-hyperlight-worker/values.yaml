replicaCount: 1
# Prometheus scrape port; the worker listens on it for the whole pod network.
metricsPort: 9102
privileged: true
# Directory inside the image the worker resolves a lease's logical image name under, as
# <name>.wasm. The worker refuses to start without one, so set it (SANDBOX_HYPERLIGHT_COMPONENT_ROOT).
componentRoot: ""
resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi
egressEnforcement: mandatory

# The image this chart deploys, as <repository>:<tag>@<digest>. An empty
# repository means <global.imageRegistry>/<chart name>. Tag and digest have no
# default: the chart published for a commit carries that commit's image, and a
# checkout must set both (see docs/how-to/sandbox/deploy.md).
serviceImage:
  repository: ""
  tag: ""
  digest: ""
