apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trogon-sandbox-dashboard.fullname" . }}
  labels:
    {{- include "trogon-sandbox-dashboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-dashboard
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "trogon-sandbox-dashboard.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "trogon-sandbox-dashboard.fullname" . }}
      containers:
        - name: sandbox-dashboard
          image: {{ include "trogon-sandbox-library.image" (dict "image" .Values.serviceImage "name" "trogon-sandbox-dashboard" "global" .Values.global "path" "trogon-sandbox-dashboard.serviceImage") | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --listen=0.0.0.0:{{ .Values.service.port }}
            - --ws-gateway-url=ws://{{ .Release.Name }}-sandbox-ws-gateway:8443/v1/ws
          # Audience: public serves clients; private serves /-/liveness, /-/readiness and /metrics to the cluster only.
          ports:
            - name: public
              containerPort: {{ .Values.service.port }}
            - name: private
              containerPort: {{ .Values.metricsPort }}
          env:
            - name: SANDBOX_METRICS_ADDR
              value: "0.0.0.0:{{ .Values.metricsPort }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /-/liveness
              port: private
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /-/liveness
              port: private
            periodSeconds: 30
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /-/readiness
              port: private
            periodSeconds: 10
