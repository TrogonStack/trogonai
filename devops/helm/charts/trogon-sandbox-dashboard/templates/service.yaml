apiVersion: v1
kind: Service
metadata:
  name: {{ include "trogon-sandbox-dashboard.fullname" . }}
  labels:
    {{- include "trogon-sandbox-dashboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandbox-dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: metrics
      port: {{ .Values.metricsPort }}
      targetPort: metrics
