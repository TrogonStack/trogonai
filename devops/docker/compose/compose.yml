name: trogonai

services:
  nats:
    image: nats:2.14.2-alpine
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    volumes:
      - nats_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3

  openbao:
    image: openbao/openbao:2.5.5
    command:
      - "server"
      - "-dev"
      - "-dev-root-token-id=${OPENBAO_DEV_ROOT_TOKEN:-dev-only-token}"
      - "-dev-listen-address=0.0.0.0:8200"
    environment:
      BAO_ADDR: "http://127.0.0.1:8200"
      BAO_TOKEN: "${OPENBAO_DEV_ROOT_TOKEN:-dev-only-token}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  trogon-gateway:
    build:
      context: ../../../rsworkspace
      dockerfile: ../devops/docker/compose/services/trogon-gateway/Dockerfile
    command:
      - "--config"
      - "/etc/trogon-gateway/gateway.toml"
    env_file:
      - path: .env
        required: false
    environment:
      TROGON_GATEWAY_LOCAL_GITHUB_WEBHOOK_SECRET: "${TROGON_GATEWAY_LOCAL_GITHUB_WEBHOOK_SECRET:-local-dev-secret}"
      NATS_URL: "nats://nats:4222"
      OPENBAO_ADDR: "http://openbao:8200"
      OPENBAO_TOKEN: "${OPENBAO_DEV_ROOT_TOKEN:-dev-only-token}"
      RUST_LOG: "${RUST_LOG:-info}"
      TROGON_GATEWAY_PORT: "${TROGON_GATEWAY_PORT:-8080}"
    volumes:
      - ./services/trogon-gateway/gateway.toml:/etc/trogon-gateway/gateway.toml:ro
    depends_on:
      nats:
        condition: service_healthy
      openbao:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${TROGON_GATEWAY_PORT:-8080}/-/liveness"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Backing store for the optional Postgres schedules read-model projection
  # (SCHEDULER_PROJECTION_BACKEND=postgres). The default NATS KV projection does
  # not need this service.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-trogon}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-trogon}"
      POSTGRES_DB: "${POSTGRES_DB:-trogon_scheduler}"
      # Read by ./services/postgres/initdb/01-openbao-database.sh, which must
      # create the same database the openbao service connects to.
      OPENBAO_POSTGRES_DB: "${OPENBAO_POSTGRES_DB:-openbao}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/postgres/initdb:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trogon} -d ${POSTGRES_DB:-trogon_scheduler}"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  # Single-node OpenBao for local development, backed by the postgres service
  # above. It auto-unseals from a static key and serves plaintext HTTP, so it is
  # a stand-in for the platform-operated OpenBao, never a model for a real one.
  openbao:
    image: openbao/openbao:2.6.2
    command:
      - "server"
    env_file:
      - path: .env
        required: false
    environment:
      BAO_PG_CONNECTION_URL: "postgres://${POSTGRES_USER:-trogon}:${POSTGRES_PASSWORD:-trogon}@postgres:5432/${OPENBAO_POSTGRES_DB:-openbao}?sslmode=disable"
      BAO_STATIC_SEAL_KEY: "${OPENBAO_STATIC_SEAL_KEY:-bG9jYWwtZGV2LW9ubHktc2VhbC1rZXktMzJieXRlcyE=}"
      BAO_LOG_LEVEL: "${OPENBAO_LOG_LEVEL:-info}"
    # No published port: OrbStack routes to the container directly at
    # http://openbao.trogonai.orb.local:8200.
    volumes:
      - ./services/openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # 200 means unsealed and active; 501 means initialized but not yet set up,
      # 503 means sealed. Only the first counts as healthy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  # Runs to completion on every `up`: initializes a fresh OpenBao, installs the
  # fixed dev root token, and mounts a transit key. A no-op once initialized.
  #
  # Nothing depends on this service, so `docker compose up openbao` on its own
  # leaves the server uninitialized and sealed. Bring the pair up by naming this
  # service instead: `docker compose up -d openbao-bootstrap` pulls in openbao
  # and postgres as its dependencies.
  openbao-bootstrap:
    image: openbao/openbao:2.6.2
    entrypoint:
      - /bin/sh
      - /bootstrap/bootstrap.sh
    env_file:
      - path: .env
        required: false
    environment:
      BAO_ADDR: "http://openbao:8200"
      OPENBAO_DEV_ROOT_TOKEN: "${OPENBAO_DEV_ROOT_TOKEN:-local-dev-root-token}"
      OPENBAO_DEV_TRANSIT_MOUNT: "${OPENBAO_DEV_TRANSIT_MOUNT:-transit}"
      OPENBAO_DEV_TRANSIT_KEY: "${OPENBAO_DEV_TRANSIT_KEY:-local-dev-kek}"
    volumes:
      - ./services/openbao:/bootstrap:ro
    depends_on:
      openbao:
        condition: service_started
    restart: on-failure:3

  ngrok:
    image: ngrok/ngrok:3.39.6-alpine
    env_file:
      - path: .env
        required: false
    environment:
      GATEWAY_ADDR: "trogon-gateway:${TROGON_GATEWAY_PORT:-8080}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /tmp/ngrok.yml <<EOF
        version: 3
        tunnels:
          gateway:
            addr: $${GATEWAY_ADDR}
            proto: http
        EOF
        exec ngrok start --all --config /tmp/ngrok.yml
    depends_on:
      trogon-gateway:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - dev

volumes:
  nats_data:
  postgres_data:
