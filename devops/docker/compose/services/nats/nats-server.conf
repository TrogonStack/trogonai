# Local development NATS, shaped like devops/nats/nats-server.conf so that the
# stack exercises the same TLS, operator-mode and encryption paths a deployment
# does. nats-bootstrap and pki-bootstrap generate everything under
# /etc/nats/secrets into the dev_secrets volume; none of it is checked in.

port: 4222
https_port: 8222

include ./secrets/identity.conf

tls {
  cert_file: /etc/nats/secrets/server.pem
  key_file: /etc/nats/secrets/server-key.pem
  ca_file: /etc/nats/secrets/ca.pem
  verify: true
  min_version: "1.3"
  timeout: 2
}

operator: /etc/nats/secrets/operator.jwt
system_account: $SYSTEM_ACCOUNT
# A client that presents no user JWT connects as the AUTH sentinel, which only
# the auth callout admits further.
default_sentinel: $DEFAULT_SENTINEL

resolver {
  type: full
  dir: /data/jwt
  allow_delete: false
  interval: "2m"
  timeout: "1.9s"
}
resolver_preload: $SYSTEM_ACCOUNT_PRELOAD

# jetstream-key.conf sets the store key. nats-bootstrap never replaces it,
# because a different key without prev_key leaves existing streams unreadable;
# devops/nats/README.md describes how a deployment rotates it.
jetstream {
  store_dir: /data
  cipher: chacha
  include ./secrets/jetstream-key.conf
}
