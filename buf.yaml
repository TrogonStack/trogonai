version: v2

deps:
  - buf.build/googleapis/googleapis:c17df5b2beca46928cc87d5656bd5343
  - buf.build/protocolbuffers/wellknowntypes:122a3d2fdc814e0bb6fcf821bcce7957
  - buf.build/trogonstack/trogon-proto:v0.15.0

modules:
  - path: proto
    name: buf.build/trogonstack/trogonai

lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
  # `status.proto`, `code.proto`, and `error_details.proto` carry what travels
  # on `DeciderService`'s error channel rather than anything this schema names
  # by type, so no field references them and IMPORT_USED cannot see the
  # dependency. Importing them is what puts them in the transitive closure,
  # which is what gives a generated client the types it needs to read an error
  # without being told out of band which ones to expect.
  ignore_only:
    IMPORT_USED:
      - proto/trogonai/decider/v1/decider_service.proto

breaking:
  use:
    - WIRE_JSON
