[tools]
bazel = "9.3.2"
"github:rhysd/actionlint" = "1.7.12"
buf = "1.70.0"
go = ["1.26.5", "1.27.3"]
kubeconform = "0.8.0"
"aqua:helm/helm" = "3.18.6"
"aqua:mikefarah/yq" = "4.54.3"
"aqua:prometheus/prometheus" = "3.15.1"
"github:nats-io/nats-server" = "2.14.10"
"cargo:cargo-fuzz" = "0.13.2"
"github:open-telemetry/weaver" = "0.24.2"
"cargo:cargo-dylint" = "6.0.1"
"cargo:dylint-link" = "6.0.1"
"cargo:protoc-gen-buffa" = "0.9.2"
"cargo:protoc-gen-buffa-packaging" = "0.9.2"
"cargo:protoc-gen-prost" = "0.5.0"
"cargo:protoc-gen-tonic" = "0.5.0"
"cargo:cargo-component" = "0.21.1"
"cargo:cargo-deny" = "0.19.8"
"cargo:wasm-tools" = "1.250.0"
node = "26.3.0"
pnpm = "11.5.1"
python = "3.14.5"
uv = "0.11.18"
rust = { version = "1.96.0", profile = "minimal", components = "rustfmt,clippy,llvm-tools-preview", targets = "wasm32-unknown-unknown" }

[tasks]
build = { description = "Build all", depends = ["build:rust", "build:go", "build:docs", "build:web"] }
check = { description = "Check workspaces", depends = ["check:rust", "check:go", "check:web"] }
