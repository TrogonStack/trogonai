suite: scheduler.schedules
events:
  - trogonai.scheduler.schedules.v1.ScheduleCreated
  - trogonai.scheduler.schedules.v1.SchedulePaused
  - trogonai.scheduler.schedules.v1.ScheduleResumed
  - trogonai.scheduler.schedules.v1.ScheduleRemoved
scenarios:
  - name: create schedule from initial state
    given: []
    when:
      '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.CreateSchedule
      schedule_id: "0198be07a38479e1a376f250f9181be9"
      status:
        scheduled: {}
      schedule:
        every:
          every: 30s
      delivery:
        nats_message:
          subject: agent.run
      message:
        content:
          content_type: application/json
          data: { utf8: '{"kind":"heartbeat"}' }
    then:
      events:
        - '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.ScheduleCreated
          schedule_id: "0198be07a38479e1a376f250f9181be9"
          status:
            scheduled: {}
          schedule:
            every:
              every: 30s
          delivery:
            nats_message:
              subject: agent.run
          message:
            content:
              content_type: application/json
              data: { utf8: '{"kind":"heartbeat"}' }

  - name: reject create when schedule already exists
    given:
      - '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.ScheduleCreated
        schedule_id: "0198be07a38479e1a376f250f9181be9"
        status:
          scheduled: {}
        schedule:
          every:
            every: 30s
        delivery:
          nats_message:
            subject: agent.run
        message:
          content:
            content_type: application/json
            data: { utf8: '{"kind":"heartbeat"}' }
    when:
      '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.CreateSchedule
      schedule_id: "0198be07a38479e1a376f250f9181be9"
      status:
        scheduled: {}
      schedule:
        every:
          every: 30s
      delivery:
        nats_message:
          subject: agent.run
      message:
        content:
          content_type: application/json
          data: { utf8: '{"kind":"heartbeat"}' }
    then:
      rejected: true

  - name: pause an existing schedule
    given:
      - '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.ScheduleCreated
        schedule_id: "0198be07a38479e1a376f250f9181be9"
        status:
          scheduled: {}
        schedule:
          every:
            every: 30s
        delivery:
          nats_message:
            subject: agent.run
        message:
          content:
            content_type: application/json
            data: { utf8: '{}' }
    when:
      '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.PauseSchedule
      schedule_id: "0198be07a38479e1a376f250f9181be9"
    then:
      events:
        - '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.SchedulePaused
          schedule_id: "0198be07a38479e1a376f250f9181be9"

  - name: reject pause when schedule missing
    given: []
    when:
      '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.PauseSchedule
      schedule_id: "0198be07a38479e1a376f250f9181be9"
    then:
      rejected: true

  - name: resume a paused schedule
    given:
      - '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.ScheduleCreated
        schedule_id: "0198be07a38479e1a376f250f9181be9"
        status:
          scheduled: {}
        schedule:
          every:
            every: 30s
        delivery:
          nats_message:
            subject: agent.run
        message:
          content:
            content_type: application/json
            data: { utf8: '{}' }
      - '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.SchedulePaused
        schedule_id: "0198be07a38479e1a376f250f9181be9"
    when:
      '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.ResumeSchedule
      schedule_id: "0198be07a38479e1a376f250f9181be9"
    then:
      events:
        - '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.ScheduleResumed
          schedule_id: "0198be07a38479e1a376f250f9181be9"

  - name: remove an existing schedule
    given:
      - '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.ScheduleCreated
        schedule_id: "0198be07a38479e1a376f250f9181be9"
        status:
          scheduled: {}
        schedule:
          every:
            every: 30s
        delivery:
          nats_message:
            subject: agent.run
        message:
          content:
            content_type: application/json
            data: { utf8: '{}' }
    when:
      '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.RemoveSchedule
      schedule_id: "0198be07a38479e1a376f250f9181be9"
    then:
      events:
        - '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.ScheduleRemoved
          schedule_id: "0198be07a38479e1a376f250f9181be9"

  - name: reject create after schedule removed
    given:
      - '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.ScheduleCreated
        schedule_id: "0198be07a38479e1a376f250f9181be9"
        status:
          scheduled: {}
        schedule:
          every:
            every: 30s
        delivery:
          nats_message:
            subject: agent.run
        message:
          content:
            content_type: application/json
            data: { utf8: '{}' }
      - '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.ScheduleRemoved
        schedule_id: "0198be07a38479e1a376f250f9181be9"
    when:
      '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.CreateSchedule
      schedule_id: "0198be07a38479e1a376f250f9181be9"
      status:
        scheduled: {}
      schedule:
        every:
          every: 30s
      delivery:
        nats_message:
          subject: agent.run
      message:
        content:
          content_type: application/json
          data: { utf8: '{"kind":"heartbeat"}' }
    then:
      rejected: true

  - name: create, pause, then resume a schedule across one session
    steps:
      - when:
          '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.CreateSchedule
          schedule_id: "0198be07a38479e1a376f250f9181be9"
          status:
            scheduled: {}
          schedule:
            every:
              every: 30s
          delivery:
            nats_message:
              subject: agent.run
          message:
            content:
              content_type: application/json
              data: { utf8: '{"kind":"heartbeat"}' }
        then:
          events:
            - '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.ScheduleCreated
              schedule_id: "0198be07a38479e1a376f250f9181be9"
              status:
                scheduled: {}
              schedule:
                every:
                  every: 30s
              delivery:
                nats_message:
                  subject: agent.run
              message:
                content:
                  content_type: application/json
                  data: { utf8: '{"kind":"heartbeat"}' }
      - when:
          '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.PauseSchedule
          schedule_id: "0198be07a38479e1a376f250f9181be9"
        then:
          events:
            - '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.SchedulePaused
              schedule_id: "0198be07a38479e1a376f250f9181be9"
      - when:
          '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.ResumeSchedule
          schedule_id: "0198be07a38479e1a376f250f9181be9"
        then:
          events:
            - '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.ScheduleResumed
              schedule_id: "0198be07a38479e1a376f250f9181be9"

  - name: a starved fuel budget traps before any command can be decided
    budget:
      fuel_per_call: 1
    when:
      '@type': type.googleapis.com/trogonai.scheduler.schedules.v1.PauseSchedule
      schedule_id: "0198be07a38479e1a376f250f9181be9"
    then:
      trap: true
