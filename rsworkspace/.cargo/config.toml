[alias]
# Codegen output (buf protobuf bindings, Weaver semconv) is not code this workspace
# writes, so it stays out of the coverage gate.
cov = [
    "llvm-cov",
    "--all-features",
    "--workspace",
    "--ignore-filename-regex",
    "/src/gen/",
]

[target.wasm32-wasip2]
rustflags = ['--cfg', 'getrandom_backend="unsupported"']

[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="unsupported"']
