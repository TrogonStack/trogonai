[package]
name = "trogon-act-chain-decider"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
buffa = { workspace = true }
thiserror = { workspace = true }
trogon-decider = { workspace = true }
trogon-decider-guest-sdk = { workspace = true }
wit-bindgen = { workspace = true }

[dev-dependencies]
trogon-decider = { workspace = true, features = ["test-support"] }

[package.metadata.component]
package = "trogon:decider"

[package.metadata.decider-test]
exempt = "a wasm-runtime fixture, not a shipped decider: its command and events are hand-rolled buffa messages with no generated proto descriptors, so decider-test has no type registry to encode a YAML suite against. Covered by trogon-decider-wasm-runtime/tests/act_chain_execution.rs."

[package.metadata.decider-parity]
exempt = "there is no native side to compare against: this crate is a cdylib whose decide/evolve live only in the component, unlike trogon-schedules-decider, which calls into trogon-scheduler-domain. A parity test would have to reimplement the guest logic natively and would then only prove the copy matches its original."
