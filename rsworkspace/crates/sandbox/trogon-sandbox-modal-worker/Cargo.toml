[package]
name = "trogon-sandbox-modal-worker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Sandbox worker that leases Modal Sandboxes over NATS"

[lints]
workspace = true

[lib]
name = "trogon_sandbox_modal_worker"

[[bin]]
name = "trogon-sandbox-modal-worker"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["env"] }
futures = { workspace = true }
object_store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "sync", "signal", "process", "fs", "io-util"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
trogon-nats = { workspace = true }
trogon-sandbox-contract = { workspace = true }
trogon-sandbox-credential-client = { workspace = true }
trogon-sandbox-observability = { workspace = true }
trogon-sandbox-protocol = { workspace = true }
trogon-sandbox-volumes = { workspace = true }
trogon-std = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "sync", "signal", "test-util", "process"] }
trogon-nats = { workspace = true, features = ["test-support"] }
