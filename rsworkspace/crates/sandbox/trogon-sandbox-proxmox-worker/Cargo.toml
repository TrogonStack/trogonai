[package]
name = "trogon-sandbox-proxmox-worker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Sandbox worker that leases Proxmox VE virtual machines over NATS"

[lints]
workspace = true

[lib]
name = "trogon_sandbox_proxmox_worker"

[[bin]]
name = "trogon-sandbox-proxmox-worker"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["env"] }
futures = { workspace = true }
ipnet = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "sync", "signal", "fs"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
trogon-nats = { workspace = true }
trogon-sandbox-contract = { workspace = true }
trogon-sandbox-egress-proxy = { workspace = true }
trogon-sandbox-protocol = { workspace = true }
trogon-std = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "sync", "signal", "test-util", "process", "fs"] }
trogon-nats = { workspace = true, features = ["test-support"] }
