[package]
name = "trogon-sandbox-protocol"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Sandbox protocol behavior: subjects, dispatch authentication, ledgers, policy evaluation, redaction, and sequencing"

[lints]
workspace = true

[dependencies]
async-nats = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
ed25519-dalek = { workspace = true }
futures = { workspace = true }
regress = { workspace = true }
rusqlite = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
trogon-nats = { workspace = true }
trogon-sandbox-contract = { workspace = true }
trogon-std = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
trogon-nats = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "time", "macros", "sync", "test-util"] }
tracing-subscriber = { workspace = true }
