[package]
name = "trogon-sandbox-hluk-worker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Spike: NATS-subscribed worker that runs each command of a lease as a hluk (hyperlight-unikraft) run restored from a warm snapshot"

[lints]
workspace = true

[lib]
name = "trogon_sandbox_hluk_worker"
path = "src/lib.rs"

[[bin]]
name = "trogon-sandbox-hluk-worker"
path = "src/main.rs"

[dependencies]
async-nats = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["env"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process", "fs"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
trogon-sandbox-contract = { workspace = true }
trogon-sandbox-file-ops = { workspace = true }
trogon-sandbox-protocol = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
