[package]
name = "trogon-sandbox-conformance"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Conformance suite that checks a sandbox provider worker over the provider subjects"

[lints]
workspace = true

[dependencies]
async-nats = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
trogon-sandbox-contract = { workspace = true }
trogon-sandbox-protocol = { workspace = true }
trogon-std = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "sync", "process", "io-util"] }
trogon-nats = { workspace = true, features = ["test-support"] }
trogon-std = { workspace = true, features = ["test-support"] }
