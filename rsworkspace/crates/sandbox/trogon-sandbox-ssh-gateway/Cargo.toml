[package]
name = "trogon-sandbox-ssh-gateway"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "SSH gateway exposing per-lease ephemeral sessions tunneled over NATS"

[lints]
workspace = true

[lib]
name = "trogon_sandbox_ssh_gateway"
path = "src/lib.rs"

[[bin]]
name = "trogon-sandbox-ssh-gateway"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true, features = ["jetstream", "kv"] }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["env"] }
futures = { workspace = true }
russh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "sync", "io-util", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
trogon-sandbox-auth = { workspace = true }
trogon-sandbox-contract = { workspace = true }
trogon-sandbox-credential-client = { workspace = true }
trogon-sandbox-observability = { workspace = true }
trogon-sandbox-protocol = { workspace = true }
trogon-std = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
trogon-nats = { workspace = true, features = ["test-support"] }
