[package]
name = "trogon-sandbox-hyperlight-worker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Sandbox leases as Wasm components in hypervisor-isolated guests behind a hypervisor seam"

# The workspace lints plus the `trogon_hyperlight_wasm` cfg that turns the Hyperlight backend on.
[lints.rust]
warnings = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)', 'cfg(dylint_lib, values(any()))', 'cfg(trogon_hyperlight_wasm)'] }

[lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[lib]
path = "src/lib.rs"

[[bin]]
name = "trogon-sandbox-hyperlight-worker"
path = "src/main.rs"

[[example]]
name = "e2e_provider_roundtrip"
path = "examples/e2e_provider_roundtrip.rs"

[[example]]
name = "e2e_snapshot_roundtrip"
path = "examples/e2e_snapshot_roundtrip.rs"

[dependencies]
async-nats = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
flate2 = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
trogon-sandbox-contract = { workspace = true }
trogon-sandbox-observability = { workspace = true }
trogon-sandbox-oci = { workspace = true }
trogon-sandbox-protocol = { workspace = true }
trogon-std = { workspace = true }
uuid = { workspace = true }

# Runs leases on Hyperlight through hyperlight-wasm. A rustc cfg gates it rather than a feature
# so that `--all-features` builds leave it out: its build script needs a toolchain that accepts
# custom target specifications, which stable Rust stopped doing in 1.95. It only builds for
# Linux (KVM or MSHV) and Windows (WHP).
[target.'cfg(all(trogon_hyperlight_wasm, any(target_os = "linux", target_os = "windows")))'.dependencies]
hyperlight-wasm = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }
trogon-nats = { workspace = true, features = ["test-support"] }
trogon-sandbox-conformance = { workspace = true }
