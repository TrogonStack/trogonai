[package]
name = "trogon-sandbox-space-worker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Sandbox leases as Firecracker microVMs through the SPACE native API"

[lints]
workspace = true

[dependencies]
async-nats = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
futures = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
trogon-sandbox-contract = { workspace = true }
trogon-sandbox-protocol = { workspace = true }
trogon-std = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }
trogon-nats = { workspace = true, features = ["test-support"] }
wiremock = { workspace = true }
