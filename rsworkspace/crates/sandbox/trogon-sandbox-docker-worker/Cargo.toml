[package]
name = "trogon-sandbox-docker-worker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "NATS-subscribed worker that fulfills sandbox lease requests through the local Docker daemon"

[lints]
workspace = true

[lib]
name = "trogon_sandbox_docker_worker"
path = "src/lib.rs"

[[bin]]
name = "trogon-sandbox-docker-worker"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bollard = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
flate2 = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "fs", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
trogon-nats = { workspace = true }
trogon-sandbox-contract = { workspace = true }
trogon-sandbox-cosign = { workspace = true }
trogon-sandbox-credential-client = { workspace = true }
trogon-sandbox-file-ops = { workspace = true }
trogon-sandbox-observability = { workspace = true }
trogon-sandbox-oci = { workspace = true }
trogon-sandbox-protocol = { workspace = true }
trogon-sandbox-providers = { workspace = true }
trogon-sandbox-ssh-gateway = { workspace = true }
trogon-sandbox-volumes = { workspace = true }
sandbox-command-supervisor = { path = "../../platform/sandbox-command-supervisor" }
trogon-std = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "sync", "time", "test-util"] }
trogon-nats = { workspace = true, features = ["test-support"] }
trogon-sandbox-client = { workspace = true }
trogon-sandbox-conformance = { workspace = true }
trogon-sandbox-oci = { workspace = true }
trogon-std = { workspace = true, features = ["test-support"] }
trogon-sandbox-volumes = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
