[package]
name = "trogon-sandbox-file-ops"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Structured file operations over a directory tree, shared by the workers that expose a host-visible sandbox filesystem"

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
trogon-sandbox-contract = { workspace = true }
trogon-sandbox-protocol = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
