[package]
name = "trogon-sandbox-v8-wasm-worker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "NATS-subscribed worker that runs untrusted JS in a V8 isolate or WASM in a Wasmtime sandbox"

[lints]
workspace = true

[lib]
name = "trogon_sandbox_v8_wasm_worker"
path = "src/lib.rs"

[[bin]]
name = "trogon-sandbox-v8-wasm-worker"
path = "src/main.rs"

[dependencies]
async-nats = { workspace = true, features = ["jetstream"] }
async-trait = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["env"] }
deno_core = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
trogon-nats = { workspace = true }
trogon-sandbox-contract = { workspace = true }
trogon-sandbox-observability = { workspace = true }
trogon-sandbox-protocol = { workspace = true }
trogon-std = { workspace = true }
uuid = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["process", "rt-multi-thread", "macros", "test-util"] }
trogon-nats = { workspace = true, features = ["test-support"] }
trogon-sandbox-conformance = { workspace = true }
wat = { workspace = true }
