[package]
name = "trogon-audit"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Platform audit records: subjects, must-audit classification, and a writer that refuses an action it cannot record"
publish = false

[lib]
name = "trogon_audit"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
# An in-memory sink with failure injection, and the publish-error classification for
# trogon-nats' mock publisher, so a surface can test how it behaves when audit is down.
test-support = ["trogon-nats/test-support"]

[dependencies]
async-nats = { workspace = true }
buffa = { workspace = true }
buffa-types = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time", "rt"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
trogon-nats = { workspace = true }
trogon-std = { workspace = true, features = ["uuid"] }
trogonai-proto = { workspace = true, features = ["audit"] }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
trogon-nats = { workspace = true, features = ["test-support"] }
trogon-std = { workspace = true, features = ["test-support", "uuid"] }
