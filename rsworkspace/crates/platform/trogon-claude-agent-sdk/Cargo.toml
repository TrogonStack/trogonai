[package]
name = "trogon-claude-agent-sdk"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Async Rust library for the Claude Code subprocess protocol"
exclude = [".config/**"]

[lints]
workspace = true

[features]
default = []
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }
indexmap = { version = "=2.14.0", features = ["serde"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
jsonschema = { workspace = true }
url = { workspace = true }
regex = "=1.12.3"
uuid = { workspace = true }
icu_collator = "=2.4.0"
unicode-normalization = "=0.1.26"
unicode-general-category = "=1.1.0"
futures-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "test-util"] }

[[bin]]
name = "claude-sdk-fixture"
path = "tests/support/fixture_cli.rs"
required-features = ["test-support"]
test = false
bench = false

[[bin]]
name = "claude-sdk-relay"
path = "tests/support/relay.rs"
required-features = ["test-support"]
test = false
bench = false
