[package]
name = "trogon-claude-agent-sdk"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Initial public Rust API for Claude Code"
exclude = [".config/**"]

[lints]
workspace = true

[features]
default = []
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
jsonschema = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
unicode-normalization = "=0.1.26"
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
