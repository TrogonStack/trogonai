[package]
name = "trogon-egress-proxy"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Agent egress proxy: an mTLS HTTP CONNECT forward proxy that admits tunnels by exact destination"
publish = false

[lib]
name = "trogon_egress_proxy"
path = "src/lib.rs"

[[bin]]
name = "trogon-egress-proxy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
async-nats = { workspace = true, features = ["jetstream"] }
async-trait = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
trogon-audit = { workspace = true }
trogon-nats = { workspace = true }
trogon-std = { workspace = true, features = ["signal", "uuid"] }
x509-parser = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
buffa = { workspace = true }
rcgen = { version = "=0.14.8", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = { workspace = true }
trogon-audit = { workspace = true, features = ["test-support"] }
trogon-nats = { workspace = true, features = ["test-support"] }
trogon-std = { workspace = true, features = ["test-support"] }
trogonai-proto = { workspace = true, features = ["audit"] }
