[package]
name = "trogonai-proto"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[features]
default = []
chrono = ["dep:buffa-types", "dep:chrono"]
schedules = ["dep:buffa", "dep:buffa-types", "dep:serde", "dep:trogon-decider", "chrono"]
# Generated types for the grpc-nats-micro binding (ADR 0016): google.rpc.Status/Code,
# the trogon.nats.micro.v1alpha1 options, and the echo conformance fixture. Deliberately
# excludes the decider/scheduler domain deps so the binding does not couple to them.
grpc-nats-micro = ["dep:buffa", "dep:buffa-types", "dep:serde"]
runtime-snapshot = ["schedules", "dep:trogon-decider-runtime"]
runtime-host = ["schedules", "dep:trogon-decider-runtime"]
decider = ["dep:buffa", "dep:buffa-types", "dep:serde", "chrono"]

[dependencies]
thiserror = { workspace = true }
buffa = { workspace = true, optional = true }
buffa-types = { workspace = true, optional = true }
chrono = { version = "0.4", optional = true, default-features = false, features = ["std"] }
serde = { workspace = true, optional = true }
trogon-decider = { version = "0.1.0", path = "../../decider/trogon-decider", optional = true }
trogon-decider-runtime = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
