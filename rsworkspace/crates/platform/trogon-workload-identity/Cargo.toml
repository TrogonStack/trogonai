[package]
name = "trogon-workload-identity"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Supervisor-owned attested workload credential activation"
publish = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
rustls = { workspace = true }
sha2 = { workspace = true }
spiffe = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "time", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
rcgen = { version = "=0.14.8", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "io-util"] }
tokio-rustls = { workspace = true }
