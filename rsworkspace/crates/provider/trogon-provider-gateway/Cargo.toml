[package]
name = "trogon-provider-gateway"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "HTTP surface of the provider gateway"
publish = false

[lib]
name = "trogon_provider_gateway"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
tower = { workspace = true, features = ["util"] }
