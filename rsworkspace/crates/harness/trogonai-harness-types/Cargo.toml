[package]
name = "trogonai-harness-types"
description = "Domain value objects and message types shared across the trogonai core."
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/TrogonStack/trogonai"

[dependencies]
jiff = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
