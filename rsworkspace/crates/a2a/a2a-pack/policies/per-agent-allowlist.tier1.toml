_doc = """
Caller allowlist: permits ingress only from enumerated SpiceDB caller_subject
values (user/alice, user/bob, service/internal-*). The gateway derives
caller_subject from the principal in the ingress subject (person.alice is
user/alice), so a caller of another kind that shares an allowlisted id is
denied. Callers not matching any allowlisted subject are denied for all methods.
"""

[[rule]]
id = "deny-non-allowlisted-callers"
priority = 100
effect = "deny"

[[rule.matches]]
kind = "caller_subject"
pattern = "user/alice"
negate = true

[[rule.matches]]
kind = "caller_subject"
pattern = "user/bob"
negate = true

[[rule.matches]]
kind = "caller_subject"
pattern = "service/internal-*"
negate = true
