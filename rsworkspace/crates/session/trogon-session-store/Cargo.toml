[package]
name = "trogon-session-store"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
buffa = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "macros"] }
trogon-decider-runtime = { workspace = true }
trogon-identity-types = { workspace = true }
trogon-nats = { workspace = true }
trogonai-proto = { workspace = true, features = ["session-contracts"] }
trogon-proto-preflight = { path = "../../platform/trogon-proto-preflight" }

[dev-dependencies]
async-nats = { workspace = true, features = ["jetstream"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
trogon-decider-nats = { workspace = true }
trogon-nats = { workspace = true, features = ["test-support"] }
uuid = { workspace = true, features = ["v4"] }
