[package]
name = "trogon-audit-chain"
version = "0.1.0"
edition = "2024"
description = "Tamper-evident SHA-256 audit hash chain over JetStream"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
async-nats = { workspace = true, features = ["jetstream"] }
bytes = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
trogon-nats = { version = "0.1.0", path = "../trogon-nats" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
trogon-nats = { version = "0.1.0", path = "../trogon-nats", features = ["test-support"] }

[features]
default = []
test-support = []
