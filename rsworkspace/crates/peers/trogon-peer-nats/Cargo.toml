[package]
name = "trogon-peer-nats"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
async-nats = { workspace = true, features = ["jetstream", "kv", "server_2_12"] }
thiserror = { workspace = true }
trogon-decider-nats = { workspace = true }
trogon-nats = { path = "../../platform/trogon-nats" }
trogon-peer = { path = "../trogon-peer" }

[dev-dependencies]
buffa = { workspace = true }
buffa-types = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
trogon-decider-runtime = { workspace = true }
trogon-nats = { path = "../../platform/trogon-nats", features = ["test-support"] }
trogonai-proto = { workspace = true, features = ["peers"] }
uuid = { workspace = true }
