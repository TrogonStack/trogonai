[package]
name = "trogon-peer-nats"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
buffa = { workspace = true }
serde = { workspace = true }
grpc-nats-micro = { workspace = true }
trogon-peer-service = { path = "../trogon-peer-service" }
trogon-decider-runtime = { workspace = true }
trogonai-proto = { workspace = true, features = ["peers"] }
async-nats = { workspace = true, features = ["jetstream", "kv", "server_2_12"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["time"] }
trogon-decider-nats = { workspace = true }
trogon-nats = { path = "../../platform/trogon-nats" }
trogon-peer = { path = "../trogon-peer" }

[dev-dependencies]
trogon-peer-service = { path = "../trogon-peer-service", features = ["test-support"] }
futures = { workspace = true }
serde_json = { workspace = true }
buffa-types = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util"] }
trogon-decider-runtime = { workspace = true }
trogon-nats = { path = "../../platform/trogon-nats", features = ["test-support"] }
trogonai-proto = { workspace = true, features = ["peers"] }
uuid = { workspace = true }
