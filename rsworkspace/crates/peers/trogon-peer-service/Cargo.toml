[package]
name = "trogon-peer-service"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lints]
workspace = true

[features]
test-support = ["dep:sha2", "dep:tokio", "trogon-decider-runtime/test-support"]

[dependencies]
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"], optional = true }
buffa = { workspace = true }
trogon-peer-context = { path = "../trogon-peer-context" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = { workspace = true }
trogon-decider-runtime = { workspace = true }
trogon-peer = { path = "../trogon-peer" }
trogonai-proto = { workspace = true, features = ["peers-runtime", "chrono"] }

[dev-dependencies]
trogon-peer-context = { path = "../trogon-peer-context" }
sha2 = { workspace = true }
trogon-peer-service = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
trogon-decider-runtime = { workspace = true, features = ["test-support"] }
