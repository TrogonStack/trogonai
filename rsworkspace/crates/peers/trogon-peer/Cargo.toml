[package]
name = "trogon-peer"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = { workspace = true }
trogon-decider = { path = "../../decider/trogon-decider" }
trogonai-proto = { path = "../../platform/trogonai-proto", features = ["peers", "chrono"] }

[dev-dependencies]
buffa = { workspace = true }
trogon-decider = { path = "../../decider/trogon-decider", features = ["test-support"] }
