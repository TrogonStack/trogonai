[package]
name = "channel-bridge-telegram"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
acp-nats = { workspace = true }
trogon-channel = { workspace = true }
trogon-nats = { workspace = true }
trogon-std = { workspace = true, features = ["signal", "uuid"] }
trogon-telemetry = { workspace = true }

agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
async-nats = { workspace = true, features = ["jetstream", "kv"] }
futures = { workspace = true }
serde_json = { workspace = true }
teloxide = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = { workspace = true }

[dev-dependencies]
trogon-nats = { workspace = true, features = ["test-support"] }
trogon-std = { workspace = true, features = ["test-support"] }
