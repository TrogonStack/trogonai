[package]
name = "trogon-secrets-service"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Release core of the secrets service: decides whether a runtime service may receive a credential and seals it to the requester, with every input and output behind a port"

[lints]
workspace = true

[features]
# Exposes `InMemoryCredentialStates` and `RecordingReleaseAudit` so the crates
# that wire the release core to NATS can drive it without a credential stream or
# an audit writer. Off by default; enable it only from `[dev-dependencies]`.
test-support = []

[dependencies]
nkeys = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
trogon-credential-aggregate = { workspace = true }
trogon-credential-domain = { workspace = true }
trogon-secret-store = { workspace = true }
trogon-std = { workspace = true }
trogonai-proto = { workspace = true, features = ["gateway"] }

[dev-dependencies]
buffa = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
trogon-secret-store = { workspace = true, features = ["test-support"] }
trogon-std = { workspace = true, features = ["test-support"] }
