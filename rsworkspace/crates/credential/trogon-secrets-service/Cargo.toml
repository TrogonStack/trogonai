[package]
name = "trogon-secrets-service"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The secrets service: decides whether a runtime service may receive a credential, seals it to the requester, and serves those releases over NATS from the configured credential stream, OpenBao, and audit stream"

[lints]
workspace = true

[[bin]]
name = "trogon-secrets-service"
path = "src/main.rs"

[features]
# Exposes `InMemoryCredentialStates` and `RecordingReleaseAudit` so the crates
# that wire the release core to NATS can drive it without a credential stream or
# an audit writer. Off by default; enable it only from `[dev-dependencies]`.
test-support = []

[dependencies]
async-nats = { workspace = true, features = ["jetstream"] }
buffa = { workspace = true }
buffa-types = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
grpc-nats-micro = { workspace = true }
nkeys = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
trogon-audit = { workspace = true }
trogon-credential-aggregate = { workspace = true }
trogon-credential-domain = { workspace = true }
trogon-decider-nats = { workspace = true }
trogon-decider-runtime = { workspace = true }
trogon-identity-types = { workspace = true }
trogon-nats = { workspace = true }
trogon-secret-store = { workspace = true }
trogon-service-config = { workspace = true }
trogon-std = { workspace = true, features = ["signal", "uuid"] }
trogonai-proto = { workspace = true, features = ["gateway", "grpc-nats-micro", "secrets-exchange"] }
url = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "test-util"] }
tokio-util = { workspace = true }
trogon-audit = { workspace = true, features = ["test-support"] }
trogon-nats = { workspace = true, features = ["test-support"] }
trogon-secret-store = { workspace = true, features = ["test-support"] }
trogon-std = { workspace = true, features = ["test-support", "uuid"] }
uuid = { workspace = true }

[[test]]
name = "release_endpoint"
path = "tests/release_endpoint.rs"
required-features = ["test-support"]
