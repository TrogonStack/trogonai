[package]
name = "trogon-secret-store"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Secret store ports for credential material, with the OpenBao KV v2 adapter that implements them"

[lints]
workspace = true

[features]
# Exposes `InMemorySecretStore` and `MockOpenBaoSecretStore` so downstream
# tests can drive the store ports without a running OpenBao. Off by default;
# enable it only from `[dev-dependencies]`.
test-support = ["dep:tokio"]

[dependencies]
chrono = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"], optional = true }
tracing = { workspace = true }
trogon-credential-domain = { workspace = true }
trogon-std = { workspace = true }
url = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
testcontainers-modules = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync"] }
