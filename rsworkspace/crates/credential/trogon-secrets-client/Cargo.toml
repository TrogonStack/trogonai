[package]
name = "trogon-secrets-client"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Client side of the secrets service: asks for one credential release over NATS and opens the value sealed to it"

[lints]
workspace = true

[features]
# Exposes `FakeSecretsService`, a scripted stand-in for the secrets service
# that seals with its own xkey, for crates that test against the release call.
# Off by default; enable it only from `[dev-dependencies]`.
test-support = []

[dependencies]
async-nats = { workspace = true }
buffa = { workspace = true }
buffa-types = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
grpc-nats-micro = { workspace = true }
nkeys = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
trogon-credential-domain = { workspace = true }
trogon-identity-types = { workspace = true }
trogon-nats = { workspace = true }
trogon-std = { workspace = true }
trogonai-proto = { workspace = true, features = ["grpc-nats-micro", "secrets-exchange"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util", "time"] }
tokio-util = { workspace = true }
trogon-credential-aggregate = { workspace = true }
trogon-nats = { workspace = true, features = ["test-support"] }
trogon-secret-store = { workspace = true, features = ["test-support"] }
trogon-secrets-service = { workspace = true, features = ["test-support"] }
trogon-std = { workspace = true, features = ["test-support"] }
trogonai-proto = { workspace = true, features = ["gateway", "grpc-nats-micro", "secrets-exchange"] }
