[package]
name = "acp-host"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
acp-nats = { workspace = true }
acp-nats-agent = { workspace = true }
agent-client-protocol = { workspace = true, features = ["process"] }
anyhow = { workspace = true }
async-nats = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "signal", "sync", "time"] }
tracing = { workspace = true }
trogon-nats = { workspace = true }
trogon-std = { workspace = true, features = ["signal"] }
trogon-telemetry = { workspace = true }

[dev-dependencies]
async-compat = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
jsonrpc-nats = { workspace = true }
opentelemetry = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util", "io-util"] }
trogon-nats = { workspace = true, features = ["test-support"] }
trogon-std = { workspace = true, features = ["test-support"] }
