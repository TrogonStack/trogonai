[package]
name = "mcp-postgres"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
authzed = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
pg_query = "=6.2.1"
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["tls-rustls-aws-lc-rs"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
trogon-std = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
tonic = { workspace = true, features = ["tls-aws-lc", "tls-native-roots"] }
url = { workspace = true }

[dev-dependencies]
testcontainers-modules = { workspace = true, features = ["postgres"] }
