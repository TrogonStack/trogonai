[package]
name = "mcp-postgres"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
authzed = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
jsonwebtoken = { workspace = true }
futures-util = { workspace = true }
pg_query = "=6.2.1"
rmcp = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["tls-rustls-aws-lc-rs"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
trogon-std = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
tonic = { workspace = true, features = ["tls-aws-lc", "tls-native-roots"] }
url = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
rmcp = { workspace = true, features = ["transport-streamable-http-client-reqwest"] }
rcgen = "=0.14.8"
rsa = { version = "=0.9.10", features = ["pem"] }
rustls = { workspace = true }
tempfile = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres"] }
