# A2A
a2a = { package = "a2a-lf", version = "=0.3.0" }

# CEL interpreter for Tier-2 declarative policy rules
cel-interpreter = "=0.10.0"
cel-parser = "=0.10.1"

# ACP
# Any bump must follow the upgrade ritual in docs/architecture/acp-conformance.md.
# Unstable flags are enabled ahead of stabilization by policy (protocol v2 is watch-only).
agent-client-protocol = { version = "=5.0.0", features = [
    "unstable_auth_status",
    "unstable_end_turn_token_usage",
    "unstable_llm_providers",
    "unstable_mcp_over_acp",
    "unstable_plan_operations",
    "unstable_session_archive",
    "unstable_session_fork",
    "unstable_session_set_title",
    "unstable_session_status",
    "unstable_session_system_prompt",
    "unstable_subagents",
] }
# Keep the direct schema pin identical to the SDK's exact requirement so all
# consumers share one set of protocol types and unified feature flags.
agent-client-protocol-schema = { version = "=1.15.1", default-features = false }
# Server side only: the client feature requires reqwest 0.13, which conflicts
# with the workspace's exact reqwest pin.
agent-client-protocol-http = { version = "=5.0.0", default-features = false, features = ["server"] }

# MCP
rmcp = { version = "3.0.0", default-features = false, features = ["client", "server", "transport-io", "transport-async-rw", "transport-streamable-http-server"] }
schemars = "=1.2.1"

# Async runtime & networking
async-compat = "=0.2.6"
async-nats = { version = "=0.51.0", default-features = false, features = ["aws-lc-rs"] }
async-trait = "=0.1.92"
axum = { version = "=0.8.9", features = ["ws"] }
bollard = { version = "=0.20.2", default-features = false, features = ["pipe"] }
bytes = "=1.12.1"
base64 = "=0.23.1"
bs58 = "=0.5.1"
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
buffa-descriptor = { version = "=0.9.2" }
futures = "=0.3.34"
futures-util = "=0.3.34"
http-body-util = "=0.1.4"
hyper = { version = "=1.12.0", default-features = false }
hyper-util = { version = "=0.1.20", default-features = false, features = ["client", "client-legacy", "http1", "tokio"] }
hyperlocal = { version = "=0.9.1", default-features = false, features = ["client"] }
tokio = "=1.54.1"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
tokio-stream = "=0.1.18"
tokio-util = "=0.7.20"
tokio-vsock = { version = "=0.7.3", default-features = false, features = ["axum08"] }
tokio-tungstenite = "=0.29.0"
tower = "=0.5.3"
tower-http = { version = "=0.7.1", features = ["trace"] }

# Database
rusqlite = { version = "=0.43.0", features = ["bundled"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "migrate", "postgres", "chrono", "json"] }

# Telegram
teloxide = { version = "=0.17.0", default-features = false, features = ["macros", "webhooks-axum", "rustls"] }

