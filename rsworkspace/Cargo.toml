[workspace]
resolver = "2"
members = ["crates/*/*", "wasm-components/*", "cli/trogon-decider-test"]
default-members = ["crates/*/*", "cli/trogon-decider-test"]

[workspace.lints.rust]
warnings = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(coverage)', 'cfg(dylint_lib, values(any()))'] }

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[workspace.dependencies]
# Internal crates
a2a-auth-callout = { path = "crates/a2a/a2a-auth-callout" }
a2a-bridge = { path = "crates/a2a/a2a-bridge" }
a2a-identity-types = { path = "crates/a2a/a2a-identity-types" }
a2a-nats = { path = "crates/a2a/a2a-nats" }
a2a-pack = { path = "crates/a2a/a2a-pack" }
ard-catalog = { path = "crates/ard/ard-catalog" }
ard-nats = { path = "crates/ard/ard-nats" }
ard-registry = { path = "crates/ard/ard-registry" }
a2a-redaction = { path = "crates/a2a/a2a-redaction" }
acp-nats = { path = "crates/acp/acp-nats" }
trogon-telemetry = { path = "crates/platform/trogon-telemetry" }
mcp-nats = { path = "crates/mcp/mcp-nats" }
mcp-nats-server = { path = "crates/mcp/mcp-nats-server" }
mcp-nats-stdio = { path = "crates/mcp/mcp-nats-stdio" }
jsonrpc-nats = { path = "crates/platform/jsonrpc-nats" }
trogon-nats = { path = "crates/platform/trogon-nats" }
trogon-aauth-sdk = { path = "crates/aauth/trogon-aauth-sdk" }
trogon-aauth-verify = { path = "crates/aauth/trogon-aauth-verify" }
trogon-decider = { path = "crates/decider/trogon-decider" }
trogon-decider-nats = { path = "crates/decider/trogon-decider-nats" }
trogon-decider-wit = { path = "crates/decider/trogon-decider-wit" }
trogon-decider-guest-macros = { path = "crates/decider/trogon-decider-guest-macros" }
trogon-decider-guest-sdk = { path = "crates/decider/trogon-decider-guest-sdk" }
trogon-decider-sim = { path = "crates/decider/trogon-decider-sim" }
trogon-decider-runtime = { path = "crates/decider/trogon-decider-runtime" }
trogon-decider-wasm-runtime = { path = "crates/decider/trogon-decider-wasm-runtime" }
trogon-identity-types = { path = "crates/platform/trogon-identity-types" }
trogon-jwks-publisher = { path = "crates/platform/trogon-jwks-publisher" }
trogon-semconv = { path = "crates/platform/trogon-semconv" }
trogon-service-config = { path = "crates/platform/trogon-service-config" }
trogon-std = { path = "crates/platform/trogon-std" }
trogonai-proto = { path = "crates/platform/trogonai-proto" }
trogon-channel = { path = "crates/channel/trogon-channel" }
channel-bridge-telegram = { path = "crates/channel/channel-bridge-telegram" }

# A2A
a2a = { package = "a2a-lf", version = "=0.3.0" }

# CEL interpreter for Tier-2 declarative policy rules
cel-interpreter = "=0.10.0"

# ACP
# Any bump must follow the upgrade ritual in docs/architecture/acp-conformance.md.
# Unstable flags are enabled ahead of stabilization by policy (protocol v2 is watch-only).
agent-client-protocol = { version = "=2.0.0", features = [
    "unstable_auth_methods",
    "unstable_elicitation",
    "unstable_end_turn_token_usage",
    "unstable_mcp_over_acp",
    "unstable_session_fork",
] }
# Direct schema dependency exists solely to enable schema-level unstable flags the
# SDK facade does not forward (cargo feature unification applies them to the SDK's re-exports).
# The version must match the SDK's own exact pin, otherwise the graph carries two
# schema crates and the flags stop reaching the SDK's re-exported types.
agent-client-protocol-schema = { version = "=1.5.0", features = [
    "unstable_llm_providers",
    "unstable_nes",
    "unstable_plan_operations",
] }
# Official HTTP/WebSocket transport from the SDK repository, released in lockstep with
# the core crate. Server side only: the `client` feature pulls reqwest 0.13 and
# async-tungstenite, both conflicting with the workspace's exact pins.
# Enables serde_json/preserve_order graph-wide through feature unification.
agent-client-protocol-http = { version = "=2.0.0", default-features = false, features = ["server"] }

# MCP
rmcp = { version = "3.0.0", default-features = false, features = ["client", "server", "transport-io", "transport-async-rw", "transport-streamable-http-server"] }

# Async runtime & networking
async-compat = "=0.2.5"
async-nats = { version = "=0.50.0", default-features = false }
async-trait = "=0.1.91"
axum = { version = "=0.8.9", features = ["ws"] }
bytes = "=1.12.1"
base64 = "=0.23.0"
buffa = { version = "=0.9.1", features = ["json"] }
buffa-types = { version = "=0.9.1", features = ["json"] }
futures = "=0.3.32"
futures-util = "=0.3.33"
tokio = "=1.53.1"
tokio-util = "=0.7.19"
tokio-tungstenite = "=0.29.0"
tower = "=0.5.3"
tower-http = { version = "=0.7.0", features = ["trace"] }

# Database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "macros", "migrate", "postgres", "chrono", "json"] }

# Telegram
teloxide = { version = "=0.14.1", features = ["macros", "webhooks-axum"] }

# Serialization
confique = { version = "=0.4.0", features = ["toml"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
jsonschema = { version = "=0.49.2", default-features = false }

# CLI
clap = { version = "=4.6.4", features = ["derive"] }

# Observability
opentelemetry = "=0.32.0"
opentelemetry-appender-tracing = "=0.32.0"
opentelemetry-otlp = "=0.32.0"
opentelemetry-semantic-conventions = { version = "=0.32.1", features = ["semconv_experimental"] }
opentelemetry_sdk = "=0.32.1"
tracing = "=0.1.44"
tracing-opentelemetry = "=0.33.0"
tracing-subscriber = "=0.3.23"

# Discord
twilight-gateway = { version = "=0.17.1", default-features = false, features = ["rustls-native-roots"] }
twilight-model = "=0.17.1"

# Error handling
anyhow = "=1.0.104"
thiserror = "=2.0.19"

# SpiceDB / authzed gRPC (feature-gated SpiceDB-backed import gate)
authzed = { package = "spicedb-grpc-tonic", version = "=1.0.0" }
tonic = { version = "=0.14.6", default-features = false, features = ["transport", "codegen", "router"] }
moka = { version = "=0.12.15", features = ["future"] }

# Misc
chrono-tz = "=0.10.4"
ed25519-dalek = { version = "=2.2.0", features = ["std", "rand_core"] }
toml = "=1.1.4"
wasmtime = "=47.0.3"
http = "=1.5.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
rrule = "=0.14.0"
sha2 = "=0.11.0"
wiremock = "=0.6.5"
testcontainers-modules = { version = "=0.15.0", features = ["nats"] }
tempfile = "=3.27.0"
filetime = "=0.2.29"
time = "=0.3.54"
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["v4", "v7"] }
prost-reflect = "=0.14.7"
serde_yaml = "=0.9.34"
wasmtime-wasi = "=47.0.3"
wit-bindgen = "=0.60.0"

# Auth callout
hex = "=0.4.3"
hmac = "=0.13.0"
jsonwebtoken = { version = "=11.0.0", features = ["rust_crypto"] }
nats-jwt-rs = "=0.1.1"
nkeys = { version = "=0.4.5", features = ["xkeys"] }
rustls-pemfile = "=2.2.0"
rustls-pki-types = { version = "=1.15.1", default-features = false, features = ["std"] }
rustls-webpki = { version = "=0.103.13", default-features = false, features = ["std", "alloc", "ring"] }
x509-parser = "=0.18.1"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
# Note: panic = "abort" removed because Cargo doesn't support per-package panic overrides.
# Bridge crates use catch_unwind for panic isolation, which requires panic = "unwind".
# All workspace crates will use unwinding in release builds for this reason.
