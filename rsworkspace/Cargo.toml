[workspace]
resolver = "2"
members = ["crates/*/*", "wasm-components/*", "cli/*"]
default-members = ["crates/*/*", "cli/*"]

# Both entries load into one rustc lint store, so a lint name may be declared by
# only one of them. `trogonai_dylint` holds rules not yet moved to the shared
# library; moving one means deleting it there in the same change.
[workspace.metadata.dylint]
libraries = [
  { path = "dylints/trogonai_dylint" },
  { git = "https://github.com/TrogonStack/rusty-monorepo", tag = "trogon_dylint_lints@v0.1.0", pattern = "crates/trogon_dylint_lints" },
]

[workspace.lints.rust]
warnings = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)', 'cfg(dylint_lib, values(any()))'] }

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

