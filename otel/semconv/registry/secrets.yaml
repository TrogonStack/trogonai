groups:
  # trogon-secrets-client: the release cache and its invalidation reader
  # (meter "trogon-secrets-client").
  - id: registry.trogonai.secrets.client
    type: attribute_group
    display_name: Secrets Client Attributes
    brief: Attributes emitted by the secrets client's release cache.
    attributes:
      - id: secrets.client.invalidation.loss_reason
        type:
          members:
            - id: failed
              value: "failed"
              brief: The consumer failed while its notices were being read.
              stability: development
            - id: gap
              value: "gap"
              brief: A notice arrived out of turn, so one before it was skipped.
              stability: development
            - id: unplaced
              value: "unplaced"
              brief: A notice arrived without saying where it falls in what the consumer delivered.
              stability: development
            - id: ended
              value: "ended"
              brief: The consumer stopped delivering notices.
              stability: development
            - id: missing
              value: "missing"
              brief: A notice the server says it delivered never arrived.
              stability: development
            - id: position_unknown
              value: "position_unknown"
              brief: The server could not say how far the consumer delivered.
              stability: development
        stability: development
        brief: Why the invalidation reader lost its place in the invalidation stream.
        examples: ["gap", "ended"]

  - id: metric.secrets.client.invalidation.position_losses
    type: metric
    metric_name: secrets.client.invalidation.position_losses
    annotations:
      code_generation:
        metric_value_type: int
    brief: Times the invalidation reader lost its place and stopped holding releases until it read again.
    instrument: counter
    unit: "{loss}"
    stability: development
    attributes:
      - ref: secrets.client.invalidation.loss_reason
        requirement_level: required

  - id: metric.secrets.client.release_cache.capacity_skips
    type: metric
    metric_name: secrets.client.release_cache.capacity_skips
    annotations:
      code_generation:
        metric_value_type: int
    brief: Releases served without being held because the release cache was full of copies that still serve.
    instrument: counter
    unit: "{release}"
    stability: development
