groups:
  # a2a-nats: A2A server handlers (spans only, no metrics). These spans carry no
  # attributes today.
  - id: span.a2a.server.agent_card
    type: span
    span_kind: server
    stability: development
    brief: A2A server agent_card request.
  - id: span.a2a.server.message_send
    type: span
    span_kind: server
    stability: development
    brief: A2A server message/send request.
  - id: span.a2a.server.message_stream
    type: span
    span_kind: server
    stability: development
    brief: A2A server message/stream request.
  - id: span.a2a.server.tasks_get
    type: span
    span_kind: server
    stability: development
    brief: A2A server tasks/get request.
  - id: span.a2a.server.tasks_list
    type: span
    span_kind: server
    stability: development
    brief: A2A server tasks/list request.
  - id: span.a2a.server.tasks_cancel
    type: span
    span_kind: server
    stability: development
    brief: A2A server tasks/cancel request.
  - id: span.a2a.server.tasks_resubscribe
    type: span
    span_kind: server
    stability: development
    brief: A2A server tasks/resubscribe request.
  - id: span.a2a.server.push_get
    type: span
    span_kind: server
    stability: development
    brief: A2A server push/get request.
  - id: span.a2a.server.push_list
    type: span
    span_kind: server
    stability: development
    brief: A2A server push/list request.
  - id: span.a2a.server.push_set
    type: span
    span_kind: server
    stability: development
    brief: A2A server push/set request.
  - id: span.a2a.server.push_delete
    type: span
    span_kind: server
    stability: development
    brief: A2A server push/delete request.

  - id: registry.trogonai.a2a.relay
    type: attribute_group
    display_name: A2A Relay Admission
    brief: Bounded admission scopes for imported request relays.
    attributes:
      - id: a2a.gateway.relay.limit
        type: string
        stability: development
        brief: Admission scope, either global or caller. Never contains an identity.

  - id: metric.a2a.gateway.imported_reply.capacity_refusals
    type: metric
    metric_name: a2a.gateway.imported_reply.capacity_refusals
    annotations:
      code_generation:
        metric_value_type: int
    brief: Imported reply requests refused by concurrent admission limits.
    instrument: counter
    unit: "{request}"
    stability: development
    attributes:
      - ref: a2a.gateway.relay.limit
        requirement_level: required
