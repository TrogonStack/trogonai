groups:
  # trogon-gateway: one server span per integration source. `subject` and
  # `event_type` are defined in common.yaml.
  - id: registry.trogonai.gateway
    type: attribute_group
    display_name: Gateway Webhook Attributes
    brief: Custom attributes emitted by trogon-gateway webhook spans today.
    attributes:
      - id: resource
        type: string
        stability: development
        brief: Sentry resource targeted by the webhook.
      - id: action
        type: string
        stability: development
        brief: Action carried by the webhook (Sentry, Linear).
      - id: request_id
        type: string
        stability: development
        brief: Sentry webhook request identifier.
      - id: event_id
        type: string
        stability: development
        brief: Webhook event identifier (Slack, Notion, Datadog).
      - id: event
        type: string
        stability: development
        brief: Webhook event name (GitHub, GitLab).
      - id: delivery
        type: string
        stability: development
        brief: GitHub webhook delivery identifier.
      - id: webhook_uuid
        type: string
        stability: development
        brief: GitLab webhook UUID.
      - id: update_type
        type: string
        stability: development
        brief: Telegram update type.
      - id: update_id
        type: string
        stability: development
        brief: Telegram update identifier.
      - id: payload_kind
        type: string
        stability: development
        brief: Twitter webhook payload kind.
      - id: webhook_id
        type: string
        stability: development
        brief: Webhook identifier (Linear, incident.io).
      - id: subscription_id
        type: string
        stability: development
        brief: Notion subscription identifier.
      - id: notification_count
        type: int
        stability: development
        brief: Microsoft Graph notification batch count.
      - id: message_id
        type: string
        stability: development
        brief: Google Cloud Pub/Sub message identifier.

  - id: span.sentry.webhook
    type: span
    span_kind: server
    stability: development
    brief: Sentry webhook ingestion.
    attributes:
      - ref: resource
      - ref: action
      - ref: request_id
      - ref: subject
  - id: span.slack.webhook
    type: span
    span_kind: server
    stability: development
    brief: Slack webhook ingestion.
    attributes:
      - ref: event_type
      - ref: event_id
      - ref: subject
  - id: span.github.webhook
    type: span
    span_kind: server
    stability: development
    brief: GitHub webhook ingestion.
    attributes:
      - ref: event
      - ref: delivery
      - ref: subject
  - id: span.gitlab.webhook
    type: span
    span_kind: server
    stability: development
    brief: GitLab webhook ingestion.
    attributes:
      - ref: event
      - ref: webhook_uuid
      - ref: subject
  - id: span.telegram.webhook
    type: span
    span_kind: server
    stability: development
    brief: Telegram webhook ingestion.
    attributes:
      - ref: update_type
      - ref: update_id
      - ref: subject
  - id: span.twitter.crc
    type: span
    span_kind: server
    stability: development
    brief: Twitter CRC challenge handling.
  - id: span.twitter.webhook
    type: span
    span_kind: server
    stability: development
    brief: Twitter webhook ingestion.
    attributes:
      - ref: event_type
      - ref: payload_kind
      - ref: subject
  - id: span.linear.webhook
    type: span
    span_kind: server
    stability: development
    brief: Linear webhook ingestion.
    attributes:
      - ref: event_type
      - ref: action
      - ref: webhook_id
      - ref: subject
      - ref: messaging.message.body.size
  - id: span.notion.webhook
    type: span
    span_kind: server
    stability: development
    brief: Notion webhook ingestion.
    attributes:
      - ref: event_type
      - ref: event_id
      - ref: subscription_id
      - ref: subject
  - id: span.incidentio.webhook
    type: span
    span_kind: server
    stability: development
    brief: incident.io webhook ingestion.
    attributes:
      - ref: event_type
      - ref: webhook_id
      - ref: subject
  - id: span.microsoft_graph.webhook
    type: span
    span_kind: server
    stability: development
    brief: Microsoft Graph webhook ingestion.
    attributes:
      - ref: notification_count
      - ref: subject
  - id: span.google_pubsub.message
    type: span
    span_kind: consumer
    stability: development
    brief: Google Cloud Pub/Sub message pulled and published to JetStream.
    attributes:
      - ref: message_id
      - ref: subject
  - id: span.datadog.webhook
    type: span
    span_kind: server
    stability: development
    brief: Datadog webhook ingestion.
    attributes:
      - ref: event_type
      - ref: event_id
      - ref: subject
  - id: span.zoom.webhook
    type: span
    span_kind: server
    stability: development
    brief: Zoom webhook ingestion.
    attributes:
      - ref: event_type
      - ref: subject
  - id: span.plaid.webhook
    type: span
    span_kind: server
    stability: development
    brief: Plaid webhook ingestion.
    attributes:
      - ref: event_type
      - ref: subject

  # trogon-gateway credential lifecycle, recovery worker, and runtime
  # projection metrics (meter "trogon-gateway"). The shared `operation`,
  # `outcome`, and `reason` attributes are defined in common.yaml.
  - id: registry.trogonai.gateway.credential
    type: attribute_group
    display_name: Gateway Credential Attributes
    brief: Custom attributes emitted by trogon-gateway credential metrics today.
    attributes:
      - id: source
        type: string
        stability: development
        brief: Integration source the credential belongs to.
        examples: ["github", "slack"]
      - id: status
        type: string
        stability: development
        brief: Credential recovery command status (planned, recovered, failed).
        examples: ["planned", "recovered"]
      - id: kind
        type: string
        stability: development
        brief: Credential recovery command kind (all, write, rotation).
        examples: ["write", "rotation"]

  - id: metric.gateway.credential.store.write.failures
    type: metric
    metric_name: gateway.credential.store.write.failures
    annotations:
      code_generation:
        metric_value_type: int
    brief: Credential secret-store writes that failed, by lifecycle operation.
    instrument: counter
    unit: "{failure}"
    stability: development
    attributes:
      - ref: operation
        requirement_level: required
        brief: Credential write operation that failed (put, rotate, revoke, destroy).
      - ref: source
        requirement_level: required

  - id: metric.gateway.credential.recovery.passes
    type: metric
    metric_name: gateway.credential.recovery.passes
    annotations:
      code_generation:
        metric_value_type: int
    brief: Credential recovery worker passes by outcome.
    instrument: counter
    unit: "{pass}"
    stability: development
    attributes:
      - ref: outcome
        requirement_level: required
        brief: Recovery pass outcome (advanced, recovered, idle, stuck, retry_delayed, invalid_event, failed_recovery, error).

  - id: metric.gateway.credential.recovery.errors
    type: metric
    metric_name: gateway.credential.recovery.errors
    annotations:
      code_generation:
        metric_value_type: int
    brief: Credential recovery worker pass errors by reason.
    instrument: counter
    unit: "{error}"
    stability: development
    attributes:
      - ref: reason
        requirement_level: required
        brief: Recovery worker failure reason (worker_error).

  - id: metric.gateway.credential.recovery.scanned_events
    type: metric
    metric_name: gateway.credential.recovery.scanned_events
    annotations:
      code_generation:
        metric_value_type: int
    brief: Raw credential stream events scanned by the recovery worker.
    instrument: counter
    unit: "{event}"
    stability: development

  - id: metric.gateway.credential.recovery.recoveries
    type: metric
    metric_name: gateway.credential.recovery.recoveries
    annotations:
      code_generation:
        metric_value_type: int
    brief: Credential recovery commands by status and kind.
    instrument: counter
    unit: "{command}"
    stability: development
    attributes:
      - ref: status
        requirement_level: required
      - ref: kind
        requirement_level: required

  - id: metric.gateway.credential.recovery.stuck_reports
    type: metric
    metric_name: gateway.credential.recovery.stuck_reports
    annotations:
      code_generation:
        metric_value_type: int
    brief: Recovery passes that observed a stuck recovery checkpoint.
    instrument: counter
    unit: "{pass}"
    stability: development

  - id: metric.gateway.credential.revocation.latency
    type: metric
    metric_name: gateway.credential.revocation.latency
    annotations:
      code_generation:
        metric_value_type: double
    brief: Time from a credential revocation event's recorded timestamp to runtime cache invalidation.
    instrument: histogram
    unit: "s"
    stability: development

  - id: metric.gateway.credential.cache.hits
    type: metric
    metric_name: gateway.credential.cache.hits
    annotations:
      code_generation:
        metric_value_type: int
    brief: Credential resolutions served from the runtime cache.
    instrument: counter
    unit: "{resolution}"
    stability: development
    attributes:
      - ref: source
        requirement_level: required

  - id: metric.gateway.credential.cache.misses
    type: metric
    metric_name: gateway.credential.cache.misses
    annotations:
      code_generation:
        metric_value_type: int
    brief: Credential resolutions that had to read the secret store.
    instrument: counter
    unit: "{resolution}"
    stability: development
    attributes:
      - ref: source
        requirement_level: required

  - id: metric.gateway.credential.delivery.denied
    type: metric
    metric_name: gateway.credential.delivery.denied
    annotations:
      code_generation:
        metric_value_type: int
    brief: Credential resolutions refused by the credential's runtime release policy.
    instrument: counter
    unit: "{resolution}"
    stability: development
    attributes:
      - ref: source
        requirement_level: required
      - ref: reason
        requirement_level: required
        brief: Runtime release check that refused delivery (runtime_service, host, injection_location).

  - id: metric.gateway.credential.resolve.failures
    type: metric
    metric_name: gateway.credential.resolve.failures
    annotations:
      code_generation:
        metric_value_type: int
    brief: Credential resolutions that failed to read material from the secret store.
    instrument: counter
    unit: "{resolution}"
    stability: development
    attributes:
      - ref: source
        requirement_level: required
