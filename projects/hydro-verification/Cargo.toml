[package]
name = "trogonai-hydro-verification"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
hydro_lang = { git = "https://github.com/hydro-project/hydro", rev = "59e91711089790dc04954ea7b5da008bd306672e", features = ["sim"] }
stageleft = "=0.16.0"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
stageleft_tool = "=0.16.0"
sha2 = "=0.10.9"

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(stageleft_runtime)'] }

[lints.clippy]
all = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
