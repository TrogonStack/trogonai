edition = "2024";

package trogonai.model_access.provider_connections.v1alpha1;

import "trogon/error/v1alpha1/options.proto";

// Schema-only Decider error templates, never encoded. External validation and
// authorization failures are distinguished from fold lifecycle rejections.
// Secret material, backend locators, headers, and provider errors are never
// copied into public error detail. Concurrency faults use the Decider channel.
message ProviderCommandInvalidError {
  option (trogon.error.v1alpha1.message).template = {
    domain: "model_access.provider_connections"
    reason: "PROVIDER_COMMAND_INVALID"
    message: "The command violates the provider connection contract."
    code: FAILED_PRECONDITION
    visibility: VISIBILITY_PUBLIC
  };
}

