message RunEvent {
  oneof event {
    option (buf.validate.oneof).required = true;

    RunStarted run_started = 1;
    NodeEntered node_entered = 2;
    RepeatIterationStarted repeat_iteration_started = 3;
    NodeDispatched node_dispatched = 4;
    RetryAuthorized retry_authorized = 5;
    InvocationResultRecorded invocation_result_recorded = 6;
    NodeCompleted node_completed = 7;
    ControlDecisionRecorded control_decision_recorded = 8;
    InputRequested input_requested = 9;
    InputProvided input_provided = 10;
    GuidanceSent guidance_sent = 11;
    GuidanceDeliveryRecorded guidance_delivery_recorded = 12;
    ExternalWaitRegistered external_wait_registered = 13;
    ExternalWaitActivated external_wait_activated = 14;
    ExternalSubscriptionLeaseRenewed external_subscription_lease_renewed = 15;
    ExternalActivityRecorded external_activity_recorded = 16;
    ExternalCursorAdvanced external_cursor_advanced = 17;
    ExternalWaitResolved external_wait_resolved = 18;
    ExternalSubscriptionCleanupRecorded external_subscription_cleanup_recorded = 19;
    TimerWaitRegistered timer_wait_registered = 20;
    TimerWaitResolved timer_wait_resolved = 21;
    PauseRequested pause_requested = 22;
    PauseApplied pause_applied = 23;
    RunResumed run_resumed = 24;
    CancellationRequested cancellation_requested = 25;
    CancellationAcknowledged cancellation_acknowledged = 26;
    RemainingPlanRevised remaining_plan_revised = 27;
    RunTerminated run_terminated = 28;
    FailedWorkflowWorkRetried failed_workflow_work_retried = 29;
  }
}
