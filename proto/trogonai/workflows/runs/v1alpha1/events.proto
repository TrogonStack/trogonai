edition = "2024";

package trogonai.workflows.runs.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/workflows/runs/v1alpha1/control.proto";
import "trogonai/workflows/runs/v1alpha1/interaction.proto";
import "trogonai/workflows/runs/v1alpha1/lifecycle.proto";
import "trogonai/workflows/runs/v1alpha1/occurrence.proto";
import "trogonai/workflows/runs/v1alpha1/receipt.proto";
import "trogonai/workflows/runs/v1alpha1/run.proto";
import "trogonai/workflows/runs/v1alpha1/wait.proto";

// Unknown event arms fail replay closed. Logical ordering belongs to the run
// aggregate; child Session histories retain their independent ownership.
message RunStarted {
  RunConfiguration configuration = 1 [features.field_presence = LEGACY_REQUIRED];
}

message NodeEntered {
  string run_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  OccurrenceEntry entry = 2 [features.field_presence = LEGACY_REQUIRED];
}

