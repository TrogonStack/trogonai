edition = "2024";

package trogonai.workflows.runs.v1alpha1;

import "trogon/error/v1alpha1/options.proto";

// Schema-only module rejection templates under ADR#0057. These are never
// encoded; google.rpc.Status carries domain and reason. Authentication, live
// authorization, Session admission, and source verification retain their owners.

message RunCommandInvalidError {
  option (trogon.error.v1alpha1.message).template = {
    domain: "workflows.runs"
    reason: "RUN_COMMAND_INVALID"
    message: "The command violates the workflow run contract."
    code: FAILED_PRECONDITION
    visibility: VISIBILITY_PUBLIC
  };
}

message RunMissingError {
  option (trogon.error.v1alpha1.message).template = {
    domain: "workflows.runs"
    reason: "RUN_MISSING"
    message: "The workflow run has not been started."
    code: FAILED_PRECONDITION
    visibility: VISIBILITY_PUBLIC
  };
}

