// Commands use DeciderService.Decide. Start requires NoStream; all later
// transitions use At with command_id and expected_revision. Authentication,
// live authorization, byte/digest verification, and referenced Session evidence
// are ingress/admission obligations, not consequences of valid protobuf shape.
message StartRun {
  RunConfiguration configuration = 1 [features.field_presence = LEGACY_REQUIRED];
}

