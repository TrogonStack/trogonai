edition = "2024";

package trogonai.workflows.runs.state.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "trogonai/workflows/runs/v1alpha1/control.proto";
import "trogonai/workflows/runs/v1alpha1/interaction.proto";
import "trogonai/workflows/runs/v1alpha1/lifecycle.proto";
import "trogonai/workflows/runs/v1alpha1/occurrence.proto";
import "trogonai/workflows/runs/v1alpha1/receipt.proto";
import "trogonai/workflows/runs/v1alpha1/run.proto";
import "trogonai/workflows/runs/v1alpha1/wait.proto";

// The fold retains exact admission, dispatch, receipts, and decisions needed to
// recover pending work. It never reconstructs execution from a progress label.
// Local constraints below do not prove historical transitions, authorization,
// byte digests, control-tree validity, or source Session event authenticity.
message State {
  oneof state {
    option (buf.validate.oneof).required = true;

    google.protobuf.Empty missing = 1;
    PresentRun present = 2;
  }
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_ACTIVE = 1;
  RUN_STATUS_PAUSE_REQUESTED = 2;
  RUN_STATUS_PAUSED = 3;
  RUN_STATUS_CANCELLATION_REQUESTED = 4;
  RUN_STATUS_SUCCEEDED = 5;
  RUN_STATUS_FAILED = 6;
  RUN_STATUS_CANCELLED = 7;
  RUN_STATUS_REJECTED = 8;
}

message OccurrenceState {
  option (buf.validate.message).cel = {
    id: "occurrence_state.completion"
    message: "a completion must belong to this occurrence"
    expression: "!has(this.completion) || this.completion.occurrence_id == this.entry.occurrence.occurrence_id"
  };

  trogonai.workflows.runs.v1alpha1.OccurrenceEntry entry = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.workflows.runs.v1alpha1.NodeCompletion completion = 2;
}

message InvocationState {
  option (buf.validate.message).cel = {
    id: "invocation_state.receipt_identity"
    message: "receipts must belong to this invocation and exact admitted plan"
    expression: "this.receipts.all(receipt, receipt.invocation_id == this.invocation.invocation_id && receipt.execution_plan_digest == this.invocation.launch.admission.execution_plan_digest)"
  };
  option (buf.validate.message).cel = {
    id: "invocation_state.receipt_source"
    message: "receipt evidence must belong to the dispatched Session or exact admission"
    expression: "this.receipts.all(receipt, has(receipt.session_event) ? (has(this.invocation.launch.create_child_session) ? receipt.session_event.session.session_id == this.invocation.launch.create_child_session.session_id : receipt.session_event.session.session_id == this.invocation.launch.create_session.session_id) : receipt.launch_rejection.admission_id == this.invocation.launch.admission.admission_id)"
  };
  option (buf.validate.message).cel = {
    id: "invocation_state.receipt_supersession"
    message: "only an indeterminate receipt can be superseded, once, by a determinate receipt"
    expression: "this.receipts.map(receipt, receipt.receipt_id).unique() && (this.receipts.size() < 2 || (has(this.receipts[0].indeterminate) && !has(this.receipts[1].indeterminate)))"
  };
  option (buf.validate.message).cel = {
    id: "invocation_state.current_receipt"
    message: "current receipt must be the last receipt, or absent before receipt"
    expression: "this.receipts.size() == 0 ? !has(this.current_receipt_id) : (has(this.current_receipt_id) && this.current_receipt_id == this.receipts[this.receipts.size() - 1].receipt_id)"
  };

  trogonai.workflows.runs.v1alpha1.NodeInvocation invocation = 1 [features.field_presence = LEGACY_REQUIRED];
  repeated trogonai.workflows.runs.v1alpha1.InvocationResultReceipt receipts = 2 [(buf.validate.field).repeated.max_items = 2];
  string current_receipt_id = 3 [(buf.validate.field).string.min_len = 1];
}

message InputState {
  option (buf.validate.message).cel = {
    id: "input_state.correlation"
    message: "the response must belong to the request"
    expression: "!has(this.response) || this.response.request_id == this.request.request_id"
  };
  option (buf.validate.message).cel = {
    id: "input_state.deadline"
    message: "answers and declines precede the deadline; expiry uses its exact bound"
    expression: "!has(this.response) || (has(this.response.expired) ? (this.response.expired.deadline == this.request.deadline && this.response.responded_at >= this.request.deadline) : this.response.responded_at < this.request.deadline)"
  };
  option (buf.validate.message).cel = {
    id: "input_state.answer_actor"
    message: "a non-expiry responder must be in the admitted audience"
    expression: "!has(this.response) || has(this.response.expired) || this.request.allowed_responders.exists(actor, actor == this.response.responded_by)"
  };
  option (buf.validate.message).cel = {
    id: "input_state.choice"
    message: "selected choice and typed answer must match one admitted choice"
    expression: "!has(this.response) || !has(this.response.selected_choice_id) || this.request.choices.exists(choice, choice.choice_id == this.response.selected_choice_id && choice.value == this.response.answered)"
  };

  trogonai.workflows.runs.v1alpha1.InputRequest request = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.workflows.runs.v1alpha1.InputResponse response = 2;
}

message GuidanceState {
  option (buf.validate.message).cel = {
    id: "guidance_state.delivery"
    message: "delivery must belong to the recorded guidance"
    expression: "!has(this.delivery) || this.delivery.guidance_id == this.guidance.guidance_id"
  };

  trogonai.workflows.runs.v1alpha1.Guidance guidance = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.workflows.runs.v1alpha1.GuidanceDelivery delivery = 2;
}

message ExternalProgress {
  oneof progress {
    option (buf.validate.oneof).required = true;

    trogonai.workflows.runs.v1alpha1.ExternalActivityReceipt activity = 1;
    trogonai.workflows.runs.v1alpha1.ExternalCursorAdvance cursor_advance = 2;
  }
}

// Late attachment identifies the effect targeted by an earlier indeterminate
// registration cleanup. Its historical receipt remains retained while the
// known activation is the current settlement target.
message RegistrationCleanupReconciliation {
  string cleanup_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string activation_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

message ExternalWaitState {
  option (buf.validate.message).cel = {
    id: "external_wait_state.activation_evidence"
    message: "observed progress and satisfied waits require retained activation evidence"
    expression: "this.activations.size() > 0 || (this.progress.size() == 0 && (!has(this.resolution) || !has(this.resolution.satisfied)))"
  };
  option (buf.validate.message).cel = {
    id: "external_wait_state.registration_cleanup_reconciliation"
    message: "registration cleanups with known activations require exact reconciliation"
    expression: "this.registration_cleanup_reconciliations.map(item, item.cleanup_id).unique() && this.registration_cleanup_reconciliations.all(item, this.cleanups.exists(cleanup, cleanup.cleanup_id == item.cleanup_id && has(cleanup.registration_intent) && has(cleanup.indeterminate)) && this.activations.exists(activation, activation.activation_id == item.activation_id)) && (this.activations.size() == 0 || this.cleanups.filter(cleanup, has(cleanup.registration_intent)).all(cleanup, this.registration_cleanup_reconciliations.exists(item, item.cleanup_id == cleanup.cleanup_id)))"
  };
  option (buf.validate.message).cel = {
    id: "external_wait_state.progress_identity"
    message: "progress must belong to the admitted wait, source, and event contract"
    expression: "this.progress.all(item, has(item.activity) ? (item.activity.wait_id == this.registration.wait_id && item.activity.source_id == this.registration.source_id && item.activity.event.contract == this.registration.observation_contract) : item.cursor_advance.wait_id == this.registration.wait_id)"
  };
  option (buf.validate.message).cel = {
    id: "external_wait_state.cursor"
    message: "current cursor must be the last recorded cursor or the initial cursor"
    expression: "this.progress.size() == 0 ? this.current_cursor == this.registration.initial_cursor : (has(this.progress[this.progress.size() - 1].activity) ? this.current_cursor == this.progress[this.progress.size() - 1].activity.cursor_after : this.current_cursor == this.progress[this.progress.size() - 1].cursor_advance.cursor_after)"
  };
  option (buf.validate.message).cel = {
    id: "external_wait_state.activation_identity"
    message: "activation identities must be unique and belong to this wait"
    expression: "this.activations.map(item, item.activation_id).unique() && this.activations.all(item, item.wait_id == this.registration.wait_id) && (!has(this.current_activation_id) || this.activations.exists(item, item.activation_id == this.current_activation_id))"
  };
  option (buf.validate.message).cel = {
    id: "external_wait_state.subscription_receipts"
    message: "subscription receipts match this wait; activation receipts must exist and never-activated evidence forbids activation"
    expression: "this.leases.map(item, item.lease_id).unique() && this.cleanups.map(item, item.cleanup_id).unique() && this.leases.all(item, item.wait_id == this.registration.wait_id && this.activations.exists(activation, activation.activation_id == item.activation_id)) && this.cleanups.all(item, item.wait_id == this.registration.wait_id && (has(item.activation_id) ? this.activations.exists(activation, activation.activation_id == item.activation_id) : (!has(item.never_activated) || this.activations.size() == 0)))"
  };
  option (buf.validate.message).cel = {
    id: "external_wait_state.resolution"
    message: "resolution must belong to this wait and reference accepted activities or its exact deadline"
    expression: "!has(this.resolution) || (this.resolution.wait_id == this.registration.wait_id && (!has(this.resolution.timed_out) || this.resolution.timed_out.deadline == this.registration.deadline) && (!has(this.resolution.satisfied) || this.resolution.satisfied.activity_ids.all(id, this.progress.exists(item, has(item.activity) && item.activity.activity_id == id))))"
  };

  trogonai.workflows.runs.v1alpha1.ExternalWaitRegistration registration = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.workflows.runs.v1alpha1.ExternalCursor current_cursor = 2 [features.field_presence = LEGACY_REQUIRED];
  repeated ExternalProgress progress = 3;
  repeated trogonai.workflows.runs.v1alpha1.ExternalWaitActivation activations = 4;
  repeated trogonai.workflows.runs.v1alpha1.ExternalSubscriptionLease leases = 5;
  repeated trogonai.workflows.runs.v1alpha1.ExternalSubscriptionCleanup cleanups = 6;
  string current_activation_id = 7 [(buf.validate.field).string.min_len = 1];
  trogonai.workflows.runs.v1alpha1.ExternalWaitResolution resolution = 8;
  repeated RegistrationCleanupReconciliation registration_cleanup_reconciliations = 9;
}

message TimerWaitState {
  option (buf.validate.message).cel = {
    id: "timer_wait_state.resolution"
    message: "timer resolution must match its identity and scheduled bounds"
    expression: "!has(this.resolution) || (this.resolution.timer_id == this.registration.timer_id && (!has(this.resolution.fired) || this.resolution.fired.due_at == this.registration.due_at) && (!has(this.resolution.timed_out) || this.resolution.timed_out.deadline == this.registration.deadline))"
  };

  trogonai.workflows.runs.v1alpha1.TimerWaitRegistration registration = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.workflows.runs.v1alpha1.TimerWaitResolution resolution = 2;
}

message PauseState {
  option (buf.validate.message).cel = {
    id: "pause_state.identity"
    message: "pause application and resumption must match the intent"
    expression: "(!has(this.boundary) || this.boundary.pause_id == this.request.pause_id) && (!has(this.resumption) || (this.resumption.pause_id == this.request.pause_id && has(this.resumption.applied_pause) == has(this.boundary)))"
  };

  trogonai.workflows.runs.v1alpha1.PauseRequest request = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.workflows.runs.v1alpha1.PauseBoundary boundary = 2;
  trogonai.workflows.runs.v1alpha1.RunResumption resumption = 3;
}

message CancellationState {
  option (buf.validate.message).cel = {
    id: "cancellation_state.identity"
    message: "acknowledgements match the intent; only indeterminate acknowledgement may be settled once"
    expression: "this.acknowledgements.all(item, item.cancellation_id == this.request.cancellation_id && this.acknowledgements.filter(other, other.invocation_id == item.invocation_id).size() <= 2 && (this.acknowledgements.filter(other, other.invocation_id == item.invocation_id).size() < 2 || (has(this.acknowledgements.filter(other, other.invocation_id == item.invocation_id)[0].indeterminate) && has(this.acknowledgements.filter(other, other.invocation_id == item.invocation_id)[1].determinate_receipt_id))))"
  };

  trogonai.workflows.runs.v1alpha1.CancellationRequest request = 1 [features.field_presence = LEGACY_REQUIRED];
  repeated trogonai.workflows.runs.v1alpha1.CancellationAcknowledgement acknowledgements = 2;
}

message PresentRun {
  option (buf.validate.message).cel = {
    id: "present_run.unique_execution_identity"
    message: "retry, recovery, plan revision, and scoped repeat iteration identities must be unique"
    expression: "this.retry_authorizations.map(item, item.retry_authorization_id).unique() && this.recoveries.map(item, item.recovery_id).unique() && this.recoveries.map(item, item.recovery_number).unique() && this.plan_revisions.map(item, item.plan.plan_revision_id).unique() && this.plan_revisions.all(item, item.plan.plan_revision_id != this.configuration.plan.plan_revision_id) && this.repeat_iterations.all(item, this.repeat_iterations.filter(other, other.repeat_occurrence_id == item.repeat_occurrence_id && other.iteration == item.iteration).size() == 1)"
  };
  option (buf.validate.message).cel = {
    id: "present_run.terminal_invocation_coverage"
    message: "selected accepted or rejected termination must cover every retained invocation"
    expression: "!has(this.current_termination_id) || this.terminations.filter(termination, termination.termination_id == this.current_termination_id && (has(termination.succeeded) || has(termination.rejected))).all(termination, this.invocations.all(invocation, termination.effects.exists(effect, effect.invocation_id == invocation.invocation.invocation_id)))"
  };
  option (buf.validate.message).cel = {
    id: "present_run.terminal_invocation_evidence"
    message: "selected accepted or rejected termination must reference retained determinate invocation receipts"
    expression: "!has(this.current_termination_id) || this.terminations.filter(termination, termination.termination_id == this.current_termination_id && (has(termination.succeeded) || has(termination.rejected))).all(termination, termination.effects.all(effect, has(effect.receipt_id) && this.invocations.exists(invocation, invocation.invocation.invocation_id == effect.invocation_id && invocation.receipts.exists(receipt, receipt.receipt_id == effect.receipt_id && !has(receipt.indeterminate)))))"
  };
  option (buf.validate.message).cel = {
    id: "present_run.terminal_subscription_coverage"
    message: "selected accepted or rejected termination must cover known activations or unactivated wait registrations"
    expression: "!has(this.current_termination_id) || this.terminations.filter(termination, termination.termination_id == this.current_termination_id && (has(termination.succeeded) || has(termination.rejected))).all(termination, this.external_waits.all(wait, wait.activations.size() == 0 ? termination.subscriptions.exists(settlement, settlement.wait_id == wait.registration.wait_id && has(settlement.registration_intent)) : wait.activations.all(activation, termination.subscriptions.exists(settlement, settlement.wait_id == wait.registration.wait_id && has(settlement.activation_id) && settlement.activation_id == activation.activation_id))))"
  };
  option (buf.validate.message).cel = {
    id: "present_run.terminal_subscription_evidence"
    message: "selected accepted or rejected termination must reference released activation or never-activated registration cleanup"
    expression: "!has(this.current_termination_id) || this.terminations.filter(termination, termination.termination_id == this.current_termination_id && (has(termination.succeeded) || has(termination.rejected))).all(termination, termination.subscriptions.all(settlement, has(settlement.cleanup_id) && this.external_waits.exists(wait, wait.registration.wait_id == settlement.wait_id && (has(settlement.activation_id) ? (wait.activations.exists(activation, activation.activation_id == settlement.activation_id) && wait.cleanups.exists(cleanup, cleanup.cleanup_id == settlement.cleanup_id && has(cleanup.activation_id) && cleanup.activation_id == settlement.activation_id && has(cleanup.released))) : (wait.activations.size() == 0 && has(settlement.registration_intent) && wait.cleanups.exists(cleanup, cleanup.cleanup_id == settlement.cleanup_id && has(cleanup.registration_intent) && has(cleanup.never_activated)))))))"
  };
  option (buf.validate.message).cel = {
    id: "present_run.launch_parent"
    message: "parent-linked launches must use the coordinating Session; unattached runs create independent Sessions"
    expression: "this.invocations.all(item, has(this.configuration.main_session) ? (has(item.invocation.launch.create_child_session) && item.invocation.launch.create_child_session.parent_session_id == this.configuration.main_session.session_id) : has(item.invocation.launch.create_session))"
  };
  option (buf.validate.message).cel = {
    id: "present_run.cancellation_status"
    message: "cancellation-requested status requires retained intent targeting the whole run"
    expression: "this.status != 4 || this.cancellations.exists(item, has(item.request.run))"
  };
  option (buf.validate.message).cel = {
    id: "present_run.dispatch_identity"
    message: "operation, child Session, and launch command identities must be unique"
    expression: "this.invocations.map(item, item.invocation.operation_id).unique() && this.invocations.map(item, item.invocation.launch.command_id).unique() && this.invocations.map(item, has(item.invocation.launch.create_child_session) ? item.invocation.launch.create_child_session.session_id : item.invocation.launch.create_session.session_id).unique()"
  };
  option (buf.validate.message).cel = {
    id: "present_run.unique_identity"
    message: "retained occurrence, invocation, request, guidance, wait, timer, pause, cancellation, and termination identities must be unique"
    expression: "this.occurrences.map(item, item.entry.occurrence.occurrence_id).unique() && this.invocations.map(item, item.invocation.invocation_id).unique() && this.inputs.map(item, item.request.request_id).unique() && this.guidance.map(item, item.guidance.guidance_id).unique() && this.external_waits.map(item, item.registration.wait_id).unique() && this.timers.map(item, item.registration.timer_id).unique() && this.pauses.map(item, item.request.pause_id).unique() && this.cancellations.map(item, item.request.cancellation_id).unique() && this.terminations.map(item, item.termination_id).unique()"
  };
  option (buf.validate.message).cel = {
    id: "present_run.current_plan"
    message: "current plan must be the initial or last revised plan"
    expression: "this.plan_revisions.size() == 0 ? this.current_plan_revision_id == this.configuration.plan.plan_revision_id : this.current_plan_revision_id == this.plan_revisions[this.plan_revisions.size() - 1].plan.plan_revision_id"
  };
  option (buf.validate.message).cel = {
    id: "present_run.occurrence_membership"
    message: "occurrences must reference retained plans and parents; invocations must reference retained occurrences"
    expression: "this.occurrences.all(item, (item.entry.occurrence.plan_revision_id == this.configuration.plan.plan_revision_id || this.plan_revisions.exists(revision, revision.plan.plan_revision_id == item.entry.occurrence.plan_revision_id)) && (!has(item.entry.occurrence.parent_occurrence_id) || this.occurrences.exists(parent, parent.entry.occurrence.occurrence_id == item.entry.occurrence.parent_occurrence_id))) && this.invocations.all(item, this.occurrences.exists(occurrence, occurrence.entry.occurrence.occurrence_id == item.invocation.occurrence_id)) && (!has(this.current_root_occurrence_id) || this.occurrences.exists(item, item.entry.occurrence.occurrence_id == this.current_root_occurrence_id && !has(item.entry.occurrence.parent_occurrence_id)))"
  };
  option (buf.validate.message).cel = {
    id: "present_run.control_membership"
    message: "control decisions and iteration snapshots must reference retained occurrences"
    expression: "this.decisions.map(item, item.decision_id).unique() && this.decisions.all(item, this.occurrences.exists(occurrence, occurrence.entry.occurrence.occurrence_id == item.occurrence_id)) && this.repeat_iterations.all(item, this.occurrences.exists(occurrence, occurrence.entry.occurrence.occurrence_id == item.repeat_occurrence_id))"
  };
  option (buf.validate.message).cel = {
    id: "present_run.join_winner_evidence"
    message: "a join winner must reference a retained successful occurrence completion"
    expression: "this.decisions.all(item, !has(item.join) || !has(item.join.winning_branch) || this.occurrences.exists(occurrence, occurrence.entry.occurrence.occurrence_id == item.join.winning_branch.occurrence_id && has(occurrence.completion) && occurrence.completion.completion_id == item.join.winning_branch.completion_id && has(occurrence.completion.succeeded)))"
  };
  option (buf.validate.message).cel = {
    id: "present_run.terminal_status"
    message: "terminal status must match the selected retained termination"
    expression: "has(this.current_termination_id) == (this.status >= 5 && this.status <= 8) && (!has(this.current_termination_id) || this.terminations.exists(item, item.termination_id == this.current_termination_id && ((this.status == 5 && has(item.succeeded)) || (this.status == 6 && has(item.failed)) || (this.status == 7 && has(item.cancelled)) || (this.status == 8 && has(item.rejected)))))"
  };
  option (buf.validate.message).cel = {
    id: "present_run.pause_status"
    message: "pause status must identify one pending or applied unresumed pause"
    expression: "has(this.current_pause_id) == (this.status == 2 || this.status == 3) && (!has(this.current_pause_id) || this.pauses.exists(item, item.request.pause_id == this.current_pause_id && !has(item.resumption) && (has(item.boundary) == (this.status == 3))))"
  };
  option (buf.validate.message).cel = {
    id: "present_run.recovery_limits"
    message: "effective limits must match the current recovery or initial admission"
    expression: "this.recoveries.size() == 0 ? (!has(this.current_recovery_id) && this.effective_limits == this.configuration.limits) : (has(this.current_recovery_id) && this.current_recovery_id == this.recoveries[this.recoveries.size() - 1].recovery_id && this.effective_limits == this.recoveries[this.recoveries.size() - 1].limits)"
  };
  option (buf.validate.message).cel = {
    id: "present_run.recovery_budgets"
    message: "recovery count and depth limits cannot exceed admission or earlier recovery limits"
    expression: "this.recoveries.all(item, item.limits.max_invocations <= this.configuration.limits.max_invocations && item.limits.max_active_sessions <= this.configuration.limits.max_active_sessions && item.limits.max_control_depth <= this.configuration.limits.max_control_depth && item.limits.max_value_depth <= this.configuration.limits.max_value_depth && this.recoveries.filter(previous, previous.recovery_number < item.recovery_number).all(previous, item.limits.max_invocations <= previous.limits.max_invocations && item.limits.max_active_sessions <= previous.limits.max_active_sessions && item.limits.max_control_depth <= previous.limits.max_control_depth && item.limits.max_value_depth <= previous.limits.max_value_depth))"
  };

  trogonai.workflows.runs.v1alpha1.RunConfiguration configuration = 1 [features.field_presence = LEGACY_REQUIRED];
  RunStatus status = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  string current_plan_revision_id = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  trogonai.workflows.runs.v1alpha1.RunLimits effective_limits = 4 [features.field_presence = LEGACY_REQUIRED];
  repeated trogonai.workflows.runs.v1alpha1.RemainingPlanRevision plan_revisions = 5;
  repeated OccurrenceState occurrences = 6;
  repeated InvocationState invocations = 7;
  repeated trogonai.workflows.runs.v1alpha1.RepeatIterationSnapshot repeat_iterations = 8;
  repeated trogonai.workflows.runs.v1alpha1.ControlDecision decisions = 9;
  repeated InputState inputs = 10;
  repeated GuidanceState guidance = 11;
  repeated ExternalWaitState external_waits = 12;
  repeated TimerWaitState timers = 13;
  repeated PauseState pauses = 14;
  repeated CancellationState cancellations = 15;
  repeated trogonai.workflows.runs.v1alpha1.RetryAuthorization retry_authorizations = 16;
