edition = "2024";

package trogonai.workflows.definitions.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/workflows/definitions/v1alpha1/digest.proto";

// NoStream admission verifies exact bytes and the complete definition contract
// before minting revision 1. Display label and placement are outside the digest.
// DecideRequest owns command identity and expected stream revision; retries reuse
// the command id rather than minting a replacement definition identity.
message ProvisionWorkflowDefinition {
  string workflow_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string display_name = 2 [features.field_presence = LEGACY_REQUIRED];
  string parent = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  bytes definition_bytes = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.min_len = 1
  ];
  Digest digest = 5 [features.field_presence = LEGACY_REQUIRED];
}
