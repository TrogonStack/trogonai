edition = "2024";

package trogonai.workflows.definitions.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/workflows/definitions/v1alpha1/workflow_definition.proto";

message WorkflowDefinitionProvisioned {
  option (buf.validate.message).cel = {
    id: "workflow_definition_provisioned.genesis_revision"
    message: "provisioning must mint revision 1"
    expression: "this.definition.reference.revision == 1u"
  };

  StoredWorkflowDefinition definition = 1 [features.field_presence = LEGACY_REQUIRED];
  string display_name = 2 [features.field_presence = LEGACY_REQUIRED];
  string parent = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
