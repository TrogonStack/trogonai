edition = "2024";

package trogonai.agents.profiles.v1alpha1;

import "trogonai/agents/profiles/v1alpha1/profile.proto";

// Replaces an initialized profile without changing its Agent identity. Absent
// avatar/category and empty tags clear those values. Dispatch applies the same
// live admission checks as initialization and requires DecideRequest.command_id
// and expected_revision. Retrying preserves both original values so an older
// replacement cannot overwrite newer metadata. After those checks, an identical
// profile succeeds without emitting an event.
message SetAgentProfile {
  AgentProfile profile = 1 [features.field_presence = LEGACY_REQUIRED];
}
