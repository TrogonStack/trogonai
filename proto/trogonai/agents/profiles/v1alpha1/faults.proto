edition = "2024";

package trogonai.agents.profiles.v1alpha1;

import "trogon/error/v1alpha1/options.proto";

// Schema-only templates on the DeciderService error channel. The module must
// declare agents.profiles as its descriptor name; these messages are never
// encoded. Dispatch authorization, Agent availability, and reference admission
// retain their owning failure contracts.
message AgentProfileCommandInvalidError {
  option (trogon.error.v1alpha1.message).template = {
    domain: "agents.profiles"
    reason: "AGENT_PROFILE_COMMAND_INVALID"
    message: "The command violates the Agent profile contract."
    code: FAILED_PRECONDITION
    visibility: VISIBILITY_PUBLIC
  };
}

message AgentProfileMissingError {
  option (trogon.error.v1alpha1.message).template = {
    domain: "agents.profiles"
    reason: "AGENT_PROFILE_MISSING"
    message: "The Agent profile must be initialized before it can be replaced."
    code: FAILED_PRECONDITION
    visibility: VISIBILITY_PUBLIC
  };
}

message AgentProfileAlreadyInitializedError {
  option (trogon.error.v1alpha1.message).template = {
    domain: "agents.profiles"
    reason: "AGENT_PROFILE_ALREADY_INITIALIZED"
    message: "The Agent profile has already been initialized."
    code: FAILED_PRECONDITION
    visibility: VISIBILITY_PUBLIC
  };
}

message AgentProfileIdentityMismatchError {
  option (trogon.error.v1alpha1.message).template = {
    domain: "agents.profiles"
    reason: "AGENT_PROFILE_IDENTITY_MISMATCH"
    message: "The command names a different Agent from this profile history."
    code: FAILED_PRECONDITION
    visibility: VISIBILITY_PUBLIC
  };
}
