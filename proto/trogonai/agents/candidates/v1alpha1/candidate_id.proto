edition = "2024";

package trogonai.agents.candidates.v1alpha1;

import "buf/validate/validate.proto";

// CandidateId is the opaque identity of one recorded candidate stream.
message CandidateId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
