edition = "2024";

package trogonai.agents.proposals.v1;

import "trogonai/agents/proposals/v1/proposal.proto";

// Only an open proposal accepts its single immutable verdict. The authenticated
// verifier must differ from the opening author; principal kind is not stored.
message RecordProposalVerdict {
  string proposal_id = 1 [features.field_presence = LEGACY_REQUIRED];
  ProposalVerdict verdict = 2 [features.field_presence = LEGACY_REQUIRED];
}
