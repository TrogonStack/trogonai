edition = "2024";

package trogonai.agents.proposals.v1alpha1;

import "trogonai/agents/proposals/v1alpha1/proposal_opened.proto";
import "trogonai/agents/proposals/v1alpha1/proposal_verdict_recorded.proto";
import "trogonai/agents/proposals/v1alpha1/proposal_withdrawn.proto";

// Activation belongs only to the Agent registry; no second closing marker is
// written here. Projections join the independent histories when needed.
message ProposalEvent {
  oneof event {
    ProposalOpened proposal_opened = 1;
    ProposalVerdictRecorded proposal_verdict_recorded = 2;
    ProposalWithdrawn proposal_withdrawn = 3;
  }
}
