edition = "2024";

package trogonai.agents.proposals.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/agents/proposals/v1alpha1/proposal.proto";

message ProposalOpened {
  option (buf.validate.message).cel = {
    id: "proposal_opened.cannot_supersede_itself"
    message: "a proposal cannot supersede itself"
    expression: "!has(this.proposal.supersedes_proposal_id) || this.proposal.supersedes_proposal_id != this.proposal_id"
  };

  string proposal_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  ProposalDefinition proposal = 2 [features.field_presence = LEGACY_REQUIRED];
}
