edition = "2024";

package trogonai.agents.proposals.v1alpha1;

import "buf/validate/validate.proto";

// Only the authenticated opening author may withdraw an unjudged proposal.
// A missing, judged, or already withdrawn proposal rejects. Retrying delivery
// reuses the Decider command_id rather than submitting another withdrawal.
message WithdrawProposal {
  string proposal_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string author_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
