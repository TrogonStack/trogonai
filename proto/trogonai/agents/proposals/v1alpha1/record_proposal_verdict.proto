edition = "2024";

package trogonai.agents.proposals.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/agents/proposals/v1alpha1/proposal.proto";

// Only an open proposal accepts its single immutable verdict. The authenticated
// verifier must differ from the opening author; principal kind is not stored.
// A missing, withdrawn, or already judged proposal rejects, including a repeated
// identical verdict submitted with a new Decider command_id.
message RecordProposalVerdict {
  string proposal_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  ProposalVerdict verdict = 2 [features.field_presence = LEGACY_REQUIRED];
}
