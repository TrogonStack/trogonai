edition = "2024";

package trogonai.agents.proposals.v1alpha1;

import "buf/validate/validate.proto";

// ProposalId is the identity of one proposal stream. New fields that point at a
// proposal use it; existing proposal_id strings are not migrated.
message ProposalId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
