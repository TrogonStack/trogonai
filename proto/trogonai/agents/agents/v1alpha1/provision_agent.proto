edition = "2024";

package trogonai.agents.agents.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/agents/agents/v1alpha1/configuration_artifact.proto";
import "trogonai/agents/agents/v1alpha1/identity.proto";

// Dispatch proves key possession and registration authority before this command
// reaches decide. NoStream provisioning mints revision 1 only after verifying
// the referenced configuration artifact and its pinned contracts.
// Without provisioning_id the Agent is immediately ACTIVE. With it, dispatch
// proves the owning workflow's immutable plan and records PROVISIONING instead;
// completing that workflow's preparation is required before new work may run.
// Coordinated creation preserves its plan's command_id across NoStream retries.
message ProvisionAgent {
  AgentIdentity identity = 1 [features.field_presence = LEGACY_REQUIRED];
  string display_name = 2 [features.field_presence = LEGACY_REQUIRED];
  string parent = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  AgentConfigurationRef configuration = 4 [features.field_presence = LEGACY_REQUIRED];
  map<string, string> annotations = 5;
  string provisioning_id = 6 [(buf.validate.field).cel = {
    id: "provision_agent.provisioning_id_nonblank"
    message: "a present provisioning_id must contain a non-whitespace character"
    expression: "this.trim() != ''"
  }];
}
