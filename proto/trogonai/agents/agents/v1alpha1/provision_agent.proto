edition = "2024";

package trogonai.agents.agents.v1alpha1;

import "trogonai/agents/agents/v1alpha1/configuration_artifact.proto";
import "trogonai/agents/agents/v1alpha1/identity.proto";

// Dispatch proves key possession and registration authority before this command
// reaches decide. NoStream provisioning mints revision 1 only after verifying
// the referenced configuration artifact and its pinned contracts.
message ProvisionAgent {
  AgentIdentity identity = 1 [features.field_presence = LEGACY_REQUIRED];
  string display_name = 2 [features.field_presence = LEGACY_REQUIRED];
  string parent = 3 [features.field_presence = LEGACY_REQUIRED];
  AgentConfigurationRef configuration = 4 [features.field_presence = LEGACY_REQUIRED];
  map<string, string> annotations = 5;
}
