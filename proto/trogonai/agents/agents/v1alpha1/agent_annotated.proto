edition = "2024";

package trogonai.agents.agents.v1alpha1;

import "buf/validate/validate.proto";

// AgentAnnotated replaces the agent's annotations with the set carried here.
// Annotations are opaque record metadata: they never reach model input,
// never affect selection, and never enter the configuration digest, so this
// event mints no revision. A key absent from `annotations` is gone.
message AgentAnnotated {
  string agent_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  map<string, string> annotations = 2;
}
