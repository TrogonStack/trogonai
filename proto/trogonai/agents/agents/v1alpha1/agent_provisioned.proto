edition = "2024";

package trogonai.agents.agents.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/agents/agents/v1alpha1/agent_revision.proto";
import "trogonai/agents/agents/v1alpha1/configuration_artifact.proto";
import "trogonai/agents/agents/v1alpha1/identity.proto";
import "trogonai/agents/agents/v1alpha1/version_snapshot_reference.proto";

// AgentProvisioned is the Agent registry stream's genesis event, minting
// revision 1. No limits, no rubrics, no grants live here (design Q15/Q16);
// those are stances on their own planes.
// Absent provisioning_id preserves direct ACTIVE genesis. Presence creates
// PROVISIONING and permanently binds this identity to that operation; the Agent
// remains unavailable for new work until AgentProvisioningCompleted.
// Fork provenance is the source verified at admission, never an unchecked
// caller claim. It remains immutable through activation and lifecycle changes.
message AgentProvisioned {
  option (buf.validate.message).cel = {
    id: "agent_provisioned.fork_origin"
    message: "fork genesis requires another Agent's exact revision configuration"
    expression: "!has(this.forked_from_revision) || (this.forked_from_revision.agent_id != this.agent_id && this.forked_from_revision.configuration == this.configuration_ref)"
  };
  option (buf.validate.message).cel = {
    id: "agent_provisioned.fork_snapshot"
    message: "fork genesis requires another Agent's exact authoring snapshot configuration"
    expression: "!has(this.forked_from_snapshot) || (this.forked_from_snapshot.agent_id != this.agent_id && this.forked_from_snapshot.configuration_digest == this.configuration_ref.configuration_digest)"
  };

  // Must be the did:key derived from public_identity_key.
  string agent_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  // Immutable registry metadata, excluded from behavior and configuration identity.
  string display_name = 2 [features.field_presence = LEGACY_REQUIRED];
  // Placement node the agent is provisioned under: the node ref that anchors
  // the agent in the placement hierarchy and scopes ownership and addressing.
  // Bare spelling is deliberate per the spelling rule: unsuffixed `parent`
  // always denotes placement, while kinship refs are always `parent<Type>Id`.
  // This is creation placement. Hierarchy owns subsequent moves and projects
  // current placement; the registry records no relocation event.
  string parent = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  // Revision minted by this genesis event, recorded explicitly so no consumer
  // derives it from convention. Always 1; the decider rejects any other value
  // at write time.
  uint64 revision = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.const = 1
  ];
  // Opaque record metadata present from genesis. Excluded from
  // configuration identity and from model input; later changes arrive as
  // AgentAnnotated and mint no revision.
  map<string, string> annotations = 5;
  AgentConfigurationRef configuration_ref = 6 [features.field_presence = LEGACY_REQUIRED];
  Ed25519PublicJwk public_identity_key = 7 [features.field_presence = LEGACY_REQUIRED];
  string provisioning_id = 8 [(buf.validate.field).cel = {
    id: "agent_provisioned.provisioning_id_nonblank"
    message: "a present provisioning_id must contain a non-whitespace character"
    expression: "this.trim() != ''"
  }];
  oneof fork_origin {
    AgentRevisionRef forked_from_revision = 9;
    AgentVersionSnapshotRef forked_from_snapshot = 10;
  }
}
