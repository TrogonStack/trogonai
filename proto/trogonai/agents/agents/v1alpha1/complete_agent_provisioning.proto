edition = "2024";

package trogonai.agents.agents.v1alpha1;

import "buf/validate/validate.proto";

// Only PROVISIONING with the exact genesis operation binding may complete.
// Dispatch proves the owning workflow and its durable verified genesis and all
// required PREPARE outcomes against the immutable plan; caller claims do not
// establish readiness. Dispatch requires the plan's command_id and an
// expected_revision, preserving both original values on retries. Completion
// races cancellation in this registry stream: reconcile the actual recorded
// winner before continuing the workflow.
message CompleteAgentProvisioning {
  string agent_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).cel = {
      id: "complete_agent_provisioning.agent_id_nonblank"
      message: "agent_id must contain a non-whitespace character"
      expression: "this.trim() != ''"
    }
  ];
  string provisioning_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).cel = {
      id: "complete_agent_provisioning.provisioning_id_nonblank"
      message: "provisioning_id must contain a non-whitespace character"
      expression: "this.trim() != ''"
    }
  ];
}
