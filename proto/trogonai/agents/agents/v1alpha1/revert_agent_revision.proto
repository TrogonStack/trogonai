edition = "2024";

package trogonai.agents.agents.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/agents/agents/v1alpha1/agent_revision.proto";

// Dispatch authorizes reversion; the registry verifies both references belong
// to this agent and the target was activated. A revert mints the next highest
// revision with the target configuration; it never moves a stored pointer back.
// Both references must match their recorded immutable values, not just their
// revision numbers. An archived agent rejects reversion. Revision exhaustion
// rejects instead of wrapping. A target may be the current revision.
message RevertAgentRevision {
  option (buf.validate.message).cel = {
    id: "revert_agent_revision.target"
    message: "the revert target must be a current or earlier revision of this agent"
    expression: "this.revert_of_revision.agent_id == this.expected_current_revision.agent_id && this.revert_of_revision.revision_number <= this.expected_current_revision.revision_number"
  };

  AgentRevisionRef expected_current_revision = 1 [features.field_presence = LEGACY_REQUIRED];
  AgentRevisionRef revert_of_revision = 2 [features.field_presence = LEGACY_REQUIRED];
}
