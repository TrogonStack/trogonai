edition = "2024";

package trogonai.agents.agents.v1alpha1;

import "buf/validate/validate.proto";

// Unarchiving restores an archived agent for new work.
// Only an archived agent accepts this command; an active agent rejects it.
// Dispatch requires DecideRequest.expected_revision for this transition. Retrying
// preserves that original stream revision and command id, so delivery after a
// later archive cannot silently undo that archive.
message UnarchiveAgent {
  string agent_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
