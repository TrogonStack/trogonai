edition = "2024";

package trogonai.agents.agents.v1alpha1;

import "buf/validate/validate.proto";

// Changes the matching pending Agent to terminal PROVISIONING_CANCELLED without
// minting a revision or erasing genesis. Cleanup of prepared participants remains
// workflow-owned; cancellation neither deletes nor rewinds another stream.
message AgentProvisioningCancelled {
  string agent_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).cel = {
      id: "agent_provisioning_cancelled.agent_id_nonblank"
      message: "agent_id must contain a non-whitespace character"
      expression: "this.trim() != ''"
    }
  ];
  string provisioning_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).cel = {
      id: "agent_provisioning_cancelled.provisioning_id_nonblank"
      message: "provisioning_id must contain a non-whitespace character"
      expression: "this.trim() != ''"
    }
  ];
}
