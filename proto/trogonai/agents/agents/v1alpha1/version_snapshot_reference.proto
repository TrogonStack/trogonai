edition = "2024";

package trogonai.agents.agents.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/agents/agents/v1alpha1/digest.proto";

// Authoring identity commits to exact bytes, independently of registry admission.
message AgentVersionSnapshotRef {
  string agent_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).cel = {
      id: "agent_version.identity_nonblank"
      message: "identity must contain a non-whitespace character"
      expression: "this.trim() != ''"
    }
  ];
  string version_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).cel = {
      id: "agent_version.identity_nonblank"
      message: "identity must contain a non-whitespace character"
      expression: "this.trim() != ''"
    }
  ];
  uint64 snapshot_number = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  Digest configuration_digest = 4 [features.field_presence = LEGACY_REQUIRED];
}
