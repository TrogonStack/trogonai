edition = "2024";

package trogonai.agents.agents.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "trogonai/agents/agents/v1alpha1/agent_revision.proto";
import "trogonai/agents/agents/v1alpha1/digest.proto";

// Session-scoped delta over a base revision. This is the one sanctioned
// Session-scoped override of admitted values. It is never stored as a revision
// and never activated; it only exists inside the admitted plan of the sessions
// that run it. Every edit must fall inside the EditableSurface of the base
// revision's implementation; edits outside it are rejected at admission.
// Omitted means inherited from the base revision.
message CandidateOverlay {
  option (buf.validate.message).cel = {
    id: "candidate_overlay.has_edit"
    message: "overlay must carry at least one edit"
    expression: "has(this.settings_edit) || size(this.platform_edits) > 0 || size(this.staged_skills) > 0"
  };

  AgentRevisionRef base_revision = 1 [features.field_presence = LEGACY_REQUIRED];
  SettingsEdit settings_edit = 2;
  repeated PlatformEdit platform_edits = 3;
  repeated StagedSkill staged_skills = 4;
}

// Partial runtime settings of the same message type as the base settings.
// Only the paths in `paths` are replaced, wholesale per path. Repeated and map
// fields are replaced as a unit, never merged element by element.
message SettingsEdit {
  google.protobuf.Any partial_settings = 1 [features.field_presence = LEGACY_REQUIRED];
  google.protobuf.FieldMask paths = 2 [features.field_presence = LEGACY_REQUIRED];
}

// The change case is the component being edited.
message PlatformEdit {
  oneof change {
    option (buf.validate.oneof).required = true;

    SkillSetReplacement skill_set = 1;
    MemoryKindReplacement memory_kinds = 2;
  }
}

message SkillSetReplacement {
  repeated string binding_names = 1 [(buf.validate.field).repeated.unique = true];
}

message MemoryKindReplacement {
  repeated string kinds = 1 [(buf.validate.field).repeated.unique = true];
}

// Skill content staged for this overlay only. It has no stream identity until
// the overlay is promoted.
message StagedSkill {
  string binding_name = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  bytes content = 2 [features.field_presence = LEGACY_REQUIRED];
  Digest content_digest = 3 [features.field_presence = LEGACY_REQUIRED];
}
