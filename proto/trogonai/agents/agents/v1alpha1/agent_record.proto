edition = "2024";

package trogonai.agents.agents.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/agents/agents/v1alpha1/agent_revision.proto";
import "trogonai/agents/agents/v1alpha1/identity.proto";
import "trogonai/agents/agents/v1alpha1/version_snapshot_reference.proto";

// New direct execution, delegation, and public discovery require ACTIVE and
// current policy authorization, including callers that already know an Agent id
// or revision. Provisioning is a registry admission gate, not a UI filter.
enum AgentLifecycle {
  AGENT_LIFECYCLE_UNSPECIFIED = 0;
  AGENT_LIFECYCLE_ACTIVE = 1;
  AGENT_LIFECYCLE_ARCHIVED = 2;
  // Only completion or cancellation of the bound provisioning may leave this phase.
  AGENT_LIFECYCLE_PROVISIONING = 3;
  // Terminal: this identity cannot be completed, unarchived, or provisioned again.
  AGENT_LIFECYCLE_PROVISIONING_CANCELLED = 4;
}

// A derived logical record joining the registry and hierarchy. It is not a
// write-side state or an independently writable placement or revision pointer.
message Agent {
  option (buf.validate.message).cel = {
    id: "agent.latest_revision_identity"
    message: "the latest revision must belong to this agent"
    expression: "this.identity.agent_id == this.latest_revision.agent_id"
  };
  option (buf.validate.message).cel = {
    id: "agent.provisioning_binding"
    message: "pending or cancelled provisioning requires its genesis operation and revision 1"
    expression: "!(this.lifecycle in [3, 4]) || (has(this.provisioning_id) && this.latest_revision.revision_number == 1u)"
  };
  option (buf.validate.message).cel = {
    id: "agent.fork_origin"
    message: "a fork must name another Agent and preserve its exact configuration at revision 1"
    expression: "!has(this.forked_from_revision) || (this.forked_from_revision.agent_id != this.identity.agent_id && (this.latest_revision.revision_number != 1u || this.forked_from_revision.configuration == this.latest_revision.configuration))"
  };
  option (buf.validate.message).cel = {
    id: "agent.fork_snapshot"
    message: "a fork must name another Agent and preserve its exact snapshot configuration at revision 1"
    expression: "!has(this.forked_from_snapshot) || (this.forked_from_snapshot.agent_id != this.identity.agent_id && (this.latest_revision.revision_number != 1u || this.forked_from_snapshot.configuration_digest == this.latest_revision.configuration.configuration_digest))"
  };

  AgentIdentity identity = 1 [features.field_presence = LEGACY_REQUIRED];
  string display_name = 2 [features.field_presence = LEGACY_REQUIRED];
  // Current hierarchy placement, which may differ from genesis placement.
  string parent = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  // The highest registry-minted revision for this identity, including reverts.
  AgentRevisionRef latest_revision = 4 [features.field_presence = LEGACY_REQUIRED];
  // UNSPECIFIED and unknown values reject.
  AgentLifecycle lifecycle = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // Nonbehavioral metadata; selectors consume the pinned configuration's labels.
  map<string, string> annotations = 6;
  // Immutable genesis binding, retained after completion or cancellation.
  string provisioning_id = 7 [(buf.validate.field).cel = {
    id: "agent.provisioning_id_nonblank"
    message: "a present provisioning_id must contain a non-whitespace character"
    expression: "this.trim() != ''"
  }];
  // Derived from immutable genesis, even when the latest configuration differs.
  oneof fork_origin {
    AgentRevisionRef forked_from_revision = 8;
    AgentVersionSnapshotRef forked_from_snapshot = 9;
  }
}
