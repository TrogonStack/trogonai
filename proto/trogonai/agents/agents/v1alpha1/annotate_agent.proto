edition = "2024";

package trogonai.agents.agents.v1alpha1;

import "buf/validate/validate.proto";

// Replaces nonbehavioral metadata only in ACTIVE; it mints no revision and
// rejects pending or cancelled provisioning.
// Dispatch requires DecideRequest.expected_revision. Retrying preserves the
// original stream revision and command id so an older replacement cannot
// silently overwrite newer annotations.
message AnnotateAgent {
  string agent_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  map<string, string> annotations = 2;
}
