edition = "2024";

package trogonai.agents.agents.v1alpha1;

import "trogonai/agents/agents/v1alpha1/agent_revision.proto";

// Only the registry records activation. The new revision is the previous
// revision plus one, including reverts; existing sessions retain their pins.
message AgentRevisionActivated {
  AgentRevisionRef previous_revision = 1 [features.field_presence = LEGACY_REQUIRED];
  // Its source is proposal_id or revert_of_revision, never provisioning.
  AgentRevision revision = 2 [features.field_presence = LEGACY_REQUIRED];
}
