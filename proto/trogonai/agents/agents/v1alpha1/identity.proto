edition = "2024";

package trogonai.agents.agents.v1alpha1;

import "buf/validate/validate.proto";

// AgentId identifies one Agent. The value is compared as a whole and never
// parsed; it carries no hierarchy segment. Messages older than this type carry
// the identifier as a bare string and keep doing so, because renaming a wire
// field is not worth a breaking change; new contracts take this type (ADR#0068).
message AgentId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

// The message fixes JWK kty=OKP, crv=Ed25519, and alg=EdDSA. No private JWK
// members are representable; x is unpadded base64url encoding of 32 public bytes.
message Ed25519PublicJwk {
  string x = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
  ];
}

// Provisioning verifies did:key derivation and possession of this key upstream.
// The public anchor proves identity, never current authorization or affiliation.
message AgentIdentity {
  string agent_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  Ed25519PublicJwk public_key = 2 [features.field_presence = LEGACY_REQUIRED];
}
