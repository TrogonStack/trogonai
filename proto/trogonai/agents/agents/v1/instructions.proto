edition = "2024";

package trogonai.agents.agents.v1;

// Instructions is the charter instruction content (ADR#0043): the one
// authored markdown document that is the agent's own voice. Proposals diff
// it as typed platform content and activation digests commit to it. It is a
// message rather than a bare string so growth stays additive on this field
// number; how a runtime ingests the content (preset, append, replacement)
// is runtime-owned settings vocabulary and never lives here, and
// conversation-shaped content belongs to turn wrappers and memory, never to
// this message.
message Instructions {
  // Markdown instruction content.
  string text = 1 [features.field_presence = LEGACY_REQUIRED];
}
