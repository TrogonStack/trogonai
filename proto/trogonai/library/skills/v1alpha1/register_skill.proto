edition = "2024";

package trogonai.library.skills.v1alpha1;

import "buf/validate/validate.proto";
import "trogon/hierarchy/v1alpha1/node.proto";

// Registers a skill under a hierarchy node. Resolution order across an agent.s
// node and its ancestors is a runtime decision, not defined here. NoStream creation requires a
// nonempty Decider command_id and no expected_revision; retries preserve the id.
message RegisterSkill {
  string skill_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  trogon.hierarchy.v1alpha1.NodeId scope = 2 [features.field_presence = LEGACY_REQUIRED];
  string display_name = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
