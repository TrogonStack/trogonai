edition = "2024";

package trogonai.library.skills.v1alpha1;

import "trogonai/library/skills/ids/v1alpha1/skill_id.proto";

// Archiving never removes versions. An already archived history emits no second
// archive.
message SkillArchived {
  trogonai.library.skills.ids.v1alpha1.SkillId skill_id = 1 [features.field_presence = LEGACY_REQUIRED];
}
