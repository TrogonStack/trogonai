edition = "2024";

package trogonai.library.skills.v1alpha1;

import "buf/validate/validate.proto";

// Archiving never removes versions. An already archived history emits no second
// archive.
message SkillArchived {
  string skill_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
