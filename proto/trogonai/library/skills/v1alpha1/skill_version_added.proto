edition = "2024";

package trogonai.library.skills.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/library/skills/v1alpha1/claim_check.proto";
import "trogonai/library/skills/v1alpha1/skill_provenance.proto";

// The version, content digest, and provenance are immutable once recorded.
message SkillVersionAdded {
  string skill_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string version = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  ClaimCheck content = 3 [features.field_presence = LEGACY_REQUIRED];
  SkillProvenance provenance = 4 [features.field_presence = LEGACY_REQUIRED];
}
