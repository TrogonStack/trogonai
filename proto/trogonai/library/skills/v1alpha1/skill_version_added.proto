edition = "2024";

package trogonai.library.skills.v1alpha1;

import "trogonai/agents/agents/v1alpha1/dependencies.proto";
import "trogonai/library/skills/v1alpha1/claim_check.proto";
import "trogonai/library/skills/v1alpha1/skill_provenance.proto";

// The version, content digest, and provenance are immutable once recorded.
message SkillVersionAdded {
  trogonai.agents.agents.v1alpha1.SkillVersionRef version_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  ClaimCheck content_ref = 2 [features.field_presence = LEGACY_REQUIRED];
  SkillProvenance provenance = 3 [features.field_presence = LEGACY_REQUIRED];
}
