edition = "2024";

package trogonai.library.skills.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/agents/agents/v1alpha1/identity.proto";
import "trogonai/agents/candidates/v1alpha1/candidate_ref.proto";
import "trogonai/agents/proposals/v1alpha1/proposal_id.proto";

// Origin fields are references, never copied configuration.
message SkillProvenance {
  oneof origin {
    option (buf.validate.oneof).required = true;

    // Proposal that promoted this version.
    SkillPromotion promoted = 1;
    // Agent that authored this version directly.
    trogonai.agents.agents.v1alpha1.AgentId authored_by = 2;
  }
}

// A promotion points back at the proposal that judged it and, when the content
// was measured as a candidate, at that exact candidate.
message SkillPromotion {
  trogonai.agents.proposals.v1alpha1.ProposalId promoted_by_proposal_id = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.agents.candidates.v1alpha1.CandidateRef origin_candidate_ref = 2;
}
