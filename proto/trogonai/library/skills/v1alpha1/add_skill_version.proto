edition = "2024";

package trogonai.library.skills.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/library/skills/v1alpha1/claim_check.proto";
import "trogonai/library/skills/v1alpha1/skill_provenance.proto";

// Appends an immutable version; a version is never edited. The pair (skill_id,
// version) is what an agents SkillVersionRef names, so a revision's
// SkillDeclaration can pin it. version is an exact identifier: empty values and
// moving aliases are invalid, and a repeated version is rejected. Content is
// held by claim check, and its digest is what SkillDeclaration.content_digest
// must match.
message AddSkillVersion {
  string skill_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string version = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  ClaimCheck content = 3 [features.field_presence = LEGACY_REQUIRED];
  SkillProvenance provenance = 4 [features.field_presence = LEGACY_REQUIRED];
}
