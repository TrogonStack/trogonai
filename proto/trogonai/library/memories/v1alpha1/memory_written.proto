edition = "2024";

package trogonai.library.memories.v1alpha1;

import "trogon/hierarchy/v1alpha1/node.proto";
import "trogonai/library/memories/v1alpha1/claim_check.proto";
import "trogonai/library/memories/v1alpha1/memory_id.proto";
import "trogonai/library/memories/v1alpha1/memory_kind.proto";
import "trogonai/library/memories/v1alpha1/memory_provenance.proto";

// Genesis fixes scope, kind, content, and provenance for this entry.
message MemoryWritten {
  MemoryId memory_id = 1 [features.field_presence = LEGACY_REQUIRED];
  trogon.hierarchy.v1alpha1.NodeId scope = 2 [features.field_presence = LEGACY_REQUIRED];
  MemoryKind kind = 3 [features.field_presence = LEGACY_REQUIRED];
  ClaimCheck content_ref = 4 [features.field_presence = LEGACY_REQUIRED];
  MemoryProvenance provenance = 5 [features.field_presence = LEGACY_REQUIRED];
}
