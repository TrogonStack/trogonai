edition = "2024";

package trogonai.library.memories.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/library/memories/v1alpha1/memory_superseded.proto";
import "trogonai/library/memories/v1alpha1/memory_written.proto";

// An unset or unknown event rejects replay; skipping a supersession could
// resurface a memory the library has already replaced.
message MemoryEvent {
  oneof event {
    option (buf.validate.oneof).required = true;

    MemoryWritten memory_written = 1;
    MemorySuperseded memory_superseded = 2;
  }
}
