edition = "2024";

package trogonai.library.memories.v1alpha1;

import "buf/validate/validate.proto";

// Names a category of memory; an agents MemoryKindSelector selects entries by
// this value.
message MemoryKind {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
