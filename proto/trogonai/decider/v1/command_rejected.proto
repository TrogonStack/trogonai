edition = "2024";

package trogonai.decider.v1;

import "trogonai/decider/v1/domain_error_detail.proto";

// A command the decider understood and refused on domain rules.
//
// A negative outcome, not a fault: the host executed correctly and the module
// answered "no". A service that rejects invalid commands all day is healthy,
// which is why this is a reply arm rather than an error channel.
message CommandRejected {
  // Stable, machine-readable rejection code the module chose.
  string code = 1 [features.field_presence = LEGACY_REQUIRED];

  string message = 2 [features.field_presence = LEGACY_REQUIRED];

  repeated DomainErrorDetail details = 3;
}
