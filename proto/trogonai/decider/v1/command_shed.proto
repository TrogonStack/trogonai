edition = "2024";

package trogonai.decider.v1;

// A command admission control refused before any work began.
//
// Nothing was read, decided, or appended, so the same command submitted later
// may well succeed. Separate from a fault because the host is working exactly
// as configured: it is full, not broken.
message CommandShed {
  // The concurrency limit that was already fully committed. Names what the
  // caller is contending for so a backoff can be sized against it rather than
  // guessed.
  uint64 limit = 1 [features.field_presence = LEGACY_REQUIRED];
}
