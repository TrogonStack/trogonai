edition = "2024";

package trogonai.decider.v1;

// One link in a decider error's source chain.
//
// Ordered rather than a map: the chain is read most specific cause last, and a
// map would drop that order along with any repeated key.
message DomainErrorDetail {
  string key = 1 [features.field_presence = LEGACY_REQUIRED];
  string value = 2 [features.field_presence = LEGACY_REQUIRED];
}
