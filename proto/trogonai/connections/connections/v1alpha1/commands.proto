edition = "2024";

package trogonai.connections.connections.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/connections/connections/v1alpha1/authorization.proto";
import "trogonai/connections/connections/v1alpha1/cleanup.proto";
import "trogonai/connections/connections/v1alpha1/configuration.proto";
import "trogonai/connections/connections/v1alpha1/health.proto";
import "trogonai/connections/connections/v1alpha1/lifecycle.proto";
import "trogonai/connections/connections/v1alpha1/mcp.proto";
import "trogonai/connections/connections/v1alpha1/upgrade.proto";
import "trogonai/connections/types/v1alpha1/authority.proto";
import "trogonai/connections/types/v1alpha1/binding.proto";
import "trogonai/connections/types/v1alpha1/cleanup.proto";
import "trogonai/connections/types/v1alpha1/health.proto";
import "trogonai/connections/types/v1alpha1/identity.proto";
import "trogonai/connections/types/v1alpha1/owner.proto";
import "trogonai/connections/types/v1alpha1/reference.proto";
import "trogonai/connections/types/v1alpha1/resource_parent.proto";

// Each concrete payload identifies its immutable resource_parent. Dispatch
// and replay require it to match the addressed stream and stored genesis; it
// is not caller authorization and never changes with logical ownership.

// connections.connections owns one stream per Connection, in its custody
// project (ADR#0092 Decision 1, ADR#0093 Decision 1). ReserveConnection uses
// NoStream; every later command uses StreamUnchanged at the observed
// revision. Custody and the connections service are the only writers; the
// trusted executors report through ReportConnectionHealth (ADR#0092
// Decision 4, R8). Dispatch authenticates and authorizes every command, and
// the envelope carries the actor. Release, provider app and project standing
// are joined live and never written here (ADR#0092 Decision 10, R22). No
// command carries material or personal data (ADR#0092 Decisions 8 and 9).

// NoStream. Reserves a Pending connection before consent completes (ADR#0092
// Decision 4). The owner and custody project are fixed for life (ADR#0093
// Decision 1); the release and app pins must equal the configuration
// activation commits. Dispatch checks that the owner is live and can access
// the custody project (ADR#0093 Decision 9), and that a workspace owner's
// custody project is its current integration project (ADR#0093 Decision 3).
message ReserveConnection {
  reserved 2;
  reserved project_id;

  option (buf.validate.message).cel = {
    id: "reserve_connection.app_parent"
    message: "a project app must share the connection custody parent"
    expression: "!has(this.provider_app_ref) || has(this.provider_app_ref.resource_parent.platform) || (has(this.provider_app_ref.resource_parent.project) && this.provider_app_ref.resource_parent.project == this.resource_parent)"
  };

  option (buf.validate.message).cel = {
    id: "reserve_connection.project_owner_custody"
    message: "a project-owned connection is in custody of its owner"
    expression: "!has(this.owner.project) || this.owner.project.project_id == this.resource_parent.project_id"
  };

  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ConnectionOwner owner = 3 [features.field_presence = LEGACY_REQUIRED];
  // The release selected, which must be Published at reservation (ADR#0092
  // Decision 10).
  trogonai.connections.types.v1alpha1.ConnectorReleaseRef connector_release_ref = 4 [features.field_presence = LEGACY_REQUIRED];
  // Absent for a method that presents no client identity.
  trogonai.connections.types.v1alpha1.ProviderAppRef provider_app_ref = 5;
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 6 [features.field_presence = LEGACY_REQUIRED];
}

// Pending only. Commits the exact configuration bytes and digest, the account,
// the claim receipt, the granted authority, the bindings and
// authorization_generation 1 (ADR#0092 Decision 4). The configuration's
// release and app must equal the reservation's pins. For an OAuth or MCP
// method the attempt is named; dispatch verified that it completed for this
// connection and that the claim is Bound to it (ADR#0094 Decision 5). A
// non-empty missing_optional_scopes records SCOPES_REDUCED (ADR#0094
// Decision 12). An MCP method records the protected resource metadata and the
// owner's acknowledgement of its endpoint origins (ADR#0092 Decision 10, R19).
message ActivateConnection {
  option (buf.validate.message).cel = {
    id: "activate_connection.first_generation"
    message: "activation records authorization generation 1"
    expression: "this.authorization.authorization_generation == 1u"
  };
  option (buf.validate.message).cel = {
    id: "activate_connection.attempt_for_oauth"
    message: "the OAuth, MCP and app installation methods name their attempt"
    expression: "(has(this.configuration.configuration.authentication.oauth_authorization_grant) || has(this.configuration.configuration.authentication.mcp_oauth) || has(this.configuration.configuration.authentication.app_installation)) == has(this.authorization.attempt_id)"
  };
  option (buf.validate.message).cel = {
    id: "activate_connection.mcp_resource"
    message: "the MCP method records its protected resource metadata and egress acknowledgement, and no other does"
    expression: "has(this.configuration.configuration.authentication.mcp_oauth) == has(this.mcp_protected_resource) && has(this.mcp_protected_resource) == has(this.egress_acknowledgement)"
  };

  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  CommittedConfiguration configuration = 2 [features.field_presence = LEGACY_REQUIRED];
  AuthorizationRecord authorization = 3 [features.field_presence = LEGACY_REQUIRED];
  McpProtectedResource mcp_protected_resource = 4;
  // The endpoint origins of the pinned metadata the owner acknowledged at
  // connect time, for a generic MCP release only; a catalog release's hosts
  // are reviewed in its definition (ADR#0092 Decision 10).
  EgressHostAcknowledgement egress_acknowledgement = 5;
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 6 [features.field_presence = LEGACY_REQUIRED];
}

// Any live state. Completes a reconnect, a step-up included, on the same id
// (ADR#0094 Decision 6): the account fingerprint must equal the recorded one,
// authorization_generation must be the recorded value plus one, and the
// configuration is unchanged. Every held health reason clears, because the
// grant is new; a non-empty missing_optional_scopes records SCOPES_REDUCED
// again. A refreshed MCP snapshot is recorded when present; its endpoint
// origins must equal the acknowledged set, since a reconnect carries no new
// acknowledgement.
message CompleteReconnect {
  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  AuthorizationRecord authorization = 2 [features.field_presence = LEGACY_REQUIRED];
  McpProtectedResource mcp_protected_resource = 3;
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 4 [features.field_presence = LEGACY_REQUIRED];
}

// Any live state. The trusted executor or the trusted MCP executor reports a
// provider-auth observation (R8): a second 401 after one forced refresh is
// PROVIDER_AUTHENTICATION_REJECTED, and a 403 with insufficient_scope is
// SCOPE_STEP_UP with the challenged scopes. These are the only reasons an
// executor may report; the rest come from custody or from this service.
message ReportConnectionHealth {
  option (buf.validate.message).cel = {
    id: "report_connection_health.executor_reasons"
    message: "an executor reports SCOPE_STEP_UP or PROVIDER_AUTHENTICATION_REJECTED only"
    expression: "this.observation.reason in [2, 7]"
  };

  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  HealthObservation observation = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Any live state. Custody records a health fact learned from refresh, restore
// or a key event: the one exception to "refresh never appends" (ADR#0092
// Decision 4, R7, ADR#0095 Decisions 3, 4 and 10). SCOPES_REDUCED carries the
// narrower granted authority, which replaces the recorded one.
message RecordCustodyHealth {
  option (buf.validate.message).cel = {
    id: "record_custody_health.custody_reasons"
    message: "custody records refresh, restore and key reasons only"
    expression: "this.observation.reason in [1, 3, 4, 5, 8, 9, 10, 11, 13]"
  };
  option (buf.validate.message).cel = {
    id: "record_custody_health.reduction_carries_authority"
    message: "a custody-reported SCOPES_REDUCED carries the reduced granted authority"
    expression: "this.observation.reason != 1 || has(this.observation.granted_authority)"
  };

  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  HealthObservation observation = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Any live state holding the reason. Custody reports recovery:
// REPEATED_TRANSIENT_FAILURE after refresh succeeds again, which returns the
// connection from Degraded (ADR#0092 Decision 4), or SCOPES_REDUCED after a
// refresh reports the full grant, with the authority that replaces the
// reduced one. Dead-credential reasons, SCOPE_STEP_UP and SCOPES_BEYOND_GRANT
// clear only through CompleteReconnect. ADR-silent shape: the ADR names
// recovery without a command; this is the smallest one.
message ClearConnectionHealth {
  option (buf.validate.message).cel = {
    id: "clear_connection_health.clearable_reasons"
    message: "only SCOPES_REDUCED and REPEATED_TRANSIENT_FAILURE clear without a reconnect"
    expression: "this.reason in [1, 3]"
  };
  option (buf.validate.message).cel = {
    id: "clear_connection_health.authority_for_reduction"
    message: "clearing SCOPES_REDUCED carries the restored granted authority and nothing else does"
    expression: "(this.reason == 1) == has(this.granted_authority)"
  };

  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ConnectionHealthReason reason = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  trogonai.connections.types.v1alpha1.GrantedAuthority granted_authority = 3;
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 4 [features.field_presence = LEGACY_REQUIRED];
}

// Any live state not already holding the reason. Suspends the connection:
// admission and the executors refuse it and refresh pauses (R9). Reasons
// accumulate, so an owner's disable and an operator's pause coexist.
message SuspendConnection {
  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  SuspensionReason reason = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Suspended with the reason held. Lifts one reason; the connection leaves
// Suspended only when no reason remains, and returns to the state its health
// reasons imply (R9).
message ResumeConnection {
  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  SuspensionReason reason = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Any live state. Replaces the owner-edited metadata whole. ADR#0092 Decision
// 4 names this UpdateMetadata; the name here follows the VerbNoun form of the
// package. The ConnectionRef is unchanged.
message UpdateConnectionMetadata {
  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  ConnectionMetadata metadata = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Any live state. Replaces the binding set whole, for a credential replaced
// under the same role (ADR#0092 Decision 4): the roles must equal the recorded
// roles, and a binding whose SecretRef differs from the recorded one carries
// the recorded binding_generation plus one; an unchanged binding repeats it.
// The ConnectionRef and the authorization_generation are unchanged. A token
// rotation behind a binding never comes here.
message ReplaceCredentialBindings {
  option (buf.validate.message).cel = {
    id: "replace_credential_bindings.roles_unique"
    message: "one binding per credential role"
    expression: "this.bindings.map(b, b.role.value).unique()"
  };

  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  repeated trogonai.connections.types.v1alpha1.CredentialBinding bindings = 2 [(buf.validate.field).repeated.min_items = 1];
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Any live state. Moves the connection to a successor release of the same
// connector: same id, new ConnectionRef (ADR#0092 Decision 10). Only the
// release pin and the requested scopes may differ from the recorded
// configuration. The owner acknowledged the added hosts and the scope
// changes; the platform never upgrades on an owner's behalf. Dispatch checks
// that the successor is Published. Every required scope of the successor
// that the recorded granted authority lacks is recorded as
// SCOPES_BEYOND_GRANT, which makes the connection ReconnectRequired until a
// reconnect grants them.
message UpgradeConnector {
  option (buf.validate.message).cel = {
    id: "upgrade_connector.required_scopes_unique"
    message: "required scopes must be unique"
    expression: "this.required_scopes.map(s, s.value).unique()"
  };
  option (buf.validate.message).cel = {
    id: "upgrade_connector.required_within_requested"
    message: "every required scope is a requested scope of the new configuration"
    expression: "this.required_scopes.all(r, this.configuration.configuration.requested_scopes.exists(s, s.value == r.value))"
  };

  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  CommittedConfiguration configuration = 2 [features.field_presence = LEGACY_REQUIRED];
  ConnectorUpgradeAcknowledgement acknowledgement = 3 [features.field_presence = LEGACY_REQUIRED];
  // The successor's required scopes, as its definition marks them, so the
  // decider can find the scopes beyond the grant without reading the catalog.
  // ADR-silent shape: the smallest input that lets the stream decide
  // SCOPES_BEYOND_GRANT itself.
  repeated trogonai.connections.types.v1alpha1.ProviderScope required_scopes = 4;
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 5 [features.field_presence = LEGACY_REQUIRED];
}

// Any live state of an MCP connection. Records a re-fetched protected resource
// metadata snapshot (R19). When its endpoint origins equal the acknowledged
// set the digest change is recorded without an acknowledgement; when they
// differ the owner's new acknowledgement of the exact set is required and
// recorded (ADR#0092 Decision 10). The resource URI and issuer are
// configuration and cannot change here.
message RecordMcpResourceMetadata {
  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  McpProtectedResource mcp_protected_resource = 2 [features.field_presence = LEGACY_REQUIRED];
  // Present exactly when the endpoint origins changed.
  EgressHostAcknowledgement egress_acknowledgement = 3;
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 4 [features.field_presence = LEGACY_REQUIRED];
}

// Any live state. Records that the provider uninstalled the app or otherwise
// revoked the grant on its side: a fact about the world, not an intent. The
// connection keeps its id and becomes ReconnectRequired with reason
// PROVIDER_UNINSTALLED (ADR#0092 Decision 4, ADR#0094 Decision 6).
message RecordProviderRevocation {
  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  // When the provider's notice or the observation that revealed it occurred.
  google.protobuf.Timestamp observed_at = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Any live state. The owner's intent, or an offboarding cascade's trigger
// (ADR#0093 Decisions 9 and 10). Terminal: admission denies at once, refresh
// and resolve stop, and reconnecting means a new connection (ADR#0092
// Decision 4, R3). Provider revoke, material destruction and profile purge
// follow as their own facts.
message RevokeConnection {
  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  RevocationTrigger trigger = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Revoked only, while no terminal outcome is recorded. Records one provider
// revoke attempt's outcome (ADR#0094 Decision 13). A terminal outcome lets
// custody destroy the material (R3); a residual past the window is recorded
// through RecordCleanupObligation as PROVIDER_REVOKE_RESIDUAL.
message RecordProviderRevokeOutcome {
  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  ProviderRevokeOutcome outcome = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Revoked or Aborted, with no open obligation of the kind. Opens cleanup debt
// for a step that could not finish (ADR#0093 Decision 9). The reactor that
// ran the step records it; the fold never derives one.
message RecordCleanupObligation {
  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  CleanupObligation obligation = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Revoked or Aborted, with an open obligation of the kind. Discharges it once
// the step completed, for example a residual grant that expired or material
// destroyed on retry.
message ConfirmConnectionCleanup {
  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.CleanupObligationKind kind = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Any present state. Records that the erasable provider account profile was
// purged (ADR#0093 Decision 12): after offboarding, on disconnect, or on an
// erasure request while the connection lives. Discharges an open
// PROFILE_UNPURGED obligation when one is held.
message RecordProfileErasure {
  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  ProviderAccountProfileErasure erasure = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Pending only. Abandons the reservation when the attempt ends without
// activation or an offboarding trigger reaches it first (ADR#0092
// Decision 4). Terminal.
message AbortConnection {
  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 1 [features.field_presence = LEGACY_REQUIRED];
  AbortReason reason = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}
