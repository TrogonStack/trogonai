edition = "2024";

package trogonai.connections.types.v1alpha1;

import "buf/validate/validate.proto";

// The typed result of one use of a connection, used for internal proxy/custody decisions and
// recorded on the connection audit stream (ADR#0096 Decisions 4 and 9).
// Denied, unavailable and throttled stay distinct. No failure causes another
// connection, app or release to be tried. Unspecified and unknown values are
// invalid.
enum ConnectionUseResult {
  CONNECTION_USE_RESULT_UNSPECIFIED = 0;
  // A provider HTTP response completed within transport and credential
  // protections. Status, permitted headers and body remain HTTP; this outcome
  // does not assert success or decode the response into a platform schema.
  CONNECTION_USE_RESULT_COMPLETED = 1;
  // The grant, proof, Session, attempt or plan digest disagree. No retry.
  CONNECTION_USE_RESULT_GRANT_MISMATCH = 2;
  // The permit, a delegation included, or its ceiling no longer allows the
  // request, or a hold stops the Agent. No retry.
  CONNECTION_USE_RESULT_NOT_PERMITTED = 3;
  // The connection is not Active, or needs the owner to reconnect. No retry.
  CONNECTION_USE_RESULT_CONNECTION_UNAVAILABLE = 4;
  // The live authorization_generation differs from the planned one. No retry.
  CONNECTION_USE_RESULT_CONNECTION_SUPERSEDED = 5;
  // The pinned release is blocked (ADR#0092 Decision 10). No retry.
  CONNECTION_USE_RESULT_RELEASE_BLOCKED = 6;
  // The HTTP request violates framing, destination, binding or a limit. No retry.
  CONNECTION_USE_RESULT_INPUT_REJECTED = 7;
  // A platform budget is exhausted or the provider asked for backoff. Carries
  // the limit source and retry_after; retry the same connection and request
  // after retry_after. The platform never retries on the agent's behalf.
  CONNECTION_USE_RESULT_PROVIDER_RATE_LIMITED = 8;
  // The provider rejected the credential again after one forced refresh, and
  // the connection becomes ReconnectRequired. No retry.
  CONNECTION_USE_RESULT_PROVIDER_AUTHENTICATION_REJECTED = 9;
  // A 403 for a scope the connection lacks. The connection stays Active with
  // the SCOPE_STEP_UP health reason and only requests refused for that scope fail. No retry.
  CONNECTION_USE_RESULT_PROVIDER_INSUFFICIENT_SCOPE = 10;
  // The provider failed before accepting the request, or a refresh is pending
  // (ADR#0095 REFRESH_PENDING). May carry retry_after; a retry is safe only on
  // the same connection.
  CONNECTION_USE_RESULT_PROVIDER_UNAVAILABLE = 11;
  // The response reached its size cap and the read was aborted. No retry.
  CONNECTION_USE_RESULT_RESPONSE_TOO_LARGE = 12;
  // The request may have been accepted. Recorded as ToolOutcomeUnknown. No
  // retry.
  CONNECTION_USE_RESULT_PROVIDER_OUTCOME_UNKNOWN = 13;
  // The acceptance fact could not be made durable, so no credential was
  // requested and nothing was dispatched. After recovery a fresh request is
  // allowed only when this definite refusal proves no provider effect. A
  // consumed invocation id is never replayed.
  CONNECTION_USE_RESULT_AUDIT_UNAVAILABLE = 14;
  // A trusted caller invariant failed. No retry.
  CONNECTION_USE_RESULT_INTERNAL_CONNECTION_FAILURE = 15;
  // A projection the live checks read was staler than the configured bound,
  // so the call was refused before any credential was requested (ADR#0096
  // Decision 4). Retry only after recovery and a definite pre-dispatch refusal;
  // a consumed invocation id is never replayed.
  CONNECTION_USE_RESULT_PROJECTION_STALE = 16;
  // A signed request nonce was already used. No HTTP request is replayed.
  CONNECTION_USE_RESULT_REQUEST_REPLAYED = 17;
  // The requested ceiling needs enforcement this proxy does not implement.
  CONNECTION_USE_RESULT_UNSUPPORTED_RESTRICTION = 18;
  // Buffered upstream headers or content reflect the injected credential, or
  // a credential-bearing redirect cannot be handled safely. The proxy returns
  // its safe 502 failure instead of any provider body or unsafe header.
  CONNECTION_USE_RESULT_CREDENTIAL_RESPONSE_REJECTED = 19;
  // A complete upstream response violates the selected finite HTTP profile,
  // for example an unsupported content coding, upgrade, SSE or invalid framing.
  // The safe 502 carries no upstream content. The provider may have acted;
  // this result never establishes a definite pre-dispatch refusal or a retry.
  CONNECTION_USE_RESULT_PROVIDER_RESPONSE_REJECTED = 20;
}

// What imposed a PROVIDER_RATE_LIMITED result (ADR#0096 Decision 8). Budgets
// are keyed by the scope in which the provider counts its limit. Unspecified
// and unknown values are invalid.
enum ConnectionRateLimitSource {
  CONNECTION_RATE_LIMIT_SOURCE_UNSPECIFIED = 0;
  // The budget of this one connection.
  CONNECTION_RATE_LIMIT_SOURCE_CONNECTION = 1;
  // The tenant's configured share of a shared platform app's budget.
  CONNECTION_RATE_LIMIT_SOURCE_TENANT_SHARE = 2;
  // The budget of the provider app across every tenant.
  CONNECTION_RATE_LIMIT_SOURCE_PROVIDER_APP = 3;
  // The provider itself asked for backoff, through a 429 or the rate-limit
  // headers the contract declares.
  CONNECTION_RATE_LIMIT_SOURCE_PROVIDER_REPORTED = 4;
}

// The class of the provider HTTP status, retained as safe audit metadata.
// The actual HTTP response is forwarded separately; its body is never copied
// to this result or an audit record (ADR#0096 Decision 6). Unspecified and unknown values are invalid.
enum ProviderStatusClass {
  PROVIDER_STATUS_CLASS_UNSPECIFIED = 0;
  // 2xx.
  PROVIDER_STATUS_CLASS_SUCCESS = 1;
  // 3xx. A redirect is never followed.
  PROVIDER_STATUS_CLASS_REDIRECTION = 2;
  // 4xx.
  PROVIDER_STATUS_CLASS_CLIENT_ERROR = 3;
  // 5xx.
  PROVIDER_STATUS_CLASS_SERVER_ERROR = 4;
}

// A provider request identifier, kept only after the reviewed provider profile
// classifies it as bounded, non-personal and non-secret. Unsafe identifiers are
// omitted, never copied into an audit fact.
message ProviderRequestId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
      pattern: "^[^\\x00-\\x1f\\x7f]+$"
    }
  ];
}
