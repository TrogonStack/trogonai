edition = "2024";

package trogonai.connections.types.v1alpha1;

// An open obligation a cleanup step could not finish. Every step ends as a
// completed fact or open debt, never silently dropped, and debt is durable,
// queryable and aged (ADR#0093 Decision 9, ADR#0094 Decision 13). Unspecified
// and unknown values are invalid.
enum CleanupObligationKind {
  CLEANUP_OBLIGATION_KIND_UNSPECIFIED = 0;
  // Provider revoke did not end CONFIRMED within its window, or the grant was
  // unreachable after key loss. Tokens live until their expiry and the
  // principal can remove the app in the provider's settings (ADR#0094
  // Decision 13, ADR#0095 Decisions 3 and 10).
  CLEANUP_OBLIGATION_KIND_PROVIDER_REVOKE_RESIDUAL = 1;
  // Material, or a superseded token-set version, is not destroyed yet
  // (ADR#0095 Decision 1).
  CLEANUP_OBLIGATION_KIND_MATERIAL_UNDESTROYED = 2;
  // The erasable provider account profile is not purged yet, an orphan from an
  // attempt that never activated included (ADR#0093 Decisions 9 and 11).
  CLEANUP_OBLIGATION_KIND_PROFILE_UNPURGED = 3;
  // A dynamic client registration may exist at the provider with no way to
  // delete it, after an ambiguous registration response or without a
  // registration client URI (ADR#0094 Decisions 10 and 13).
  CLEANUP_OBLIGATION_KIND_REGISTRATION_RESIDUAL = 4;
  // A code exchange with an unknown outcome may have left a provider grant the
  // platform holds no tokens for (ADR#0094 Decision 4).
  CLEANUP_OBLIGATION_KIND_UNKNOWN_EXCHANGE_GRANT = 5;
  // A losing attempt's bundle was destroyed locally without a provider revoke,
  // because revoking it could revoke the grant an existing connection uses. It
  // lives until expiry (ADR#0094 Decision 5).
  CLEANUP_OBLIGATION_KIND_DISCARDED_BUNDLE = 6;
}
