// Parent-authorized metadata views only. Secret material and the erasable
// provider account profile are never fields of these responses. Read admission
// authenticates the tenant, exact parent and caller class before retrieving a
// snapshot; unknown and unauthorized resources share the same failure shape.
// stream_revision identifies the source fold and is not a permission receipt.

message ConnectorReleaseResource {
  option (buf.validate.message).cel = {
    id: "connector_release_resource.identity_matches_state"
    message: "resource name and folded state must have the same parent and identity"
    expression: "this.resource.resource_parent == this.state.resource_parent && this.resource.release_id == this.state.release_id"
  };
  ConnectorReleaseResourceName resource = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.catalog.state.v1alpha1.ConnectorRelease state = 2 [features.field_presence = LEGACY_REQUIRED];
  uint64 stream_revision = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
}

