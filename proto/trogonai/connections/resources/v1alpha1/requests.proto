// Parent-bound request shapes, not declarations that every aggregate is a
// public browser service. The documented caller class authenticates before
// route, request parent and command parent are compared. Project parents must
// match the caller's authenticated project context and live administration
// authority. Platform parents require an explicit platform role; an empty
// platform marker never substitutes for authorization. Policy parents require
// live authority on the exact Agent/node plus owner-side rights for permits.
// Unknown and unauthorized resources use the same external failure shape.
//
// Public create/list collection parent differs from hierarchy NodeId placement.
// No request can move a resource or reinterpret its logical owner. This surface
// does not define browser start-connect/redirect or upload secret material.

// Pagination is over one exact resource type and parent, in bytewise opaque-id
// order. Default page size is 50 and maximum is 200. A cursor is nonsecret,
// integrity-protected server metadata bound to caller identity/tenant, parent,
// resource type, ordering and read snapshot; it grants no access. Every page
// rechecks live authorization. Changed/expired cursor context is refused, never
// silently restarted or broadened to another parent.
message ResourcePageRequest {
  uint32 page_size = 1 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 200
  }];
  string page_token = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
    pattern: "^[A-Za-z0-9_-]+$"
  }];
}

