edition = "2024";

package trogonai.connections.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/connections/v1alpha1/connector.proto";
import "trogonai/provisioning/v1alpha1/events.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

// All fields except state are immutable. The connection aggregate atomically
// owns activation/replacement and permits at most one active binding per role.
// SecretRef must belong to this project and match the role's declared purpose.
// Replacing a role or SecretRef creates a new binding and revokes the old one;
// previously issued grants cannot follow the replacement. Material rotation
// behind the same SecretRef does not replace this binding. Tool, MCP and OAuth
// credentials compose these bindings; they do not introduce another secret
// model. A binding confers use authority only and never implies ownership.
message CredentialBinding {
  option (buf.validate.message).cel = {
    id: "credential_binding.provisioned_identity"
    message: "provisioned credential receipt must identify this project and secret"
    expression: "!has(this.provisioned_credential) || (this.provisioned_credential.provisioning.project_id == this.project_id && this.provisioned_credential.resource.kind == 1 && this.provisioned_credential.resource.id == this.secret_ref.id)"
  };

  string id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string project_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string connection_id = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  CredentialRole role = 4 [features.field_presence = LEGACY_REQUIRED];
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 5 [features.field_presence = LEGACY_REQUIRED];
  // Unknown and unspecified states are invalid. Revocation is terminal.
  CredentialBindingState state = 6 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // Positive connection aggregate revision at this binding's installation.
  // Immutable across material rotation and independent of later metadata edits.
  uint64 binding_revision = 7 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  // Exactly one known provenance is required and immutable. Newly provisioned
  // material remains owned by its creator until the parent's durable activation
  // adopts the exact receipt. A borrowed admission never authorizes destruction,
  // even after binding revocation or a failed connection enrollment.
  oneof credential_provenance {
    option (buf.validate.oneof).required = true;
    trogonai.provisioning.v1alpha1.ResourceReceiptRef provisioned_credential = 8;
    trogonai.provisioning.v1alpha1.EventRef borrowed_credential_admission = 9;
  }
}

enum CredentialBindingState {
  CREDENTIAL_BINDING_STATE_UNSPECIFIED = 0;
  CREDENTIAL_BINDING_STATE_ACTIVE = 1;
  CREDENTIAL_BINDING_STATE_REVOKED = 2;
}

// Names the exact active role binding; its SecretRef is never authority to use
// it, and the material version is deliberately absent.
message CredentialBindingRef {
  string binding_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  CredentialRole role = 2 [features.field_presence = LEGACY_REQUIRED];
  // Exact positive installation revision used by SecretUseAuthorization.
  uint64 binding_revision = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
}

// This fact atomically installs the new binding and revokes the previous role
// binding, if any, in the connection aggregate. It changes no secret ownership.
// The active binding may be staged while its connection is pending; only narrow
// management verification can use it before durable connection activation.
message CredentialBindingActivated {
  option (buf.validate.message).cel = {
    id: "credential_binding_activated.active"
    message: "the admitted binding must be active"
    expression: "this.binding.state == 1"
  };
  option (buf.validate.message).cel = {
    id: "credential_binding_activated.replacement_identity"
    message: "replacement must use a new binding identifier"
    expression: "!has(this.revoked_binding_id) || this.revoked_binding_id != this.binding.id"
  };

  CredentialBinding binding = 1 [features.field_presence = LEGACY_REQUIRED];
  // Exactly one known arm records the previous role occupancy.
  oneof previous {
    option (buf.validate.oneof).required = true;
    EmptyCredentialRole empty_role = 2;
    string revoked_binding_id = 3 [(buf.validate.field).string.min_len = 1];
  }
}

message EmptyCredentialRole {}
