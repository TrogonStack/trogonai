// Active/paused transitions do not relinquish ownership or trigger cleanup.
// Revocation and deletion instead require the dedicated cleanup facts.
message InboundWebhookLifecycleChanged {
  WebhookEventMetadata metadata = 1 [features.field_presence = LEGACY_REQUIRED];
  string endpoint_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  WebhookLifecycle lifecycle = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      in: [
        1,
        2
      ]
    }
  ];
}

message InboundWebhookVerificationReplaced {
  WebhookEventMetadata metadata = 1 [features.field_presence = LEGACY_REQUIRED];
  string endpoint_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  InboundWebhookVerification verification = 3 [features.field_presence = LEGACY_REQUIRED];
  WebhookActivationEvidence evidence = 4 [features.field_presence = LEGACY_REQUIRED];
}

message OutboundWebhookLifecycleChanged {
  WebhookEventMetadata metadata = 1 [features.field_presence = LEGACY_REQUIRED];
  string subscription_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  WebhookLifecycle lifecycle = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      in: [
        1,
        2
      ]
    }
  ];
}

// Replaced owned signing material stays cleanup-owned until its shared receipt
// records destruction. A binding replacement never deletes a borrowed secret.
message OutboundWebhookSigningChanged {
  WebhookEventMetadata metadata = 1 [features.field_presence = LEGACY_REQUIRED];
  string subscription_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  WebhookSigningPolicy signing = 3 [features.field_presence = LEGACY_REQUIRED];
  WebhookActivationEvidence evidence = 4 [features.field_presence = LEGACY_REQUIRED];
}

// Provisioning facts are embedded in the endpoint stream, not a second saga
// stream. Their project, owner and revision must match this authoritative stream.
message InboundWebhookEndpointEvent {
  option (buf.validate.message).cel = {
    id: "webhook.endpoint.provisioning_owner"
    message: "embedded provisioning must belong to an inbound endpoint"
    expression: "!has(this.provisioning) || this.provisioning.owner.kind == 3"
  };
  oneof event {
    option (buf.validate.oneof).required = true;
    InboundWebhookEndpointReserved reserved = 1;
    InboundWebhookEndpointActivated activated = 2;
    InboundWebhookLifecycleChanged lifecycle_changed = 3;
    InboundWebhookVerificationReplaced verification_replaced = 4;
    InboundWebhookEndpointCleanupRequested cleanup_requested = 5;
    InboundWebhookEndpointCleanupCompleted cleanup_completed = 6;
    trogonai.provisioning.v1alpha1.ProvisioningEvent provisioning = 7;
  }
}

// Provisioning facts share the subscription stream and its authority checks.
message OutboundWebhookSubscriptionEvent {
  option (buf.validate.message).cel = {
    id: "webhook.subscription.provisioning_owner"
    message: "embedded provisioning must belong to an outbound subscription"
    expression: "!has(this.provisioning) || this.provisioning.owner.kind == 4"
  };
  oneof event {
    option (buf.validate.oneof).required = true;
    OutboundWebhookSubscriptionReserved reserved = 1;
    OutboundWebhookSubscriptionActivated activated = 2;
    OutboundWebhookLifecycleChanged lifecycle_changed = 3;
    OutboundWebhookSigningChanged signing_changed = 4;
    OutboundWebhookSubscriptionCleanupRequested cleanup_requested = 5;
    OutboundWebhookSubscriptionCleanupCompleted cleanup_completed = 6;
    trogonai.provisioning.v1alpha1.ProvisioningEvent provisioning = 7;
  }
}
