edition = "2024";

package trogonai.projects.projects.v1alpha1;

import "trogonai/projects/projects/v1alpha1/identity.proto";

// Only an active Project accepts a restated goal. Dispatch requires
// DecideRequest.expected_revision; retrying preserves the original stream
// revision and command id, so a stale restatement cannot silently overwrite a
// later one.
message RestateProjectGoal {
  ProjectId project_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string goal = 2 [features.field_presence = LEGACY_REQUIRED];
}
