edition = "2024";

package trogonai.peers.v1alpha1;

import "google/protobuf/timestamp.proto";
import "trogonai/peers/v1alpha1/attachment_ref.proto";
import "trogonai/peers/v1alpha1/attachment_status.proto";

// A lease describes connector connectivity, not model progress.
message PeerAttachment {
  reserved attachment;

  AttachmentRef attachment_ref = 1;
  AttachmentStatus status = 2;
  google.protobuf.Timestamp observed_at = 3;
  google.protobuf.Timestamp expires_at = 4;
}
