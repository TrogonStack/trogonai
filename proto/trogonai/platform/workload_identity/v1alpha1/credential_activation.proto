edition = "2024";

package trogonai.platform.workload_identity.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/platform/workload_identity/v1alpha1/registration_binding.proto";

// A validated activation intent, durably acknowledged before material becomes
// usable. It does not assert that a later live-generation comparison succeeded.
// Fingerprints identify only public certificate, public key and trust material.
message CredentialActivation {
  option (buf.validate.message).cel = {
    id: "credential_activation.lifetime"
    message: "an SVID has positive validity no longer than one hour"
    expression: "this.expires_at > this.not_before && this.expires_at <= this.not_before + duration('3600s')"
  };
  RegistrationBinding binding = 1 [features.field_presence = LEGACY_REQUIRED];
  uint64 recovery_fence = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 registration_revision = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 trust_revision = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 source_revision = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 activation_revision = 6 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  bytes leaf_sha256 = 7 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.len = 32
  ];
  bytes public_key_sha256 = 8 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.len = 32
  ];
  bytes bundle_sha256 = 9 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.len = 32
  ];
  google.protobuf.Timestamp not_before = 10 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
  google.protobuf.Timestamp expires_at = 11 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
}
