edition = "2024";

package trogonai.platform.workload_identity.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/platform/workload_identity/v1alpha1/registration_binding.proto";

// A complete, scoped projection. Missing bindings withdraw admission. A recovery
// fence is provisioned independently of the store restored from backup.
message RegistrationSnapshot {
  option (buf.validate.message).cel = {
    id: "registration_snapshot.scope"
    message: "every registration belongs to this exact tenant and project"
    expression: "this.bindings.all(b, b.tenant == this.tenant && b.project == this.project)"
  };
  option (buf.validate.message).cel = {
    id: "registration_snapshot.lease"
    message: "registration authority has a positive lease no longer than 330 seconds"
    expression: "this.expires_at > this.issued_at && this.expires_at <= this.issued_at + duration('330s')"
  };
  string tenant = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9_.-]+$"
    }
  ];
  string project = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9_.-]+$"
    }
  ];
  uint64 recovery_fence = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 registration_revision = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 trust_revision = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  google.protobuf.Timestamp issued_at = 6 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
  google.protobuf.Timestamp expires_at = 7 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
  repeated RegistrationBinding bindings = 8 [(buf.validate.field).repeated.max_items = 4096];
  // SHA-256 of the DER roots authorized for the local trust domain. Matching a
  // revision number without matching this set cannot authorize a received root.
  repeated bytes approved_root_sha256 = 9 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 16
    unique: true
    items: {
      bytes: {len: 32}
    }
  }];
}
