edition = "2024";

package trogonai.platform.workload_identity.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/platform/workload_identity/v1alpha1/registration_binding.proto";

// Authenticated transport and the governed mapping observed by this listener.
// Application identity alone cannot distinguish separate registered runtimes.
message WorkloadPeerEvidence {
  option (buf.validate.message).cel = {
    id: "workload_peer_evidence.agent_binding"
    message: "authenticated workload peer registration must name an agent"
    expression: "this.peer_binding.role == 2"
  };
  RegistrationBinding peer_binding = 1 [features.field_presence = LEGACY_REQUIRED];
  // SHA-256 of the remote leaf certificate DER verified in the handshake.
  bytes peer_leaf_sha256 = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.len = 32
  ];
  // Expiry of the verified selected peer path. A later expiry denial may retain
  // this attribution, so the audit contract does not require it to remain future.
  google.protobuf.Timestamp peer_path_expires_at = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
  // Revisions of the governed registration/trust snapshot authorizing the peer.
  uint64 recovery_fence = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 registration_revision = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 trust_revision = 6 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  // These identify this listener's approved verifier material. They are not
  // remote Workload API revisions or assertions about the peer's issuance.
  uint64 verifier_source_revision = 7 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 verifier_activation_revision = 8 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  // Same canonical bundle digest as CredentialActivation, for this verifier.
  bytes verifier_bundle_sha256 = 9 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.len = 32
  ];
}
