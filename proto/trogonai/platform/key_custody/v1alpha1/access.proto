edition = "2024";

package trogonai.platform.key_custody.v1alpha1;

import "buf/validate/validate.proto";

// Non-secret provider access parameters, limited to what ADR#0030 Decision 5
// names for each provider. Raw credentials never appear here. Provider-native
// values are nonempty and preserved exactly; admission checks their format and
// proves them against the provider, and this contract restates neither.
message AwsAccountId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

message AwsRegion {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

// The customer-owned role the platform assumes through STS AssumeRole.
// Registration does not retain it until attempts with a missing and an
// incorrect external ID are both denied (ADR#0030).
message AwsRoleArn {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

// Generated by the platform and unique to the tenant, never chosen by the
// registrant. The customer role's trust policy requires it as sts:ExternalId.
message AwsExternalId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

// The platform's deployment-attested principal assumes the role with short-lived
// source credentials. No long-lived AWS access key exists to describe.
message AwsAssumeRoleAuthentication {
  AwsRoleArn role = 1 [features.field_presence = LEGACY_REQUIRED];
  AwsExternalId external_id = 2 [features.field_presence = LEGACY_REQUIRED];
}

message AwsKmsAccess {
  AwsAccountId account = 1 [features.field_presence = LEGACY_REQUIRED];
  AwsRegion region = 2 [features.field_presence = LEGACY_REQUIRED];
  AwsAssumeRoleAuthentication authentication = 3 [features.field_presence = LEGACY_REQUIRED];
}

message GoogleCloudProjectId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

message GoogleCloudLocation {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

// The workload identity federation provider the platform federates through.
message GoogleCloudWorkloadIdentityProvider {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

message GoogleCloudServiceAccount {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

// Workload Identity Federation for direct access to the exact CryptoKey.
// Impersonation is the allowed fallback when the customer's policy requires it:
// when present, the federated principal impersonates only that service account.
// No service-account key exists to describe.
message GoogleCloudFederationAuthentication {
  GoogleCloudWorkloadIdentityProvider workload_identity_provider = 1 [features.field_presence = LEGACY_REQUIRED];
  GoogleCloudServiceAccount impersonated_service_account = 2;
}

message GoogleCloudKmsAccess {
  GoogleCloudProjectId project = 1 [features.field_presence = LEGACY_REQUIRED];
  GoogleCloudLocation location = 2 [features.field_presence = LEGACY_REQUIRED];
  GoogleCloudFederationAuthentication authentication = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Credential-free HTTPS base URL, retaining path and trailing slash. No user
// info, query, or fragment is permitted. Hostname verification, explicit trust
// roots, disabled redirects, DNS-rebinding-safe resolution, and the egress
// policy that rejects loopback, link-local, metadata, and undeclared internal
// destinations are enforced by admission and on every use (ADR#0030).
message OpenBaoEndpoint {
  string base_url = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.uri = true,
    (buf.validate.field).string.pattern = "^https://[^/?#@]+(/[^?#]*)?$"
  ];
}

// The OpenBao namespace the registration's security boundary lives in. It is
// part of the KeyBackendId's identity: changing it requires a new registration,
// never a revision (ADR#0030).
message OpenBaoNamespace {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

// The Transit mount whose mount-global disable_upsert setting registration
// validation requires to be enabled (ADR#0030).
message OpenBaoTransitMount {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

// The OpenBao authentication role the platform logs in to. Granting it use
// permissions only is the customer's side of registration.
message OpenBaoAuthRole {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

// One certificate authority the registration trusts for the endpoint. Public
// certificate material only, never a private key or a client credential. Its
// encoding is fixed by admission, which rejects what it cannot parse.
message TrustRoot {
  bytes certificate = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.min_len = 1
  ];
}

// JWT authentication, narrowly bound to an issuer, audience, subject, and
// claims on the customer's side. Only the role is a platform-side parameter.
message OpenBaoJwtAuthentication {
  OpenBaoAuthRole role = 1 [features.field_presence = LEGACY_REQUIRED];
}

// Certificate authentication, bound to the expected CA and certificate identity
// on the customer's side. Only the role is a platform-side parameter.
message OpenBaoCertificateAuthentication {
  OpenBaoAuthRole role = 1 [features.field_presence = LEGACY_REQUIRED];
}

// Exactly one known method is required. Server TLS validation and a short
// explicit token maximum lifetime apply to either (ADR#0030).
message OpenBaoAuthentication {
  oneof method {
    option (buf.validate.oneof).required = true;
    OpenBaoJwtAuthentication jwt = 1;
    OpenBaoCertificateAuthentication certificate = 2;
  }
}

// Customer-operated OpenBao is the only adapter that accepts a customer
// endpoint; the AWS and Google Cloud service endpoints are derived from the
// verified provider resource and cannot be overridden (ADR#0030).
message OpenBaoTransitAccess {
  OpenBaoEndpoint endpoint = 1 [features.field_presence = LEGACY_REQUIRED];
  OpenBaoTransitMount transit_mount = 2 [features.field_presence = LEGACY_REQUIRED];
  OpenBaoAuthentication authentication = 3 [features.field_presence = LEGACY_REQUIRED];
  repeated TrustRoot trust_roots = 4 [(buf.validate.field).repeated.min_items = 1];
  // Absent means the root namespace.
  OpenBaoNamespace namespace = 5;
}

// Exactly one known provider is required, and the arm is the registration's
// provider, so no second field can disagree with it. Each arm holds that
// provider's non-secret authentication profile with its access parameters.
message KeyBackendAccess {
  oneof provider {
    option (buf.validate.oneof).required = true;
    OpenBaoTransitAccess open_bao_transit = 1;
    AwsKmsAccess aws_kms = 2;
    GoogleCloudKmsAccess google_cloud_kms = 3;
  }
}
