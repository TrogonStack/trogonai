edition = "2024";

package trogonai.platform.key_custody.v1alpha1;

import "buf/validate/validate.proto";
import "trogon/hierarchy/v1alpha1/node.proto";
import "trogonai/platform/key_custody/v1alpha1/capability.proto";
import "trogonai/platform/key_custody/v1alpha1/identity.proto";
import "trogonai/platform/key_custody/v1alpha1/locator.proto";
import "trogonai/platform/key_custody/v1alpha1/registration.proto";
import "trogonai/platform/key_custody/v1alpha1/validation.proto";

// platform.key_custody owns one stream per registration, including every KeyRef
// bound to it. Registration uses NoStream, a stable nonempty Decider command_id,
// and no expected_revision. All later commands on a registration use
// StreamUnchanged, a positive observed expected_revision, and stable nonempty
// command_id; retries preserve both. Dispatch authenticates and authorizes every
// operation, and only the registration's owner changes its admission. Identity
// reuse rejects. No command carries a credential, a token, or a provider
// response. Registration creates a registration pending validation whose health
// is unknown, ineligible for use until it validates.
message RegisterKeyBackend {
  KeyBackendId key_backend_id = 1 [features.field_presence = LEGACY_REQUIRED];
  KeyBackendConfiguration configuration = 2 [features.field_presence = LEGACY_REQUIRED];
}

// PENDING_VALIDATION only. The validation covers the registration's current
// revision end to end; dispatch resolves its trusted record and rejects missing,
// stale, mismatched, or untrusted evidence, and the Decider never probes. A
// connected observation activates the registration. A failed one keeps it
// PENDING_VALIDATION and records the typed reason as its health.
message ValidateKeyBackend {
  KeyBackendId key_backend_id = 1 [features.field_presence = LEGACY_REQUIRED];
  KeyBackendValidation validation = 2 [features.field_presence = LEGACY_REQUIRED];
}

// ACTIVE only, and ENABLED only. Takes effect without waiting on the provider
// and the owner can reverse it. A pause is not the provider-side veto, and the
// platform never issues it from health signals. While it holds, the platform
// makes no provider call for the registration, probes included.
message PauseKeyBackend {
  KeyBackendId key_backend_id = 1 [features.field_presence = LEGACY_REQUIRED];
}

// ACTIVE only, and PAUSED only. The validation covers the registration's
// current revision end to end. A connected observation resumes admission. A
// failed one keeps the registration PAUSED and records the typed reason as its
// health. After a resume the key-state matrix still applies.
message ResumeKeyBackend {
  KeyBackendId key_backend_id = 1 [features.field_presence = LEGACY_REQUIRED];
  KeyBackendValidation validation = 2 [features.field_presence = LEGACY_REQUIRED];
}

// PENDING_VALIDATION or ACTIVE only. RETIRED is terminal and never reused.
message RetireKeyBackend {
  KeyBackendId key_backend_id = 1 [features.field_presence = LEGACY_REQUIRED];
}

// The only command that carries a provider locator, and only on this
// authorized administrative operation, never on wrap or unwrap. ACTIVE
// registration required. The service has already validated identity, access, and
// a complete authenticated-data round trip, and dispatch resolves the receipt
// against the exact registration, locator, purpose, and required capabilities.
// key_ref is the new opaque reference, generated by the service and stable
// across retries; its reuse rejects. Admission denials, including
// BACKEND_PAUSED, and key-state denials are operation failures decided by the
// service before any provider call, not Decider faults. The binding never
// changes in place.
message BindExternalKey {
  KeyBackendId key_backend_id = 1 [features.field_presence = LEGACY_REQUIRED];
  KeyRef key_ref = 2 [features.field_presence = LEGACY_REQUIRED];
  KeyPurpose purpose = 3 [features.field_presence = LEGACY_REQUIRED];
  ProviderKeyLocator locator = 4 [features.field_presence = LEGACY_REQUIRED];
  repeated KeyCapability required_capabilities = 5 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  KeyBindingValidationRef validation = 6 [features.field_presence = LEGACY_REQUIRED];
}

// Selects an already bound KeyRef as the tenant's default wrapping key for new
// envelopes of one purpose, on the tenant's own default-key stream rather than a
// registration stream. The default is policy for future envelopes, never an
// indirection that can retarget an existing one, and a backend registration
// alone cannot be selected. Dispatch checks that the KeyRef is bound to this
// tenant and purpose, that its registration admits the operation, and that the
// key state permits it, gated like wrap_dek, before the Decider is asked.
message SetDefaultKey {
  trogon.hierarchy.v1alpha1.NodeId tenant = 1 [features.field_presence = LEGACY_REQUIRED];
  KeyPurpose purpose = 2 [features.field_presence = LEGACY_REQUIRED];
  KeyRef key_ref = 3 [features.field_presence = LEGACY_REQUIRED];
}
