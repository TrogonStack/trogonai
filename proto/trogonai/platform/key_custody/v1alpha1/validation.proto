edition = "2024";

package trogonai.platform.key_custody.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/platform/key_custody/v1alpha1/health.proto";
import "trogonai/platform/key_custody/v1alpha1/identity.proto";

// Opaque authority-issued receipt identity for the validation of one
// registration revision, not a caller assertion. Dispatch resolves its trusted
// immutable record against the exact registration and revision; missing, stale,
// mismatched, or untrusted evidence rejects. External probes and credential
// resolution never occur in the pure decider. No receipt grants future access.
message KeyBackendValidationRef {
  string validation_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

// Opaque authority-issued receipt identity for the validation of one key
// binding. Dispatch resolves its trusted immutable record against the exact
// registration, locator, purpose, required capabilities, and the complete
// authenticated-data round trip (ADR#0030). The same rules as
// KeyBackendValidationRef apply, and the locator never travels with the receipt.
message KeyBindingValidationRef {
  string validation_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

// The result of validating one registration revision end to end. The
// observation is the health the validation measured: connected means the
// revision validated, and failed carries the typed reason. A validation never
// concludes with an unknown status. Dispatch checks the claimed observation
// against the trusted record the receipt names.
message KeyBackendValidation {
  option (buf.validate.message).cel = {
    id: "validation.observed"
    message: "a validation records a connected or failed observation, never an unknown one"
    expression: "!has(this.observation.unknown)"
  };

  KeyBackendValidationRef receipt = 1 [features.field_presence = LEGACY_REQUIRED];
  RegistrationRevision revision = 2 [features.field_presence = LEGACY_REQUIRED];
  KeyBackendHealth observation = 3 [features.field_presence = LEGACY_REQUIRED];
}
