edition = "2024";

package trogonai.platform.key_custody.v1alpha1;

import "trogonai/platform/key_custody/v1alpha1/identity.proto";
import "trogonai/platform/key_custody/v1alpha1/key_state.proto";
import "trogonai/platform/key_custody/v1alpha1/locator.proto";

// The detail of one customer managed binding, returned only to the tenant that
// owns it so it can match the binding to the key in its provider's console and
// audit log (ADR#0030). It is the only message that returns a locator. A
// platform-owned binding has no detail here, and the state is observed, not
// owned, because the bound provider is authoritative.
message CustomerManagedKeyBindingDetail {
  KeyRef key_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  KeyBackendId key_backend_id = 2 [features.field_presence = LEGACY_REQUIRED];
  KeyPurpose purpose = 3 [features.field_presence = LEGACY_REQUIRED];
  ProviderKeyLocator locator = 4 [features.field_presence = LEGACY_REQUIRED];
  KeyStateObservation state = 5 [features.field_presence = LEGACY_REQUIRED];
}
