edition = "2024";

package trogonai.platform.audit.v1;

import "trogonai/agents/agents/v1alpha1/identity.proto";

// ActChainEntry is one delegator in the chain behind the actor of a record.
//
// Entries are ordered upstream: the first is the delegator of the actor and the
// last is the root delegator, the order flatten_act_chain produces. An entry's
// depth is its position in the list, so it is not stored. AuditRecord bounds the
// list at 16 entries, the maximum delegation depth the verifier accepts.
message ActChainEntry {
  trogonai.agents.agents.v1alpha1.AgentId agent_id = 1 [features.field_presence = LEGACY_REQUIRED];
}
