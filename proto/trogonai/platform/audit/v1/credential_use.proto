edition = "2024";

package trogonai.platform.audit.v1;

import "buf/validate/validate.proto";
import "trogonai/platform/audit/v1/credential_use_kind.proto";

// CredentialUse is the detail of a credential released or injected.
//
// A credential appears by resource name and binding id, never by value,
// placeholder text or digest, and no field has a type that could hold one.
// Injection happens per request inside a tunnel that a decision admitted, so
// each injection is its own record naming the decision it served.
message CredentialUse {
  CredentialUseKind kind = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // The credential's resource name (ADR#0046).
  string credential = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  // The binding the credential was used under. An injection names the
  // connection binding that placed it. A release serves no connection binding,
  // because the credential's own release policy binds it to a runtime service,
  // destination and location, so a release names the credential itself.
  string binding_id = 3 [features.field_presence = LEGACY_REQUIRED];
  // Where the credential went, as a host or other registry-style name.
  string destination = 4;
  // The record_id of the GatewayDecision record this use served.
  string decision_record_id = 5 [(buf.validate.field).string.uuid = true];
  // Where in the outbound request the credential is placed, as header:{name},
  // query:{name} or body:{path}. A location, never the value placed there.
  string location = 6;
}
