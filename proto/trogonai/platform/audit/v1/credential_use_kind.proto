edition = "2024";

package trogonai.platform.audit.v1;

// CredentialUseKind is what was done with a credential. Unspecified and unknown
// values are invalid.
enum CredentialUseKind {
  CREDENTIAL_USE_KIND_UNSPECIFIED = 0;
  // The secrets service released the credential to a caller.
  CREDENTIAL_USE_KIND_RELEASE = 1;
  // A point injected the credential into a request inside an admitted tunnel.
  CREDENTIAL_USE_KIND_INJECT = 2;
}
