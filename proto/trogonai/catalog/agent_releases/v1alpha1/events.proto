edition = "2024";

package trogonai.catalog.agent_releases.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/catalog/agent_releases/v1alpha1/agent_release.proto";

message AgentReleasePublished {
  AgentRelease release = 1 [features.field_presence = LEGACY_REQUIRED];
}

message AgentReleaseWithdrawn {
  string release_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).cel = {
      id: "agent_release_withdrawn.release_id_nonblank"
      message: "release_id must contain a non-whitespace character"
      expression: "this.trim() != ''"
    }
  ];
  AgentReleaseWithdrawal withdrawal = 2 [features.field_presence = LEGACY_REQUIRED];
}

// Publication and withdrawal dates come from event-envelope recorded_at.
// Unknown events, duplicate publication/withdrawal, or foreign identities reject
// replay instead of producing an eligible release from an incomplete history.
message AgentReleaseEvent {
  oneof event {
    option (buf.validate.oneof).required = true;

    AgentReleasePublished published = 1;
    AgentReleaseWithdrawn withdrawn = 2;
  }
}
