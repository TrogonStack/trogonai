edition = "2024";

package trogonai.catalog.agent_listings.v1alpha1;

import "buf/validate/validate.proto";

// Authored public-hub discovery intent, not hierarchy-derived access visibility.
// Missing, unspecified, or unknown intent never permits a public listing.
// Private discovery remains limited by live hierarchy and policy; neither value
// grants execution, configuration, source, session, or dependency access.
enum AgentListingVisibility {
  AGENT_LISTING_VISIBILITY_UNSPECIFIED = 0;
  AGENT_LISTING_VISIBILITY_PRIVATE = 1;
  AGENT_LISTING_VISIBILITY_PUBLIC = 2;
}

// One independently mutable catalog record per Agent identity. Public intent
// permits only discovery/profile presentation after live catalog eligibility,
// hierarchy, and policy checks. It never makes behavior or protected data public.
// A missing record has private eligibility without implying a persisted record.
//
// Archive always suppresses effective public listing without rewriting intent.
// Unarchive preserves intent: PUBLIC becomes eligible only after fresh live
// checks; PRIVATE stays private. An unavailable or stale eligibility decision
// cannot expose a public listing. No copied lifecycle or owner scope is trusted.
message AgentListing {
  string agent_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).cel = {
      id: "agent_listing.agent_id_nonblank"
      message: "agent_id must contain a non-whitespace character"
      expression: "this.trim() != ''"
    }
  ];
  AgentListingVisibility visibility = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}
