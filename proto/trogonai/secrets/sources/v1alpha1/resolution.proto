edition = "2024";

package trogonai.secrets.sources.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/connections/types/v1alpha1/audit_correlation.proto";
import "trogonai/secrets/exchange/v1alpha1/failure.proto";
import "trogonai/secrets/sources/v1alpha1/identity.proto";
import "trogonai/secrets/sources/v1alpha1/registration.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

// Observed version metadata only, not a requested pinned version. Source reads
// always select AWSCURRENT/latest/current. No endpoint, entry path, material or
// bearer lease is retained. Protected source audit has this metadata; ordinary
// consumers still receive only an opaque SecretRef and the sealed value.
message SourceObservedVersion {
  oneof version {
    option (buf.validate.oneof).required = true;
    string aws_version_id = 1 [(buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }];
    uint64 google_version = 2 [(buf.validate.field).uint64.gt = 0];
    uint64 open_bao_version = 3 [(buf.validate.field).uint64.gt = 0];
  }
}

// Validation of the actual newly observed value under its consumer's original
// provider subject/billing/purpose checks. The protected owner resolves this
// receipt; metadata registration or a provider rotation schedule is insufficient.
message SourceValueValidationRef {
  SourceValueValidationId validation_id = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretSourceEntryRef source_entry_ref = 2 [features.field_presence = LEGACY_REQUIRED];
  SourceObservedVersion observed_version = 3 [features.field_presence = LEGACY_REQUIRED];
  // Resolves the original accepted consumer use and its expected subject,
  // billing boundary, purpose and live binding. Receipt signing/lookup binds
  // this value-validation purpose separately from metadata-probe receipts.
  trogonai.connections.types.v1alpha1.AuditCorrelationId correlation_id = 4 [features.field_presence = LEGACY_REQUIRED];
}

message SourceResolutionSucceeded {
  SourceObservedVersion observed_version = 1 [features.field_presence = LEGACY_REQUIRED];
  SourceValueValidationRef value_validation_ref = 2 [features.field_presence = LEGACY_REQUIRED];
  // The actual selected local cache deadline, never a provider rotation or
  // consistency guarantee and never permission to retain material after revoke.
  google.protobuf.Timestamp cache_expires_at = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
  option (buf.validate.message).cel = {
    id: "source_resolution.version_validation"
    message: "material validation must cover the exact observed source version"
    expression: "this.value_validation_ref.observed_version == this.observed_version"
  };
}

// Data-plane material continues through the existing trusted ResolveForTrustedUse
// request and SealedAccess reply. The service selects the SecretRef from current
// authorization, then invokes this source owner internally. This record never
// carries plaintext, sealed material, credentials, provider bodies or payload
// digests and does not add a public raw-SecretRef resolve RPC.
message SourceResolutionEvidence {
  option (buf.validate.message).cel = {
    id: "source_resolution.consumer_validation"
    message: "material validation must belong to the original accepted consumer use"
    expression: "!has(this.succeeded) || this.succeeded.value_validation_ref.correlation_id == this.correlation_id"
  };
  option (buf.validate.message).cel = {
    id: "source_resolution.cache_bound"
    message: "successful source cache validity is finite and at most 330 seconds after observation"
    expression: "!has(this.succeeded) || (this.succeeded.cache_expires_at > this.observed_at && this.succeeded.cache_expires_at <= this.observed_at + duration('330s'))"
  };
  option (buf.validate.message).cel = {
    id: "source_resolution.exact_entry"
    message: "source material validation must cover the exact resolved entry"
    expression: "!has(this.succeeded) || this.succeeded.value_validation_ref.source_entry_ref == this.source_entry_ref"
  };
  option (buf.validate.message).cel = {
    id: "source_resolution.failure_category"
    message: "source failure keeps denied unavailable throttled integrity and internal categories distinct"
    expression: "!has(this.failed) || this.failed.category in [1, 3, 4, 7, 8]"
  };
  SourceResolutionId resolution_id = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretSourceEntryRef source_entry_ref = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.AuditCorrelationId correlation_id = 3 [features.field_presence = LEGACY_REQUIRED];
  google.protobuf.Timestamp observed_at = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
  oneof outcome {
    option (buf.validate.oneof).required = true;
    SourceResolutionSucceeded succeeded = 5;
    trogonai.secrets.exchange.v1alpha1.ResolveFailure failed = 6;
  }
}

// Safe downstream health/fan-out evidence. It contains no provider location or
// source auth profile and cannot distinguish an unknown ref from denied access.
// An outage is degradation, never an automatic change of registration or a
// fallback to an old value/platform copy.
message SecretReferenceDegraded {
  option (buf.validate.message).cel = {
    id: "secret_reference_degraded.source_category"
    message: "source degradation must preserve a supported source failure category"
    expression: "this.failure.category in [1, 3, 4, 7, 8]"
  };
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.secrets.exchange.v1alpha1.ResolveFailure failure = 2 [features.field_presence = LEGACY_REQUIRED];
}

// Platform reference revocation evicts caches and drives held-session closure
// through the existing invalidation path. Source-side rotation/revocation sends
// no such event in this profile; source consistency/session limits remain real.
message SecretReferenceRevocationEvidence {
  SecretSourceScope scope = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 2 [features.field_presence = LEGACY_REQUIRED];
  SourceReferenceRevocationReason reason = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  google.protobuf.Timestamp revoked_at = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
}
