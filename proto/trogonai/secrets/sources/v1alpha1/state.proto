edition = "2024";

package trogonai.secrets.sources.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/secrets/sources/v1alpha1/identity.proto";
import "trogonai/secrets/sources/v1alpha1/registration.proto";
import "trogonai/secrets/sources/v1alpha1/resolution.proto";

message SecretSourceEntryState {
  SecretSourceEntryBinding binding = 1 [features.field_presence = LEGACY_REQUIRED];
  SourceEntryLifecycle lifecycle = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // Absence means unobserved, never healthy. A prior success is not permission.
  SourceResolutionEvidence last_resolution = 3;
  option (buf.validate.message).cel = {
    id: "source_entry_state.resolution"
    message: "entry observation must refer to this exact immutable binding"
    expression: "!has(this.last_resolution) || this.last_resolution.source_entry_ref.binding == this.binding"
  };
}

// Locator-free folded metadata. Replay verifies stream containment, legal
// immutable genesis, terminal revocation and protected recovery floors. It never
// reads source material, probes a provider or reconstructs private locators.
message SecretSourceState {
  option (buf.validate.message).cel = {
    id: "source_state.version_provider"
    message: "observed version metadata must match the registered provider"
    expression: "this.entries.all(entry, !has(entry.last_resolution) || !has(entry.last_resolution.succeeded) || ((this.registration.provider == 1 && has(entry.last_resolution.succeeded.observed_version.aws_version_id)) || (this.registration.provider == 2 && has(entry.last_resolution.succeeded.observed_version.google_version)) || (this.registration.provider == 3 && has(entry.last_resolution.succeeded.observed_version.open_bao_version))))"
  };
  option (buf.validate.message).cel = {
    id: "source_state.entry_set"
    message: "source state must retain exactly its registered immutable entry bindings"
    expression: "this.entries.size() == this.registration.bindings.size() && this.entries.map(entry, entry.binding.entry_id.value).unique() && this.entries.all(entry, this.registration.bindings.exists(binding, binding == entry.binding))"
  };
  option (buf.validate.message).cel = {
    id: "source_state.observation_scope"
    message: "entry observations must belong to this exact source definition"
    expression: "this.entries.all(entry, !has(entry.last_resolution) || entry.last_resolution.source_entry_ref.source_ref == this.registration.source_ref)"
  };
  option (buf.validate.message).cel = {
    id: "source_state.revoked"
    message: "a revoked source must retain every entry as revoked"
    expression: "this.lifecycle != 2 || this.entries.all(entry, entry.lifecycle == 2)"
  };
  SecretSourceRegistration registration = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretSourceLifecycle lifecycle = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  repeated SecretSourceEntryState entries = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4096
  }];
}
