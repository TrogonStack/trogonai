edition = "2024";

package trogonai.secrets.sources.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/platform/key_custody/v1alpha1/access.proto";
import "trogonai/secrets/sources/v1alpha1/identity.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

// An unavoidable long-lived source credential is still platform-stored under
// SecretStore. Admission verifies this provenance and independent exception
// approval; a source-backed credential or a cycle is refused. It is never
// resolved by the public source control plane or written as inline bytes.
message PlatformStoredSourceCredentialRef {
  trogonai.secrets.v1alpha1.SecretRef bootstrap_credential_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  SourceBootstrapApprovalId approval_id = 2 [features.field_presence = LEGACY_REQUIRED];
}

message AwsSecretsManagerSource {
  option (buf.validate.message).cel = {
    id: "aws_secret_source.identity"
    message: "AWS source account and region must be literal provider identities"
    expression: "this.account_id.value.matches('^[0-9]{12}$') && this.region.value.matches('^[a-z0-9-]+$') && (!has(this.assume_role) || this.assume_role.role.value.matches('^arn:[a-z0-9-]+:iam::' + this.account_id.value + ':role/.+$'))"
  };
  trogonai.platform.key_custody.v1alpha1.AwsAccountId account_id = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.platform.key_custody.v1alpha1.AwsRegion region = 2 [features.field_presence = LEGACY_REQUIRED];
  oneof authentication {
    option (buf.validate.oneof).required = true;
    trogonai.platform.key_custody.v1alpha1.AwsAssumeRoleAuthentication assume_role = 3;
    PlatformStoredSourceCredentialRef stored_credentials_ref = 4;
  }
}

message GoogleSourceFederationAuthentication {
  trogonai.platform.key_custody.v1alpha1.GoogleCloudWorkloadIdentityProvider workload_identity_provider = 1 [features.field_presence = LEGACY_REQUIRED];
  // Presence selects this exact impersonation profile; no automatic fallback.
  trogonai.platform.key_custody.v1alpha1.GoogleCloudServiceAccount impersonated_service_account = 2;
}

message GoogleSecretManagerSource {
  trogonai.platform.key_custody.v1alpha1.GoogleCloudProjectId project_id = 1 [features.field_presence = LEGACY_REQUIRED];
  oneof authentication {
    option (buf.validate.oneof).required = true;
    GoogleSourceFederationAuthentication federation = 2;
    PlatformStoredSourceCredentialRef stored_credentials_ref = 3;
  }
}

message OpenBaoKvMount {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
      pattern: "^[A-Za-z0-9_-]+$"
    }
  ];
}

// OpenBao alone names a customer endpoint. Existing endpoint/auth values keep
// HTTPS, explicit roots and namespace semantics; admission additionally proves
// hostname verification, no redirects, rebinding-safe egress and exact KVv2.
message OpenBaoKvSource {
  trogonai.platform.key_custody.v1alpha1.OpenBaoEndpoint endpoint = 1 [features.field_presence = LEGACY_REQUIRED];
  repeated trogonai.platform.key_custody.v1alpha1.TrustRoot trust_roots = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 16
  }];
  OpenBaoKvMount mount = 3 [features.field_presence = LEGACY_REQUIRED];
  trogonai.platform.key_custody.v1alpha1.OpenBaoNamespace namespace = 4;
  oneof authentication {
    option (buf.validate.oneof).required = true;
    trogonai.platform.key_custody.v1alpha1.OpenBaoAuthentication workload_identity = 5;
    PlatformStoredSourceCredentialRef stored_token_ref = 6;
  }
}

enum SecretSourceProvider {
  SECRET_SOURCE_PROVIDER_UNSPECIFIED = 0;
  SECRET_SOURCE_PROVIDER_AWS_SECRETS_MANAGER = 1;
  SECRET_SOURCE_PROVIDER_GOOGLE_SECRET_MANAGER = 2;
  SECRET_SOURCE_PROVIDER_OPEN_BAO_KV2 = 3;
}

enum SourceCurrentSelection {
  SOURCE_CURRENT_SELECTION_UNSPECIFIED = 0;
  SOURCE_CURRENT_SELECTION_AWS_CURRENT = 1;
  SOURCE_CURRENT_SELECTION_GOOGLE_LATEST = 2;
  SOURCE_CURRENT_SELECTION_OPEN_BAO_CURRENT = 3;
}

// Administrative/private entry locations only. There is no provider version
// selector. The supported operation is current read, never write/rotate/delete.
message AwsSecretEntry {
  string secret_arn = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 2048
    }
  ];
}

message GoogleSecretEntry {
  string secret_resource = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 2048
      pattern: "^projects/[^/]+/secrets/[^/]+$"
    }
  ];
}

// The initial KVv2 profile selects one exact top-level data field. Canonical
// relative paths refuse empty/dot segments; aliases and version pinning are not
// part of this profile. Provider parsing/admission proves its actual key shape.
message OpenBaoKvEntry {
  option (buf.validate.message).cel = {
    id: "open_bao_source_entry.path"
    message: "OpenBao entry paths cannot contain dot segments"
    expression: "this.path != '.' && this.path != '..' && !this.path.startsWith('./') && !this.path.startsWith('../') && !this.path.endsWith('/.') && !this.path.endsWith('/..') && !this.path.contains('/./') && !this.path.contains('/../')"
  };
  string path = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 2048
      pattern: "^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$"
    }
  ];
  string field_name = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];
}

message SecretSourceEntryDefinition {
  option (buf.validate.message).cel = {
    id: "source_entry.current_selection"
    message: "the provider entry must use its fixed current-version selection"
    expression: "(has(this.aws) && this.selection == 1) || (has(this.google) && this.selection == 2) || (has(this.open_bao) && this.selection == 3)"
  };
  SecretSourceEntryId entry_id = 1 [features.field_presence = LEGACY_REQUIRED];
  SourceCurrentSelection selection = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  oneof locator {
    option (buf.validate.oneof).required = true;
    AwsSecretEntry aws = 3;
    GoogleSecretEntry google = 4;
    OpenBaoKvEntry open_bao = 5;
  }
}
