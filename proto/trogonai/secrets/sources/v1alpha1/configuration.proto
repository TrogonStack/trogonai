edition = "2024";

package trogonai.secrets.sources.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/secrets/sources/v1alpha1/identity.proto";
import "trogonai/secrets/sources/v1alpha1/provider.proto";

// Exact bytes of SecretSourceDefinition, kept only in protected secrets-owner
// administrative state. Ingress/replay verify supported contract version, hash
// and the complete typed projection. No protobuf re-encoding recreates a hash.
message SecretSourceDefinitionArtifact {
  bytes definition_bytes = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes = {
      min_len: 1
      max_len: 262144
    }
  ];
}

message SecretSourceDefinition {
  option (buf.validate.message).cel = {
    id: "source_definition.unique_locations"
    message: "selected source entry locations must be unique"
    expression: "this.entries.map(entry, has(entry.aws) ? entry.aws.secret_arn : (has(entry.google) ? entry.google.secret_resource : entry.open_bao.path + '#' + entry.open_bao.field_name)).unique()"
  };
  option (buf.validate.message).cel = {
    id: "source_definition.provider_pairing"
    message: "every entry locator must match its registered provider"
    expression: "this.entries.all(entry, (has(this.aws) && has(entry.aws)) || (has(this.google) && has(entry.google)) || (has(this.open_bao) && has(entry.open_bao)))"
  };
  option (buf.validate.message).cel = {
    id: "source_definition.unique_entries"
    message: "selected source entry identities must be unique"
    expression: "this.entries.map(entry, entry.entry_id.value).unique()"
  };
  option (buf.validate.message).cel = {
    id: "source_definition.provider_boundary"
    message: "AWS and Google entries must stay within the configured account or project"
    expression: "this.entries.all(entry, (!has(this.aws) || entry.aws.secret_arn.matches('^arn:[a-z0-9-]+:secretsmanager:' + this.aws.region.value + ':' + this.aws.account_id.value + ':secret:.+$')) && (!has(this.google) || entry.google.secret_resource.startsWith('projects/' + this.google.project_id.value + '/secrets/')))"
  };
  SecretSourceScope scope = 1 [features.field_presence = LEGACY_REQUIRED];
  oneof provider {
    option (buf.validate.oneof).required = true;
    AwsSecretsManagerSource aws = 2;
    GoogleSecretManagerSource google = 3;
    OpenBaoKvSource open_bao = 4;
  }
  repeated SecretSourceEntryDefinition entries = 5 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4096
  }];
  uint32 contract_version = 6 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint32.const = 1
  ];
}

// Authorized owner readback/private persistence only. Neither this projection
// nor the artifact may enter consumer events, provider streams or read models.
// Moving an account/endpoint/entry requires a new registration and new SecretRef.
message SecretSourcePrivateConfiguration {
  option (buf.validate.message).cel = {
    id: "source_private_configuration.scope"
    message: "private source definition must match its registered scope"
    expression: "this.source_ref.scope == this.definition.scope"
  };
  SecretSourceRef source_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretSourceDefinition definition = 2 [features.field_presence = LEGACY_REQUIRED];
  SecretSourceDefinitionArtifact artifact = 3 [features.field_presence = LEGACY_REQUIRED];
}
