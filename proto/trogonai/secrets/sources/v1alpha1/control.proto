edition = "2024";

package trogonai.secrets.sources.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/secrets/sources/v1alpha1/configuration.proto";
import "trogonai/secrets/sources/v1alpha1/identity.proto";
import "trogonai/secrets/sources/v1alpha1/registration.proto";
import "trogonai/secrets/sources/v1alpha1/resolution.proto";

// Privileged authenticated administrative core request only. The service proves
// endpoint/auth safety, decodes and retains exact artifact bytes, probes metadata
// only, mints opaque SecretRefs and records locator-free registration facts.
// NoStream/command_id deduplication applies to the internal metadata transition.
// The request_id stays stable across retries; unacknowledged effects reconcile.
message RegisterSecretSourceRequest {
  SecretSourceRequestId request_id = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretSourceDefinition definition = 2 [features.field_presence = LEGACY_REQUIRED];
  SecretSourceDefinitionArtifact artifact = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Internal pure metadata Decider command, not a material probe. Dispatch verifies
// protected receipt, actual artifact digest, provider/entry pairing, exactly the
// selected complete entry set and the service-minted ref identities. It refuses
// any bootstrap SecretRef backed by this or another external source.
message RecordSecretSourceRegistration {
  SecretSourceRegistration registration = 1 [features.field_presence = LEGACY_REQUIRED];
}

// At plus stable command_id/expected_revision on the exact registration stream.
// Revoke and register-new are the only owner mutations: no provider write,
// rotate/delete, version pin, entry retarget, or in-place provider reconfigure.
message RevokeSecretSourceEntry {
  SecretSourceEntryRef source_entry_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  SourceReferenceRevocationReason reason = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

message RevokeSecretSource {
  SecretSourceRef source_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  SourceReferenceRevocationReason reason = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// The source worker resolves/probes outside the Decider and submits safe trusted
// evidence. Actual source currentness, original deadline and purpose validation
// remain ingress obligations, never conclusions inferred from protobuf shape.
message RecordSourceResolution {
  SourceResolutionEvidence evidence = 1 [features.field_presence = LEGACY_REQUIRED];
}

message SecretSourceRegistered {
  SecretSourceRegistration registration = 1 [features.field_presence = LEGACY_REQUIRED];
}

message SecretSourceEntryRevoked {
  option (buf.validate.message).cel = {
    id: "source_entry_revoked.binding"
    message: "revocation evidence must match the exact scoped SecretRef"
    expression: "this.evidence.scope == this.source_entry_ref.source_ref.scope && this.evidence.secret_ref == this.source_entry_ref.binding.secret_ref"
  };
  SecretSourceEntryRef source_entry_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretReferenceRevocationEvidence evidence = 2 [features.field_presence = LEGACY_REQUIRED];
}

// Every bound reference becomes denied immediately; fan-out/held-session close
// follows without waiting for a provider or unrelated bookkeeping. Re-registration
// receives new identities; the old definition/fence can never revive them.
message SecretSourceRevoked {
  SecretSourceRef source_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  SourceReferenceRevocationReason reason = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

message SourceResolutionObserved {
  SourceResolutionEvidence evidence = 1 [features.field_presence = LEGACY_REQUIRED];
}

// Actor/time are authenticated envelope facts. This stream deliberately never
// imports SecretSourcePrivateConfiguration, Definition or artifact as fields.
message SecretSourceEvent {
  oneof event {
    option (buf.validate.oneof).required = true;
    SecretSourceRegistered registered = 1;
    SecretSourceEntryRevoked entry_revoked = 2;
    SecretSourceRevoked revoked = 3;
    SourceResolutionObserved resolution_observed = 4;
  }
}
