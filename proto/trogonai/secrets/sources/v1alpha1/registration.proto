edition = "2024";

package trogonai.secrets.sources.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/secrets/sources/v1alpha1/identity.proto";
import "trogonai/secrets/sources/v1alpha1/provider.proto";

// Safe source-owner metadata only. The metadata validation receipt matches the
// exact protected definition and complete selected entry set. It proves neither
// material access nor value validation. Downstream consumers receive only each
// existing SecretRef, never this source record or a private provider locator.
message SecretSourceRegistration {
  option (buf.validate.message).cel = {
    id: "source_registration.validation"
    message: "metadata validation must name the exact source definition"
    expression: "this.metadata_validation_ref.source_ref == this.source_ref"
  };
  option (buf.validate.message).cel = {
    id: "source_registration.unique_bindings"
    message: "source entries and returned SecretRefs must be unique"
    expression: "this.bindings.map(binding, binding.entry_id.value).unique() && this.bindings.map(binding, binding.secret_ref.id).unique()"
  };
  SecretSourceRef source_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretSourceProvider provider = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  repeated SecretSourceEntryBinding bindings = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4096
  }];
  SourceMetadataValidationRef metadata_validation_ref = 4 [features.field_presence = LEGACY_REQUIRED];
}

enum SecretSourceLifecycle {
  SECRET_SOURCE_LIFECYCLE_UNSPECIFIED = 0;
  // Metadata registered; material access and health are still unobserved.
  SECRET_SOURCE_LIFECYCLE_REGISTERED = 1;
  SECRET_SOURCE_LIFECYCLE_REVOKED = 2;
}

enum SourceEntryLifecycle {
  SOURCE_ENTRY_LIFECYCLE_UNSPECIFIED = 0;
  SOURCE_ENTRY_LIFECYCLE_REGISTERED = 1;
  SOURCE_ENTRY_LIFECYCLE_REVOKED = 2;
}

enum SourceReferenceRevocationReason {
  SOURCE_REFERENCE_REVOCATION_REASON_UNSPECIFIED = 0;
  SOURCE_REFERENCE_REVOCATION_REASON_OWNER_REQUESTED = 1;
  SOURCE_REFERENCE_REVOCATION_REASON_SOURCE_REVOKED = 2;
  SOURCE_REFERENCE_REVOCATION_REASON_RECOVERY_FENCE_ADVANCED = 3;
}
