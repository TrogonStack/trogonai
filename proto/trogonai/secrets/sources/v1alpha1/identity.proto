edition = "2024";

package trogonai.secrets.sources.v1alpha1;

import "buf/validate/validate.proto";
import "trogon/hierarchy/v1alpha1/node.proto";
import "trogonai/connections/types/v1alpha1/digest.proto";
import "trogonai/connections/types/v1alpha1/resource_parent.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

// Tenant identity is authenticated; project containment is checked against its
// hierarchy. SecretRef never encodes either placement or provider (ADR#0079).
message SecretSourceScope {
  trogon.hierarchy.v1alpha1.NodeId tenant_id = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 2 [features.field_presence = LEGACY_REQUIRED];
}

message SecretSourceId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];
}

message SecretSourceEntryId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];
}

message SecretSourceRequestId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];
}

message SourceMetadataValidationId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];
}

message SourceValueValidationId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];
}

message SourceBootstrapApprovalId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];
}

message SourceResolutionId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];
}

// Refers to one immutable source definition, never to a provider locator. The
// digest covers exact retained SecretSourceDefinition bytes, not a re-encoding
// or a wrapper containing its own digest. Recovery fences are independent of
// the store being restored. No identity/ref is reused or retargeted.
message SecretSourceRef {
  SecretSourceScope scope = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretSourceId source_id = 2 [features.field_presence = LEGACY_REQUIRED];
  uint64 definition_revision = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 recovery_fence = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  trogonai.connections.types.v1alpha1.Digest definition_digest = 5 [features.field_presence = LEGACY_REQUIRED];
}

// Registration mints the existing opaque SecretRef for every selected entry.
// These immutable pairs reveal no provider location and grant no read access.
message SecretSourceEntryBinding {
  SecretSourceEntryId entry_id = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 2 [features.field_presence = LEGACY_REQUIRED];
}

message SecretSourceEntryRef {
  SecretSourceRef source_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretSourceEntryBinding binding = 2 [features.field_presence = LEGACY_REQUIRED];
}

// Protected metadata-probe evidence for the exact definition/entry set. This
// receipt cannot assert material-read permission or that a credential is usable.
// Receipt lookup/signing binds the metadata-probe purpose and source owner.
message SourceMetadataValidationRef {
  SourceMetadataValidationId validation_id = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretSourceRef source_ref = 2 [features.field_presence = LEGACY_REQUIRED];
}
