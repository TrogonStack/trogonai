edition = "2024";

package trogonai.secrets.sources.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/secrets/sources/v1alpha1/configuration.proto";
import "trogonai/secrets/sources/v1alpha1/identity.proto";
import "trogonai/secrets/sources/v1alpha1/registration.proto";
import "trogonai/secrets/sources/v1alpha1/state.proto";

enum SecretSourceControlFailureKind {
  SECRET_SOURCE_CONTROL_FAILURE_KIND_UNSPECIFIED = 0;
  SECRET_SOURCE_CONTROL_FAILURE_KIND_DENIED = 1;
  SECRET_SOURCE_CONTROL_FAILURE_KIND_UNAVAILABLE = 2;
  SECRET_SOURCE_CONTROL_FAILURE_KIND_THROTTLED = 3;
  SECRET_SOURCE_CONTROL_FAILURE_KIND_INVALID_CONFIGURATION = 4;
  SECRET_SOURCE_CONTROL_FAILURE_KIND_CONFLICT = 5;
  SECRET_SOURCE_CONTROL_FAILURE_KIND_UNCERTAIN_EFFECT = 6;
  SECRET_SOURCE_CONTROL_FAILURE_KIND_INVALID_CURSOR = 7;
  SECRET_SOURCE_CONTROL_FAILURE_KIND_STALE_SNAPSHOT = 8;
}

// No provider response, locator or credential is included in public failures.
// Unknown/unauthorized references remain indistinguishable as DENIED.
message SecretSourceControlFailure {
  SecretSourceControlFailureKind kind = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// Metadata registration returns references only and does not assert that a
// material read will succeed. Partial/uncertain registration is reconciled under
// the original request ID; it never silently mints replacement references.
message RegisterSecretSourceResponse {
  SecretSourceRequestId request_id = 1 [features.field_presence = LEGACY_REQUIRED];
  oneof result {
    option (buf.validate.oneof).required = true;
    SecretSourceRegistration registration = 2;
    SecretSourceControlFailure failure = 3;
  }
}

message GetSecretSourceRequest {
  SecretSourceScope scope = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretSourceId source_id = 2 [features.field_presence = LEGACY_REQUIRED];
}

message GetSecretSourceResponse {
  oneof result {
    option (buf.validate.oneof).required = true;
    SecretSourceState source = 1;
    SecretSourceControlFailure failure = 2;
  }
}

// Restricted owner-only readback is distinct from locator-free metadata reads.
// Admission checks current ownership, actual source scope and read privilege;
// possession of a source ref/digest does not grant this operation.
message GetSecretSourcePrivateConfigurationRequest {
  SecretSourceRef source_ref = 1 [features.field_presence = LEGACY_REQUIRED];
}

message GetSecretSourcePrivateConfigurationResponse {
  oneof result {
    option (buf.validate.oneof).required = true;
    SecretSourcePrivateConfiguration private_configuration = 1;
    SecretSourceControlFailure failure = 2;
  }
}

// Authenticated opaque cursor binds scope, caller, query kind, snapshot and
// independent recovery fence. Stale authority/cursor changes fail closed.
message SecretSourcePageCursor {
  bytes value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes = {
      min_len: 1
      max_len: 4096
    }
  ];
}

message ListSecretSourcesRequest {
  SecretSourceScope scope = 1 [features.field_presence = LEGACY_REQUIRED];
  uint32 page_size = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint32 = {
      gte: 1
      lte: 100
    }
  ];
  SecretSourcePageCursor cursor = 3;
}

message SecretSourcePage {
  option (buf.validate.message).cel = {
    id: "source_page.scope"
    message: "every source in a page must share its exact authenticated scope"
    expression: "this.sources.all(source, source.registration.source_ref.scope == this.scope)"
  };
  option (buf.validate.message).cel = {
    id: "source_page.unique_sources"
    message: "a source page cannot duplicate registration identities"
    expression: "this.sources.map(source, source.registration.source_ref.source_id.value).unique()"
  };
  SecretSourceScope scope = 1 [features.field_presence = LEGACY_REQUIRED];
  repeated SecretSourceState sources = 2 [(buf.validate.field).repeated.max_items = 100];
  SecretSourcePageCursor next_cursor = 3;
}

message ListSecretSourcesResponse {
  oneof result {
    option (buf.validate.oneof).required = true;
    SecretSourcePage page = 1;
    SecretSourceControlFailure failure = 2;
  }
}
