edition = "2024";

package trogonai.secrets.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/provisioning/v1alpha1/events.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

// Account continuity applies to active provider/tool/MCP authentication and OAuth roles
// on account-bearing connections. Accountless destination verification, when
// required by its adapter, targets endpoint identity instead. The service derives
// every applicable requirement; a caller cannot omit one. Fingerprints and
// digests cover non-secret identities, never token bytes or secret URL components.
// Generated webhook shared keys require local type/entropy admission, not an
// invented external account probe.
message MaterialVerificationRequirement {
  string id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string connection_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string binding_id = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  uint64 binding_revision = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  bytes connection_configuration_digest = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.len = 32
  ];
  bytes endpoint_policy_digest = 6 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.len = 32
  ];
  oneof expected_identity {
    option (buf.validate.oneof).required = true;
    bytes expected_account_fingerprint = 7 [(buf.validate.field).bytes.len = 32];
    bytes expected_endpoint_identity_digest = 8 [(buf.validate.field).bytes.len = 32];
  }
}

enum MaterialVerificationOutcome {
  MATERIAL_VERIFICATION_OUTCOME_UNSPECIFIED = 0;
  MATERIAL_VERIFICATION_OUTCOME_PASSED = 1;
  MATERIAL_VERIFICATION_OUTCOME_ACCOUNT_MISMATCH = 2;
  MATERIAL_VERIFICATION_OUTCOME_AUTHENTICATION_REJECTED = 3;
  MATERIAL_VERIFICATION_OUTCOME_PROVIDER_UNAVAILABLE = 4;
  MATERIAL_VERIFICATION_OUTCOME_ENDPOINT_MISMATCH = 5;
}

// Only a transport-authenticated trusted verifier may attest a probe. Passed
// evidence must match the requirement's identity variant, identity value, and
// configuration exactly; failing or stale evidence cannot activate the candidate.
message MaterialVerification {
  option (buf.validate.message).cel = {
    id: "material_verification.passed_identity"
    message: "passed verification must identify the verified account or endpoint"
    expression:
      "this.outcome != 1 || has(this.verified_account_fingerprint) || "
      "has(this.verified_endpoint_identity_digest)"
  };

  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretVersionRef candidate_version = 2 [features.field_presence = LEGACY_REQUIRED];
  string requirement_id = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  bytes connection_configuration_digest = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.len = 32
  ];
  oneof verified_identity {
    bytes verified_account_fingerprint = 5 [(buf.validate.field).bytes.len = 32];
    bytes verified_endpoint_identity_digest = 10 [(buf.validate.field).bytes.len = 32];
  }
  string evidence_id = 6 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  MaterialVerificationOutcome outcome = 7 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  string verifier_principal_id = 8 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  google.protobuf.Timestamp verified_at = 9 [features.field_presence = LEGACY_REQUIRED];
}

message MaterialVerificationRecorded {
  MaterialVerification verification = 1 [features.field_presence = LEGACY_REQUIRED];
}
