edition = "2024";

package trogonai.secrets.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/provisioning/v1alpha1/events.proto";
import "trogonai/secrets/v1alpha1/credential.proto";
import "trogonai/secrets/v1alpha1/failure.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

enum SecretUseAction {
  SECRET_USE_ACTION_UNSPECIFIED = 0;
  SECRET_USE_ACTION_RESOLVE = 1;
  SECRET_USE_ACTION_COMPUTE_MAC = 2;
  SECRET_USE_ACTION_VERIFY_MAC = 3;
  SECRET_USE_ACTION_VERIFY_TOKEN = 4;
}

enum SecretUseDirection {
  SECRET_USE_DIRECTION_UNSPECIFIED = 0;
  SECRET_USE_DIRECTION_INBOUND = 1;
  SECRET_USE_DIRECTION_OUTBOUND = 2;
}

enum SecretUseMode {
  SECRET_USE_MODE_UNSPECIFIED = 0;
  SECRET_USE_MODE_RUNTIME = 1;
  SECRET_USE_MODE_MANAGEMENT_VERIFICATION = 2;
  SECRET_USE_MODE_MANAGEMENT_PROVISIONING = 3;
  SECRET_USE_MODE_OWNED_CLEANUP = 4;
}

// No arbitrary historical version choice exists. Candidate access is confined
// to the exact required verification probe while the owner is not yet active.
message CandidateSecretUse {
  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretVersionRef candidate_version = 2 [features.field_presence = LEGACY_REQUIRED];
  string requirement_id = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

// A prepared child may supply material to one already-planned parent registration
// effect before parent activation. This does not make the credential generally
// usable. Admission verifies the parent's exact live plan/step, declared role,
// pinned adapter operation and destination plus the child's Prepared evidence.
// Only a trusted registration executor may receive the ephemeral value.
message ProvisioningSecretUse {
  trogonai.provisioning.v1alpha1.ProvisioningRef child_provisioning = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretVersionRef candidate_version = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.provisioning.v1alpha1.EventRef child_prepared = 3 [features.field_presence = LEGACY_REQUIRED];
  trogonai.provisioning.v1alpha1.ProvisioningRef parent_provisioning = 4 [features.field_presence = LEGACY_REQUIRED];
  trogonai.provisioning.v1alpha1.ResourceRef parent_owner = 5 [features.field_presence = LEGACY_REQUIRED];
  trogonai.provisioning.v1alpha1.EventRef parent_started = 6 [features.field_presence = LEGACY_REQUIRED];
  string step_id = 7 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string credential_role_name = 8 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string registration_operation_name = 9 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

// Durable authorization metadata, not a bearer credential or a material API.
// Transport-derived identity, exact binding, purpose and endpoint policy are
// rechecked on use. Lifetime is positive and <=5m, further bounded by the owning
// operation. Verification candidates require MANAGEMENT_VERIFICATION and parent
// registration candidates require MANAGEMENT_PROVISIONING; owned cleanup
// requires an unresolved cleanup obligation and grants no business operations.
// A prior version is eligible only for explicitly admitted webhook verification
// or dual signing and never raw resolution. Version refs belong to this secret.
// Webhook values are resolved only for registration or owned cleanup. MAC/token
// verification is inbound and signing is outbound; action and purpose must agree.
message SecretUseAuthorization {
  option (buf.validate.message).cel = {
    id: "secret_use_authorization.bounded_lifetime"
    message: "secret use authorization lifetime must be positive and at most five minutes"
    expression: "this.expires_at > this.issued_at && this.expires_at - this.issued_at <= duration('300s')"
  };
  option (buf.validate.message).cel = {
    id: "secret_use_authorization.candidate_mode"
    message: "candidate material is for a verification probe only"
    expression:
      "!has(this.candidate) || (this.mode == 2 && this.action == 1 && "
      "this.candidate.candidate_version.secret.id == this.secret.id && "
      "this.candidate.provisioning.project_id == this.project_id)"
  };
  option (buf.validate.message).cel = {
    id: "secret_use_authorization.provisioning_candidate_mode"
    message: "prepared child material is limited to its admitted parent registration effect"
    expression:
      "!has(this.provisioning_candidate) || (this.mode == 3 && this.action == 1 && this.direction == 2 && "
      "this.provisioning_candidate.candidate_version.secret.id == this.secret.id && "
      "this.provisioning_candidate.child_provisioning.project_id == this.project_id && "
      "this.provisioning_candidate.parent_provisioning.project_id == this.project_id && "
      "this.provisioning_candidate.parent_owner.kind == this.resource.kind && "
      "this.provisioning_candidate.parent_owner.id == this.resource.id)"
  };
  option (buf.validate.message).cel = {
    id: "secret_use_authorization.action_purpose_direction"
    message: "MAC/token actions must match webhook purpose and direction"
    expression:
      "(this.action != 2 || (this.purpose == 3 && this.direction == 2)) && "
      "(!(this.action in [3, 4]) || (this.purpose == 2 && this.direction == 1)) && "
      "(this.action != 1 || !(this.purpose in [2, 3]) || this.mode in [3, 4])"
  };
  option (buf.validate.message).cel = {
    id: "secret_use_authorization.cleanup_mode"
    message: "owned cleanup requires an exact cleanup obligation and active versions belong to this credential"
    expression:
      "(this.mode == 4) == has(this.cleanup_obligation) && "
      "(!has(this.active_version) || this.active_version.secret.id == this.secret.id)"
  };
  option (buf.validate.message).cel = {
    id: "secret_use_authorization.prior_version"
    message: "prior material is restricted to webhook signing or verification"
    expression:
      "!has(this.previous_version) || (has(this.active_version) && this.purpose in [2, 3] && "
      "this.action in [2, 3, 4] && this.previous_version.secret.id == this.secret.id && "
      "this.previous_version.version != this.active_version.version)"
  };

  string id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string project_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  SecretRef secret = 3 [features.field_presence = LEGACY_REQUIRED];
  trogonai.provisioning.v1alpha1.ResourceRef resource = 4 [features.field_presence = LEGACY_REQUIRED];
  string binding_id = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  uint64 binding_revision = 6 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  string operation_id = 7 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string attempt_id = 8 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string workload_principal_id = 9 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  SecretPurpose purpose = 10 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  SecretUseAction action = 11 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  SecretUseDirection direction = 12 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  string audience = 13 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  bytes endpoint_policy_digest = 14 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.len = 32
  ];
  google.protobuf.Timestamp issued_at = 15 [features.field_presence = LEGACY_REQUIRED];
  google.protobuf.Timestamp expires_at = 16 [features.field_presence = LEGACY_REQUIRED];
  SecretUseMode mode = 17 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  oneof material {
    option (buf.validate.oneof).required = true;
    SecretVersionRef active_version = 18;
    CandidateSecretUse candidate = 19;
    SecretLeaseRef lease = 20;
    ProvisioningSecretUse provisioning_candidate = 23;
  }
  SecretVersionRef previous_version = 21;
  trogonai.provisioning.v1alpha1.EventRef cleanup_obligation = 22;
}

// This audit acceptance is durable before material release or cryptographic
// use, including service-cache hits. It grants no authority to agent processes.
message SecretUseAccepted {
  SecretUseAuthorization authorization = 1 [features.field_presence = LEGACY_REQUIRED];
}

enum SecretUseResult {
  SECRET_USE_RESULT_UNSPECIFIED = 0;
  SECRET_USE_RESULT_MATERIAL_RELEASED = 1;
  SECRET_USE_RESULT_MAC_COMPUTED = 2;
  SECRET_USE_RESULT_VERIFICATION_MATCHED = 3;
  SECRET_USE_RESULT_VERIFICATION_REJECTED = 4;
  SECRET_USE_RESULT_FAILED = 5;
}

// Completion records an outcome only, never resolved bytes, signed inputs,
// MACs, presented tokens, callback URLs, or provider diagnostic bodies.
message SecretUseCompleted {
  option (buf.validate.message).cel = {
    id: "secret_use_completed.failure_reason"
    message: "failed use must carry a failure reason and successful use must not"
    expression: "(this.result == 5) == has(this.failure_reason)"
  };

  string authorization_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  SecretUseResult result = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  SecretFailureReason failure_reason = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated SecretVersionRef used_versions = 4 [(buf.validate.field).repeated.max_items = 2];
}

// Known-credential denials can be audited without inventing an authorization.
// Unknown-ref or unauthenticated attempts belong to the admission audit stream.
message SecretUseDenied {
  string workload_principal_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string operation_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  SecretFailureReason reason = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

enum SecretAuthorizationEndReason {
  SECRET_AUTHORIZATION_END_REASON_UNSPECIFIED = 0;
  SECRET_AUTHORIZATION_END_REASON_EXPIRED = 1;
  SECRET_AUTHORIZATION_END_REASON_OPERATION_FINISHED = 2;
  SECRET_AUTHORIZATION_END_REASON_POLICY_REVOKED = 3;
}

message SecretUseAuthorizationEnded {
  string authorization_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  SecretAuthorizationEndReason reason = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

message SecretAuditEvent {
  oneof fact {
    option (buf.validate.oneof).required = true;
    SecretUseAccepted accepted = 1;
    SecretUseCompleted completed = 2;
    SecretUseDenied denied = 3;
    SecretUseAuthorizationEnded authorization_ended = 4;
  }
}
