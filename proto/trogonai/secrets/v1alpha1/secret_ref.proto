edition = "2024";

package trogonai.secrets.v1alpha1;

import "buf/validate/validate.proto";

// The service mints 32 random bytes encoded as unpadded base64url. The handle
// exposes no project, provider, path, or version and grants no access by itself.
message SecretRef {
  string id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{43}$"
  ];
}

// Versions describe observed storage metadata. Runtime callers cannot select
// historical material by supplying a version; policy selects eligible versions.
message SecretVersionRef {
  SecretRef secret = 1 [features.field_presence = LEGACY_REQUIRED];
  uint64 version = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
}

// The lease handle identifies platform metadata only, never a provider lease id
// or a bearer token. It is reserved before acquisition and never reused.
message SecretLeaseRef {
  string id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{43}$"
  ];
}
