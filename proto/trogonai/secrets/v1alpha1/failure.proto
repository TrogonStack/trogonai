edition = "2024";

package trogonai.secrets.v1alpha1;

// Reasons carry no provider text, protected URL, submitted material or hash of
// material. A failure reason never proves external effects have been removed.
enum SecretFailureReason {
  SECRET_FAILURE_REASON_UNSPECIFIED = 0;
  SECRET_FAILURE_REASON_PERMISSION_DENIED = 1;
  SECRET_FAILURE_REASON_NOT_FOUND = 2;
  SECRET_FAILURE_REASON_REVISION_CONFLICT = 3;
  SECRET_FAILURE_REASON_PURPOSE_MISMATCH = 4;
  SECRET_FAILURE_REASON_INVALID_MATERIAL = 5;
  SECRET_FAILURE_REASON_PROVIDER_UNAVAILABLE = 6;
  SECRET_FAILURE_REASON_AUDIT_UNAVAILABLE = 7;
  SECRET_FAILURE_REASON_MATERIAL_RESUBMISSION_REQUIRED = 8;
  SECRET_FAILURE_REASON_VERSION_UNAVAILABLE = 9;
  SECRET_FAILURE_REASON_RECONNECT_REQUIRED = 10;
  SECRET_FAILURE_REASON_INVALID_LIFECYCLE = 11;
  SECRET_FAILURE_REASON_OPERATION_IN_PROGRESS = 12;
  SECRET_FAILURE_REASON_AUTHORIZATION_EXPIRED = 13;
  SECRET_FAILURE_REASON_BINDING_CHANGED = 14;
  SECRET_FAILURE_REASON_IDEMPOTENCY_CONFLICT = 15;
  SECRET_FAILURE_REASON_OWNERSHIP_MISMATCH = 16;
  SECRET_FAILURE_REASON_VERIFICATION_REJECTED = 17;
  SECRET_FAILURE_REASON_EFFECT_UNKNOWN = 18;
}
