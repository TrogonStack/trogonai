edition = "2024";

package trogonai.secrets.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/provisioning/v1alpha1/events.proto";
import "trogonai/secrets/v1alpha1/authorization.proto";
import "trogonai/secrets/v1alpha1/credential.proto";
import "trogonai/secrets/v1alpha1/failure.proto";
import "trogonai/secrets/v1alpha1/lease.proto";
import "trogonai/secrets/v1alpha1/material_verification.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

// This first fact reserves the opaque identity with NoStream concurrency before
// any backend write, OAuth exchange or provider effect. The credential is
// PROVISIONING and unusable. The matching shared Started plan must also be
// durable before IO. Neither caller retry nor compensation can reuse this id.
message CredentialReserved {
  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 1 [features.field_presence = LEGACY_REQUIRED];
  string vault_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string display_name = 3 [features.field_presence = LEGACY_REQUIRED];
  CredentialPolicy policy = 4 [features.field_presence = LEGACY_REQUIRED];
}

// Only the label is mutable metadata. Environment remains immutable with the
// credential policy; changing it requires a replacement credential.
message CredentialMetadataUpdated {
  string display_name = 1 [features.field_presence = LEGACY_REQUIRED];
}

enum CredentialWriteKind {
  CREDENTIAL_WRITE_KIND_UNSPECIFIED = 0;
  CREDENTIAL_WRITE_KIND_INITIAL = 1;
  CREDENTIAL_WRITE_KIND_ROTATION = 2;
  CREDENTIAL_WRITE_KIND_RECONNECT = 3;
}

// CAS and immutable ownership are reserved before touching material. Initial
// material writes use the observed reservation-marker version; rotation uses the observed backend version,
// which may exceed the active version after compensated attempts. At most one
// write operation is outstanding per credential. All retries use the same CAS
// precondition and ownership token; resubmission cannot overwrite an observed
// candidate. The prior active version remains current until durable activation.
// Backend retention must preserve active/overlap and unresolved attribution
// through the next write; unsafe max-version or automatic-deletion settings
// reject the write instead of pruning a live version during failed rotations.
message CredentialCandidateWriteReserved {
  option (buf.validate.message).cel = {
    id: "credential_candidate_write_reserved.initial_marker"
    message: "initial writes require marker evidence; rotation and reconnect require the previous current version"
    expression:
      "this.kind == 1 ? (has(this.initial_marker) && !has(this.prior_active_version)) : "
      "(!has(this.initial_marker) && has(this.prior_active_version))"
  };

  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 1 [features.field_presence = LEGACY_REQUIRED];
  string step_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string ownership_token = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  uint64 expected_storage_version = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  CredentialWriteKind kind = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  SecretVersionRef prior_active_version = 6;
  repeated MaterialVerificationRequirement required_verifications = 7;
  // Only webhook purposes admit overlap; absence means no overlap. Activation
  // fixes its start and cannot extend this deadline beyond the admitted <=24h.
  google.protobuf.Timestamp previous_webhook_expires_at = 8;
  SecretMaterialOrigin origin = 9 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // Required for INITIAL and absent for ROTATION/RECONNECT.
  trogonai.provisioning.v1alpha1.EventRef initial_marker = 10;
}

// Initial path creation reserves a non-secret marker with CAS zero. Backend
// authority is operation-scoped and bounded; this records its deadline, never
// its token. No material write starts until matching marker evidence is durable.
message CredentialBackendMarkerReserved {
  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 1 [features.field_presence = LEGACY_REQUIRED];
  string step_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string ownership_token = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  google.protobuf.Timestamp backend_authority_expires_at = 4 [features.field_presence = LEGACY_REQUIRED];
}

message CredentialBackendMarkerObserved {
  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 1 [features.field_presence = LEGACY_REQUIRED];
  string step_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string attempt_id = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  uint64 fence = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 backend_version = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.const = 1
  ];
  string ownership_token = 6 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

// Cancellation consumes the candidate's reserved CAS with a non-secret fence
// write if no candidate already consumed it. This proves conditional writes
// cannot arrive against that version; it does not quiesce initial CAS-zero
// attempts after metadata purge. Those also require backend-authority settlement.
message CredentialWriteCasClosed {
  option (buf.validate.message).cel = {
    id: "credential_write_cas_closed.next_version"
    message: "closure must consume exactly the reserved CAS version"
    expression: "this.resulting_storage_version == this.closed_storage_version + 1u"
  };

  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.provisioning.v1alpha1.EventRef write_reservation = 2 [features.field_presence = LEGACY_REQUIRED];
  uint64 closed_storage_version = 3 [features.field_presence = LEGACY_REQUIRED];
  uint64 resulting_storage_version = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  oneof closure {
    option (buf.validate.oneof).required = true;
    trogonai.provisioning.v1alpha1.EventRef candidate_observed = 5;
    string nonsecret_fence_ownership_token = 6 [(buf.validate.field).string.min_len = 1];
  }
}

// Evidence requires expiry/revocation of every operation-scoped backend grant
// plus the adapter's proven settlement bound for requests already in flight.
// Local worker expiry alone is insufficient. Purging key metadata requires this
// fact, otherwise a late CAS-zero marker could recreate the abandoned path.
message CredentialBackendAuthorityQuiesced {
  option (buf.validate.message).cel = {
    id: "credential_backend_authority_quiesced.settlement_order"
    message: "in-flight settlement cannot precede authority closure"
    expression: "this.in_flight_settled_at >= this.authority_closed_at"
  };

  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 1 [features.field_presence = LEGACY_REQUIRED];
  uint64 through_fence = 2 [features.field_presence = LEGACY_REQUIRED];
  google.protobuf.Timestamp authority_closed_at = 3 [features.field_presence = LEGACY_REQUIRED];
  google.protobuf.Timestamp in_flight_settled_at = 4 [features.field_presence = LEGACY_REQUIRED];
  trogonai.provisioning.v1alpha1.EventRef authority_reservation = 5 [features.field_presence = LEGACY_REQUIRED];
}

// The private KV v2 data envelope atomically stores material with provisioning
// id and ownership token. Path-scoped custom_metadata cannot prove ownership of
// a version. Reconciliation inspects the protected envelope inside the service;
// only this metadata evidence escapes. AVAILABLE is required and its version
// must equal the reserved CAS version plus one. Unknown effects stay in shared
// reconciliation and produce no fabricated candidate or terminal failure.
message CredentialCandidateObserved {
  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 1 [features.field_presence = LEGACY_REQUIRED];
  string step_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string attempt_id = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  uint64 fence = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  SecretVersionMetadata candidate = 5 [features.field_presence = LEGACY_REQUIRED];
  string ownership_token = 6 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

// A value was not durably available when the attempt settled. Recovery cannot
// retrieve material from the event stream. Resubmission is a new authorized
// attempt of this operation after absence/quiescence, never a blind second write.
message CredentialMaterialResubmissionRequired {
  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.provisioning.v1alpha1.EventRef settled_absence = 2 [features.field_presence = LEGACY_REQUIRED];
}

// This is the commit decision, after the exact candidate's required proofs and
// shared Prepared fact, with current vault/binding/dependency policy rechecked.
// Generated webhook material has local type/entropy admission, not a fabricated
// external account proof. Shared Committed may follow after a crash. For child
// provisioning, parent_activation must durably adopt the creation receipt first;
// an unresolved parent decision blocks activation and compensation.
message CredentialVersionActivated {
  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretVersionRef version = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.provisioning.v1alpha1.EventRef prepared = 3 [features.field_presence = LEGACY_REQUIRED];
  repeated trogonai.provisioning.v1alpha1.EventRef verification_evidence = 4;
  PreviousWebhookVersion previous_webhook_version = 5;
  trogonai.provisioning.v1alpha1.EventRef parent_activation = 6;
  // Retirement is derived durably from activation, even if scheduling crashes.
  // A prior version remains only through its explicitly recorded webhook overlap.
  SecretVersionRef retired_version = 7;
}

// Parent activation is authoritative even if this acknowledgement lags. The
// receipt must be NEWLY_OWNED by this credential's creator and named in the
// parent's activation. Borrowed resources never transfer or authorize cleanup.
message SecretOwnershipTransferred {
  trogonai.provisioning.v1alpha1.ResourceReceiptRef creation = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.provisioning.v1alpha1.ResourceRef owner = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.provisioning.v1alpha1.EventRef parent_activation = 3 [features.field_presence = LEGACY_REQUIRED];
}

// ACTIVE <-> DISABLED; active -> RECONNECT_REQUIRED; nonterminal -> REVOKED.
// Revocation denies use immediately and is irreversible. Reconnect needs a
// verified activation, not a lifecycle shortcut. Destroy/abort use their own
// evidence-bearing events, not an arbitrary lifecycle assignment.
message CredentialLifecycleChanged {
  CredentialLifecycle lifecycle = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      in: [
        2,
        3,
        4,
        7
      ]
    }
  ];
  CredentialPolicyReason reason = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// A failed write closes activation but is not a terminal operation. Shared
// compensation tracks every possible owned effect, including unknown writes.
// During rotation, existing current material and borrowed resources survive.
message CredentialWriteRejected {
  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretFailureReason reason = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// Immediately denies use and new writes; execute_after delays physical removal,
// not revocation. Existing attempts remain tracked until quiescence is proved.
message CredentialDestructionScheduled {
  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 1 [features.field_presence = LEGACY_REQUIRED];
  google.protobuf.Timestamp execute_after = 2 [features.field_presence = LEGACY_REQUIRED];
  CredentialPolicyReason reason = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// Evidence of irreversible destruction of the exact owned version, never soft
// delete. It must match the shared cleanup plan and its current attempt fence.
// Backend key metadata is a separate obligation; this fact cannot close it.
message SecretVersionDestructionObserved {
  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 1 [features.field_presence = LEGACY_REQUIRED];
  string cleanup_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  SecretVersionRef version = 3 [features.field_presence = LEGACY_REQUIRED];
  string ownership_token = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  uint64 through_fence = 5 [features.field_presence = LEGACY_REQUIRED];
  google.protobuf.Timestamp observed_at = 6 [features.field_presence = LEGACY_REQUIRED];
}

enum SecretMetadataCleanupScope {
  SECRET_METADATA_CLEANUP_SCOPE_UNSPECIFIED = 0;
  SECRET_METADATA_CLEANUP_SCOPE_VERSION_OWNERSHIP = 1;
  SECRET_METADATA_CLEANUP_SCOPE_EXCLUSIVE_CREDENTIAL_KEY = 2;
}

// Rotation cleanup removes only the failed version's owned material/envelope;
// it preserves key metadata needed by the current version. Full key-metadata
// purge requires exclusive ownership, no live versions and all attempts fenced.
// The application's minimal tombstone remains so old workers cannot recreate it.
message SecretMetadataPurgeObserved {
  option (buf.validate.message).cel = {
    id: "secret_metadata_purge_observed.scope"
    message: "version cleanup names the exact version; whole-key cleanup names no single version"
    expression: "(this.scope == 1) == has(this.version)"
  };

  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 1 [features.field_presence = LEGACY_REQUIRED];
  string cleanup_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  SecretMetadataCleanupScope scope = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  SecretVersionRef version = 4;
  uint64 through_fence = 5 [features.field_presence = LEGACY_REQUIRED];
  google.protobuf.Timestamp observed_at = 6 [features.field_presence = LEGACY_REQUIRED];
}

// A terminal tombstone needs irreversible destruction, exclusively owned key
// metadata purge and quiescence evidence for every possible writer. Provider
// revocation debts must also be settled. A soft delete or retry limit is not proof.
message CredentialDestroyed {
  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 1 [features.field_presence = LEGACY_REQUIRED];
  repeated trogonai.provisioning.v1alpha1.EventRef cleanup_evidence = 2 [(buf.validate.field).repeated.min_items = 1];
}

// Ends only the matching previous-version window. The current version remains
// active. Later destruction of the retired version uses a new removal operation.
message WebhookRotationOverlapEnded {
  SecretVersionRef previous_version = 1 [features.field_presence = LEGACY_REQUIRED];
  CredentialPolicyReason reason = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// Shared provisioning facts live in this same credential stream, never in an
// independently committed saga store. Embedded owner/project/event metadata
// must equal the envelope. Shared compensation settles initial provisioning to
// PROVISIONING_ABORTED only after all cleanup and quiescence; a failed rotation
// returns to its prior policy state without deleting prior material. Fan-out
// invalidation reaches every replica. Constraints document, not enforce, rules.
message CredentialEvent {
  option (buf.validate.message).cel = {
    id: "credential_event.creation_revision"
    message: "credential reservation must be revision one in the same project"
    expression:
      "has(this.reserved) == (this.revision == 1u) && "
      "(!has(this.reserved) || this.reserved.provisioning.project_id == this.project_id)"
  };
  option (buf.validate.message).cel = {
    id: "credential_event.provisioning_envelope"
    message: "embedded provisioning facts must match their credential stream envelope"
    expression:
      "!has(this.provisioning) || (this.provisioning.provisioning.project_id == this.project_id && "
      "this.provisioning.owner.kind == 1 && this.provisioning.owner.id == this.secret.id && "
      "this.provisioning.event_id == this.event_id && this.provisioning.revision == this.revision && "
      "this.provisioning.occurred_at == this.occurred_at)"
  };
  option (buf.validate.message).cel = {
    id: "credential_event.audit_identity"
    message: "accepted secret use must match the owning credential and project"
    expression:
      "!has(this.audit) || !has(this.audit.accepted) || "
      "(this.audit.accepted.authorization.secret.id == this.secret.id && "
      "this.audit.accepted.authorization.project_id == this.project_id)"
  };
  option (buf.validate.message).cel = {
    id: "credential_event.audit_used_versions"
    message: "completed use may reference only this credential's versions"
    expression:
      "!has(this.audit) || !has(this.audit.completed) || "
      "this.audit.completed.used_versions.all(v, v.secret.id == this.secret.id)"
  };

  SecretRef secret = 1 [features.field_presence = LEGACY_REQUIRED];
  string project_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string event_id = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  uint64 revision = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  google.protobuf.Timestamp occurred_at = 5 [features.field_presence = LEGACY_REQUIRED];
  oneof fact {
    option (buf.validate.oneof).required = true;
    CredentialReserved reserved = 10;
    CredentialCandidateWriteReserved candidate_write_reserved = 11;
    CredentialCandidateObserved candidate_observed = 12;
    CredentialMaterialResubmissionRequired material_resubmission_required = 13;
    MaterialVerificationRecorded material_verification_recorded = 14;
    CredentialVersionActivated version_activated = 15;
    SecretOwnershipTransferred ownership_transferred = 16;
    CredentialLifecycleChanged lifecycle_changed = 17;
    CredentialWriteRejected write_rejected = 18;
    CredentialDestructionScheduled destruction_scheduled = 19;
    SecretVersionDestructionObserved version_destruction_observed = 20;
    SecretMetadataPurgeObserved metadata_purge_observed = 21;
    CredentialDestroyed destroyed = 22;
    WebhookRotationOverlapEnded webhook_rotation_overlap_ended = 23;
    SecretAuditEvent audit = 24;
    SecretLeaseEvent lease = 25;
    trogonai.provisioning.v1alpha1.ProvisioningEvent provisioning = 26;
    CredentialBackendMarkerReserved backend_marker_reserved = 27;
    CredentialBackendMarkerObserved backend_marker_observed = 28;
    CredentialWriteCasClosed write_cas_closed = 29;
    CredentialBackendAuthorityQuiesced backend_authority_quiesced = 30;
    CredentialMetadataUpdated metadata_updated = 31;
  }
}
