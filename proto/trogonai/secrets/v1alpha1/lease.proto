edition = "2024";

package trogonai.secrets.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/provisioning/v1alpha1/events.proto";
import "trogonai/secrets/v1alpha1/credential.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

// A short-lived provider credential belongs to a trusted executor's single
// workload operation/attempt, never an agent prompt, tool environment or user
// file. Acquisition requires recoverable provider effects in the shared plan.
// A renewal reserves a new lease identity; it never extends a previous grant.
message SecretLeaseReserved {
  SecretLeaseRef lease = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 2 [features.field_presence = LEGACY_REQUIRED];
  string workload_principal_id = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string operation_id = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string attempt_id = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  SecretPurpose purpose = 6 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      in: [
        1,
        6,
        7
      ]
    }
  ];
  trogonai.provisioning.v1alpha1.ResourceRef resource = 7 [features.field_presence = LEGACY_REQUIRED];
  string binding_id = 8 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  uint64 binding_revision = 9 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  string audience = 10 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  bytes endpoint_policy_digest = 11 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.len = 32
  ];
  SecretLeaseRef replaces = 12;
}

// Issuance follows shared Prepared and rechecks live owner authority. Material
// and provider lease identifiers stay in custody. Local use lasts <=5m and no
// later than the provider expiry or owning operation. Provider expiry itself
// can be later; local expiry never claims provider revocation or cleanup success.
message SecretLeaseIssued {
  option (buf.validate.message).cel = {
    id: "secret_lease_issued.bounded_lifetime"
    message: "local lease lifetime must be positive, at most five minutes, and no later than provider expiry"
    expression:
      "this.expires_at > this.issued_at && this.expires_at - this.issued_at <= duration('300s') && "
      "this.expires_at <= this.provider_expires_at"
  };

  SecretLeaseRef lease = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.provisioning.v1alpha1.ProvisioningRef provisioning = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.provisioning.v1alpha1.ResourceReceiptRef acquisition = 3 [features.field_presence = LEGACY_REQUIRED];
  google.protobuf.Timestamp issued_at = 4 [features.field_presence = LEGACY_REQUIRED];
  google.protobuf.Timestamp expires_at = 5 [features.field_presence = LEGACY_REQUIRED];
  google.protobuf.Timestamp provider_expires_at = 6 [features.field_presence = LEGACY_REQUIRED];
  trogonai.provisioning.v1alpha1.EventRef prepared = 7 [features.field_presence = LEGACY_REQUIRED];
}

enum SecretLeaseEndReason {
  SECRET_LEASE_END_REASON_UNSPECIFIED = 0;
  SECRET_LEASE_END_REASON_EXPIRED = 1;
  SECRET_LEASE_END_REASON_OPERATION_FINISHED = 2;
  SECRET_LEASE_END_REASON_POLICY_REVOKED = 3;
  SECRET_LEASE_END_REASON_REPLACED = 4;
}

// Immediately ends local use and creates a durable removal obligation for the
// provider credential and its material. Cleanup authority is separate from the
// terminated runtime grant. A provider outage leaves this obligation pending.
message SecretLeaseUseEnded {
  SecretLeaseRef lease = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretLeaseEndReason reason = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  trogonai.provisioning.v1alpha1.ProvisioningRef removal = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Provider absence/expiry and owned material/metadata destruction must all be
// confirmed after attempt quiescence. An elapsed local TTL proves none of these.
message SecretLeaseCleanupConfirmed {
  SecretLeaseRef lease = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.provisioning.v1alpha1.ProvisioningRef removal = 2 [features.field_presence = LEGACY_REQUIRED];
  repeated trogonai.provisioning.v1alpha1.EventRef cleanup_evidence = 3 [(buf.validate.field).repeated.min_items = 1];
}

message SecretLeaseEvent {
  oneof fact {
    option (buf.validate.oneof).required = true;
    SecretLeaseReserved reserved = 1;
    SecretLeaseIssued issued = 2;
    SecretLeaseUseEnded use_ended = 3;
    SecretLeaseCleanupConfirmed cleanup_confirmed = 4;
  }
}
