edition = "2024";

package trogonai.secrets.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

enum SecretPurpose {
  SECRET_PURPOSE_UNSPECIFIED = 0;
  SECRET_PURPOSE_PROVIDER_AUTHENTICATION = 1;
  SECRET_PURPOSE_WEBHOOK_VERIFICATION = 2;
  SECRET_PURPOSE_WEBHOOK_SIGNING = 3;
  SECRET_PURPOSE_OAUTH_REFRESH = 4;
  SECRET_PURPOSE_WEBHOOK_DESTINATION = 5;
  SECRET_PURPOSE_TOOL_AUTHENTICATION = 6;
  SECRET_PURPOSE_MCP_AUTHENTICATION = 7;
}

enum SecretMaterialKind {
  SECRET_MATERIAL_KIND_UNSPECIFIED = 0;
  SECRET_MATERIAL_KIND_API_TOKEN = 1;
  SECRET_MATERIAL_KIND_BASIC_AUTHENTICATION = 2;
  SECRET_MATERIAL_KIND_OAUTH_ACCESS_TOKEN = 3;
  SECRET_MATERIAL_KIND_OAUTH_REFRESH_TOKEN = 4;
  SECRET_MATERIAL_KIND_WEBHOOK_SHARED_SECRET = 5;
  SECRET_MATERIAL_KIND_WEBHOOK_DESTINATION = 6;
}

enum SecretMaterialOrigin {
  SECRET_MATERIAL_ORIGIN_UNSPECIFIED = 0;
  SECRET_MATERIAL_ORIGIN_IMPORTED = 1;
  SECRET_MATERIAL_ORIGIN_GENERATED = 2;
  SECRET_MATERIAL_ORIGIN_PROVIDER_ISSUED = 3;
}

// Lifecycle governs permission independently of physical backend versions.
// PROVISIONING never authorizes use; REVOKED is irreversible. Destroying material
// does not free its identity for reuse. Cleanup pending is never a terminal state.
enum CredentialLifecycle {
  CREDENTIAL_LIFECYCLE_UNSPECIFIED = 0;
  CREDENTIAL_LIFECYCLE_PROVISIONING = 1;
  CREDENTIAL_LIFECYCLE_ACTIVE = 2;
  CREDENTIAL_LIFECYCLE_DISABLED = 3;
  CREDENTIAL_LIFECYCLE_REVOKED = 4;
  CREDENTIAL_LIFECYCLE_DESTROY_PENDING = 5;
  CREDENTIAL_LIFECYCLE_DESTROYED = 6;
  CREDENTIAL_LIFECYCLE_RECONNECT_REQUIRED = 7;
  CREDENTIAL_LIFECYCLE_CLEANUP_PENDING = 8;
  CREDENTIAL_LIFECYCLE_PROVISIONING_ABORTED = 9;
}

enum CredentialPolicyReason {
  CREDENTIAL_POLICY_REASON_UNSPECIFIED = 0;
  CREDENTIAL_POLICY_REASON_OPERATOR_REQUESTED = 1;
  CREDENTIAL_POLICY_REASON_COMPROMISE = 2;
  CREDENTIAL_POLICY_REASON_PROVIDER_AUTHENTICATION_REJECTED = 3;
  CREDENTIAL_POLICY_REASON_OWNER_REMOVED = 4;
  CREDENTIAL_POLICY_REASON_OVERLAP_EXPIRED = 5;
}

enum SecretVersionState {
  SECRET_VERSION_STATE_UNSPECIFIED = 0;
  SECRET_VERSION_STATE_AVAILABLE = 1;
  SECRET_VERSION_STATE_SOFT_DELETED = 2;
  SECRET_VERSION_STATE_DESTROYED = 3;
}

// Purpose, kind and environment never change. Tool and MCP authentication belong to trusted
// executors, never agents, prompts or arbitrary tool processes. Authentication
// purposes accept API/basic/OAuth access tokens; webhook purposes accept shared
// secrets; refresh and destination purposes accept only their matching kind.
message CredentialPolicy {
  option (buf.validate.message).cel = {
    id: "credential_policy.material_matches_purpose"
    message: "material kind must match immutable purpose"
    expression:
      "(this.purpose in [1, 6, 7] && this.material_kind in [1, 2, 3]) || "
      "(this.purpose in [2, 3] && this.material_kind == 5) || "
      "(this.purpose == 4 && this.material_kind == 4) || "
      "(this.purpose == 5 && this.material_kind == 6)"
  };

  SecretPurpose purpose = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  SecretMaterialKind material_kind = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  string environment = 3 [features.field_presence = LEGACY_REQUIRED];
}

message SecretVersionMetadata {
  SecretVersionRef reference = 1 [features.field_presence = LEGACY_REQUIRED];
  SecretVersionState state = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  google.protobuf.Timestamp observed_at = 3 [features.field_presence = LEGACY_REQUIRED];
}

// The prior version remains eligible only for explicitly admitted webhook
// verification or dual signing. The absolute window is positive and <=24h;
// retries, reconciliation and caches cannot extend it. Ordinary resolution never
// selects a prior version. Compromise ends eligibility without grace.
message PreviousWebhookVersion {
  option (buf.validate.message).cel = {
    id: "previous_webhook_version.bounded_overlap"
    message: "webhook overlap must be positive and at most 24 hours"
    expression: "this.expires_at > this.starts_at && this.expires_at - this.starts_at <= duration('86400s')"
  };

  SecretVersionRef reference = 1 [features.field_presence = LEGACY_REQUIRED];
  google.protobuf.Timestamp expires_at = 2 [features.field_presence = LEGACY_REQUIRED];
  google.protobuf.Timestamp starts_at = 3 [features.field_presence = LEGACY_REQUIRED];
}
