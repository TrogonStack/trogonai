edition = "2024";

package trogonai.secrets.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

enum VaultLifecycle {
  VAULT_LIFECYCLE_UNSPECIFIED = 0;
  VAULT_LIFECYCLE_ACTIVE = 1;
  VAULT_LIFECYCLE_DISABLED = 2;
  VAULT_LIFECYCLE_DESTROY_PENDING = 3;
  VAULT_LIFECYCLE_DESTROYED = 4;
}

// Metadata-only creation performs no OpenBao side effect. Project and
// environment are immutable; public paths derive from the envelope's ids.
message VaultCreated {
  string display_name = 1 [features.field_presence = LEGACY_REQUIRED];
  string environment = 2 [features.field_presence = LEGACY_REQUIRED];
}

// Labels may change; moving an environment requires a replacement vault so
// existing credential policy is never silently retargeted.
message VaultMetadataUpdated {
  string display_name = 1 [features.field_presence = LEGACY_REQUIRED];
}

// ACTIVE <-> DISABLED; either -> DESTROY_PENDING -> DESTROYED. Disabling denies
// new child uses and writes. Destruction is admitted only once every child is
// destroyed or fully compensated and no pending attempt can recreate a child.
message VaultLifecycleChanged {
  VaultLifecycle lifecycle = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// Identity, time and revision have one canonical location, so a lifecycle fact
// cannot name another vault. Creation is revision one; later facts are not.
message VaultEvent {
  option (buf.validate.message).cel = {
    id: "vault_event.creation_revision"
    message: "vault creation must be revision one"
    expression: "has(this.created) == (this.revision == 1u)"
  };

  string vault_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string project_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string event_id = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  uint64 revision = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  google.protobuf.Timestamp occurred_at = 5 [features.field_presence = LEGACY_REQUIRED];
  oneof fact {
    option (buf.validate.oneof).required = true;
    VaultCreated created = 10;
    VaultMetadataUpdated metadata_updated = 11;
    VaultLifecycleChanged lifecycle_changed = 12;
  }
}
