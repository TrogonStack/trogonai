edition = "2024";

package trogonai.secrets.exchange.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/connections/types/v1alpha1/reference.proto";
import "trogonai/secrets/exchange/v1alpha1/failure.proto";
import "trogonai/secrets/exchange/v1alpha1/sealing.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

// Caller: the connections service, at BeginAuthorization (ADR#0094 Decision
// 3, ADR#0095 Decision 5). Custody generates the PKCE verifier, keeps it in a
// capsule that expires with the attempt, and returns only the S256
// challenge. There is no readback verb. The capsule is not a credential
// stream; it is short-lived custody state counted by secrets.capsule.orphaned.
message OpenTransactionCapsuleRequest {
  trogonai.connections.types.v1alpha1.AuthorizationAttemptRef attempt_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  // The attempt's expiry; the capsule expires with it (ADR#0094 Decision 1).
  google.protobuf.Timestamp expires_at = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
}

message OpenTransactionCapsuleResponse {
  oneof result {
    option (buf.validate.oneof).required = true;

    TransactionCapsule capsule = 1;
    ResolveFailure failure = 2;
  }
}

// What the attempt records: the capsule reference and the challenge for the
// authorize URL. The challenge is public by construction.
message TransactionCapsule {
  trogonai.secrets.v1alpha1.SecretRef capsule_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  // BASE64URL(SHA256(verifier)) per RFC 7636, 43 characters.
  string code_challenge = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{43}$"
  ];
  string code_challenge_method = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.const = "S256"
  ];
}

// Caller: the broker only, inside custody, at code exchange (ADR#0094
// Decision 3, ADR#0095 Decision 5). The capsule is destroyed on consumption
// whether or not the exchange succeeds; a second consume, an expired capsule
// and an unknown one all fail DENIED. The attempt must be the one the capsule
// was opened for.
message ConsumeTransactionCapsuleRequest {
  trogonai.secrets.v1alpha1.SecretRef capsule_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.AuthorizationAttemptRef attempt_ref = 2 [features.field_presence = LEGACY_REQUIRED];
  RequesterXkey requester_xkey = 3 [features.field_presence = LEGACY_REQUIRED];
}

message ConsumeTransactionCapsuleResponse {
  oneof result {
    option (buf.validate.oneof).required = true;

    ConsumedCapsule consumed = 1;
    ResolveFailure failure = 2;
  }
}

message ConsumedCapsule {
  // The PKCE verifier, sealed by the secrets service to the broker's
  // ephemeral xkey. It lives in the broker's memory for the token request
  // only.
  bytes xkey_sealed_verifier = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.min_len = 1
  ];
}
