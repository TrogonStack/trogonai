edition = "2024";

package trogonai.secrets.exchange.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "trogonai/connections/types/v1alpha1/identity.proto";
import "trogonai/connections/types/v1alpha1/reference.proto";
import "trogonai/connections/types/v1alpha1/use_result.proto";
import "trogonai/secrets/exchange/v1alpha1/sealing.proto";

// Optional future trusted-adapter issuance, separate from ordinary HTTP proxy
// use. Only a registered adapter whose verified workload identity matches the
// grant audience may call. The service rechecks the tenant, live grant,
// TOKEN_ISSUANCE permit, connection generation, budgets and durable acceptance
// audit before resolve. Person-owned connections are refused. No agent or
// harness is a caller. The reply goes directly to the adapter under the same
// request; there is no separate token-delivery message or stream.
message EnsureProviderAccessRequest {
  trogonai.connections.types.v1alpha1.ConnectionGrantRef grant_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  // Unique under this grant. Acceptance consumes it; a duplicate never issues
  // again, including after a lost response, and returns REQUEST_REPLAYED.
  trogonai.connections.types.v1alpha1.InvocationId invocation_id = 2 [features.field_presence = LEGACY_REQUIRED];
  // Confirmation-key signature over a length-prefixed sequence of UTF-8
  // strings: "connection-token-issuance-v1", grant resource_parent.project_id, grant id,
  // invocation id. Each length is a four-byte unsigned big-endian count.
  // The signer is the trusted supervisor, not caller-provided identity data.
  bytes proof = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.min_len = 1
  ];
}

// Core NATS request/reply only, captured by no stream. The sealing recipient
// is the adapter xkey bound to its verified workload registration, never a key
// selected by request input. valid_until is bounded by grant expiry and local
// cache policy, and does not change the provider's token lifetime. The trusted
// adapter must evict by that time. A refresh token is never returned.
message EnsureProviderAccessResponse {
  oneof result {
    option (buf.validate.oneof).required = true;

    SealedAccess access = 1;
    ProviderAccessFailure failure = 2;
  }
}

message ProviderAccessFailure {
  option (buf.validate.message).cel = {
    id: "provider_access_failure.not_completed"
    message: "a failure cannot report a completed issuance"
    expression: "this.result != 1"
  };
  option (buf.validate.message).cel = {
    id: "provider_access_failure.rate_limit_source"
    message: "limited_by is present exactly for a rate limit"
    expression: "has(this.limited_by) == (this.result == 8)"
  };
  option (buf.validate.message).cel = {
    id: "provider_access_failure.retry_after"
    message: "retry delay is only for rate limiting or temporary unavailability"
    expression: "!has(this.retry_after) || this.result in [8, 11]"
  };

  trogonai.connections.types.v1alpha1.ConnectionUseResult result = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  trogonai.connections.types.v1alpha1.ConnectionRateLimitSource limited_by = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Duration retry_after = 3 [(buf.validate.field).duration.gte = {}];
}
