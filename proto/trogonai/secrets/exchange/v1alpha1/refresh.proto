edition = "2024";

package trogonai.secrets.exchange.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "trogonai/connections/types/v1alpha1/identity.proto";
import "trogonai/secrets/credentials/v1alpha1/bundle.proto";
import "trogonai/secrets/credentials/v1alpha1/refresh.proto";
import "trogonai/secrets/exchange/v1alpha1/failure.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

// Caller: internal to custody only; the refresh scheduler, the recovery
// worker and the resolve path when it needs a refresh (ADR#0095 Decisions 3,
// 5 and 8). Not reachable by any executor, the gateway, the connections
// service or the agent egress proxy. The broker acquires a sealing lease,
// appends CredentialRefreshDispatched (the single-flight authority), calls
// the token endpoint with resource for MCP, CAS-writes the sealed bundle at
// the expected generation plus one, and settles the operation exactly once.
// The reply carries no token.
message RefreshProviderAuthorityRequest {
  option (buf.validate.message).cel = {
    id: "refresh_provider_authority.redispatch"
    message: "redispatch is present exactly for a RECOVERY trigger"
    expression: "(this.trigger == 3) == has(this.redispatch)"
  };

  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  // Stable across retries of one refresh; the stream settles on it.
  trogonai.connections.types.v1alpha1.CredentialOperationId operation_id = 2 [features.field_presence = LEGACY_REQUIRED];
  // The generation the caller observed. A current generation already above it
  // answers Superseded without a provider call.
  uint64 expected_bundle_generation = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  trogonai.secrets.credentials.v1alpha1.RefreshTrigger trigger = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  trogonai.secrets.credentials.v1alpha1.RefreshRedispatch redispatch = 5;
}

message RefreshProviderAuthorityResponse {
  oneof result {
    option (buf.validate.oneof).required = true;

    RefreshCommitted committed = 1;
    RefreshRejected rejected = 2;
    RefreshOutcomeUnknown outcome_unknown = 3;
    RefreshSuperseded superseded = 4;
    // DENIED when the credential is not an Active live token set, THROTTLED
    // when the ProviderApp's concurrency cap or the tenant's share is
    // exhausted, REFRESH_PENDING when another operation is unsettled,
    // KEY_DENIED or UNAVAILABLE when no sealing lease could be acquired.
    // Pre-dispatch only: after dispatch a custody persistence failure returns
    // outcome_unknown and cannot release the old generation through failure.
    ResolveFailure failure = 5;
  }
}

// The operation produced bundle_generation. A repeat with the same
// operation_id after commit answers the same way.
message RefreshCommitted {
  uint64 bundle_generation = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 1
  ];
  trogonai.secrets.credentials.v1alpha1.TokenBundle bundle = 2 [features.field_presence = LEGACY_REQUIRED];
}

// A definite provider rejection or proof that no request left settled the
// operation without a bundle. A post-I/O persistence failure never returns
// this arm: it is outcome_unknown until attributable recovery.
message RefreshRejected {
  option (buf.validate.message).cel = {
    id: "refresh_rejected.retry_after"
    message: "retry_after is carried only for a transient reason"
    expression: "!has(this.retry_after) || this.reason in [2, 3]"
  };

  option (buf.validate.message).cel = {
    id: "refresh_rejected.provider_error"
    message: "a token endpoint error is supplied exactly for PROVIDER_REJECTED"
    expression: "(this.reason == 5) == has(this.provider_error)"
  };

  trogonai.secrets.credentials.v1alpha1.RefreshRejectionReason reason = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      in: [
        1,
        2,
        3,
        4,
        5
      ]
    }
  ];
  trogonai.secrets.credentials.v1alpha1.TokenEndpointError provider_error = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Duration retry_after = 3 [(buf.validate.field).duration.gte = {}];
}

// The request may have left without an attributable response, or its
// replacement could not be durably persisted/attributed after provider I/O.
// The operation stays unsettled for the recovery worker; the caller never
// redispatches on its own (ADR#0095 Decision 3).
message RefreshOutcomeUnknown {
  trogonai.connections.types.v1alpha1.CredentialOperationId operation_id = 1 [features.field_presence = LEGACY_REQUIRED];
}

// The current committed generation is already above the expected one, so no
// provider call was made. The caller resolves the current generation.
message RefreshSuperseded {
  uint64 current_bundle_generation = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 1
  ];
}
