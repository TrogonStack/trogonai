edition = "2024";

package trogonai.secrets.exchange.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/connections/types/v1alpha1/audit_correlation.proto";
import "trogonai/policy/egress_permissions/v1alpha1/permission_policy.proto";
import "trogonai/secrets/exchange/v1alpha1/credential_address.proto";
import "trogonai/secrets/exchange/v1alpha1/failure.proto";
import "trogonai/secrets/exchange/v1alpha1/sealing.proto";

// Where the egress proxy places a released value in the one outbound request
// it is about to send. The release policy names the locations a credential
// may go to and the service compares this one against them, so a value
// configured for a header is never released for a query parameter, where it
// would land in provider access logs.
message ReleaseLocation {
  oneof value {
    option (buf.validate.oneof).required = true;

    // An RFC 9110 field name, compared case-insensitively. It holds only the
    // token characters an audit record name also holds, so the release record
    // names the header whole.
    string header = 1 [(buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9+._~-]*$"
    }];
    // A URL query parameter name, compared exactly.
    string query_parameter = 2 [(buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9._~-]*$"
    }];
    // A dot-separated path into the request body, compared exactly. Every
    // segment is nonempty.
    string body_field = 3 [(buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^([A-Za-z0-9_-]+(\\.[A-Za-z0-9_-]+)*)?$"
    }];
  }
}

// Caller: the egress proxy, asking for one credential value it is about to
// place in one outbound request. Core NATS request/reply only, so the value
// never enters a stream (ADR#0023 Decision 3).
//
// The request carries no tenant and no caller identity, and the service reads
// neither from a field or a header. The tenant is the importing account's
// token at the head of the subject (ADR#0081 Decision 3), and the runtime
// service is the `service.{id}` principal the subject carries (ADR#0082),
// which the service parses before it decodes this payload.
//
// The service releases only the version the credential's current state
// releases, never one the caller names, and only when the credential's
// release policy permits the runtime service, destination_host and location
// together. A credential with no policy releases nothing. The policy matches
// the host alone; the port is recorded in the release audit, and the proxy's
// own egress admission enforces it.
message ResolveForReleaseRequest {
  CredentialAddress credential = 1 [features.field_presence = LEGACY_REQUIRED];
  // The exact destination the proxy will contact with the value.
  trogonai.policy.egress_permissions.v1alpha1.EgressHost destination_host = 2 [features.field_presence = LEGACY_REQUIRED];
  ReleaseLocation location = 3 [features.field_presence = LEGACY_REQUIRED];
  // Recorded on the service's release record and threaded into its store
  // request, the dual audit of ADR#0023 Decision 6, so the proxy's record of
  // the same outbound request joins both.
  trogonai.connections.types.v1alpha1.AuditCorrelationId correlation_id = 4 [features.field_presence = LEGACY_REQUIRED];
  // The key the value is sealed to, with the service as authenticated sender
  // (ADR#0083 Decision 1).
  RequesterXkey requester_xkey = 5 [features.field_presence = LEGACY_REQUIRED];
}

// On success the value is the credential's current version, sealed to the
// requester's xkey. bundle_generation is 0, since these credentials have no
// generation. valid_until is no later than the ADR#0049 cache TTL of 300
// seconds from now; a policy can only shorten it. The value is sealed only
// after the release is durably audited.
//
// Failures use the shared categories, mapped so a caller cannot probe:
//
// - DENIED, identical in every case: an unknown credential, a revoked or
//   otherwise unreleasable one, an owner the tenant does not hold, an unknown
//   tenant, a missing release policy, a policy that refuses, and a principal
//   that is not a runtime service.
// - KEY_DENIED: the requester xkey matches the pattern but does not decode as
//   a curve key.
// - UNAVAILABLE: the store, its login, the credential stream or the audit
//   store is unreachable or refusing, or the service's own deadline passed.
//   Never collapsed into DENIED, so a caller backs off rather than giving up.
// - INTEGRITY_FAILURE: the store lacks the version the credential's state
//   names.
// - THROTTLED, with retry_after: admission is saturated.
// - INTERNAL: sealing failed.
//
// The precise reason goes only to the audit record and the service's logs. A
// payload that does not decode or validate is answered on the ADR#0016 error
// channel with INVALID_ARGUMENT, never with a typed failure.
message ResolveForReleaseResponse {
  // These credentials have no refresh family and no reconnect flow.
  option (buf.validate.message).cel = {
    id: "resolve_for_release_response.no_refresh_categories"
    message: "a release never asks for a reconnect or reports a pending refresh"
    expression: "!has(this.failure) || !(this.failure.category in [5, 6])"
  };

  oneof result {
    option (buf.validate.oneof).required = true;

    SealedAccess access = 1;
    ResolveFailure failure = 2;
  }
}
