edition = "2024";

package trogonai.secrets.exchange.v1alpha1;

import "trogon/nats/micro/v1alpha1/options.proto";
import "trogonai/secrets/exchange/v1alpha1/release.proto";

// The secrets service, the only OpenBao client (ADR#0023 Decision 3). In
// PLATFORM it registers under the subject prefix
// `{tenant}.secrets.v1.service.{id}`, so ResolveForRelease is
// `{tenant}.secrets.v1.service.{id}.SecretExchangeService.ResolveForRelease`
// (ADR#0016 Decision 2). A caller in a tenant account omits `{tenant}` and its
// import inserts it (ADR#0081 Decision 3).
//
// `service.{id}` is the caller's subject principal (ADR#0082). The service
// subscribes with the literal kind `service`, so an agent or person principal
// matches no subscription, and it parses the id before decoding the payload.
service SecretExchangeService {
  option (trogon.nats.micro.v1alpha1.service) = {
    version: "0.1.0"
    description: "Releases one credential value, sealed to the egress proxy"
    content_type: CONTENT_TYPE_PROTOBUF
  };

  rpc ResolveForRelease(ResolveForReleaseRequest) returns (ResolveForReleaseResponse);
}
