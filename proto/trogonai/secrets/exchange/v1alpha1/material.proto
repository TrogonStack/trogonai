edition = "2024";

package trogonai.secrets.exchange.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "trogonai/connections/types/v1alpha1/resource_parent.proto";
import "trogonai/secrets/credentials/v1alpha1/kind.proto";
import "trogonai/secrets/credentials/v1alpha1/lifecycle.proto";
import "trogonai/secrets/exchange/v1alpha1/failure.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

// Caller: the control-plane management path only (ADR#0095 Decision 5).
// Custody writes the value to OpenBao first and tells the credential stream
// after (EstablishCredential for a new SecretRef, RotateCredentialMaterial
// for an existing one), so the stream records what custody holds (ADR#0095
// Decision 1). A token set is never submitted: it is established by exchange
// and promotion. A registration secret or private key names its ProviderApp
// as subject (ADR#0095 Decision 2).
message SubmitMaterialRequest {
  option (buf.validate.message).cel = {
    id: "submit_material.parent_matches_subject"
    message: "credential custody must match its connection or provider app parent"
    expression: "has(this.subject.connection_ref) ? (has(this.resource_parent.project) && this.resource_parent.project == this.subject.connection_ref.resource_parent) : (has(this.subject.provider_app) && ((has(this.resource_parent.platform) && has(this.subject.provider_app.resource_parent.platform)) || (has(this.resource_parent.project) && has(this.subject.provider_app.resource_parent.project) && this.resource_parent.project == this.subject.provider_app.resource_parent.project)))"
  };
  option (buf.validate.message).cel = {
    id: "submit_material.not_token_set"
    message: "a token set is established by staging and promotion, never submitted"
    expression: "this.kind != 13"
  };
  option (buf.validate.message).cel = {
    id: "submit_material.not_attempt_scoped"
    message: "only a staged bundle belongs to an authorization attempt"
    expression: "!has(this.subject.authorization_attempt)"
  };

  // Absent creates a new SecretRef; present rotates that one, whose kind and
  // subject must equal the ones given.
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1;
  trogonai.secrets.credentials.v1alpha1.CredentialKind kind = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  trogonai.secrets.credentials.v1alpha1.CredentialSubject subject = 3 [features.field_presence = LEGACY_REQUIRED];
  // The material, sealed by the control plane to the secrets service's public
  // xkey. It is unsealed in memory for the OpenBao write only.
  bytes xkey_sealed_material = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.min_len = 1
  ];
  // The authorized management collection. On rotation it must equal the
  // stored credential parent; the opaque handle never overrides this check.
  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 5 [features.field_presence = LEGACY_REQUIRED];
}

message SubmitMaterialResponse {
  oneof result {
    option (buf.validate.oneof).required = true;

    // The version written: 1 for a new SecretRef.
    trogonai.secrets.v1alpha1.SecretVersionRef written = 1;
    ResolveFailure failure = 2;
  }
}

// Caller: the control-plane management path only (ADR#0095 Decision 5).
// Destroys, never deletes, the named versions and records
// DestroyCredentialMaterial on the stream. Refused with DENIED while the
// credential's state does not admit it: a revoked live token set before its
// provider revoke settled, or an Active credential for ALL_VERSIONS. A destroy
// that fails in OpenBao answers UNAVAILABLE and custody records
// MATERIAL_UNDESTROYED debt for the lifecycle worker; the caller does not
// retry on its own.
message DestroyRequest {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.secrets.credentials.v1alpha1.MaterialDestroyScope scope = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // Must match the existing credential's immutable custody container and the
  // authenticated management route before any storage operation.
  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

message DestroyResponse {
  oneof result {
    option (buf.validate.oneof).required = true;

    google.protobuf.Empty destroyed = 1;
    ResolveFailure failure = 2;
  }
}
