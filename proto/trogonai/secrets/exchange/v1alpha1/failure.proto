edition = "2024";

package trogonai.secrets.exchange.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

// The closed set of resolve failure categories of ADR#0095 Decision 11, with
// the retry semantics of ADR#0030 Decision 6: unavailability never collapses
// into denial, and an unknown ref and an unauthorized one look alike. Every
// secrets.exchange verb fails with one of these; no failure carries an
// OpenBao path, a status code or a provider body. Unspecified and unknown
// values are invalid.
enum ResolveFailureCategory {
  RESOLVE_FAILURE_CATEGORY_UNSPECIFIED = 0;
  // The caller or grant is not permitted, the ref is unknown, or the
  // credential is revoked. No retry.
  RESOLVE_FAILURE_CATEGORY_DENIED = 1;
  // The tenant's key refuses (disabled or revoked, reversible). No retry; the
  // tenant acts (ADR#0095 Decision 4).
  RESOLVE_FAILURE_CATEGORY_KEY_DENIED = 2;
  // OpenBao, the key backend or the provider is unreachable. Bounded backoff.
  RESOLVE_FAILURE_CATEGORY_UNAVAILABLE = 3;
  // A budget or rate is exhausted, the anomaly throttle included. Retry after
  // retry_after.
  RESOLVE_FAILURE_CATEGORY_THROTTLED = 4;
  // Unusable until the user reconnects, a destroyed tenant key included. No
  // retry.
  RESOLVE_FAILURE_CATEGORY_RECONNECT_REQUIRED = 5;
  // An unsettled refresh holds the family. Bounded retry after retry_after;
  // the executor maps it to PROVIDER_UNAVAILABLE with the same delay.
  RESOLVE_FAILURE_CATEGORY_REFRESH_PENDING = 6;
  // The sealed open failed, or the generation or associated data does not
  // match the stream. Fail closed; no retry; pages.
  RESOLVE_FAILURE_CATEGORY_INTEGRITY_FAILURE = 7;
  // Unmapped. No retry.
  RESOLVE_FAILURE_CATEGORY_INTERNAL = 8;
}

// One typed failure reply. retry_after is carried only for THROTTLED and
// REFRESH_PENDING, which state a delay; UNAVAILABLE leaves the backoff to the
// caller.
message ResolveFailure {
  option (buf.validate.message).cel = {
    id: "resolve_failure.retry_after"
    message: "retry_after is carried only for THROTTLED and REFRESH_PENDING"
    expression: "!has(this.retry_after) || this.category in [4, 6]"
  };

  ResolveFailureCategory category = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  google.protobuf.Duration retry_after = 2 [(buf.validate.field).duration.gte = {}];
}
