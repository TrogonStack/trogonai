edition = "2024";

package trogonai.secrets.exchange.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "trogon/hierarchy/v1alpha1/node.proto";
import "trogonai/platform/key_custody/v1alpha1/identity.proto";

// Explicit initial 32-byte DEK/share input profile (ADR#0030, ADR#0083).
// The data owner separately selects its payload cipher; this profile adds no
// provider, signing capability or arbitrary payload-encryption operation.
enum KeyWrappingMaterialSuite {
  KEY_WRAPPING_MATERIAL_SUITE_UNSPECIFIED = 0;
  KEY_WRAPPING_MATERIAL_SUITE_DEK32_V1 = 1;
}

// EPHEMERAL INNER PLAINTEXT ONLY, before authenticated xkey sealing or after
// opening inside the authorized caller/service. Never a NATS payload, event,
// cache, log, trace or durable value. Runtime owns and zeroizes every usable
// copy on all exit paths; protobuf validation does not establish erasure.
message Dek {
  KeyWrappingMaterialSuite suite = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  bytes value = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.len = 32
  ];
}

// Complete platform-owned versioned value; only the selected adapter decodes
// its opaque payload. No provider marker, native key/version or locator crosses
// this boundary (ADR#0030). The data owner persists it atomically with KeyRef,
// binding version and payload ciphertext. Existing sealing-port conversion and
// codec compatibility still require implementation proof.
message WrappedDek {
  KeyWrappingMaterialSuite suite = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  uint32 format_version = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint32.const = 1
  ];
  bytes adapter_payload = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes = {
      min_len: 1
      max_len: 65536
    }
  ];
}

message KeyWrappingResourceTypeId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];
}

message KeyWrappingResourceId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];
}

// Both opaque identities come from the authenticated data owner, never an
// envelope. The type distinguishes unrelated resources with equal local ids.
message KeyWrappingResourceRef {
  KeyWrappingResourceTypeId resource_type_id = 1 [features.field_presence = LEGACY_REQUIRED];
  KeyWrappingResourceId resource_id = 2 [features.field_presence = LEGACY_REQUIRED];
}

// Non-secret authoritative context only (ADR#0030). Version 1 encodes:
// lp("trogon/key-wrapping/binding/v1") || u32_be(1) ||
// lp(tenant_id.value) || lp(resource_ref.resource_type_id.value) ||
// lp(resource_ref.resource_id.value) || lp(purpose.value).
// lp(x) = u32_be(length of exact UTF-8 bytes) || those bytes. No normalization,
// maps, delimiter joining or protobuf re-encoding defines the preimage.
// Tenant/purpose identifiers are at most 256 characters in this profile; no
// names, emails, payload values or per-attempt data are admissible binding ids.
// The service independently derives and compares every field before provider
// dispatch. Fields arriving from a caller are not authority or verified AAD.
message AuthenticatedBinding {
  option (buf.validate.message).cel = {
    id: "authenticated_binding.bounds"
    message: "binding tenant and purpose identifiers are bounded to 256 characters"
    expression: "this.tenant_id.value.size() <= 256 && this.purpose.value.size() <= 256"
  };
  uint32 schema_version = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint32.const = 1
  ];
  trogon.hierarchy.v1alpha1.NodeId tenant_id = 2 [features.field_presence = LEGACY_REQUIRED];
  KeyWrappingResourceRef resource_ref = 3 [features.field_presence = LEGACY_REQUIRED];
  trogonai.platform.key_custody.v1alpha1.KeyPurpose purpose = 4 [features.field_presence = LEGACY_REQUIRED];
}

// Exact keys are untrusted opaque selections admitted only to an authorized
// encryption caller, including an explicit rewrap migration target (ADR#0030).
// The service proves tenant/purpose, registration/admission, key state and
// capability before any dispatch. It never substitutes a default or another
// key after exact-key denial. The default arm resolves only from authenticated
// tenant/purpose policy and pins the chosen key for the original operation.
message KeyWrappingTarget {
  oneof selection {
    option (buf.validate.oneof).required = true;
    trogonai.platform.key_custody.v1alpha1.KeyRef exact_key_ref = 1;
    google.protobuf.Empty tenant_default = 2;
  }
}
