edition = "2024";

package trogonai.secrets.exchange.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "trogon/hierarchy/v1alpha1/node.proto";
import "trogonai/platform/key_custody/audit/v1alpha1/audit_record.proto";
import "trogonai/platform/key_custody/v1alpha1/failure.proto";
import "trogonai/platform/key_custody/v1alpha1/identity.proto";
import "trogonai/secrets/exchange/v1alpha1/key_wrapping_wire.proto";

// Transport publication is not caller receipt, possession or later permitted
// use. Unspecified/unknown outcomes cannot be interpreted as successful release.
enum KeyWrappingReplyOutcome {
  KEY_WRAPPING_REPLY_OUTCOME_UNSPECIFIED = 0;
  KEY_WRAPPING_REPLY_OUTCOME_PUBLISHED = 1;
  KEY_WRAPPING_REPLY_OUTCOME_WITHHELD = 2;
  KEY_WRAPPING_REPLY_OUTCOME_UNKNOWN = 3;
}

// Output release is distinct from provider execution. A known successful
// provider operation is not made uncertain merely because publication is.
enum KeyWrappingWithholdingReason {
  KEY_WRAPPING_WITHHOLDING_REASON_UNSPECIFIED = 0;
  KEY_WRAPPING_WITHHOLDING_REASON_KEY_OPERATION_FAILED = 1;
  KEY_WRAPPING_WITHHOLDING_REASON_AUTHORITY_NO_LONGER_CURRENT = 2;
  KEY_WRAPPING_WITHHOLDING_REASON_ORIGINAL_DEADLINE_EXCEEDED = 3;
  KEY_WRAPPING_WITHHOLDING_REASON_SEALED_CONTEXT_INVALID = 4;
  KEY_WRAPPING_WITHHOLDING_REASON_REPLY_PUBLICATION_UNCERTAIN = 5;
  KEY_WRAPPING_WITHHOLDING_REASON_INTERNAL = 6;
}

// Safe sensitive-result release metadata, separate from KeyOperationAuditRecord
// (ADR#0030). It does not describe delivery of a metadata-only failure reply.
// The existing audit retains every actual provider attempt and its real crypto
// outcome. A successful provider operation can still have its output withheld
// after authority changes; this record never rewrites that success as failure.
// Tenant/operation/correlation are resolved and cross-checked against that audit
// and the original request. No DEK, WrappedDek, box, provider response or raw
// authenticated binding occurs. None of these fields authenticates its sender.
message KeyWrappingReplyEvidence {
  option (buf.validate.message).cel = {
    id: "key_wrapping_reply_evidence.reason"
    message: "published sensitive results carry no withholding reason or operation failure"
    expression: "this.outcome == 1 ? (!has(this.withholding_reason) && !has(this.operation_failure) && this.provider_effect == 2) : has(this.withholding_reason)"
  };
  option (buf.validate.message).cel = {
    id: "key_wrapping_reply_evidence.unknown"
    message: "uncertain publication preserves independently known or possible provider completion"
    expression: "this.outcome == 3 ? (this.withholding_reason == 5 && this.provider_effect in [2, 3] && !has(this.operation_failure)) : (!has(this.withholding_reason) || this.withholding_reason != 5)"
  };
  option (buf.validate.message).cel = {
    id: "key_wrapping_reply_evidence.operation_failure"
    message: "only an actual failed key operation carries operation failure metadata"
    expression: "has(this.operation_failure) == (has(this.withholding_reason) && this.withholding_reason == 1)"
  };
  trogon.hierarchy.v1alpha1.NodeId tenant_id = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.platform.key_custody.v1alpha1.OperationId operation_id = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.platform.key_custody.audit.v1alpha1.CorrelationId correlation_id = 3 [features.field_presence = LEGACY_REQUIRED];
  KeyWrappingReplyOutcome outcome = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  KeyWrappingEffect provider_effect = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  KeyWrappingWithholdingReason withholding_reason = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  trogonai.platform.key_custody.v1alpha1.OperationFailure operation_failure = 7;
  google.protobuf.Timestamp observed_at = 8 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
}
