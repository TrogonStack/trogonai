edition = "2024";

package trogonai.secrets.exchange.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// The requester's ephemeral NATS xkey public key, which the secrets service
// seals a reply value to, authenticated as sender (ADR#0083 Decision 1). The
// requester authenticates the service's public xkey from boot material
// (ADR#0033 Decision 5). ADR#0083 does not say whether the key travels in a
// header or the payload; it is in the payload so the contract is complete on
// its own. It is public, never a seed.
message RequesterXkey {
  // A NATS curve public key: the X prefix and 55 base32 characters.
  string public_key = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.pattern = "^X[A-Z2-7]{55}$"
  ];
}

// A resolved value, sealed by the secrets service to the requester's xkey
// (ADR#0095 Decision 5). For an OAUTH_TOKEN_SET it is the access token only;
// the refresh token never leaves the secrets service. For every other kind it
// is the current version's value. The holder keeps it in memory only, no
// longer than valid_until, evicted by revocation fan-out and generation
// advance (ADR#0095 Decision 7).
message SealedAccess {
  // Sealed by the secrets service to the requester's ephemeral xkey.
  bytes xkey_sealed_value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.min_len = 1
  ];
  // The committed generation the value came from. A 401 on it is reported
  // with min_bundle_generation set to this plus one. Zero for a kind that has
  // no generation.
  uint64 bundle_generation = 2 [features.field_presence = LEGACY_REQUIRED];
  // Always finite: the earlier of a known reported/documented access expiry
  // less skew and the ADR#0049 bound from now. With unknown or documented
  // non-expiring access, use the local bound alone; never invent provider
  // expiry. Local expiry evicts the cache, not the provider grant.
  google.protobuf.Timestamp valid_until = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
}
