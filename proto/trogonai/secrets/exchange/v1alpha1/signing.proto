edition = "2024";

package trogonai.secrets.exchange.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/connections/types/v1alpha1/reference.proto";
import "trogonai/secrets/exchange/v1alpha1/failure.proto";
import "trogonai/secrets/exchange/v1alpha1/sealing.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

// The JWS algorithms a client assertion may use. ADR#0094 names
// private_key_jwt without an algorithm set; these are the asymmetric JWS
// algorithms of RFC 7518 and RFC 8037, so an HMAC can never be chosen for a
// private key. Unspecified and unknown values are invalid.
enum JwtSigningAlgorithm {
  JWT_SIGNING_ALGORITHM_UNSPECIFIED = 0;
  JWT_SIGNING_ALGORITHM_RS256 = 1;
  JWT_SIGNING_ALGORITHM_PS256 = 2;
  JWT_SIGNING_ALGORITHM_ES256 = 3;
  JWT_SIGNING_ALGORITHM_EDDSA = 4;
}

// The claims of an RFC 7523 client assertion. The broker supplies them; the
// service adds jti, iat and exp from lifetime and signs. The subject equals
// the issuer: both are the client id.
message ClientAssertionClaims {
  option (buf.validate.message).cel = {
    id: "client_assertion_claims.subject_is_issuer"
    message: "a client assertion's subject equals its issuer"
    expression: "this.subject == this.issuer"
  };

  string issuer = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string subject = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  // The authorization server's issuer or token endpoint, as the pinned
  // metadata states.
  string audience = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.uri = true
  ];
  google.protobuf.Duration lifetime = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).duration = {
      gt: {}
      lte: {seconds: 600}
    }
  ];
}

// Caller: the broker only (ADR#0095 Decision 5, R1). The executor never
// signs; app private keys are broker material. The key must be the
// PRIVATE_KEY credential bound to the named ProviderApp, else DENIED.
message SignJwtRequest {
  trogonai.connections.types.v1alpha1.ProviderAppRef provider_app = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.secrets.v1alpha1.SecretRef private_key_ref = 2 [features.field_presence = LEGACY_REQUIRED];
  ClientAssertionClaims claims = 3 [features.field_presence = LEGACY_REQUIRED];
  JwtSigningAlgorithm algorithm = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  RequesterXkey requester_xkey = 5 [features.field_presence = LEGACY_REQUIRED];
}

message SignJwtResponse {
  oneof result {
    option (buf.validate.oneof).required = true;

    SignedAssertion assertion = 1;
    ResolveFailure failure = 2;
  }
}

message SignedAssertion {
  // The compact JWS, sealed by the secrets service to the broker's ephemeral
  // xkey. It is a bearer credential at the token endpoint for its lifetime.
  bytes xkey_sealed_assertion = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.min_len = 1
  ];
  google.protobuf.Timestamp expires_at = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
}

// The keyed-hash algorithms the operation verbs support. Unspecified and
// unknown values are invalid.
enum MacAlgorithm {
  MAC_ALGORITHM_UNSPECIFIED = 0;
  MAC_ALGORITHM_HMAC_SHA256 = 1;
  MAC_ALGORITHM_HMAC_SHA1 = 2;
  MAC_ALGORITHM_HMAC_SHA512 = 3;
}

// Caller: the gateway and the trusted executor, the operation verb of
// ADR#0074 Q1 (ADR#0095 Decision 5). The signing secret never leaves the
// secrets service; the caller supplies the exact signing input its source
// defines and receives the tag it puts on the wire. The secret must be a
// SIGNING_SECRET, SIGNING_TOKEN, WEBHOOK_SECRET or CONSUMER_SECRET the caller
// is permitted to use, else DENIED.
message ComputeMacRequest {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  MacAlgorithm algorithm = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  bytes signing_input = 3 [features.field_presence = LEGACY_REQUIRED];
}

message ComputeMacResponse {
  oneof result {
    option (buf.validate.oneof).required = true;

    ComputedMac mac = 1;
    ResolveFailure failure = 2;
  }
}

// The tag over the caller's signing input. It is a proof the caller sends to
// the provider, not material, so it is not sealed.
message ComputedMac {
  bytes tag = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.min_len = 1
  ];
}

// Caller: the gateway and the trusted executor, the operation verb of
// ADR#0074 Q1 (ADR#0095 Decision 5). The service recomputes the tag over the
// signing input and compares it in constant time; the caller builds the
// signing input per its source, timestamp tolerance included, and learns a
// verdict only. The secret never leaves the secrets service.
message VerifyProviderRequestRequest {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  MacAlgorithm algorithm = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  bytes signing_input = 3 [features.field_presence = LEGACY_REQUIRED];
  // The raw tag the provider presented, decoded by the caller.
  bytes presented_signature = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.min_len = 1
  ];
}

message VerifyProviderRequestResponse {
  oneof result {
    option (buf.validate.oneof).required = true;

    SignatureVerdict verdict = 1;
    ResolveFailure failure = 2;
  }
}

// Unspecified and unknown values are invalid.
enum SignatureVerdict {
  SIGNATURE_VERDICT_UNSPECIFIED = 0;
  SIGNATURE_VERDICT_VERIFIED = 1;
  SIGNATURE_VERDICT_MISMATCH = 2;
}
