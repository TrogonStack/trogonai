edition = "2024";

package trogonai.secrets.exchange.v1alpha1;

import "buf/validate/validate.proto";

// One credential aggregate, named by its owner and its id the way the
// aggregate keys its own stream. A credential id is unique only within its
// owner, so neither field addresses a credential alone.
//
// The owner is an address, never an authority. The secrets service checks it
// against the tenant it reads from the importing account's token (ADR#0081
// Decision 3) and answers DENIED when that tenant does not own it, exactly as
// it answers an unknown credential, so a caller learns nothing by naming
// another tenant's owner.
message CredentialAddress {
  // The canonical lowercase hyphenated UUID text the aggregate records. Any
  // other spelling of the same UUID is a different string and is refused, so
  // two spellings can never name one credential in a cache or a policy entry.
  string credential_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
  ];
  // A project id or a platform owner such as `static-config`. Never a path
  // segment that walks the store's hierarchy.
  string owner_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9._:-]*$"
      not_in: [
        ".",
        ".."
      ]
    }
  ];
}
