edition = "2024";

package trogonai.secrets.exchange.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/connections/types/v1alpha1/audit_correlation.proto";
import "trogonai/connections/types/v1alpha1/identity.proto";
import "trogonai/connections/types/v1alpha1/proxy.proto";
import "trogonai/connections/types/v1alpha1/reference.proto";
import "trogonai/secrets/exchange/v1alpha1/failure.proto";
import "trogonai/secrets/exchange/v1alpha1/sealing.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

// Caller: the authenticated connection HTTP proxy, trusted MCP caller or
// identity-probe worker only (ADR#0095 Decision 5). The account/tenant and
// principal come from the verified bus identity, never from caller fields.
// Core NATS request/reply only; no stream captures these messages.
//
// Under binding_ref, custody reads the Activated HTTP_PROXY grant and the
// exact immutable ProxyBinding, verifies the caller class/audience, Session
// attempt, connection generation, tenant, live permit/owner/project/release/app
// standing and audit acceptance, and selects the SecretRef itself from the
// connection's binding for credential_role. A caller cannot substitute a
// SecretRef, upstream host or role. Missing/anonymous role is DENIED, since
// anonymous forwarding needs no material. A stale or unavailable authorization
// read fails closed. The reply xkey must belong to the authenticated trusted
// caller; an arbitrary egress identity has no resolve permission.
//
// An MCP grant is checked analogously in mode MCP_SESSION with its pinned
// canonical resource and credential role. Attempt-scoped staged access is
// admitted only to the probe worker, while the attempt is open/unexpired and
// the stage matches it. No agent, supervisor or harness resolves credentials.
//
// force_refresh serves a provider 401: the executor resolves once with the
// flag and min_bundle_generation set to the rejected generation plus one.
// Custody refreshes only if the current generation is lower and otherwise
// returns the current bundle, so concurrent rejections of one generation
// cause one refresh. An invalid_grant on that refresh makes the credential
// Unusable and the reply RECONNECT_REQUIRED.
message ResolveForTrustedUseRequest {
  reserved 1, 2;
  reserved secret_ref, grant_ref;
  option (buf.validate.message).cel = {
    id: "resolve_for_trusted_use.force_refresh_generation"
    message: "force_refresh names the generation it rejects"
    expression: "!this.force_refresh || this.min_bundle_generation > 0u"
  };
  option (buf.validate.message).cel = {
    id: "resolve_for_trusted_use.staged_never_refreshed"
    message: "a staged resolve never refreshes and names no generation"
    expression: "!has(this.attempt_ref) || (!this.force_refresh && this.min_bundle_generation == 0u)"
  };

  oneof authorization {
    option (buf.validate.oneof).required = true;

    // A live grant and its exact immutable HTTP proxy binding.
    trogonai.connections.types.v1alpha1.ProxyBindingRef binding_ref = 8;
    // Protocol-aware trusted MCP use, never ordinary HTTP forwarding.
    McpGrantRef mcp_grant_ref = 9;
    // The staged resolve for the identity probe (ADR#0095 Decision 12).
    AttemptRef attempt_ref = 4;
  }
  // The lowest committed generation the caller accepts; zero accepts the
  // current one.
  uint64 min_bundle_generation = 3 [features.field_presence = LEGACY_REQUIRED];
  bool force_refresh = 5 [features.field_presence = LEGACY_REQUIRED];
  // From the use audit acceptance fact, so both records join (ADR#0096
  // Decision 9). Required under a grant; under an attempt the probe's
  // acceptance fact supplies it the same way.
  trogonai.connections.types.v1alpha1.AuditCorrelationId correlation_id = 6 [features.field_presence = LEGACY_REQUIRED];
  RequesterXkey requester_xkey = 7 [features.field_presence = LEGACY_REQUIRED];
}

// The open attempt and the exact stage it owns. Custody derives the stage
// SecretRef from this receipt and verifies attempt ownership before reading it.
// Honoured only for the trusted probe worker while the attempt is open and
// unexpired (ADR#0095 Decisions 5 and 12).
message AttemptRef {
  trogonai.connections.types.v1alpha1.AuthorizationAttemptRef attempt = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.secrets.v1alpha1.SecretVersionRef staged_bundle_ref = 2 [features.field_presence = LEGACY_REQUIRED];
}

// Protocol-specific authorization for one role of a live MCP_SESSION grant.
// Custody checks the role against the connection's pinned authentication and
// resource before resolving; app registration material is never an access role.
message McpGrantRef {
  trogonai.connections.types.v1alpha1.ConnectionGrantRef grant_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.CredentialRoleName credential_role = 2 [features.field_presence = LEGACY_REQUIRED];
}

message ResolveForTrustedUseResponse {
  oneof result {
    option (buf.validate.oneof).required = true;

    SealedAccess access = 1;
    ResolveFailure failure = 2;
  }
}
