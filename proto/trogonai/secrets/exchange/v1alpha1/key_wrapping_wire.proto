edition = "2024";

package trogonai.secrets.exchange.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/platform/key_custody/audit/v1alpha1/audit_record.proto";
import "trogonai/platform/key_custody/v1alpha1/failure.proto";
import "trogonai/platform/key_custody/v1alpha1/identity.proto";
import "trogonai/platform/key_custody/v1alpha1/operation.proto";
import "trogonai/secrets/exchange/v1alpha1/key_wrapping.proto";
import "trogonai/secrets/exchange/v1alpha1/sealing.proto";

// Captured once for the original operation. Caller and tenant permissions come
// from verified bus identity and authoritative state. Both outer and sealed
// inner contexts must match exactly, including operation kind, ids, binding,
// xkeys and deadline. Every retry retains them and repeats live admission.
// Check authority/deadline before dispatch, after asynchronous waits and before
// releasing output. A revoked/expired result is zeroized and withheld. Caller
// monotonic time starts at the original send and never resets on a reply.
// The service xkey is authenticated bootstrap material; a supplied public key
// is not proof that it belongs to an authenticated requester (ADR#0083).
message KeyWrappingContext {
  option (buf.validate.message).cel = {
    id: "key_wrapping_context.deadline"
    message: "key wrapping deadline must be after the original operation start"
    expression: "this.deadline > this.started_at"
  };
  trogonai.platform.key_custody.v1alpha1.OperationId operation_id = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.platform.key_custody.audit.v1alpha1.CorrelationId correlation_id = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.platform.key_custody.v1alpha1.KeyOperationKind operation = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      in: [
        1,
        2
      ]
    }
  ];
  AuthenticatedBinding binding = 4 [features.field_presence = LEGACY_REQUIRED];
  RequesterXkey requester_xkey = 5 [features.field_presence = LEGACY_REQUIRED];
  RequesterXkey service_xkey = 6 [features.field_presence = LEGACY_REQUIRED];
  google.protobuf.Timestamp started_at = 7 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
  google.protobuf.Timestamp deadline = 8 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
}

// A lost response/cancellation never asserts that a dispatched request did not
// happen. Unknown outcomes are reconciled under the original operation, never
// retried with a new key/provider or an extended deadline (ADR#0030).
enum KeyWrappingEffect {
  KEY_WRAPPING_EFFECT_UNSPECIFIED = 0;
  KEY_WRAPPING_EFFECT_NOT_DISPATCHED = 1;
  KEY_WRAPPING_EFFECT_PROVIDER_COMPLETED = 2;
  KEY_WRAPPING_EFFECT_MAY_HAVE_COMPLETED = 3;
}

message KeyWrappingFailure {
  // Effect aggregates every provider attempt, independently of the final
  // category. An earlier timeout may remain uncertain even if a later live
  // admission check denies use; that denial cannot erase possible effects.
  trogonai.platform.key_custody.v1alpha1.OperationFailure failure = 1 [features.field_presence = LEGACY_REQUIRED];
  KeyWrappingEffect effect = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// Core NATS request/reply only, addressed to the authorized secrets service.
// xkey_sealed_input contains WrapDekInput sealed to the captured service xkey
// by the authenticated requester. Unknown fields and context mismatches refuse
// before provider access. No JetStream, durable command or payload logging.
message WrapDekRequest {
  option (buf.validate.message).cel = {
    id: "wrap_dek_request.operation"
    message: "wrap requests require the wrap operation kind"
    expression: "this.context.operation == 1"
  };
  KeyWrappingContext context = 1 [features.field_presence = LEGACY_REQUIRED];
  bytes xkey_sealed_input = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes = {
      min_len: 1
      max_len: 131072
    }
  ];
}

// EPHEMERAL INNER PLAINTEXT ONLY. It is never the direct wire request, event or
// application state. The context and target are authorized before reading/use
// of the DEK; borrowed decode buffers and all usable copies are zeroized.
message WrapDekInput {
  option (buf.validate.message).cel = {
    id: "wrap_dek_input.operation"
    message: "wrap inputs require the wrap operation kind"
    expression: "this.context.operation == 1"
  };
  KeyWrappingContext context = 1 [features.field_presence = LEGACY_REQUIRED];
  KeyWrappingTarget target = 2 [features.field_presence = LEGACY_REQUIRED];
  Dek dek = 3 [features.field_presence = LEGACY_REQUIRED];
}

message WrapDekResponse {
  option (buf.validate.message).cel = {
    id: "wrap_dek_response.operation"
    message: "wrap replies require the wrap operation kind"
    expression: "this.context.operation == 1"
  };
  KeyWrappingContext context = 1 [features.field_presence = LEGACY_REQUIRED];
  oneof result {
    option (buf.validate.oneof).required = true;
    // Authenticated service-sender xkey box containing WrapDekOutput. The
    // requester validates its entire captured context and actual selected key.
    bytes xkey_sealed_output = 2 [(buf.validate.field).bytes = {
      min_len: 1
      max_len: 131072
    }];
    KeyWrappingFailure failure = 3;
  }
}

// Complete immutable pair for the data owner's atomic persistence/CAS. A
// migration uses a fresh authorized KeyRef and retains its original operation
// id; compromise requires new DEKs and payload re-encryption, not only rewrap.
message WrapDekOutput {
  option (buf.validate.message).cel = {
    id: "wrap_dek_output.operation"
    message: "wrapped output requires the wrap operation kind"
    expression: "this.context.operation == 1"
  };
  KeyWrappingContext context = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.platform.key_custody.v1alpha1.KeyRef key_ref = 2 [features.field_presence = LEGACY_REQUIRED];
  WrappedDek wrapped_dek = 3 [features.field_presence = LEGACY_REQUIRED];
}

message UnwrapDekRequest {
  option (buf.validate.message).cel = {
    id: "unwrap_dek_request.operation"
    message: "unwrap requests require the unwrap operation kind"
    expression: "this.context.operation == 2"
  };
  KeyWrappingContext context = 1 [features.field_presence = LEGACY_REQUIRED];
  // UnwrapDekInput xkey-sealed to the captured authenticated service key.
  bytes xkey_sealed_input = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes = {
      min_len: 1
      max_len: 131072
    }
  ];
}

// EPHEMERAL INNER PLAINTEXT ONLY. Stored KeyRef/ciphertext are untrusted input;
// tenant/resource/purpose come from authoritative context, not this envelope.
// Every unwrap participates in its one bound backend, with no cached raw DEK.
message UnwrapDekInput {
  option (buf.validate.message).cel = {
    id: "unwrap_dek_input.operation"
    message: "unwrap inputs require the unwrap operation kind"
    expression: "this.context.operation == 2"
  };
  KeyWrappingContext context = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.platform.key_custody.v1alpha1.KeyRef key_ref = 2 [features.field_presence = LEGACY_REQUIRED];
  WrappedDek wrapped_dek = 3 [features.field_presence = LEGACY_REQUIRED];
}

message UnwrapDekResponse {
  option (buf.validate.message).cel = {
    id: "unwrap_dek_response.operation"
    message: "unwrap replies require the unwrap operation kind"
    expression: "this.context.operation == 2"
  };
  KeyWrappingContext context = 1 [features.field_presence = LEGACY_REQUIRED];
  oneof result {
    option (buf.validate.oneof).required = true;
    // UnwrapDekOutput sealed to the captured requester, with authenticated
    // service sender. Consumer validates context and finite original deadline.
    bytes xkey_sealed_output = 2 [(buf.validate.field).bytes = {
      min_len: 1
      max_len: 131072
    }];
    KeyWrappingFailure failure = 3;
  }
}

// EPHEMERAL INNER PLAINTEXT ONLY, delivered under the captured finite deadline.
// No reusable data-key cache is authorized by this wire. ADR#0083 sealing leases
// remain their own separately scoped operation and sixty-second exception.
message UnwrapDekOutput {
  option (buf.validate.message).cel = {
    id: "unwrap_dek_output.operation"
    message: "unwrapped output requires the unwrap operation kind"
    expression: "this.context.operation == 2"
  };
  KeyWrappingContext context = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.platform.key_custody.v1alpha1.KeyRef key_ref = 2 [features.field_presence = LEGACY_REQUIRED];
  Dek dek = 3 [features.field_presence = LEGACY_REQUIRED];
}
