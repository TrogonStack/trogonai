edition = "2024";

package trogonai.secrets.exchange.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/connections/types/v1alpha1/account.proto";
import "trogonai/connections/types/v1alpha1/audit_correlation.proto";
import "trogonai/connections/types/v1alpha1/digest.proto";
import "trogonai/connections/types/v1alpha1/identity.proto";
import "trogonai/connections/types/v1alpha1/reference.proto";
import "trogonai/connections/types/v1alpha1/resource_parent.proto";
import "trogonai/secrets/exchange/v1alpha1/failure.proto";
import "trogonai/secrets/exchange/v1alpha1/resolve.proto";

// Core NATS request/reply only. The registered trusted identity-probe worker
// seals the typed probe to custody's authenticated xkey. Custody authenticates
// that sender, the accepted probe audit, exact attempt/stage and pinned release,
// and derives tenant, owner, issuer, app, resource and key ring from live state.
// Agents, supervisors and arbitrary MCP servers cannot call this operation.
message FingerprintAccountIdentityRequest {
  AttemptRef attempt_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  bytes xkey_sealed_probe = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes = {
      min_len: 1
      max_len: 16384
    }
  ];
  trogonai.connections.types.v1alpha1.AuditCorrelationId correlation_id = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Plaintext before authenticated sealing, never an unsealed RPC payload.
// Custody rejects unknown fields and mismatched inner/outer bindings. It checks
// observed_at against the staged exchange and a maximum probe age of 60 seconds.
message AccountIdentityProbe {
  AttemptRef attempt_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.Digest connector_definition_digest = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ProviderSubjectKind subject_kind = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  trogonai.connections.types.v1alpha1.ProviderAccountIdentityInput identity = 4 [features.field_presence = LEGACY_REQUIRED];
  google.protobuf.Timestamp observed_at = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
  trogonai.connections.types.v1alpha1.AuditCorrelationId correlation_id = 6 [features.field_presence = LEGACY_REQUIRED];
}

message FingerprintAccountIdentityResponse {
  oneof result {
    option (buf.validate.oneof).required = true;

    AccountIdentityReceipt identified = 1;
    AccountIdentityFailure failure = 2;
  }
}

// The registry commits all accepted-generation aliases to one canonical claim
// atomically before this receipt exists. It does not hold or bind the claim.
// Dispatch reads custody's authoritative receipt by attempt/stage and compares
// it before CaptureGrantedAuthority, HoldProviderAccount or reconnect checks.
// The receipt is metadata, never bearer authority or a substitute for live reads.
message AccountIdentityReceipt {
  AttemptRef attempt_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ProviderAccount provider_account = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ProviderAccountClaimId claim_id = 3 [features.field_presence = LEGACY_REQUIRED];
  uint64 registry_epoch = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 registry_revision = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  google.protobuf.Timestamp valid_until = 6 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
}

// Custody's authenticated migration worker only, under an exclusive parent
// registry fence. The sealed tuple comes from an authoritative profile read;
// it cannot select another claim, generation or owner. An insufficient/erased
// profile blocks coverage until a fresh trusted probe or terminal release.
message ReindexAccountIdentityRequest {
  option (buf.validate.message).cel = {
    id: "reindex_account_identity.connection_parent"
    message: "migration and connection must share the custody parent"
    expression: "this.resource_parent == this.connection_ref.resource_parent"
  };

  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ConnectionRef connection_ref = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ProviderAccountClaimId claim_id = 3 [features.field_presence = LEGACY_REQUIRED];
  uint64 expected_registry_epoch = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  bytes xkey_sealed_profile_identity = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes = {
      min_len: 1
      max_len: 16384
    }
  ];
  trogonai.connections.types.v1alpha1.AuditCorrelationId correlation_id = 6 [features.field_presence = LEGACY_REQUIRED];
}

// Decoded inside custody only. The worker checks profile_revision through an
// authenticated source read; echoing an arbitrary revision provides no proof.
// Every context field must equal its authoritative migration request/state.
message AccountIdentityReindexInput {
  trogonai.connections.types.v1alpha1.ConnectionRef connection_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ProviderAccountClaimId claim_id = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ProviderAccountFingerprint canonical_fingerprint = 3 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ProviderAccountIdentityInput identity = 4 [features.field_presence = LEGACY_REQUIRED];
  uint64 profile_revision = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 registry_epoch = 6 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  trogonai.connections.types.v1alpha1.AuditCorrelationId correlation_id = 7 [features.field_presence = LEGACY_REQUIRED];
}

message ReindexAccountIdentityResponse {
  oneof result {
    option (buf.validate.oneof).required = true;

    AccountIdentityReindexed reindexed = 1;
    AccountIdentityFailure failure = 2;
  }
}

message AccountIdentityReindexed {
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ProviderAccountClaimId claim_id = 2 [features.field_presence = LEGACY_REQUIRED];
  uint32 lookup_generation = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint32.gt = 0
  ];
  uint64 registry_epoch = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 registry_revision = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
}

enum AccountIdentityFailureReason {
  ACCOUNT_IDENTITY_FAILURE_REASON_UNSPECIFIED = 0;
  ACCOUNT_IDENTITY_FAILURE_REASON_DENIED = 1;
  ACCOUNT_IDENTITY_FAILURE_REASON_PROBE_UNSUPPORTED = 2;
  ACCOUNT_IDENTITY_FAILURE_REASON_PROBE_INVALID = 3;
  ACCOUNT_IDENTITY_FAILURE_REASON_UNAVAILABLE = 4;
  ACCOUNT_IDENTITY_FAILURE_REASON_THROTTLED = 5;
  ACCOUNT_IDENTITY_FAILURE_REASON_KEY_DENIED = 6;
  ACCOUNT_IDENTITY_FAILURE_REASON_REGISTRY_FENCED = 7;
  ACCOUNT_IDENTITY_FAILURE_REASON_INTEGRITY_FAILURE = 8;
  ACCOUNT_IDENTITY_FAILURE_REASON_KEY_COMPROMISED = 9;
}

// Specific reasons are returned only after caller/attempt authorization.
// Unknown and unauthorized attempts both return DENIED without probe details.
message AccountIdentityFailure {
  option (buf.validate.message).cel = {
    id: "account_identity_failure.category"
    message: "identity reason must preserve custody failure and retry semantics"
    expression: "(this.reason in [1, 2, 3] && this.failure.category == 1) || (this.reason in [4, 7] && this.failure.category == 3) || (this.reason == 5 && this.failure.category == 4) || (this.reason in [6, 9] && this.failure.category == 2) || (this.reason == 8 && this.failure.category == 7)"
  };

  AccountIdentityFailureReason reason = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  ResolveFailure failure = 2 [features.field_presence = LEGACY_REQUIRED];
}
