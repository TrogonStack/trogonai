edition = "2024";

package trogonai.secrets.exchange.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "trogonai/connections/types/v1alpha1/digest.proto";
import "trogonai/connections/types/v1alpha1/discovery.proto";
import "trogonai/connections/types/v1alpha1/reference.proto";
import "trogonai/secrets/credentials/v1alpha1/bundle.proto";
import "trogonai/secrets/credentials/v1alpha1/refresh.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

// Caller: the connections service, once StartCodeExchange has committed; the
// broker implements it (ADR#0094 Decision 4, ADR#0095 Decision 5). The code
// and state exist only in memory for the call. The broker consumes the
// capsule, reads the token endpoint and client authentication from the
// ProviderApp's pinned snapshot or the release, never from a fresh fetch
// (ADR#0094 Decision 10), sends the exchange with resource for MCP, and
// stages the bundle under the attempt (ADR#0095 Decision 12). The broker
// parses only the token response.
message ExchangeAuthorizationCodeRequest {
  trogonai.connections.types.v1alpha1.AuthorizationAttemptRef attempt_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.secrets.v1alpha1.SecretRef capsule_ref = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ProviderAppRef provider_app = 3 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ConnectorReleaseRef connector_release = 4 [features.field_presence = LEGACY_REQUIRED];
  // The authorization server metadata snapshot the attempt pinned. Absent for
  // a preregistered app whose release declares the token endpoint.
  trogonai.connections.types.v1alpha1.Digest authorization_server_metadata_digest = 5;
  // The exact redirect URI the authorize request used, repeated in the token
  // request as RFC 6749 requires.
  string redirect_uri = 6 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.uri = true
  ];
  // The RFC 8707 resource for an MCP connection; absent otherwise.
  trogonai.connections.types.v1alpha1.CanonicalResourceUri resource = 7;
  // The authorization code, sealed by the connections service to the secrets
  // service's public xkey.
  bytes xkey_sealed_code = 8 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.min_len = 1
  ];
  // The signed state the callback presented, sealed by the connections
  // service to the secrets service's public xkey, so the broker can bind the
  // exchange to the claimed callback.
  bytes xkey_sealed_state = 9 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).bytes.min_len = 1
  ];
}

message ExchangeAuthorizationCodeResponse {
  oneof result {
    option (buf.validate.oneof).required = true;

    ExchangeStaged staged = 1;
    ExchangeFailure failed = 2;
  }
}

// The bundle is staged under the attempt and not yet usable. The connections
// service records staged_bundle_ref on the attempt and the executor runs the
// identity probe through an attempt-scoped resolve (ADR#0094 Decision 5).
message ExchangeStaged {
  // The staged stream's SecretRef, derived from the attempt id.
  trogonai.secrets.v1alpha1.SecretRef staged_secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  // The facts of version 1 at the staging path. Its secret_version_ref is the
  // attempt's staged_bundle_ref.
  trogonai.secrets.credentials.v1alpha1.TokenBundle bundle = 2 [features.field_presence = LEGACY_REQUIRED];
}

// Why an exchange did not stage a bundle. ADR#0094 Decision 4 names the
// lost-response case and ADR#0095 Decision 3 the provider outcomes for a
// refresh; this is the same table applied to the code exchange. Unspecified
// and unknown values are invalid.
enum ExchangeFailureReason {
  EXCHANGE_FAILURE_REASON_UNSPECIFIED = 0;
  // The caller is not permitted, the attempt is unknown to custody, or a
  // stage already exists under the attempt.
  EXCHANGE_FAILURE_REASON_DENIED = 1;
  // The capsule is unknown, consumed or expired. The code is presumed spent
  // and never reused.
  EXCHANGE_FAILURE_REASON_CAPSULE_UNAVAILABLE = 2;
  // A definite token endpoint error, carried as provider_error. invalid_grant
  // here means the code was rejected.
  EXCHANGE_FAILURE_REASON_PROVIDER_REJECTED = 3;
  // The provider rejected the client's authentication. The ProviderApp
  // becomes Degraded.
  EXCHANGE_FAILURE_REASON_CLIENT_AUTHENTICATION_REJECTED = 4;
  // 429 from the token endpoint; retry_after when the provider sent one.
  EXCHANGE_FAILURE_REASON_PROVIDER_RATE_LIMITED = 5;
  // The request never left: DNS, connect or TLS failed. The code is still
  // unspent, but ADR#0094 Decision 4 fails the attempt rather than retry.
  EXCHANGE_FAILURE_REASON_PROVIDER_UNREACHABLE = 6;
  // The request may have left and no attributable response arrived. The
  // caller records RecordExchangeUnknown and reconciliation asks custody
  // whether a stage exists (ADR#0094 Decision 4).
  EXCHANGE_FAILURE_REASON_OUTCOME_UNKNOWN = 7;
  // The token response was malformed or violated the release's expectations.
  EXCHANGE_FAILURE_REASON_RESPONSE_INVALID = 8;
  // The tenant's key refused the sealing lease for the stage.
  EXCHANGE_FAILURE_REASON_KEY_DENIED = 9;
  // OpenBao or the key backend was unavailable for the stage write.
  EXCHANGE_FAILURE_REASON_UNAVAILABLE = 10;
  // Unmapped.
  EXCHANGE_FAILURE_REASON_INTERNAL = 11;
}

message ExchangeFailure {
  option (buf.validate.message).cel = {
    id: "exchange_failure.provider_error"
    message: "a token endpoint error is supplied exactly for PROVIDER_REJECTED"
    expression: "(this.reason == 3) == has(this.provider_error)"
  };
  option (buf.validate.message).cel = {
    id: "exchange_failure.retry_after"
    message: "retry_after is carried only for PROVIDER_RATE_LIMITED"
    expression: "!has(this.retry_after) || this.reason == 5"
  };

  ExchangeFailureReason reason = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  trogonai.secrets.credentials.v1alpha1.TokenEndpointError provider_error = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Duration retry_after = 3 [(buf.validate.field).duration.gte = {}];
}
