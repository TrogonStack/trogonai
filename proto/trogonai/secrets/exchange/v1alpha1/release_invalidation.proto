edition = "2024";

package trogonai.secrets.exchange.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/secrets/exchange/v1alpha1/credential_address.proto";

// Why a released value stopped being the one the credential releases.
// Unspecified and unknown values are invalid.
enum ReleaseInvalidationReason {
  RELEASE_INVALIDATION_REASON_UNSPECIFIED = 0;
  // A rotation completed and a new version releases. A rotation that has only
  // started still releases the version it replaces, so it sends no notice.
  RELEASE_INVALIDATION_REASON_ROTATED = 1;
  RELEASE_INVALIDATION_REASON_REVOKED = 2;
  // Destruction was requested or has completed.
  RELEASE_INVALIDATION_REASON_DESTROYED = 3;
}

// Tells every holder of a value released by ResolveForRelease to drop it.
// This is not trogonai.secrets.credentials.v1alpha1.CredentialInvalidated,
// which records a credential becoming unusable on its own stream.
//
// Published on `{tenant}.secrets.invalidation.v1.{owner_token}.{credential_id}`,
// where `{tenant}` is the account key of the tenant holding the owner, so only
// that account can import it (ADR#0081 Decision 3), and `{owner_token}` is the
// owner id with each `.` written as `~`, as the credential event subjects
// write it.
//
// It carries metadata only and has no field that could hold a value, since
// values stay out of JetStream (ADR#0023 Decision 3). A consumer evicts every
// copy it holds of the credential, for every host and location, whatever the
// reason. Each consumer replica reads through its own consumer, never a queue
// group, so no replica keeps serving a revoked value (ADR#0023 Decision 6). A
// missed notice lasts only until the copy's valid_until, the ADR#0049 bound
// that ADR#0074 Decision 4 places on a consumer's cache.
message ReleaseInvalidated {
  CredentialAddress credential = 1 [features.field_presence = LEGACY_REQUIRED];
  ReleaseInvalidationReason reason = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // When the credential event behind this notice was appended.
  google.protobuf.Timestamp occurred_at = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
  // The CREDENTIAL_EVENTS stream sequence of that event. The publisher also
  // sends it as the `Nats-Msg-Id` `CREDENTIAL_EVENTS:{source_sequence}`, so a
  // redelivered event publishes one notice.
  uint64 source_sequence = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
}
