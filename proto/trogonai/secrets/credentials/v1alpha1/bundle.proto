edition = "2024";

package trogonai.secrets.credentials.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/connections/types/v1alpha1/access_expiry.proto";
import "trogonai/connections/types/v1alpha1/authority.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

// The non-secret facts of one written token bundle: which KV version holds
// it, when the provider says it expires, and what the provider granted. These
// are the only bundle facts the stream records; no token, no issuer secret and
// no provider body enters an event (ADR#0095 Decision 1).
message TokenBundle {
  // The previous draft required a provider expiry even when none was known.
  reserved 2;
  reserved provider_expires_at;

  // The KV v2 version the compare-and-set write produced.
  trogonai.secrets.v1alpha1.SecretVersionRef secret_version_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  // The refresh token expiry, when the provider reports one. Absent means the
  // provider did not say; a lapse is then learned from invalid_grant.
  google.protobuf.Timestamp refresh_token_expires_at = 3 [(buf.validate.field).timestamp.gt = {seconds: 0}];
  // The actual authority of this bundle, never a suppressed or attenuated
  // metadata view. A refresh may lower it; a wider response invalidates custody
  // with AUTHORITY_WIDENED and is never promoted (ADR#0092 Decision 4).
  trogonai.connections.types.v1alpha1.GrantedAuthority granted_authority = 4 [features.field_presence = LEGACY_REQUIRED];
  // Explicit evidence, never a guessed provider timestamp. Known expiries
  // bound valid_until after skew. Unknown and documented non-expiring access
  // still receive a finite local cache bound and no lifetime-based proactive
  // refresh. A provider rejection can trigger on-demand refresh when a refresh
  // credential exists; otherwise an attributable dead grant needs reconnect.
  trogonai.connections.types.v1alpha1.AccessExpiry access_expiry = 5 [features.field_presence = LEGACY_REQUIRED];
}
