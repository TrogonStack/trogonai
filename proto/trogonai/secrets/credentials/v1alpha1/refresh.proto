edition = "2024";

package trogonai.secrets.credentials.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/connections/types/v1alpha1/identity.proto";

// Why a refresh was dispatched (ADR#0095 Decisions 5 and 8). On-demand work
// goes ahead of proactive work in the scheduler. Unspecified and unknown
// values are invalid.
enum RefreshTrigger {
  REFRESH_TRIGGER_UNSPECIFIED = 0;
  // Due at a random point between 70 and 90 percent of the token lifetime,
  // chosen once per generation. Only reported or documented finite lifetime
  // permits this scheduling; unknown and non-expiring access have no due time.
  REFRESH_TRIGGER_PROACTIVE = 1;
  // The resolve path found the current generation below the caller's
  // min_bundle_generation, with force_refresh set after a provider 401.
  REFRESH_TRIGGER_ON_DEMAND = 2;
  // The recovery worker redispatched after an unknown outcome on provider
  // evidence (ADR#0095 Decision 3).
  REFRESH_TRIGGER_RECOVERY = 3;
}

// The provider evidence that lets the recovery worker dispatch a new refresh
// over an unsettled one (ADR#0095 Decision 3). A lease expiry or a local
// timeout is never evidence. Unspecified and unknown values are invalid.
enum RedispatchEvidence {
  REDISPATCH_EVIDENCE_UNSPECIFIED = 0;
  // The release documents that the provider never rotates refresh tokens.
  REDISPATCH_EVIDENCE_STABLE_REFRESH_TOKENS = 1;
  // The release documents a refresh token reuse grace and it is still open.
  REDISPATCH_EVIDENCE_REUSE_GRACE_OPEN = 2;
}

// Names the unsettled operation a recovery dispatch supersedes and the
// evidence that permits it. Present only on a RECOVERY dispatch.
message RefreshRedispatch {
  trogonai.connections.types.v1alpha1.CredentialOperationId superseded_operation_id = 1 [features.field_presence = LEGACY_REQUIRED];
  RedispatchEvidence evidence = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// The RFC 6749 Section 5.2 token endpoint error codes, plus the RFC 8707
// invalid_target, as a closed set so no provider text enters an event. The
// authorization endpoint has its own set on the attempt. Unspecified and
// unknown values are invalid.
enum TokenEndpointError {
  TOKEN_ENDPOINT_ERROR_UNSPECIFIED = 0;
  TOKEN_ENDPOINT_ERROR_INVALID_REQUEST = 1;
  TOKEN_ENDPOINT_ERROR_INVALID_CLIENT = 2;
  TOKEN_ENDPOINT_ERROR_INVALID_GRANT = 3;
  TOKEN_ENDPOINT_ERROR_UNAUTHORIZED_CLIENT = 4;
  TOKEN_ENDPOINT_ERROR_UNSUPPORTED_GRANT_TYPE = 5;
  TOKEN_ENDPOINT_ERROR_INVALID_SCOPE = 6;
  TOKEN_ENDPOINT_ERROR_INVALID_TARGET = 7;
  // A code the set does not name, recorded without its text.
  TOKEN_ENDPOINT_ERROR_OTHER = 8;
}

// Why a dispatched refresh was rejected, settling the operation without a new
// bundle (ADR#0095 Decision 3). Each value names what follows. Unspecified and
// unknown values are invalid.
enum RefreshRejectionReason {
  REFRESH_REJECTION_REASON_UNSPECIFIED = 0;
  // invalid_grant on the current refresh token. The credential becomes
  // Unusable with INVALID_GRANT and a stale token is never retried.
  REFRESH_REJECTION_REASON_INVALID_GRANT = 1;
  // 429 from the token endpoint. Transient; jittered backoff honouring
  // Retry-After, and the whole ProviderApp backs off (Decision 8).
  REFRESH_REJECTION_REASON_PROVIDER_RATE_LIMITED = 2;
  // The request never left: DNS, connect or TLS failed. Transient; jittered
  // backoff.
  REFRESH_REJECTION_REASON_PROVIDER_UNREACHABLE = 3;
  // The provider rejected the client's authentication. The ProviderApp
  // becomes Degraded and its refresh pauses; user consent is not assumed
  // revoked.
  REFRESH_REJECTION_REASON_CLIENT_AUTHENTICATION_REJECTED = 4;
  // A definite provider rejection other than the ones above, carried as a
  // TokenEndpointError. No automatic retry.
  REFRESH_REJECTION_REASON_PROVIDER_REJECTED = 5;
  // The tenant's key refused the sealing lease needed before dispatch
  // (Decision 4). Refresh for the tenant is suspended until the key is
  // restored.
  REFRESH_REJECTION_REASON_KEY_DENIED = 6;
  // The key backend or OpenBao was unavailable for the sealing lease or the
  // compare-and-set write. Transient.
  REFRESH_REJECTION_REASON_KEY_UNAVAILABLE = 7;
  // The compare-and-set write found a version other than the one read. Another
  // writer won; the loser re-reads and never retries blindly (Decision 1).
  REFRESH_REJECTION_REASON_WRITE_CONFLICT = 8;
}
