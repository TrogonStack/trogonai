edition = "2024";

package trogonai.secrets.credentials.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/connections/types/v1alpha1/cleanup.proto";
import "trogonai/connections/types/v1alpha1/health.proto";
import "trogonai/connections/types/v1alpha1/identity.proto";
import "trogonai/connections/types/v1alpha1/outcome.proto";
import "trogonai/connections/types/v1alpha1/reference.proto";
import "trogonai/connections/types/v1alpha1/resource_parent.proto";
import "trogonai/secrets/credentials/v1alpha1/bundle.proto";
import "trogonai/secrets/credentials/v1alpha1/kind.proto";
import "trogonai/secrets/credentials/v1alpha1/lifecycle.proto";
import "trogonai/secrets/credentials/v1alpha1/refresh.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

// Each concrete event records immutable resource containment. Replay verifies
// resource_parent against the stream route and genesis; a parent mismatch is
// invalid history, never a resource move.

// Replay rejects unset or unknown events and invalid transitions; skipping one
// could make destroyed or revoked material look resolvable. Actor identity and
// occurrence time come from the event envelope. Every event records
// references, generations, expiries and outcomes only: never a token, a
// verifier, a key, a provider body or an OpenBao path (ADR#0095 Decision 1,
// ADR#0092 Decision 8).
message CredentialEvent {
  oneof event {
    option (buf.validate.oneof).required = true;

    CredentialEstablished established = 1;
    CredentialMaterialRotated material_rotated = 2;
    CredentialBundleStaged bundle_staged = 3;
    CredentialStagePromoted stage_promoted = 4;
    CredentialStageDiscarded stage_discarded = 5;
    CredentialTokenSetPromoted token_set_promoted = 6;
    CredentialRefreshDispatched refresh_dispatched = 7;
    CredentialRefreshCommitted refresh_committed = 8;
    CredentialRefreshRejected refresh_rejected = 9;
    CredentialRefreshOutcomeUnknown refresh_outcome_unknown = 10;
    CredentialInvalidated invalidated = 11;
    CredentialResealed resealed = 12;
    CredentialRevoked revoked = 13;
    CredentialProviderRevokeSettled provider_revoke_settled = 14;
    CredentialMaterialDestroyed material_destroyed = 15;
    CredentialCleanupDebtRecorded cleanup_debt_recorded = 16;
  }
}

// Genesis under NoStream for every kind but a token set. The credential is
// Active at version 1 (ADR#0095 Decision 2).
message CredentialEstablished {
  option (buf.validate.message).cel = {
    id: "credentialestablished.kind_subject"
    message: "registration secret kinds belong to an app; other established kinds belong to a connection"
    expression: "(this.kind in [3, 14, 15]) == has(this.subject.provider_app) && !has(this.subject.authorization_attempt)"
  };

  option (buf.validate.message).cel = {
    id: "credentialestablished.subject_parent"
    message: "credential containment must equal the qualified subject container"
    expression: "(has(this.subject.connection_ref) && has(this.resource_parent.project) && this.resource_parent.project == this.subject.connection_ref.resource_parent) || (has(this.subject.authorization_attempt) && has(this.resource_parent.project) && this.resource_parent.project == this.subject.authorization_attempt.resource_parent) || (has(this.subject.provider_app) && ((has(this.resource_parent.platform) && has(this.subject.provider_app.resource_parent.platform)) || (has(this.resource_parent.project) && has(this.subject.provider_app.resource_parent.project) && this.resource_parent.project == this.subject.provider_app.resource_parent.project)))"
  };

  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  CredentialKind kind = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  CredentialSubject subject = 3 [features.field_presence = LEGACY_REQUIRED];
  trogonai.secrets.v1alpha1.SecretVersionRef secret_version_ref = 4 [features.field_presence = LEGACY_REQUIRED];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 5 [features.field_presence = LEGACY_REQUIRED];
}

// A new version is current behind the same SecretRef; identity and binding
// generation are unchanged.
message CredentialMaterialRotated {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.secrets.v1alpha1.SecretVersionRef secret_version_ref = 2 [features.field_presence = LEGACY_REQUIRED];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Genesis under NoStream of a staged stream: kind OAUTH_TOKEN_SET, purpose
// STAGED, lifecycle Staged (ADR#0095 Decision 12).
message CredentialBundleStaged {
  option (buf.validate.message).cel = {
    id: "credentialbundlestaged.attempt_parent"
    message: "staged and promoted token bundles remain in the attempt custody parent"
    expression: "has(this.resource_parent.project) && this.resource_parent.project == this.attempt_ref.resource_parent"
  };

  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.AuthorizationAttemptRef attempt_ref = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 3 [features.field_presence = LEGACY_REQUIRED];
  TokenBundle bundle = 4 [features.field_presence = LEGACY_REQUIRED];
  google.protobuf.Timestamp expires_at = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 6 [features.field_presence = LEGACY_REQUIRED];
}

// The stage was promoted into the named live token set and is Retired: no
// longer resolvable, awaiting destruction.
message CredentialStagePromoted {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.secrets.v1alpha1.SecretRef promoted_to = 2 [features.field_presence = LEGACY_REQUIRED];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// The stage was discarded and is Retired, awaiting destruction without a
// provider revoke (ADR#0095 Decision 12).
message CredentialStageDiscarded {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  StageDiscardReason reason = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// The live token set holds the promoted bundle at bundle_generation: genesis
// under NoStream at generation 1 for a fresh connection (kind
// OAUTH_TOKEN_SET, purpose LIVE, subject the connection), or the next
// generation on a reconnect. The credential is Active (ADR#0095 Decision 12).
message CredentialTokenSetPromoted {
  option (buf.validate.message).cel = {
    id: "credentialtokensetpromoted.attempt_parent"
    message: "staged and promoted token bundles remain in the attempt custody parent"
    expression: "has(this.resource_parent.project) && this.resource_parent.project == this.attempt_ref.resource_parent"
  };

  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.AuthorizationAttemptRef attempt_ref = 3 [features.field_presence = LEGACY_REQUIRED];
  trogonai.secrets.v1alpha1.SecretRef staged_secret_ref = 4 [features.field_presence = LEGACY_REQUIRED];
  uint64 bundle_generation = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  TokenBundle bundle = 6 [features.field_presence = LEGACY_REQUIRED];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 7 [features.field_presence = LEGACY_REQUIRED];
}

// The write-ahead record of one refresh, committed before any HTTP call. The
// operation is unsettled until exactly one of Committed, Rejected or
// OutcomeUnknown names it, or a RECOVERY dispatch supersedes it (ADR#0095
// Decision 3).
message CredentialRefreshDispatched {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.CredentialOperationId operation_id = 2 [features.field_presence = LEGACY_REQUIRED];
  uint64 expected_bundle_generation = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 fence = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  RefreshTrigger trigger = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  RefreshRedispatch redispatch = 6;

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 7 [features.field_presence = LEGACY_REQUIRED];
}

// The named operation produced the bundle at bundle_generation, which is now
// the only generation an executor may receive (ADR#0095 Decision 3).
message CredentialRefreshCommitted {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.CredentialOperationId operation_id = 2 [features.field_presence = LEGACY_REQUIRED];
  uint64 bundle_generation = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 1
  ];
  TokenBundle bundle = 4 [features.field_presence = LEGACY_REQUIRED];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 5 [features.field_presence = LEGACY_REQUIRED];
}

// The named operation ended without a bundle. The generation is unchanged.
message CredentialRefreshRejected {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.CredentialOperationId operation_id = 2 [features.field_presence = LEGACY_REQUIRED];
  RefreshRejectionReason reason = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  TokenEndpointError provider_error = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Duration retry_after = 5 [(buf.validate.field).duration.gte = {}];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 6 [features.field_presence = LEGACY_REQUIRED];
}

// The named operation's outcome could not be attributed. It stays unsettled
// and the family is held (resolve fails REFRESH_PENDING) until recovery
// settles it (ADR#0095 Decision 3).
message CredentialRefreshOutcomeUnknown {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.CredentialOperationId operation_id = 2 [features.field_presence = LEGACY_REQUIRED];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// The credential is Unusable for the named reason until a reconnect promotes
// a new bundle. Any unsettled operation is closed. Custody reports the reason
// to the connections service as a health fact (ADR#0092 Decision 4).
message CredentialInvalidated {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  // INVALID_GRANT, REFRESH_OUTCOME_LOST, CUSTODY_RESTORED,
  // CUSTODY_KEY_DESTROYED, CUSTODY_KEY_LOST or REFRESH_TOKEN_LAPSED.
  trogonai.connections.types.v1alpha1.ConnectionHealthReason reason = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      in: [
        4,
        5,
        8,
        9,
        10,
        11
      ]
    }
  ];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// The bundle at bundle_generation was re-sealed into a new version with the
// same plaintext (ADR#0095 Decision 4). Older versions are then destroyed.
message CredentialResealed {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  uint64 bundle_generation = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  trogonai.secrets.v1alpha1.SecretVersionRef secret_version_ref = 3 [features.field_presence = LEGACY_REQUIRED];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 4 [features.field_presence = LEGACY_REQUIRED];
}

// Refresh and resolve stopped at once; material still exists (ADR#0095
// Decision 1).
message CredentialRevoked {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 2 [features.field_presence = LEGACY_REQUIRED];
}

// The provider revoke of a revoked token set reached a terminal outcome or
// its window ended, which admits destruction (ADR#0094 Decision 13).
message CredentialProviderRevokeSettled {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.EffectOutcome outcome = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Custody destroyed the named versions. ALL_VERSIONS makes the credential
// Destroyed and settles MATERIAL_UNDESTROYED debt.
message CredentialMaterialDestroyed {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  MaterialDestroyScope scope = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// An open obligation for the lifecycle worker (ADR#0095 Decisions 1, 3, 9
// and 12).
message CredentialCleanupDebtRecorded {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  // PROVIDER_REVOKE_RESIDUAL, MATERIAL_UNDESTROYED or DISCARDED_BUNDLE.
  trogonai.connections.types.v1alpha1.CleanupObligationKind kind = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      in: [
        1,
        2,
        6
      ]
    }
  ];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}
