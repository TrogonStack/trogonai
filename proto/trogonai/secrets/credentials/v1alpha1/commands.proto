edition = "2024";

package trogonai.secrets.credentials.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/connections/types/v1alpha1/cleanup.proto";
import "trogonai/connections/types/v1alpha1/health.proto";
import "trogonai/connections/types/v1alpha1/identity.proto";
import "trogonai/connections/types/v1alpha1/outcome.proto";
import "trogonai/connections/types/v1alpha1/reference.proto";
import "trogonai/connections/types/v1alpha1/resource_parent.proto";
import "trogonai/connections/types/v1alpha1/stage.proto";
import "trogonai/secrets/credentials/v1alpha1/bundle.proto";
import "trogonai/secrets/credentials/v1alpha1/kind.proto";
import "trogonai/secrets/credentials/v1alpha1/lifecycle.proto";
import "trogonai/secrets/credentials/v1alpha1/refresh.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

// resource_parent is immutable custody containment, distinct from the subject
// association. Every command is checked against authenticated routing and the
// recorded parent. Stage and promotion stay within one project; CloseStage
// resolves promoted_to under that same parent rather than a caller-chosen scope.

// secrets.credentials owns one stream per SecretRef in its subject custody
// namespace: platform for platform-app material, the custody project otherwise. The SecretRef is the aggregate id because ADR#0095 keys
// everything on it: the sealing layout binds the SecretRef (Decision 4), a
// resolve names one (Decision 5), a Connection binding names one (ADR#0092
// Decision 5), a staged bundle has the attempt id in the SecretRef position
// (Decision 12), and registration secrets belong to a ProviderApp rather than
// a Connection (Decision 2), so a Connection key would not cover them. A
// staged bundle and the live token set it is promoted into are two streams of
// this aggregate.
//
// Only the secrets service writes this stream, and only after the matching
// OpenBao write landed, because the stream records what custody holds
// (ADR#0095 Decision 1). No command carries material: only SecretRef and
// SecretVersionRef. Genesis commands (EstablishCredential, StageTokenBundle,
// and PromoteTokenBundle at generation 1) use NoStream with a stable nonempty
// Decider command_id; every later command uses StreamUnchanged at the
// observed revision with a stable command_id.

// Genesis for every kind but a token set: the control-plane management path
// submitted material through SubmitMaterial and custody wrote version 1. The
// subject is a Connection for connection-scoped kinds and a ProviderApp for
// CLIENT_SECRET, REGISTRATION_ACCESS_TOKEN and PRIVATE_KEY (ADR#0095
// Decision 2). Refused for OAUTH_TOKEN_SET, which only StageTokenBundle and
// PromoteTokenBundle establish.
message EstablishCredential {
  option (buf.validate.message).cel = {
    id: "establishcredential.kind_subject"
    message: "registration secret kinds belong to an app; other established kinds belong to a connection"
    expression: "(this.kind in [3, 14, 15]) == has(this.subject.provider_app) && !has(this.subject.authorization_attempt)"
  };

  option (buf.validate.message).cel = {
    id: "establishcredential.subject_parent"
    message: "credential containment must equal the qualified subject container"
    expression: "(has(this.subject.connection_ref) && has(this.resource_parent.project) && this.resource_parent.project == this.subject.connection_ref.resource_parent) || (has(this.subject.authorization_attempt) && has(this.resource_parent.project) && this.resource_parent.project == this.subject.authorization_attempt.resource_parent) || (has(this.subject.provider_app) && ((has(this.resource_parent.platform) && has(this.subject.provider_app.resource_parent.platform)) || (has(this.resource_parent.project) && has(this.subject.provider_app.resource_parent.project) && this.resource_parent.project == this.subject.provider_app.resource_parent.project)))"
  };

  option (buf.validate.message).cel = {
    id: "establish_credential.not_token_set"
    message: "a token set is established by staging and promotion, never submitted"
    expression: "this.kind != 13"
  };
  option (buf.validate.message).cel = {
    id: "establish_credential.not_attempt_scoped"
    message: "only a staged bundle belongs to an authorization attempt"
    expression: "!has(this.subject.authorization_attempt)"
  };

  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  CredentialKind kind = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  CredentialSubject subject = 3 [features.field_presence = LEGACY_REQUIRED];
  // Version 1 of this SecretRef.
  trogonai.secrets.v1alpha1.SecretVersionRef secret_version_ref = 4 [features.field_presence = LEGACY_REQUIRED];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 5 [features.field_presence = LEGACY_REQUIRED];
}

// Active only, for a kind other than OAUTH_TOKEN_SET. SubmitMaterial on an
// existing SecretRef rotates it: the new version is current and the identity
// is unchanged, so a client secret rotation keeps the ProviderApp and the
// binding generation (ADR#0092 Decision 3). Superseded versions are destroyed
// through DestroyCredentialMaterial.
message RotateCredentialMaterial {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  // Strictly greater than the current version.
  trogonai.secrets.v1alpha1.SecretVersionRef secret_version_ref = 2 [features.field_presence = LEGACY_REQUIRED];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Genesis of a staged stream (NoStream), after the broker exchanged the code
// and wrote the bundle to the staging path with cas 0 and max_versions 1,
// sealed with purpose staged (ADR#0095 Decision 12). The attempt id is the
// key, so a second exchange under one attempt meets an existing stream and
// is refused. The stage is resolvable only through an attempt reference while
// the attempt is open and before expires_at. Expiry never discards a stage
// protected for activation/promotion.
message StageTokenBundle {
  option (buf.validate.message).cel = {
    id: "stagetokenbundle.attempt_parent"
    message: "staged and promoted token bundles remain in the attempt custody parent"
    expression: "has(this.resource_parent.project) && this.resource_parent.project == this.attempt_ref.resource_parent"
  };

  // The staged bundle's own SecretRef, derived from the attempt id.
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.AuthorizationAttemptRef attempt_ref = 2 [features.field_presence = LEGACY_REQUIRED];
  // The connection the attempt targets, fresh or reconnecting (ADR#0094
  // Decision 1), so promotion knows its destination from this stream alone.
  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 3 [features.field_presence = LEGACY_REQUIRED];
  // Version 1 at the staging path.
  TokenBundle bundle = 4 [features.field_presence = LEGACY_REQUIRED];
  // Probe/consent expiry only. Destruction requires authoritative terminal
  // attempt evidence and no promotion protection in the staged fold.
  google.protobuf.Timestamp expires_at = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 6 [features.field_presence = LEGACY_REQUIRED];
}

// Staged only, before the probe/consent expiry, after capture and a claim held
// for the fresh target or already Bound to the reconnect target.
// StreamUnchanged records an immutable promotion binding before activation or
// reconnect. This append races CloseStage(discard) on this same staged stream:
// discard winning makes protection impossible; protection winning forbids every
// discard. Dispatch verifies the exact stored stage/attempt/target and intended
// authorization generation. Repeated identical protection is idempotent; a
// different binding is refused. Its append revision forms the protection receipt.
// No expiry, terminal attempt, lease loss or absent activation read releases it.
message ProtectStagePromotion {
  option (buf.validate.message).cel = {
    id: "protect_stage_promotion.binding"
    message: "protection requires the exact staged ref and custody parent"
    expression: "has(this.resource_parent.project) && this.resource_parent.project == this.binding.attempt_ref.resource_parent && this.secret_ref == this.binding.staged_bundle_ref.secret"
  };

  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.StagePromotionBinding binding = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Staged only. Closes a stage: promoted into the connection's token set, or
// discarded because its attempt ended without activation (ADR#0095 Decision
// 12). Either way the stage stops being resolvable and every version is then
// destroyed through DestroyCredentialMaterial; the platform never calls the
// provider to revoke a discarded stage. Discard requires a verified terminal
// attempt revision for the exact attempt attributed by this staged fold, and
// an unprotected current staged fold under StreamUnchanged.
// A protected stage cannot be discarded, even when its attempt failed or expired;
// ambiguous activation remains held for recovery and records cleanup debt.
// Promotion close verifies the exact live promotion before retiring the stage.
message CloseStage {
  option (buf.validate.message).cel = {
    id: "close_stage.evidence"
    message: "stage close requires promotion protection or terminal discard evidence"
    expression: "has(this.promoted_to) == has(this.promotion_protection) && has(this.discarded) == has(this.discard_evidence)"
  };
  option (buf.validate.message).cel = {
    id: "close_stage.parent"
    message: "stage close evidence requires the exact stage and custody parent"
    expression: "has(this.resource_parent.project) && (!has(this.promotion_protection) || (this.promotion_protection.binding.staged_bundle_ref.secret == this.secret_ref && this.promotion_protection.binding.attempt_ref.resource_parent == this.resource_parent.project)) && (!has(this.discard_evidence) || this.discard_evidence.attempt_ref.resource_parent == this.resource_parent.project)"
  };
  option (buf.validate.message).cel = {
    id: "close_stage.discard_reason"
    message: "discard reason requires the corresponding terminal attempt outcome"
    expression: "!has(this.discard_evidence) || (this.discarded == 5 || (this.discarded == 1 && this.discard_evidence.terminal_outcome == 3) || (this.discarded in [2, 3] && this.discard_evidence.terminal_outcome == 1) || (this.discarded == 4 && this.discard_evidence.terminal_outcome == 2))"
  };

  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  oneof outcome {
    option (buf.validate.oneof).required = true;

    // The live token set the bundle was promoted into.
    trogonai.secrets.v1alpha1.SecretRef promoted_to = 2;
    StageDiscardReason discarded = 3 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];
  }

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 4 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.StagePromotionProtection promotion_protection = 5;
  trogonai.connections.types.v1alpha1.StageDiscardEvidence discard_evidence = 6;
}

// Establishes or advances the connection's live token set from a staged
// bundle, after ActivateConnection committed and custody re-sealed the bundle
// under the connection's SecretRef and CAS-wrote it (ADR#0095 Decision 12).
// A fresh connection uses NoStream at bundle_generation 1. A reconnect uses
// StreamUnchanged on the existing live stream, in Active or Unusable, at the
// generation it read plus one; it makes the credential Active and is refused
// while a refresh is unsettled. Idempotent on attempt_ref: a repeat with the
// same attempt after promotion is accepted without a new event. A reconciler
// issues it after a crash between activation and promotion, even past the
// probe/consent expiry. Dispatch verifies the live activation/reconnect carries
// this exact protection receipt and intended authorization generation.
message PromoteTokenBundle {
  option (buf.validate.message).cel = {
    id: "promote_token_bundle.protection"
    message: "promotion requires the protected attempt, stage and target connection"
    expression: "this.promotion_protection.binding.attempt_ref == this.attempt_ref && this.promotion_protection.binding.staged_bundle_ref.secret == this.staged_secret_ref && this.promotion_protection.binding.connection_id == this.connection_id"
  };
  option (buf.validate.message).cel = {
    id: "promotetokenbundle.attempt_parent"
    message: "staged and promoted token bundles remain in the attempt custody parent"
    expression: "has(this.resource_parent.project) && this.resource_parent.project == this.attempt_ref.resource_parent"
  };

  // The connection's live token set.
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.AuthorizationAttemptRef attempt_ref = 3 [features.field_presence = LEGACY_REQUIRED];
  // The stage the bundle came from.
  trogonai.secrets.v1alpha1.SecretRef staged_secret_ref = 4 [features.field_presence = LEGACY_REQUIRED];
  uint64 bundle_generation = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  // The version the compare-and-set write produced on the live path.
  TokenBundle bundle = 6 [features.field_presence = LEGACY_REQUIRED];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 7 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.StagePromotionProtection promotion_protection = 8 [features.field_presence = LEGACY_REQUIRED];
}

// Active only, OAUTH_TOKEN_SET only, and refused while any refresh is
// unsettled: this append is the single-flight authority, so a replica that
// loses the race waits on the winner's operation (ADR#0095 Decision 3). It
// commits before any HTTP call, after a sealing lease was acquired with at
// least twice the request deadline remaining (Decision 4). From Unusable it is
// refused. A RECOVERY trigger is the one exception to the unsettled rule: it
// supersedes an OutcomeUnknown operation on provider evidence and must carry
// redispatch; any other trigger must not.
message DispatchRefresh {
  option (buf.validate.message).cel = {
    id: "dispatch_refresh.redispatch"
    message: "redispatch is present exactly for a RECOVERY trigger"
    expression: "(this.trigger == 3) == has(this.redispatch)"
  };

  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.CredentialOperationId operation_id = 2 [features.field_presence = LEGACY_REQUIRED];
  // Must equal the current committed generation; the new bundle is written at
  // this plus one.
  uint64 expected_bundle_generation = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  // A monotonic token the writer carries into the bundle so a stale worker's
  // write after settlement is refused by compare-and-set and attributed for
  // cleanup (Decision 3). Strictly greater than every fence this stream
  // recorded.
  uint64 fence = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  RefreshTrigger trigger = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  RefreshRedispatch redispatch = 6;

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 7 [features.field_presence = LEGACY_REQUIRED];
}

// Settles the named operation with a new bundle, from Dispatched or from
// OutcomeUnknown when recovery found the current bundle carrying this
// operation id and fence (ADR#0095 Decision 3). Idempotent on operation_id: a
// repeat after commit is accepted without a new event. bundle_generation
// must equal the dispatched expected generation plus one. The writer then
// destroys superseded versions through DestroyCredentialMaterial. The
// candidate authority must be a subset of the previously committed authority;
// a wider candidate is refused and InvalidateCredential records
// AUTHORITY_WIDENED instead.
message CommitRefresh {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.CredentialOperationId operation_id = 2 [features.field_presence = LEGACY_REQUIRED];
  uint64 bundle_generation = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 1
  ];
  TokenBundle bundle = 4 [features.field_presence = LEGACY_REQUIRED];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 5 [features.field_presence = LEGACY_REQUIRED];
}

// Settles only a definite provider rejection or proof that no request left,
// from Dispatched only. Custody/key/write failures are never rejection evidence:
// after provider I/O they keep the operation unsettled for recovery.
// (ADR#0095 Decision 3). INVALID_GRANT also makes the credential Unusable
// (CredentialInvalidated with INVALID_GRANT follows in the same append).
// retry_after is carried for the transient reasons, from Retry-After when the
// provider sent one. provider_error is present exactly for PROVIDER_REJECTED.
message RejectRefresh {
  option (buf.validate.message).cel = {
    id: "reject_refresh.provider_error"
    message: "a token endpoint error is supplied exactly for PROVIDER_REJECTED"
    expression: "(this.reason == 5) == has(this.provider_error)"
  };
  option (buf.validate.message).cel = {
    id: "reject_refresh.retry_after"
    message: "retry_after is carried only for a transient reason"
    expression: "!has(this.retry_after) || this.reason in [2, 3]"
  };

  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.CredentialOperationId operation_id = 2 [features.field_presence = LEGACY_REQUIRED];
  RefreshRejectionReason reason = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      in: [
        1,
        2,
        3,
        4,
        5
      ]
    }
  ];
  TokenEndpointError provider_error = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Duration retry_after = 5 [(buf.validate.field).duration.gte = {}];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 6 [features.field_presence = LEGACY_REQUIRED];
}

// Dispatched only. The provider effect cannot be durably settled: the request
// may have left without an attributable response, or its replacement bundle
// could not be durably written/attributed after provider I/O. Key unavailability,
// CAS conflict, 5xx, a read timeout or a lost process follow ADR#0095 Decision 3. The
// operation stays unsettled until the recovery worker commits it, supersedes
// it on evidence, or invalidates the credential with REFRESH_OUTCOME_LOST.
// Never issued for a lease expiry or local timeout alone.
message RecordRefreshOutcomeUnknown {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.CredentialOperationId operation_id = 2 [features.field_presence = LEGACY_REQUIRED];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Active, or Unusable for a new reason, OAUTH_TOKEN_SET only. Custody learned
// the material cannot serve use until the user reconnects: the recovery
// worker found no evidence (REFRESH_OUTCOME_LOST), the restore sweep or a
// resolve found the generation behind the stream (CUSTODY_RESTORED), the
// returned authority widened, the tenant key was destroyed or declared lost,
// or the refresh token lapsed
// while refresh was paused (ADR#0095 Decisions 3, 4 and 10). INVALID_GRANT is
// decided only by RejectRefresh. An unsettled operation is closed by this
// command. For REFRESH_OUTCOME_LOST, CUSTODY_KEY_DESTROYED and
// CUSTODY_KEY_LOST the provider grant is unreachable and a
// PROVIDER_REVOKE_RESIDUAL debt is recorded in the same append.
// AUTHORITY_WIDENED also records that debt: candidate material is discarded and
// no token in the uncertain family is resolved or blindly refreshed. Custody
// reports the reason to the connections service as a health fact.
message InvalidateCredential {
  option (buf.validate.message).cel = {
    id: "invalidate_credential.custody_reason"
    message: "the reason is one custody decides"
    expression: "this.reason in [5, 8, 9, 10, 11, 13]"
  };

  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ConnectionHealthReason reason = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Active or Unusable, OAUTH_TOKEN_SET only, refused while a refresh is
// unsettled. A tier or KEK change re-sealed the bundle by compare-and-set at
// the same generation, producing a new KV version with the same plaintext
// (ADR#0095 Decision 4). The generation is unchanged.
message ResealTokenSet {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  // Must equal the current committed generation.
  uint64 bundle_generation = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  trogonai.secrets.v1alpha1.SecretVersionRef secret_version_ref = 3 [features.field_presence = LEGACY_REQUIRED];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 4 [features.field_presence = LEGACY_REQUIRED];
}

// Active or Unusable. The Connection was revoked, the ProviderApp retired, or
// offboarding reached this credential: refresh and resolve stop at once, and
// an unsettled refresh is closed, its result discarded by compare-and-set and
// the fence. Material is not destroyed here. For a live OAUTH_TOKEN_SET,
// DestroyCredentialMaterial is admitted only after SettleProviderRevoke; for
// every other kind it is admitted at once (ADR#0095 Decisions 1 and 2,
// ADR#0094 Decision 13).
message RevokeCredential {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 2 [features.field_presence = LEGACY_REQUIRED];
}

// Revoked only, OAUTH_TOKEN_SET only, at most once. The cleanup worker in
// custody called the provider's revocation endpoint, refresh token first, and
// the outcome is terminal (CONFIRMED, UNSUPPORTED, REJECTED) or the bounded
// retry window ended on UNAVAILABLE or UNKNOWN (ADR#0094 Decision 13). Any
// outcome but CONFIRMED records a PROVIDER_REVOKE_RESIDUAL debt in the same
// append. The connections service records the same outcome on the
// Connection for the owner; this record is what admits destruction here.
message SettleProviderRevoke {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.EffectOutcome outcome = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Records that custody destroyed, not deleted, the named versions (ADR#0095
// Decision 1). SUPERSEDED_VERSIONS is admitted in Active after a commit or a
// rotation and keeps the state. ALL_VERSIONS is admitted in Retired, in
// Revoked once a live token set's provider revoke is settled, and in Revoked
// at once for every other kind; it makes the credential Destroyed and
// settles any MATERIAL_UNDESTROYED debt.
message DestroyCredentialMaterial {
  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  MaterialDestroyScope scope = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}

// Any state but Destroyed. A cleanup step could not finish and its obligation
// is recorded as durable, queryable, aged debt for the lifecycle worker
// rather than dropped (ADR#0095 Decisions 1, 9 and 12). MATERIAL_UNDESTROYED
// is the failed destroy; DISCARDED_BUNDLE is recorded when a stage is
// discarded without a provider revoke. Recording the same open kind twice is
// accepted without a new event.
message RecordCredentialCleanupDebt {
  option (buf.validate.message).cel = {
    id: "record_credential_cleanup_debt.kind"
    message: "the debt is one custody owns"
    expression: "this.kind in [1, 2, 6]"
  };

  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.CleanupObligationKind kind = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 3 [features.field_presence = LEGACY_REQUIRED];
}
