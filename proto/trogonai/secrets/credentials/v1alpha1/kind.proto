edition = "2024";

package trogonai.secrets.credentials.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/connections/types/v1alpha1/identity.proto";
import "trogonai/connections/types/v1alpha1/reference.proto";
import "trogonai/connections/types/v1alpha1/resource_parent.proto";

// What kind of material a credential holds. Values 1 to 12 keep the numbers of
// the gateway credential kind (ADR#0095 Decision 1: existing enum numbers are
// preserved); 13 onward are the kinds ADR#0095 adds. The kind never changes
// after the credential is established. Unspecified and unknown values are
// invalid.
enum CredentialKind {
  CREDENTIAL_KIND_UNSPECIFIED = 0;
  CREDENTIAL_KIND_APP_TOKEN = 1;
  CREDENTIAL_KIND_BOT_TOKEN = 2;
  // An OAuth client secret. A dynamically registered client's secret reuses
  // this kind and is bound to its ProviderApp (ADR#0095 Decision 2).
  CREDENTIAL_KIND_CLIENT_SECRET = 3;
  CREDENTIAL_KIND_CLIENT_STATE = 4;
  CREDENTIAL_KIND_CONSUMER_SECRET = 5;
  // A shared secret that signs or verifies provider requests through
  // ComputeMac and VerifyProviderRequest, never resolved as a value
  // (ADR#0074 Q1).
  CREDENTIAL_KIND_SIGNING_SECRET = 6;
  CREDENTIAL_KIND_SIGNING_TOKEN = 7;
  CREDENTIAL_KIND_VERIFICATION_TOKEN = 8;
  CREDENTIAL_KIND_WEBHOOK_SECRET = 9;
  CREDENTIAL_KIND_WEBHOOK_TOKEN = 10;
  CREDENTIAL_KIND_SECRET_TOKEN = 11;
  CREDENTIAL_KIND_SERVICE_ACCOUNT_CREDENTIALS = 12;
  // One JSON bundle per connection holding the access and refresh tokens,
  // token type, both expiries, granted scope, issuer, canonical resource,
  // bundle_generation and the operation id and fence of the write that
  // produced it. The tokens rotate as a pair, so they share one value
  // (ADR#0095 Decision 1). Only this kind is refreshed, staged and promoted.
  CREDENTIAL_KIND_OAUTH_TOKEN_SET = 13;
  // The RFC 7592 registration access token of a dynamically registered client,
  // bound to its ProviderApp (ADR#0095 Decision 2).
  CREDENTIAL_KIND_REGISTRATION_ACCESS_TOKEN = 14;
  // The private key of a keyed ProviderApp, used only by the broker through
  // SignJwt for private_key_jwt client authentication (ADR#0094 Decision 9,
  // ADR#0095 Decision 5). ADR#0095 names no kind for it; this is the smallest
  // addition that keeps app private keys out of the value verb.
  CREDENTIAL_KIND_PRIVATE_KEY = 15;
}

// Which sealing purpose a token set is written under. The purpose is bound
// into the trogon/sealing/token-set/v1 layout with the tenant, SecretRef and
// bundle_generation (ADR#0095 Decision 4). Unspecified and unknown values are
// invalid.
enum CredentialPurpose {
  CREDENTIAL_PURPOSE_UNSPECIFIED = 0;
  // The live material a binding resolves. ADR#0095 names only the staged
  // purpose; LIVE is the smallest name for the other arm.
  CREDENTIAL_PURPOSE_LIVE = 1;
  // A token bundle staged under its authorization attempt, resolvable only
  // through an attempt reference, never refreshed, promoted by compare-and-set
  // or destroyed (ADR#0095 Decision 12).
  CREDENTIAL_PURPOSE_STAGED = 2;
}

// What the credential belongs to. A token set belongs to its Connection, a
// staged bundle to its authorization attempt until promotion, and a
// registration secret or private key to its ProviderApp (ADR#0095 Decisions
// 1, 2 and 12). The subject association is separate from the credential
// resource_parent; scope-qualified references allow exact containment checks.
message CredentialSubject {
  reserved 1;
  reserved connection;
  oneof subject {
    option (buf.validate.oneof).required = true;

    CredentialConnectionSubject connection_ref = 4;
    trogonai.connections.types.v1alpha1.ProviderAppRef provider_app = 2;
    trogonai.connections.types.v1alpha1.AuthorizationAttemptRef authorization_attempt = 3;
  }
}

// Identity-only connection association. Configuration pins are irrelevant to
// storage containment, but the custody project cannot be inferred from a bare
// connection id or from the credential caller.
message CredentialConnectionSubject {
  trogonai.connections.types.v1alpha1.ProjectResourceParent resource_parent = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.connections.types.v1alpha1.ConnectionId connection_id = 2 [features.field_presence = LEGACY_REQUIRED];
}
