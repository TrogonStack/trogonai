edition = "2024";

package trogonai.secrets.credentials.v1alpha1;

// The custody lifecycle of one credential. ADR#0095 names the transitions
// (staged, promoted, refreshed, revoked, destroyed) without an enum; this is
// the smallest set whose values decide what resolve, refresh and destroy may
// do. Unspecified and unknown values are invalid.
enum CredentialLifecycle {
  CREDENTIAL_LIFECYCLE_UNSPECIFIED = 0;
  // A token bundle staged under its attempt. Resolvable only through an
  // attempt reference while the attempt is open; never refreshed (ADR#0095
  // Decision 12).
  CREDENTIAL_LIFECYCLE_STAGED = 1;
  // Resolvable under a live grant and, for a token set, refreshed.
  CREDENTIAL_LIFECYCLE_ACTIVE = 2;
  // The material cannot serve use until the user reconnects: resolve fails
  // RECONNECT_REQUIRED and refresh stops. A reconnect promotes a new bundle
  // over it at the next generation and makes it Active again (ADR#0095
  // Decisions 3, 4, 10 and 12).
  CREDENTIAL_LIFECYCLE_UNUSABLE = 3;
  // Revoked: refresh and resolve stopped at once. Material is destroyed only
  // after the provider revoke outcome is terminal or its window ended
  // (ADR#0095 Decision 1, ADR#0094 Decision 13). Terminal for use.
  CREDENTIAL_LIFECYCLE_REVOKED = 4;
  // A stage closed by promotion or discard: no longer resolvable, awaiting
  // destruction of every version (ADR#0095 Decision 12). Terminal for use.
  CREDENTIAL_LIFECYCLE_RETIRED = 5;
  // Every version destroyed. Terminal.
  CREDENTIAL_LIFECYCLE_DESTROYED = 6;
}

// Why a staged bundle was discarded instead of promoted (ADR#0095 Decision
// 12). Unspecified and unknown values are invalid.
enum StageDiscardReason {
  STAGE_DISCARD_REASON_UNSPECIFIED = 0;
  STAGE_DISCARD_REASON_ATTEMPT_ABORTED = 1;
  // The attempt failed, ACCOUNT_ALREADY_CONNECTED included.
  STAGE_DISCARD_REASON_ATTEMPT_FAILED = 2;
  // The attempt's outcome was lost and reconciliation did not continue it.
  STAGE_DISCARD_REASON_ATTEMPT_LOST = 3;
  STAGE_DISCARD_REASON_ATTEMPT_EXPIRED = 4;
  // The orphan sweep verified a terminal unactivated attempt and an
  // unprotected stage under CAS. Passing expiry alone is never sufficient.
  STAGE_DISCARD_REASON_ORPHAN_SWEEP = 5;
}

// Which versions a destroy covers. Destroy, never delete, because delete is
// reversible (ADR#0095 Decision 1). Unspecified and unknown values are
// invalid.
enum MaterialDestroyScope {
  MATERIAL_DESTROY_SCOPE_UNSPECIFIED = 0;
  // Every version but the current one, after a refresh commits.
  MATERIAL_DESTROY_SCOPE_SUPERSEDED_VERSIONS = 1;
  // Every version, after revoke settlement, stage close or app retirement.
  MATERIAL_DESTROY_SCOPE_ALL_VERSIONS = 2;
}
