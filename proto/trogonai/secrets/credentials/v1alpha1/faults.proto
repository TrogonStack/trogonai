edition = "2024";

package trogonai.secrets.credentials.v1alpha1;

import "trogon/error/v1alpha1/options.proto";

// Schema-only Decider error templates, never encoded. Resolve failures are
// not here: they are the closed taxonomy of secrets.exchange (ADR#0095
// Decision 11). No fault detail carries a token, a version value, an OpenBao
// path or a provider body. Concurrency faults use the Decider channel.
message CredentialCommandInvalidError {
  option (trogon.error.v1alpha1.message).template = {
    domain: "secrets.credentials"
    reason: "CREDENTIAL_COMMAND_INVALID"
    message: "The command violates the credential custody contract."
    code: FAILED_PRECONDITION
    visibility: VISIBILITY_PUBLIC
  };
}

message CredentialAlreadyExistsError {
  option (trogon.error.v1alpha1.message).template = {
    domain: "secrets.credentials"
    reason: "CREDENTIAL_ALREADY_EXISTS"
    message: "The SecretRef already has a credential stream."
    code: FAILED_PRECONDITION
    visibility: VISIBILITY_PUBLIC
  };
}

message CredentialNotFoundError {
  option (trogon.error.v1alpha1.message).template = {
    domain: "secrets.credentials"
    reason: "CREDENTIAL_NOT_FOUND"
    message: "The credential must be established, staged or promoted before this command."
    code: FAILED_PRECONDITION
    visibility: VISIBILITY_PUBLIC
  };
}

// The lifecycle state does not admit the command: a refresh on an Unusable
// credential, a stage close on a live token set, a destroy of a revoked token
// set before its provider revoke settled, and the like.
message CredentialLifecycleConflictError {
  option (trogon.error.v1alpha1.message).template = {
    domain: "secrets.credentials"
    reason: "CREDENTIAL_LIFECYCLE_CONFLICT"
    message: "The credential's lifecycle state does not admit this command."
    code: FAILED_PRECONDITION
    visibility: VISIBILITY_PUBLIC
  };
}

// The command is for a kind or purpose that does not support it: a refresh,
// promotion, reseal or provider revoke on anything but a live OAUTH_TOKEN_SET,
// or an establish or rotation of a token set.
message CredentialKindMismatchError {
  option (trogon.error.v1alpha1.message).template = {
    domain: "secrets.credentials"
    reason: "CREDENTIAL_KIND_MISMATCH"
    message: "The credential's kind or purpose does not support this command."
    code: FAILED_PRECONDITION
    visibility: VISIBILITY_PUBLIC
  };
}

// A second dispatch while one refresh is unsettled, the single-flight rule
// of ADR#0095 Decision 3. The loser waits on the winner's operation.
message CredentialRefreshInFlightError {
  option (trogon.error.v1alpha1.message).template = {
    domain: "secrets.credentials"
    reason: "CREDENTIAL_REFRESH_IN_FLIGHT"
    message: "A refresh is already dispatched and unsettled for this credential."
    code: FAILED_PRECONDITION
    visibility: VISIBILITY_PUBLIC
  };
}

// A settlement names an operation other than the unsettled one, or there is
// no unsettled operation.
message CredentialOperationMismatchError {
  option (trogon.error.v1alpha1.message).template = {
    domain: "secrets.credentials"
    reason: "CREDENTIAL_OPERATION_MISMATCH"
    message: "The operation is not the credential's unsettled refresh."
    code: FAILED_PRECONDITION
    visibility: VISIBILITY_PUBLIC
  };
}

// An expected or produced bundle generation, a fence or a version does not
// follow the stream: the generation is not the current one plus one, the
// fence is not above every recorded fence, or the version is not above the
// current one.
message CredentialGenerationMismatchError {
  option (trogon.error.v1alpha1.message).template = {
    domain: "secrets.credentials"
    reason: "CREDENTIAL_GENERATION_MISMATCH"
    message: "The generation, fence or version does not follow the credential stream."
    code: FAILED_PRECONDITION
    visibility: VISIBILITY_PUBLIC
  };
}
