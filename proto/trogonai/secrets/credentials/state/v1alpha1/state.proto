edition = "2024";

package trogonai.secrets.credentials.state.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/connections/types/v1alpha1/cleanup.proto";
import "trogonai/connections/types/v1alpha1/health.proto";
import "trogonai/connections/types/v1alpha1/identity.proto";
import "trogonai/connections/types/v1alpha1/outcome.proto";
import "trogonai/connections/types/v1alpha1/resource_parent.proto";
import "trogonai/secrets/credentials/v1alpha1/bundle.proto";
import "trogonai/secrets/credentials/v1alpha1/kind.proto";
import "trogonai/secrets/credentials/v1alpha1/lifecycle.proto";
import "trogonai/secrets/credentials/v1alpha1/refresh.proto";
import "trogonai/secrets/v1alpha1/secret_ref.proto";

// The present fold retains its immutable resource_parent from genesis. A
// command or event with another parent is refused before applying a transition;
// current hierarchy placement and logical ownership do not rewrite this value.

// One fold per SecretRef, not a joined projection. Unknown events and invalid
// transitions reject replay. Missing is the explicit initial state. The
// state holds references, generations, expiries and outcomes only, never
// material (ADR#0095 Decision 1).
message State {
  oneof state {
    option (buf.validate.oneof).required = true;

    google.protobuf.Empty missing = 1;
    Credential present = 2;
  }
}

// What custody holds for one SecretRef. A resolve is admitted from this state
// alone: Active (or Staged under an attempt reference) with no unsettled
// refresh, at the current bundle generation; anything else fails with the
// matching category (ADR#0095 Decisions 5, 11 and 12).
message Credential {
  option (buf.validate.message).cel = {
    id: "credential_state.kind_subject"
    message: "registration secret kinds belong to apps, token sets to connections or attempts"
    expression: "(this.kind in [3, 14, 15]) == has(this.subject.provider_app) && (this.kind != 13 || has(this.subject.connection_ref) || has(this.subject.authorization_attempt)) && (!has(this.subject.authorization_attempt) || this.kind == 13)"
  };

  option (buf.validate.message).cel = {
    id: "credential_state.purpose_subject"
    message: "only a staged credential belongs to an authorization attempt"
    expression: "(this.purpose == 2) == has(this.subject.authorization_attempt)"
  };

  option (buf.validate.message).cel = {
    id: "credential_state.subject_parent"
    message: "stored credential containment equals its qualified subject container"
    expression: "(has(this.subject.connection_ref) && has(this.resource_parent.project) && this.resource_parent.project == this.subject.connection_ref.resource_parent) || (has(this.subject.authorization_attempt) && has(this.resource_parent.project) && this.resource_parent.project == this.subject.authorization_attempt.resource_parent) || (has(this.subject.provider_app) && ((has(this.resource_parent.platform) && has(this.subject.provider_app.resource_parent.platform)) || (has(this.resource_parent.project) && has(this.subject.provider_app.resource_parent.project) && this.resource_parent.project == this.subject.provider_app.resource_parent.project)))"
  };

  option (buf.validate.message).cel = {
    id: "credential_state.staged_purpose"
    message: "a STAGED purpose carries its attempt expiry and is Staged, Retired or Destroyed; LIVE is never Staged or Retired"
    expression: "(this.purpose == 2) == has(this.stage_expires_at) && (this.purpose == 2 ? this.lifecycle in [1, 5, 6] : !(this.lifecycle in [1, 5]))"
  };
  option (buf.validate.message).cel = {
    id: "credential_state.token_set_bundle"
    message: "a token set carries its current bundle and generation; no other kind does"
    expression: "(this.kind == 13) == (has(this.bundle) && this.bundle_generation > 0)"
  };
  option (buf.validate.message).cel = {
    id: "credential_state.unsettled_refresh"
    message: "an unsettled refresh exists only on an Active live token set"
    expression: "!has(this.unsettled_refresh) || (this.kind == 13 && this.purpose == 1 && this.lifecycle == 2)"
  };
  option (buf.validate.message).cel = {
    id: "credential_state.invalidation_reason"
    message: "an invalidation reason is present exactly when the credential is Unusable"
    expression: "(this.lifecycle == 3) == has(this.invalidation_reason)"
  };
  option (buf.validate.message).cel = {
    id: "credential_state.provider_revoke"
    message: "a provider revoke outcome exists only on a revoked or destroyed live token set"
    expression: "!has(this.provider_revoke_outcome) || (this.kind == 13 && this.purpose == 1 && (this.lifecycle == 4 || this.lifecycle == 6))"
  };

  trogonai.secrets.v1alpha1.SecretRef secret_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.secrets.credentials.v1alpha1.CredentialKind kind = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  trogonai.secrets.credentials.v1alpha1.CredentialPurpose purpose = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // The attempt for a staged bundle; the connection or app otherwise. A
  // promoted live token set keeps its connection subject across reconnects.
  trogonai.secrets.credentials.v1alpha1.CredentialSubject subject = 4 [features.field_presence = LEGACY_REQUIRED];
  trogonai.secrets.credentials.v1alpha1.CredentialLifecycle lifecycle = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // The version resolution serves. For a token set it is the version of
  // bundle; for every other kind the version last established or rotated.
  trogonai.secrets.v1alpha1.SecretVersionRef current_version = 6 [features.field_presence = LEGACY_REQUIRED];
  // Token set only. The last committed generation; the opener binds it so a
  // restored older version fails to open (ADR#0095 Decision 4). A staged
  // bundle is at generation 1 of its own path.
  uint64 bundle_generation = 7;
  // Token set only. The facts of the bundle at bundle_generation.
  trogonai.secrets.credentials.v1alpha1.TokenBundle bundle = 8;
  // Live token set only. The highest fence any dispatch recorded; the next
  // dispatch must exceed it (ADR#0095 Decision 3).
  uint64 last_fence = 9;
  // Present while a refresh is Dispatched or OutcomeUnknown. The family is
  // held: resolve fails REFRESH_PENDING and no second dispatch is admitted.
  UnsettledRefresh unsettled_refresh = 10;
  // Present exactly while Unusable.
  trogonai.connections.types.v1alpha1.ConnectionHealthReason invalidation_reason = 11 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Present once SettleProviderRevoke recorded the outcome.
  trogonai.connections.types.v1alpha1.EffectOutcome provider_revoke_outcome = 12 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Staged bundle only: the attempt expiry after which the stage is an
  // orphan.
  google.protobuf.Timestamp stage_expires_at = 13 [(buf.validate.field).timestamp.gt = {seconds: 0}];
  // Open cleanup obligations, each kind at most once. MATERIAL_UNDESTROYED is
  // removed by a destroy of all versions; the others stay until the
  // lifecycle worker reports them elsewhere.
  repeated trogonai.connections.types.v1alpha1.CleanupObligationKind open_cleanup_debt = 14 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  trogonai.connections.types.v1alpha1.CredentialResourceParent resource_parent = 15 [features.field_presence = LEGACY_REQUIRED];
}

// The one refresh that may be in flight (ADR#0095 Decision 3).
message UnsettledRefresh {
  trogonai.connections.types.v1alpha1.CredentialOperationId operation_id = 1 [features.field_presence = LEGACY_REQUIRED];
  uint64 expected_bundle_generation = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 fence = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).uint64.gt = 0
  ];
  trogonai.secrets.credentials.v1alpha1.RefreshTrigger trigger = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // True once CredentialRefreshOutcomeUnknown named the operation; the
  // recovery worker then settles it in the order ADR#0095 Decision 3 fixes.
  bool outcome_unknown = 5 [features.field_presence = LEGACY_REQUIRED];
}
