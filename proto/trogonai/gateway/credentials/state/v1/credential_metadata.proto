edition = "2024";

package trogonai.gateway.credentials.state.v1;

import "trogonai/gateway/credentials/v1/credential_metadata.proto";
import "trogonai/gateway/credentials/v1/credential_ref.proto";

message CredentialMetadata {
  trogonai.gateway.credentials.v1.CredentialRef reference = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.gateway.credentials.v1.CredentialStatus status = 2;
  string fingerprint = 4 [features.field_presence = LEGACY_REQUIRED];
  string storage_locator = 5 [features.field_presence = LEGACY_REQUIRED];
}
