edition = "2024";

package trogonai.gateway.credentials.v1;

import "trogon/uuid/v1/options.proto";

enum CredentialSource {
  CREDENTIAL_SOURCE_UNSPECIFIED = 0;
  CREDENTIAL_SOURCE_DISCORD = 1;
  CREDENTIAL_SOURCE_GITHUB = 2;
  CREDENTIAL_SOURCE_GITLAB = 3;
  CREDENTIAL_SOURCE_INCIDENTIO = 4;
  CREDENTIAL_SOURCE_LINEAR = 5;
  CREDENTIAL_SOURCE_MICROSOFT_GRAPH = 6;
  CREDENTIAL_SOURCE_NOTION = 7;
  CREDENTIAL_SOURCE_SENTRY = 8;
  CREDENTIAL_SOURCE_SLACK = 9;
  CREDENTIAL_SOURCE_TELEGRAM = 10;
  CREDENTIAL_SOURCE_TWITTER = 11;
  CREDENTIAL_SOURCE_DATADOG = 12;
  CREDENTIAL_SOURCE_GOOGLE_PUBSUB = 13;
  CREDENTIAL_SOURCE_ZOOM = 14;
  CREDENTIAL_SOURCE_PLAID = 15;
}

enum CredentialKind {
  CREDENTIAL_KIND_UNSPECIFIED = 0;
  CREDENTIAL_KIND_APP_TOKEN = 1;
  CREDENTIAL_KIND_BOT_TOKEN = 2;
  CREDENTIAL_KIND_CLIENT_SECRET = 3;
  CREDENTIAL_KIND_CLIENT_STATE = 4;
  CREDENTIAL_KIND_CONSUMER_SECRET = 5;
  CREDENTIAL_KIND_SIGNING_SECRET = 6;
  CREDENTIAL_KIND_SIGNING_TOKEN = 7;
  CREDENTIAL_KIND_VERIFICATION_TOKEN = 8;
  CREDENTIAL_KIND_WEBHOOK_SECRET = 9;
  CREDENTIAL_KIND_WEBHOOK_TOKEN = 10;
  CREDENTIAL_KIND_SECRET_TOKEN = 11;
  CREDENTIAL_KIND_SERVICE_ACCOUNT_CREDENTIALS = 12;
}

// The rule a credential id was derived by. Replay reads the id recorded on the
// write request and never derives it again, so a new rule is a new value here
// and the ids already recorded keep the rule they were minted under.
enum CredentialIdentityVersion {
  option (trogon.uuid.v1.enum).namespace = {uuid: "0b0e6d1c-71a4-4c1e-9f0a-3c52e8d417aa"};

  CREDENTIAL_IDENTITY_VERSION_UNSPECIFIED = 0;
  CREDENTIAL_IDENTITY_VERSION_V1 = 1 [(trogon.uuid.v1.enum_value).format = {template: "{owner_id}/{scope_key}/{kind}"}];
}

// Everything a credential is, recorded once on the write request that opens its
// stream. Every later event names the credential by its key alone.
message CredentialIdentity {
  string credential_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string owner_id = 2 [features.field_presence = LEGACY_REQUIRED];
  CredentialSource source = 3;
  string scope_key = 4 [features.field_presence = LEGACY_REQUIRED];
  CredentialKind kind = 5;
  CredentialIdentityVersion identity_version = 6;
}

message CredentialKey {
  string credential_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string owner_id = 2 [features.field_presence = LEGACY_REQUIRED];
}
