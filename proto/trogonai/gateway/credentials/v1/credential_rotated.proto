edition = "2024";

package trogonai.gateway.credentials.v1;

import "trogonai/gateway/credentials/v1/credential_identity.proto";

message CredentialRotated {
  CredentialKey key = 1 [features.field_presence = LEGACY_REQUIRED];
  uint64 previous_version = 2;
  uint64 version = 3;
  string fingerprint = 4 [features.field_presence = LEGACY_REQUIRED];
}
