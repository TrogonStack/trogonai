edition = "2024";

package trogonai.evaluation.rubrics.v1alpha1;

import "trogonai/evaluation/rubrics/v1alpha1/claim_check.proto";
import "trogonai/evaluation/rubrics/v1alpha1/rubric_version_ref.proto";

// The version and the criteria it points at are immutable once recorded. Neither
// the rubric nor its criteria may be readable through any agent, proposal, or
// session query; they exist only in the evaluation streams (ADR#0024,
// ADR#0025).
message RubricVersionAdded {
  RubricVersionRef version_ref = 1 [features.field_presence = LEGACY_REQUIRED];
  ClaimCheck criteria_ref = 2 [features.field_presence = LEGACY_REQUIRED];
}
