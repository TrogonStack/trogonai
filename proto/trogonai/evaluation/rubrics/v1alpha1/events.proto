edition = "2024";

package trogonai.evaluation.rubrics.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/evaluation/rubrics/v1alpha1/rubric_registered.proto";

// An unset or unknown event rejects replay; skipping a registration could let a
// binding resolve to a rubric the stream never held.
message RubricEvent {
  oneof event {
    option (buf.validate.oneof).required = true;

    RubricRegistered rubric_registered = 1;
  }
}
