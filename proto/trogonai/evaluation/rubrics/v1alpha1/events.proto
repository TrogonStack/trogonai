edition = "2024";

package trogonai.evaluation.rubrics.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/evaluation/rubrics/v1alpha1/rubric_registered.proto";
import "trogonai/evaluation/rubrics/v1alpha1/rubric_retired.proto";
import "trogonai/evaluation/rubrics/v1alpha1/rubric_version_added.proto";

// An unset or unknown event rejects replay; skipping a version could let a
// binding resolve to criteria the stream never held.
message RubricEvent {
  oneof event {
    option (buf.validate.oneof).required = true;

    RubricRegistered rubric_registered = 1;
    RubricVersionAdded rubric_version_added = 2;
    RubricRetired rubric_retired = 3;
  }
}
