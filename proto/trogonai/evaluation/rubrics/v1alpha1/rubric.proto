edition = "2024";

package trogonai.evaluation.rubrics.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "trogonai/agents/agents/v1alpha1/digest.proto";

// Criteria are opaque to the agent under evaluation. Neither the rubric nor its
// criteria may be readable through any agent, proposal, or session query; they
// exist only in the evaluation streams (ADR#0024, ADR#0025).
message Rubric {
  string rubric_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string display_name = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  google.protobuf.Any criteria = 3 [features.field_presence = LEGACY_REQUIRED];
  trogonai.agents.agents.v1alpha1.Digest criteria_digest = 4 [features.field_presence = LEGACY_REQUIRED];
}
