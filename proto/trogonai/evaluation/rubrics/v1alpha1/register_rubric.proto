edition = "2024";

package trogonai.evaluation.rubrics.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/evaluation/rubrics/v1alpha1/rubric_id.proto";

// Registers a rubric identity with no criteria; criteria arrive only through
// AddRubricVersion. NoStream creation requires a nonempty Decider command_id and
// no expected_revision; retries preserve the id. An already-registered rubric is
// rejected, never overwritten.
message RegisterRubric {
  RubricId rubric_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string display_name = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
