edition = "2024";

package trogonai.evaluation.comparisons.v1alpha1;

import "buf/validate/validate.proto";

// CandidateLabel is the blind label a run carries within one comparison. It is a value object assigned once, and it reveals nothing about candidate identity or origin.
message CandidateLabel {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
