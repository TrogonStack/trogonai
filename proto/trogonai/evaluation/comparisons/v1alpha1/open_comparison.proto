edition = "2024";

package trogonai.evaluation.comparisons.v1alpha1;

import "trogonai/agents/agents/v1alpha1/agent_revision.proto";
import "trogonai/evaluation/comparisons/v1alpha1/claim_check.proto";
import "trogonai/evaluation/comparisons/v1alpha1/comparison_id.proto";

// Opens a comparison: a group of runs over the same task against the same base
// revision. NoStream creation requires a nonempty Decider command_id and no
// expected_revision; retries preserve the id. An already-opened comparison is
// rejected, never replaced.
message OpenComparison {
  ComparisonId comparison_id = 1 [features.field_presence = LEGACY_REQUIRED];
  trogonai.agents.agents.v1alpha1.AgentRevisionRef base_revision_ref = 2 [features.field_presence = LEGACY_REQUIRED];
  // The shared task every run in the comparison was given, held out of line.
  ClaimCheck task_ref = 3 [features.field_presence = LEGACY_REQUIRED];
}
