edition = "2024";

package trogonai.evaluation.comparisons.v1alpha1;

import "trogonai/evaluation/comparisons/v1alpha1/comparison_id.proto";

// Closing stops further enrollment and keeps every enrolled run. Dispatch
// requires the original positive expected_revision; an already closed
// comparison succeeds without an event after that concurrency check.
message CloseComparison {
  ComparisonId comparison_id = 1 [features.field_presence = LEGACY_REQUIRED];
}
