edition = "2024";

package trogonai.evaluation.bindings.v1alpha1;

import "buf/validate/validate.proto";

// EvaluationResultId is the identity of one recorded evaluation result. A proposal verdict cites it through EvaluationResultRef.
message EvaluationResultId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
