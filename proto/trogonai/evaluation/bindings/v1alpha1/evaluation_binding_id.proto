edition = "2024";

package trogonai.evaluation.bindings.v1alpha1;

import "buf/validate/validate.proto";

// EvaluationBindingId is the identity of one evaluation binding stream.
message EvaluationBindingId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
