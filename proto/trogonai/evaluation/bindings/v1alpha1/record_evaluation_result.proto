edition = "2024";

package trogonai.evaluation.bindings.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/agents/agents/v1alpha1/digest.proto";
import "trogonai/evaluation/bindings/v1alpha1/score.proto";

// Records one judged result against a live binding. overlay_digest, when
// present, ties the score to the candidate overlay that was measured. The
// evaluation_result_id and content_digest are what a proposal verdict later
// cites through its EvaluationResultRef; the score itself never leaves this
// stream. A repeated evaluation_result_id is rejected, never overwritten.
message RecordEvaluationResult {
  string evaluation_result_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string binding_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string session_id = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  trogonai.agents.agents.v1alpha1.Digest overlay_digest = 4;
  Score score = 5 [features.field_presence = LEGACY_REQUIRED];
  trogonai.agents.agents.v1alpha1.Digest content_digest = 6 [features.field_presence = LEGACY_REQUIRED];
}
