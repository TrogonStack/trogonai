edition = "2024";

package trogonai.evaluation.bindings.v1alpha1;

import "trogonai/agents/agents/v1alpha1/digest.proto";
import "trogonai/agents/candidates/v1alpha1/candidate_ref.proto";
import "trogonai/evaluation/bindings/v1alpha1/claim_check.proto";
import "trogonai/evaluation/bindings/v1alpha1/evaluation_binding_id.proto";
import "trogonai/evaluation/bindings/v1alpha1/evaluation_result_id.proto";
import "trogonai/evaluation/bindings/v1alpha1/score.proto";
import "trogonai/session/sessions/v1alpha1/session_position_ref.proto";

// Records one judged result against a live binding. evaluated_ref is a temporal
// pointer to the run that was measured: that session's log as of that ordinal.
// candidate_ref, when present, ties the score to the recorded candidate that
// run executed. The evaluation_result_id and content_digest are what a proposal
// verdict later cites through its EvaluationResultRef; the score itself never
// leaves this stream. A repeated evaluation_result_id is rejected, never
// overwritten.
message RecordEvaluationResult {
  EvaluationResultId evaluation_result_id = 1 [features.field_presence = LEGACY_REQUIRED];
  EvaluationBindingId binding_id = 2 [features.field_presence = LEGACY_REQUIRED];
  trogonai.session.sessions.v1alpha1.SessionPositionRef evaluated_ref = 3 [features.field_presence = LEGACY_REQUIRED];
  trogonai.agents.candidates.v1alpha1.CandidateRef candidate_ref = 4;
  // The score is the fact and is recorded inline.
  Score score = 5 [features.field_presence = LEGACY_REQUIRED];
  // The judge's reasoning, held out of line.
  ClaimCheck rationale_ref = 6;
  trogonai.agents.agents.v1alpha1.Digest content_digest = 7 [features.field_presence = LEGACY_REQUIRED];
}
