edition = "2024";

package trogonai.policy.agent_rate_limits.v1alpha1;

import "buf/validate/validate.proto";

// Removes the policy, never the identity or previously counted and reserved
// requests. An already cleared history emits no second clear.
message AgentRateLimitCleared {
  string agent_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
