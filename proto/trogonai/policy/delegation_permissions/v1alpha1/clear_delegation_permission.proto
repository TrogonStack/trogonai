edition = "2024";

package trogonai.policy.delegation_permissions.v1alpha1;

import "trogonai/policy/subjects/v1alpha1/subject.proto";

// Clears only this subject's permit, which returns it to deny unless an
// ancestor node still permits the target. The initialized identity remains.
// Dispatch requires live authority and a nonempty Decider command_id plus the
// original positive expected_revision; retries preserve both. An already cleared
// permission succeeds without an event after that concurrency check. For an
// Agent subject, authoritative registry lifecycle must be ACTIVE or ARCHIVED,
// so requested provisioning setup cannot disappear before activation.
message ClearDelegationPermission {
  trogonai.policy.subjects.v1alpha1.PolicySubject subject = 1 [features.field_presence = LEGACY_REQUIRED];
}
