edition = "2024";

package trogonai.policy.agent_budgets.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/policy/agent_budgets/v1alpha1/budget_policy.proto";

// Replaces policy without replacing its accounting history or denomination.
message AgentBudgetSet {
  string agent_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  AgentBudgetPolicy policy = 2 [features.field_presence = LEGACY_REQUIRED];
}
