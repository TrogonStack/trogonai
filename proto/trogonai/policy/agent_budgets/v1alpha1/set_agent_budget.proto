edition = "2024";

package trogonai.policy.agent_budgets.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/policy/agent_budgets/v1alpha1/budget_policy.proto";

// Replaces an initialized Agent's policy, including after a clear. Dispatch
// requires live administration authority and a nonempty Decider command_id plus
// original positive expected_revision. Retries preserve both; a refreshed
// revision is a new intent. The accounting currency cannot change.
// Equal limits by period succeed without an event after the concurrency check;
// reordering limits alone is not a change. Accounting history is untouched.
// Authoritative current registry lifecycle must be ACTIVE or ARCHIVED. Pending,
// cancelled, or unknown lifecycle rejects normal replacement, preserving required
// provisioning setup. Genesis provisioning origin survives every replacement.
message SetAgentBudget {
  string agent_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  AgentBudgetPolicy policy = 2 [features.field_presence = LEGACY_REQUIRED];
}
