edition = "2024";

package trogonai.policy.agent_budgets.v1alpha1;

import "buf/validate/validate.proto";

// Clears only the Agent-specific cap. The initialized identity, currency, and
// accounting history remain. Other applicable policies still constrain spend.
// Dispatch requires live authority and a nonempty Decider command_id plus
// the original positive expected_revision; retries preserve both. An already
// cleared policy succeeds without an event after that concurrency check.
// Authoritative current registry lifecycle must be ACTIVE or ARCHIVED. Pending,
// cancelled, or unknown lifecycle rejects clearing, so requested provisioning
// limits cannot disappear before activation. Genesis provisioning origin remains.
message ClearAgentBudget {
  string agent_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
