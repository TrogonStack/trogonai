edition = "2024";

package trogonai.policy.agent_budgets.state.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "trogonai/policy/agent_budgets/v1alpha1/budget_policy.proto";

// Policy fold only. Authoritative incurred spend and remaining reservations
// belong to accounting, and are never reconstructed from these policy events.
// Replay rejects unknown events, identity or currency changes, repeated genesis,
// and mutations before initialization. Clear retains initialized state.
// Provisioning origin is copied from genesis and never cleared or replaced.
message State {
  oneof state {
    option (buf.validate.oneof).required = true;

    google.protobuf.Empty missing = 1;
    InitializedAgentBudget initialized = 2;
  }
}

message InitializedAgentBudget {
  option (buf.validate.message).cel = {
    id: "initialized_agent_budget.currency_matches"
    message: "the policy must retain the initialized accounting currency"
    expression: "!has(this.policy) || this.policy.limits.all(limit, limit.maximum.currency_code == this.currency_code)"
  };

  string agent_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  // Fixed at initialization and retained even while the policy is cleared.
  string currency_code = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.pattern = "^[A-Z]{3}$"
  ];
  // Absence means cleared, not zero. Restoring limits consults the same history.
  trogonai.policy.agent_budgets.v1alpha1.AgentBudgetPolicy policy = 3;
  string provisioning_id = 4 [(buf.validate.field).cel = {
    id: "initialized_agent_budget.provisioning_id_nonblank"
    message: "a supplied provisioning_id must contain a non-whitespace character"
    expression: "this.trim() != ''"
  }];
}
