edition = "2024";

package trogonai.policy.subjects.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/policy/subjects/v1alpha1/subject.proto";

// PolicyRuleRef names one policy history, at one revision, that an admission or
// a protected action evaluated. Session admission and accounting record these
// rather than copying policies, so a past decision can be reconstructed from
// the policy streams at the recorded revisions without the stream ever being
// pinned (ADR#0025 "authorization never pins"). Unknown kinds reject.
enum PolicyRuleKind {
  POLICY_RULE_KIND_UNSPECIFIED = 0;
  POLICY_RULE_KIND_AGENT_BUDGET = 1;
  POLICY_RULE_KIND_AGENT_RATE_LIMIT = 2;
  POLICY_RULE_KIND_HOLD = 3;
  POLICY_RULE_KIND_MODEL_CEILING = 4;
}

message PolicyRuleRef {
  PolicyRuleKind kind = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  PolicySubject subject = 2 [features.field_presence = LEGACY_REQUIRED];
  // The policy stream's revision that was current when evaluated. Zero means
  // the history did not exist, which is itself a fact a reviewer needs.
  uint64 stream_revision = 3 [features.field_presence = LEGACY_REQUIRED];
}
