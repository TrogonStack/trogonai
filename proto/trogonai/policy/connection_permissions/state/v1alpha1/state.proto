edition = "2024";

package trogonai.policy.connection_permissions.state.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "trogonai/policy/connection_permissions/v1alpha1/parent.proto";
import "trogonai/policy/connection_permissions/v1alpha1/permission_policy.proto";
import "trogonai/policy/subjects/v1alpha1/subject.proto";

// The present fold retains its immutable resource_parent from genesis. A
// command or event with another parent is refused before applying a transition;
// current hierarchy placement and logical ownership do not rewrite this value.

// Policy fold only. Replay rejects unknown events, a subject change, repeated
// genesis, and mutations before initialization. Clear retains initialized state.
// Provisioning origin is copied from genesis and never cleared or replaced.
// Owner kinds, tenancy and owner access are joined live from the connection
// directory at evaluation, never folded here.
message State {
  oneof state {
    option (buf.validate.oneof).required = true;

    google.protobuf.Empty missing = 1;
    InitializedConnectionPermission initialized = 2;
  }
}

message InitializedConnectionPermission {
  option (buf.validate.message).cel = {
    id: "initializedconnectionpermission.subject_parent"
    message: "the policy resource parent must name its exact subject"
    expression: "this.resource_parent.subject == this.subject"
  };

  trogonai.policy.subjects.v1alpha1.PolicySubject subject = 1 [features.field_presence = LEGACY_REQUIRED];
  // Absence means cleared, which is deny rather than a permit of nothing in
  // particular. Restoring permits consults the same history.
  trogonai.policy.connection_permissions.v1alpha1.ConnectionPermissionPolicy policy = 2;
  string provisioning_id = 3 [(buf.validate.field).cel = {
    id: "initialized_connection_permission.provisioning_id_nonblank"
    message: "a supplied provisioning_id must contain a non-whitespace character"
    expression: "this.trim() != ''"
  }];

  trogonai.policy.connection_permissions.v1alpha1.ConnectionPermissionParent resource_parent = 4 [features.field_presence = LEGACY_REQUIRED];
}
