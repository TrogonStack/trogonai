edition = "2024";

package trogonai.session.sessions.artifacts.v1alpha1;

// Value types for the Session artifact read contract.
//
// These are redefined here rather than imported from the write side on purpose
// (ADR#0035 facet 3). The write side records what happened to an artifact; this
// contract answers what a caller can get right now, and the two change for
// different reasons and on different cadences.

// ArtifactAvailability is what a caller can expect to read, and why, when the
// answer is not "the bytes".
//
// A claim-check can fail to resolve for reasons that are not interchangeable,
// and collapsing them into a single "missing" is how deliberate destruction
// gets reported as data loss and how a transient storage fault gets reported as
// permanent. Every non-AVAILABLE value here is a distinct operational
// situation with a distinct correct response.
//
// The vocabulary deliberately reuses the Session doctor's
// mismatch/absent/unreadable distinction rather than inventing a second
// taxonomy for the same three facts.
enum ArtifactAvailability {
  ARTIFACT_AVAILABILITY_UNSPECIFIED = 0;
  // The bytes are readable now.
  ARTIFACT_AVAILABILITY_AVAILABLE = 1;
  // Destroyed on purpose and recorded as such by ArtifactErased. The
  // claim-check and its provenance remain on the log; the bytes are gone and
  // are not coming back. This is a correct end state, not a fault, and a reader
  // that renders it as damage will send someone looking for a problem that was
  // the point.
  ARTIFACT_AVAILABILITY_ERASED = 2;
  // The store reports no such object, and no erasure was ever recorded. This is
  // the one value that means something went wrong: the log says bytes exist
  // that do not.
  ARTIFACT_AVAILABILITY_MISSING = 3;
  // The artifact was recorded as an external reference whose bytes were never
  // durably stored. There is nothing to range-read, and there never was; the
  // source location may or may not still serve them, which is not this
  // contract's claim to make.
  ARTIFACT_AVAILABILITY_EXTERNAL_ONLY = 4;
  // The object was read and does not match the digest recorded on the log. The
  // bytes exist and are not the artifact's, so serving them silently would hand
  // a caller content under a claim-check it does not satisfy.
  ARTIFACT_AVAILABILITY_CORRUPT = 5;
  // The object could not be read. Unlike MISSING this makes no claim about
  // whether the bytes exist: a permissions or transport fault against the
  // artifact store looks identical from here, and a retry may succeed.
  ARTIFACT_AVAILABILITY_UNREADABLE = 6;
  // The caller may see that this artifact exists and may not read it.
  //
  // This is reported, rather than answered as MISSING, only because the caller
  // can already see the claim-check in the session's own history. Hiding the
  // bytes from someone who is looking at the reference protects the content;
  // pretending the reference is dangling would just describe the session
  // incorrectly. An artifact belonging to a session the caller cannot see is
  // never reachable to be labelled at all.
  ARTIFACT_AVAILABILITY_HIDDEN = 7;
}
