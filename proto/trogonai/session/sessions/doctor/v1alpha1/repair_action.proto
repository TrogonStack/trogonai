edition = "2024";

package trogonai.session.sessions.doctor.v1alpha1;

// RepairAction is something the doctor can do about a finding.
//
// Every value in this enum operates on derived state: a projection, a
// checkpoint, a snapshot, a claim. That is not a coincidence and it is not a
// starting point to be extended later.
//
// The event stream is the source of truth and it is append-only. A repair that
// edited, deleted, or reordered events would make the log depend on the tooling
// built to inspect it, and every guarantee that rests on replay determinism
// would rest instead on nobody having run the wrong repair. So no such action
// exists here, and adding one is a decision about the architecture rather than
// an addition to a list.
//
// The corollary catches the case operators most often expect to find here.
// Reconciling a tool call that never recorded an outcome is not a repair. It is
// CompleteToolCall or FailToolCall, an ordinary command through the ordinary
// decider, subject to the ordinary invariants. Routing it through the doctor
// would let an operator write history without passing the rules that make the
// history mean anything.
enum RepairAction {
  REPAIR_ACTION_UNSPECIFIED = 0;
  // Rebuild a projection from the stream under a new generation. The workhorse:
  // it addresses most DEGRADED findings and it is safe because the input is
  // authoritative and the output is disposable.
  REPAIR_ACTION_REBUILD_PROJECTION = 1;
  // Mark a projection generation unreadable so reads fail closed instead of
  // serving state known to be wrong. Used when a rebuild is not immediately
  // possible, and it makes the situation worse for readers on purpose: a
  // refused read is recoverable, a believed wrong answer is not.
  REPAIR_ACTION_QUARANTINE_PROJECTION_GENERATION = 2;
  // Reset a projection checkpoint to the position the materialized view
  // actually reflects, so the projector reprocesses the gap it skipped.
  REPAIR_ACTION_RESET_PROJECTION_CHECKPOINT = 3;
  // Discard a snapshot so the aggregate is folded from events again. Always
  // safe and never necessary for correctness, since a snapshot is a cache.
  REPAIR_ACTION_DISCARD_SNAPSHOT = 4;
  // Recompute an artifact's digest from storage. This is a re-observation, not
  // a mutation, and it exists as an action because a digest finding is often a
  // transient read failure rather than data loss.
  REPAIR_ACTION_REVERIFY_ARTIFACT = 5;
  // Release an artifact claim or multipart upload that references nothing
  // durable. The only action here that destroys anything, which is why the
  // finding it answers requires tracing durable ownership rather than a
  // reference search.
  REPAIR_ACTION_RELEASE_ORPHANED_CLAIM = 6;
  // Discard derived state belonging to a computation that no longer runs: an
  // abandoned projection generation, staging from a completed migration.
  //
  // Distinct from releasing a claim, which is the only other action that
  // destroys anything, because this one destroys something reproducible. The
  // gate on the finding still has to pass: the cheap thing to get wrong here is
  // discarding the generation a rebuild is currently writing into.
  REPAIR_ACTION_DISCARD_ORPHANED_DERIVED_STATE = 7;
  // Reclaim an expired reconciliation lease so another worker can settle the
  // operation it covered. A handoff rather than a deletion: the work still
  // exists and still needs an outcome.
  REPAIR_ACTION_RECLAIM_EXPIRED_LEASE = 8;
}
