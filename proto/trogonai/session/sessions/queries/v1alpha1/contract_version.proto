edition = "2024";

package trogonai.session.sessions.queries.v1alpha1;

// ContractVersion identifies a revision of the Session query contract.
//
// Every request declares the highest version its caller understands, and every
// response reports the version it was actually rendered at. Without both halves
// a client can only discover an incompatibility by failing to parse a response,
// which is exactly the outcome this contract exists to prevent.
//
// Compatibility rule:
//
//   - Same `major`: compatible. Anything added within a major is additive, so a
//     caller built against an earlier `minor` can still decode the response.
//   - Different `major`: unsupported. The caller must not attempt to interpret
//     the response, and the server must refuse the request with
//     QUERY_ERROR_CODE_UNSUPPORTED_CONTRACT_VERSION rather than answer in a
//     shape the caller cannot read.
//
// `minor` increments for additive changes only: a new optional field, a new
// enum value, a new variant in a discriminated union. `major` increments for
// anything a caller built against the prior version could misread: a removed
// field, a narrowed type, a changed meaning.
message ContractVersion {
  // Incompatible revision. A caller must refuse a response whose major it does
  // not know, rather than interpret the fields it happens to recognize.
  uint32 major = 1 [features.field_presence = LEGACY_REQUIRED];
  // Additive revision within a major.
  uint32 minor = 2 [features.field_presence = LEGACY_REQUIRED];
}

// ContractNegotiation is the version block every query response carries.
//
// It exists so that "the server understands more than I do" is a fact the
// caller reads, rather than something it infers from a field it cannot see.
message ContractNegotiation {
  // The version this response was rendered at. It is never greater than the
  // caller's declared `accepted_contract`, because the server clamps its output
  // rather than emitting variants the caller cannot decode.
  ContractVersion rendered = 1 [features.field_presence = LEGACY_REQUIRED];
  // The highest version this server can render. When it exceeds `rendered`, the
  // caller is reading a deliberately narrowed view and an upgrade would show
  // more; the elision counters on the response say whether anything was
  // actually withheld from this particular answer.
  ContractVersion server_max = 2 [features.field_presence = LEGACY_REQUIRED];
}
