edition = "2024";

package trogonai.session.sessions.queries.v1alpha1;

import "buf/validate/validate.proto";

// ComparisonId is the queries package's own copy of the comparison identity, so
// the queries package never imports the evaluation package.
message ComparisonId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
