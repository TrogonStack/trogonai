edition = "2024";

package trogonai.session.sessions.v1;

// DelegationDetached records an intentional severance of the parent-child
// delegation link, mirrored on both the parent and child streams since each side
// needs it for its own invariant; the stream it is on is the one whose id equals
// session_id (ADR#0035 facet 6). It is an invariant-bearing transition
// (WRITE_PRECONDITION = At).
message DelegationDetached {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string parent_session_id = 2 [features.field_presence = LEGACY_REQUIRED];
  string child_session_id = 3 [features.field_presence = LEGACY_REQUIRED];
  // Command-time reason for the intentional detach; empty when none.
  string reason = 4;
}
