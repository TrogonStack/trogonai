edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "trogonai/session/sessions/v1alpha1/digest.proto";
import "trogonai/session/sessions/v1alpha1/operation_reserved.proto";

// ReserveOperation claims an operation id and its request bytes before a side
// effect runs, recording [OperationReserved].
//
// Write precondition At: this is what makes reserve-and-check atomic. One
// reservation per operation_id; a retry carrying different bytes under the same
// id is a contract violation, not a duplicate (ADR#0035 facet 3).
message ReserveOperation {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string operation_id = 2 [features.field_presence = LEGACY_REQUIRED];
  // Digest of the request the id is reserved for, so a retry with different
  // bytes is refused instead of executed as if it were the same call.
  Digest request_digest = 3 [features.field_presence = LEGACY_REQUIRED];
  OperationKind operation_kind = 4 [features.field_presence = LEGACY_REQUIRED];
}
