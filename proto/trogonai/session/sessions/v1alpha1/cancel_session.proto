edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/session/sessions/v1alpha1/session_cancelled.proto";

// CancelSession seals a session as cancelled, recording [SessionCancelled].
//
// Write precondition At: rejected if the session is already terminal.
message CancelSession {
  string session_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  SessionCancellationReason reason = 2 [features.field_presence = LEGACY_REQUIRED];
  string detail = 3;
}
