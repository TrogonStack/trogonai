edition = "2024";

package trogonai.session.sessions.v1alpha1;

// SessionArchived records that a session was moved out of the default listing
// view: reversible organization state, distinct from the terminal
// SessionHidden (D11). It is a commuting happened-fact
// (WRITE_PRECONDITION = Any).
message SessionArchived {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
}
