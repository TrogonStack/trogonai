edition = "2024";

package trogonai.session.sessions.v1alpha1;

// RedactionApplied records that the targeted events' content must be masked at
// read time by the fold and every projection; original bytes remain on the
// keep-forever log (D7). Because every redelivered duplicate of an event
// shares one deterministic event id (D3), redaction by event id covers
// duplicates automatically. Redaction on a source stream automatically masks
// every fork's inherited context, since a fork reads source events by
// reference (D2) rather than copying them. It is an invariant-bearing
// transition (WRITE_PRECONDITION = At).
message RedactionApplied {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  // Ids of the events whose content must be masked at read time.
  repeated string redacted_event_ids = 2;
  // Command-time reason for the redaction; empty when none.
  string reason = 3;
}
