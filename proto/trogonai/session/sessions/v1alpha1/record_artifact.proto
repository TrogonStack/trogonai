edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/session/sessions/v1alpha1/artifact.proto";

// RecordArtifact registers an artifact by claim-check, recording
// [ArtifactRecorded]. Bytes are never inlined on the log (ADR#0035 facet 3).
//
// Write precondition Any.
message RecordArtifact {
  string session_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  ArtifactMetadata artifact = 2 [features.field_presence = LEGACY_REQUIRED];
  // Set when a turn produced the artifact.
  string turn_id = 3;
}
