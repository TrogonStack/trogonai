edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "trogonai/session/sessions/v1alpha1/message.proto";

// RecordUserMessage appends a user message, recording [UserMessageRecorded].
//
// Write precondition Any: arrival of a message is a happened-fact that commutes
// with other appends and carries no invariant a concurrent writer could break
// (ADR#0035 facet 2).
message RecordUserMessage {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  CanonicalMessage message = 2 [features.field_presence = LEGACY_REQUIRED];
  // The turn this message opens; every event produced within the turn
  // repeats it, because the fold cannot recover a boundary that concurrent
  // Any appends give no reliable ordering for.
  string turn_id = 3 [features.field_presence = LEGACY_REQUIRED];
}
