edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/session/sessions/v1alpha1/cascade_policy.proto";
import "trogonai/session/sessions/v1alpha1/child_session_creation.proto";
import "trogonai/session/sessions/v1alpha1/delegation_binding_ref.proto";

// DispatchDelegation is the delegation saga's first step, run against the
// parent: it records [DelegationDispatched], naming the child and what happens
// to it when the parent reaches a terminal state.
//
// Write precondition At: one dispatch per operation_id, and the parent must not
// already be terminal. The child must differ from the parent, and the cascade
// policy must be known and nonzero. The binding resolves in the stored parent
// plan; the exact creation inputs are retained before any child is created.
message DispatchDelegation {
  option (buf.validate.message).cel = {
    id: "dispatch_delegation.distinct_child"
    message: "child session must differ from parent session"
    expression: "this.session_id != this.child_session_id"
  };

  // The parent session.
  string session_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string operation_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string child_session_id = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  // Recorded at dispatch so an orphaned child is never a silent accident
  // (ADR#0035 facet 6).
  CascadePolicy cascade_policy = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  string turn_id = 5 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  DelegationBindingRef delegate_binding = 6 [(buf.validate.field).required = true];
  ChildSessionCreation child_creation = 7 [(buf.validate.field).required = true];
}
