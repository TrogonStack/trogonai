edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "buf/validate/validate.proto";

// UnarchiveSession restores an archived session to the default listing view,
// recording [SessionUnarchived].
//
// Write precondition Any.
message UnarchiveSession {
  string session_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
