edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/session/sessions/v1alpha1/artifact.proto";

// CloseSession seals a session as completed, recording [SessionClosed].
//
// Write precondition At: the first terminal marker is authoritative, so a
// decision taken against a stale head must be rejected rather than appended.
message CloseSession {
  string session_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  // Out-of-line result of the session's work, when it produced one.
  ArtifactRef result_ref = 2;
}
