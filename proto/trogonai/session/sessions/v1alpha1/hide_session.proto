edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/session/sessions/v1alpha1/session_hidden.proto";

// HideSession seals a session as hidden, recording [SessionHidden]. Hiding is a
// terminal marker, not a deletion: no bytes are removed (ADR#0035 facet 5).
//
// Write precondition At.
message HideSession {
  string session_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  SessionHiddenReason reason = 2 [features.field_presence = LEGACY_REQUIRED];
}
