edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "trogonai/session/sessions/v1alpha1/artifact.proto";
import "trogonai/session/sessions/v1alpha1/digest.proto";

// OperationOutcomeRecorded reconciles a reserved operation's outcome as a typed
// oneof, including a non-terminal unknown outcome that does not auto-repeat the
// side effect (ADR#0031 §4). unknown may be superseded exactly once by a
// determinate outcome (succeeded, failed, or cancelled) under the At guard;
// every determinate outcome is terminal, one per operation_id. The join key is
// operation_id alone -- correlation_id is meaningful on the dispatch event
// (DelegationDispatched, ExternalDelegationDispatched), not here. The ledger
// deduplicates by operation id and digest; it is not exactly-once execution.
// It is an invariant-bearing transition (WRITE_PRECONDITION = At).
message OperationOutcomeRecorded {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string operation_id = 2 [features.field_presence = LEGACY_REQUIRED];
  oneof outcome {
    OperationSucceeded succeeded = 3;
    OperationFailed failed = 4;
    OperationCancelled cancelled = 5;
    OperationUnknown unknown = 6;
  }
}

// OperationSucceeded is the determinate success outcome of a reserved
// operation.
message OperationSucceeded {
  // Digest over the response bytes, verified before decode.
  Digest response_digest = 1 [features.field_presence = LEGACY_REQUIRED];
  // Claim-check to the response when it was durably stored; unset when the
  // response was not retained as an artifact.
  ArtifactRef response_ref = 2;
}

// OperationFailed is the determinate failure outcome of a reserved operation.
message OperationFailed {
  // Human-readable failure detail.
  string detail = 1 [features.field_presence = LEGACY_REQUIRED];
  // Digest over failure evidence bytes when retained; unset when none.
  Digest failure_digest = 2;
}

// OperationCancelled is the determinate cancellation outcome of a reserved
// operation, distinct from OperationFailed and OperationUnknown (e.g. a
// child-session delegation cancelled by parent-terminal cascade).
message OperationCancelled {
  // Principal or process that cancelled the operation.
  string cancelled_by = 1 [features.field_presence = LEGACY_REQUIRED];
  // Command-time reason for the cancellation; empty when none.
  string reason = 2;
}

// OperationUnknown is the indeterminate outcome recorded when the operation's
// resolution could not be determined; it is non-terminal and may be superseded
// exactly once by a determinate outcome.
message OperationUnknown {
  // Human-readable detail of why the outcome is indeterminate; empty when none.
  string detail = 1;
}
