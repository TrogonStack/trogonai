edition = "2024";

package trogonai.session.sessions.v1alpha1;

// SessionOrdinal is a logical position on one session's own logical stream:
// the 1-indexed position of an event in that subject's append order. It is
// derived by counting events at fold time, never read from JetStream message
// metadata, so it is stable across restore, backfill, migration, and
// cold-tier relocation, which reassign physical stream sequences without
// rewriting event bytes (ADR#0013). A payload field of this type always
// references an already-appended event's position, never a predicted future
// position.
message SessionOrdinal {
  uint64 value = 1 [features.field_presence = LEGACY_REQUIRED];
}
