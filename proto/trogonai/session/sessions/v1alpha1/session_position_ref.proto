edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "trogonai/session/sessions/v1alpha1/session_id.proto";
import "trogonai/session/sessions/v1alpha1/session_ordinal.proto";

// A temporal pointer: this session's log as of that ordinal, inclusive. The log
// is append-only, so the pointed-to prefix never changes and what was true at
// that point is always reconstructable by folding up to it.
message SessionPositionRef {
  SessionId session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  SessionOrdinal through_ordinal = 2 [features.field_presence = LEGACY_REQUIRED];
}
