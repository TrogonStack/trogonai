edition = "2024";

package trogonai.session.sessions.v1alpha1;

// ArtifactErased records out-of-band destruction of claim-checked artifact
// bytes; the artifact's digest and metadata remain on the log as provenance,
// even though the bytes they reference are gone. This separates artifact-byte
// lifecycle from event-log retention: the log itself is never purged, but the
// out-of-line bytes an artifact claim-check points to may be destroyed
// independently (D7). It is an invariant-bearing transition
// (WRITE_PRECONDITION = At).
message ArtifactErased {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string artifact_id = 2 [features.field_presence = LEGACY_REQUIRED];
  // Command-time reason for the erasure; empty when none.
  string reason = 3;
}
