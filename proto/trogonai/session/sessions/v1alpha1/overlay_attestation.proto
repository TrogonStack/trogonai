edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "trogonai/session/sessions/v1alpha1/digest.proto";

// Projection of the overlay embedded in the stored plan bytes, so the session
// package never depends on the overlay type. A session without one ran the
// registered revision unchanged. Sessions are comparable only when their
// overlay digests are equal or both are absent.
message OverlayAttestation {
  Digest overlay_digest = 1 [features.field_presence = LEGACY_REQUIRED];
}
