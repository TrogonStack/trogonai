// This package is v1alpha1: the contract depends on draft ADR#0026/0027/0028/
// 0029/0031 and promotes to v1 only by a later decision once ADR#0035 and its
// dependencies are accepted and the substrate obligations they impose are met.
// A session is scoped by its subject alone; shared multi-tenant deployment is
// blocked on ADR#0027's resolver contract, and v1alpha1 is the room in which
// that lands additively rather than as a speculative tenant_id today (D0).
//
// Within v1alpha1 a field may still be added as LEGACY_REQUIRED. That window is
// open only while both conditions hold -- no deployed producer has written these
// events, and this package has not promoted -- and it closes at whichever comes
// first. The break a new required field causes is a current validator rejecting
// already-stored bytes, so a producer shipping on v1alpha1 closes the window
// early by creating those bytes, and promotion closes it regardless of producers
// because promotion is the act of accepting the compatibility obligation. Once it
// closes, a new required field needs a new package version. buf breaking under
// WIRE_JSON does not catch this, because it compares fields present on both sides
// and a field new to one side is not among them.
//
// SessionEvent is the session aggregate's event catalog: one oneof arm per
// concrete event type. It is a convenience union for matching and codegen, not
// the persisted form -- the store persists each concrete event's own bytes under
// its stable type name and never the bytes of this wrapper (ADR#0031 §6).
message SessionEvent {
  oneof event {
    // Lifecycle.
    SessionStarted session_started = 1;
    SessionClosed session_closed = 2;
    SessionCancelled session_cancelled = 3;
    SessionFailed session_failed = 4;
    SessionHidden session_hidden = 5;
    // Fork and rewind.
    SessionForked session_forked = 6;
    SessionRewound session_rewound = 7;
    // Compaction.
    Compacted compacted = 8;
    // Conversation.
    UserMessageRecorded user_message_recorded = 9;
    AssistantMessageStarted assistant_message_started = 10;
    AssistantMessageCompleted assistant_message_completed = 11;
    AssistantMessageFailed assistant_message_failed = 28;
    // Tool lifecycle.
    ToolCallRequested tool_call_requested = 12;
    ToolCallApproved tool_call_approved = 13;
    ToolCallDenied tool_call_denied = 29;
    ToolCallStarted tool_call_started = 14;
    ToolCallCompleted tool_call_completed = 15;
    ToolCallFailed tool_call_failed = 16;
    // Artifacts and files.
    ArtifactRecorded artifact_recorded = 17;
    FileChanged file_changed = 18;
    // Execution attempts.
    ExecutionAttemptStarted execution_attempt_started = 19;
    ExecutionAttemptReady execution_attempt_ready = 20;
    ExecutionAttemptEnded execution_attempt_ended = 21;
    CheckpointProduced checkpoint_produced = 30;
    // Delegation and child sessions.
    DelegationDispatched delegation_dispatched = 22;
    ParentLinked parent_linked = 23;
    ParentTerminated parent_terminated = 24;
    DelegationDetached delegation_detached = 25;
    ParentHistoryInvalidated parent_history_invalidated = 33;
    ParentDetached parent_detached = 34;
    ExternalDelegationDispatched external_delegation_dispatched = 35;
    // Operation ledger.
    OperationReserved operation_reserved = 26;
    OperationOutcomeRecorded operation_outcome_recorded = 27;
    OperationCancellationRequested operation_cancellation_requested = 36;
    // Privacy and redaction.
    ArtifactErased artifact_erased = 37;
    RedactionApplied redaction_applied = 38;
    // System.
    SystemNoticeRecorded system_notice_recorded = 31;
    // Plan.
    TodoUpdated todo_updated = 32;
    // Organization.
    SessionRenamed session_renamed = 39;
    SessionArchived session_archived = 40;
    SessionUnarchived session_unarchived = 41;
  }
}
