edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "trogonai/session/sessions/v1alpha1/session_ordinal.proto";

// SessionRewound records a retroactive rewind as a new event, never an edit of
// stored events; keep_through is the inclusive kept boundary on this session's
// own stream, so events [1..keep_through] remain valid. Children whose
// ParentLinked.parent_dispatched_at is strictly greater than keep_through are
// invalidated by the reconciler's atomic [ParentHistoryInvalidated,
// SessionCancelled{reason = PARENT_REWIND_CASCADE}] batch when their
// cascade_policy is CASCADE_ON_PARENT_TERMINAL; children dispatched at or
// before the boundary survive untouched (ADR#0035 facet 6). It is an
// invariant-bearing transition guarded by WRITE_PRECONDITION = At(current_position).
message SessionRewound {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  SessionOrdinal keep_through = 2 [features.field_presence = LEGACY_REQUIRED];
  // Why the rewind happened; a command-time input not derivable from the log,
  // mirroring ForkReason and CompactionTrigger.
  RewindReason reason = 3 [features.field_presence = LEGACY_REQUIRED];
}

// RewindReason is why a session was rewound.
enum RewindReason {
  REWIND_REASON_UNSPECIFIED = 0;
  // An explicit user rewind/undo.
  REWIND_REASON_MANUAL = 1;
  // A message was edited and the turn re-sent from that point.
  REWIND_REASON_EDIT_AND_RESEND = 2;
  // A retry of a turn from an earlier point.
  REWIND_REASON_RETRY = 3;
}
