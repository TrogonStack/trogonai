edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "google/protobuf/timestamp.proto";
import "trogonai/session/sessions/v1alpha1/digest.proto";

// ExecutionAttemptReady is admission proof that the attempt's implementation
// and effective configuration are running (ADR#0031 §4). It advances the
// same attempt's Ready-after-Started invariant, so it is invariant-bearing
// (WRITE_PRECONDITION = At), not a commuting happened-fact.
message ExecutionAttemptReady {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string execution_attempt_id = 2 [features.field_presence = LEGACY_REQUIRED];
  string ready_attestation_ref = 3 [features.field_presence = LEGACY_REQUIRED];
  Digest ready_attestation_digest = 4 [features.field_presence = LEGACY_REQUIRED];
  // Wall-clock instant the attempt actually became ready: a real external
  // occurrence distinct from envelope append time (D10).
  google.protobuf.Timestamp ready_at = 5 [features.field_presence = LEGACY_REQUIRED];
}
