edition = "2024";

package trogonai.session.sessions.v1alpha1;

// ParentTerminated is recorded on the child session's stream by the reconciler
// when the parent reached a Session-level terminal state; it is emitted as one
// atomic [ParentTerminated, SessionCancelled] batch (ADR#0035 facet 6). It is
// strictly for parent-terminal causes -- rewind cascade uses
// ParentHistoryInvalidated instead, never this event. It is an
// invariant-bearing transition (WRITE_PRECONDITION = At).
message ParentTerminated {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string parent_session_id = 2 [features.field_presence = LEGACY_REQUIRED];
  // Which parent-terminal marker triggered this cascade.
  ParentTerminalCause cause = 3 [features.field_presence = LEGACY_REQUIRED];
  // Event id of the parent's terminal marker that triggered this cascade, for
  // audit traceability back to the exact triggering fact.
  string triggering_event_id = 4 [features.field_presence = LEGACY_REQUIRED];
}

// ParentTerminalCause is which parent-terminal marker triggered a
// ParentTerminated cascade.
enum ParentTerminalCause {
  PARENT_TERMINAL_CAUSE_UNSPECIFIED = 0;
  PARENT_TERMINAL_CAUSE_CLOSED = 1;
  PARENT_TERMINAL_CAUSE_CANCELLED = 2;
  PARENT_TERMINAL_CAUSE_FAILED = 3;
  PARENT_TERMINAL_CAUSE_HIDDEN = 4;
}
