edition = "2024";

package trogonai.session.sessions.v1alpha1;

// SessionFailed is the terminal failure marker for a session; a liveness
// watchdog records this when no further attempt will run (ADR#0035 facet 6).
// It is an invariant-bearing transition guarded by WRITE_PRECONDITION = At(current_position).
message SessionFailed {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  // Human-readable detail of the failure; empty when none.
  string detail = 2 [features.field_presence = LEGACY_REQUIRED];
  SessionFailureReason reason = 3 [features.field_presence = LEGACY_REQUIRED];
}

// SessionFailureReason is the typed classification of why a session failed.
enum SessionFailureReason {
  SESSION_FAILURE_REASON_UNSPECIFIED = 0;
  // Failed with a runtime or execution error.
  SESSION_FAILURE_REASON_EXECUTION_ERROR = 1;
  // Exceeded its time budget.
  SESSION_FAILURE_REASON_TIMEOUT = 2;
  // Exhausted an allotted resource (for example a token or cost budget).
  SESSION_FAILURE_REASON_RESOURCE_EXHAUSTED = 3;
  // A required external dependency failed.
  SESSION_FAILURE_REASON_EXTERNAL_DEPENDENCY_FAILURE = 4;
  // The session's execution violated its own SessionExecutionPlan binding.
  SESSION_FAILURE_REASON_PLAN_BINDING_VIOLATION = 5;
}
