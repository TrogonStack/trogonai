edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "trogonai/session/sessions/v1alpha1/cascade_policy.proto";
import "trogonai/session/sessions/v1alpha1/execution_plan.proto";
import "trogonai/session/sessions/v1alpha1/session_ordinal.proto";
import "trogonai/session/sessions/v1alpha1/workspace.proto";

// CreateChildSession is the delegation saga's second step: it opens the
// delegated child's stream, recording [SessionStarted, ParentLinked] as one
// batch so a child can never exist without its lineage.
//
// Write precondition NoStream on the child. parent_dispatched_at and
// cascade_policy are copied verbatim from the parent's DelegationDispatched, so
// a redelivered saga step reproduces the same link (ADR#0035 facet 6).
message CreateChildSession {
  // The child session's own id.
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  StoredSessionExecutionPlan execution_plan = 2 [features.field_presence = LEGACY_REQUIRED];
  WorkspaceRef workspace = 3 [features.field_presence = LEGACY_REQUIRED];
  string parent_session_id = 4 [features.field_presence = LEGACY_REQUIRED];
  // The parent's own ordinal of the DelegationDispatched being followed.
  SessionOrdinal parent_dispatched_at = 5 [features.field_presence = LEGACY_REQUIRED];
  CascadePolicy cascade_policy = 6 [features.field_presence = LEGACY_REQUIRED];
  // The parent-side ledger operation this dispatch reserved.
  string operation_id = 7 [features.field_presence = LEGACY_REQUIRED];
}
