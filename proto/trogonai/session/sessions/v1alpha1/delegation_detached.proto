edition = "2024";

package trogonai.session.sessions.v1alpha1;

// DelegationDetached is the parent-side fact recording an intentional
// severance of the parent-child delegation link, causally joined to the
// child's own ParentDetached by one durable saga id (detach_operation_id)
// rather than a mirrored write -- each stream records its own
// invariant-bearing local fact, satisfying ADR#0024's record-once rule
// (ADR#0035 facet 6). Crash repair: the reconciler completes the missing side
// idempotently, deduped by detach_operation_id; a duplicate delivery no-ops
// because decide sees the operation id already folded. It is an
// invariant-bearing transition (WRITE_PRECONDITION = At).
message DelegationDetached {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string child_session_id = 3 [features.field_presence = LEGACY_REQUIRED];
  // Command-time reason for the intentional detach; empty when none.
  string reason = 4;
  // Durable saga id joining this fact to the child's own ParentDetached.
  string detach_operation_id = 5 [features.field_presence = LEGACY_REQUIRED];
}
