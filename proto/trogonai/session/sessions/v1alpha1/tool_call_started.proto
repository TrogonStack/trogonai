edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "buf/validate/validate.proto";

// ToolCallStarted records that a tool call began executing. It is a commuting
// happened-fact (WRITE_PRECONDITION = Any, ADR#0035 facet 2).
message ToolCallStarted {
  string session_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string tool_call_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string tool_execution_id = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  // Turn this call belongs to (see UserMessageRecorded.turn_id).
  string turn_id = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
