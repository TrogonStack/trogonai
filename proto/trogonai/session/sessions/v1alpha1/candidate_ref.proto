edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "trogonai/session/sessions/v1alpha1/candidate_id.proto";
import "trogonai/session/sessions/v1alpha1/digest.proto";

// Projection of the candidate pinned in the stored plan bytes, so the session
// package never depends on the candidate type. Sessions are comparable only
// when their candidate_ref values name the same content digest or both are
// absent.
message CandidateRef {
  CandidateId candidate_id = 1 [features.field_presence = LEGACY_REQUIRED];
  Digest content_digest = 2 [features.field_presence = LEGACY_REQUIRED];
}
