edition = "2024";

package trogonai.session.sessions.v1alpha1;

// RenameSession changes the session's display name, recording
// [SessionRenamed]. Reversible organization state, unlike the terminal
// HideSession.
//
// Write precondition Any.
message RenameSession {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string display_name = 2 [features.field_presence = LEGACY_REQUIRED];
}
