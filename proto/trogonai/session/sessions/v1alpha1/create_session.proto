edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "trogonai/session/sessions/v1alpha1/execution_plan.proto";
import "trogonai/session/sessions/v1alpha1/workspace.proto";

// CreateSession opens a session stream, recording [SessionStarted].
//
// Write precondition NoStream: creation is atomic and exactly-once, so a
// redelivered create observes the stream already exists rather than forking a
// second history (ADR#0035 facet 2). The execution plan is immutable for the
// session's life; every later attempt, checkpoint, and compaction is bound to
// its digest.
message CreateSession {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  StoredSessionExecutionPlan execution_plan = 2 [features.field_presence = LEGACY_REQUIRED];
  WorkspaceRef workspace = 3 [features.field_presence = LEGACY_REQUIRED];
}
