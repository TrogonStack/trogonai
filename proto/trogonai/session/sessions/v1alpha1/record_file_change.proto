edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "trogonai/session/sessions/v1alpha1/artifact.proto";
import "trogonai/session/sessions/v1alpha1/diff_summary.proto";
import "trogonai/session/sessions/v1alpha1/file_change.proto";

// RecordFileChange attributes a workspace file change to the tool call that
// caused it, recording [FileChanged]. A change with no proximate call is not
// this command: it surfaces as a ResourceObservation whose digest moved,
// meaning something outside the session touched the file.
//
// Write precondition Any.
message RecordFileChange {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  // Workspace-relative, forward slashes, no leading slash.
  string path = 2 [features.field_presence = LEGACY_REQUIRED];
  FileChangeKind change_kind = 3 [features.field_presence = LEGACY_REQUIRED];
  string previous_path = 4;
  // Content before the change; unset for a create or when not captured.
  // Recorded because checkpoints are opaque, so what changed is not
  // re-derivable by diffing them afterwards.
  ArtifactRef before_ref = 5;
  ArtifactRef after_ref = 6;
  // The causing call. Without it, which call touched this file is only
  // answerable by fold adjacency, which concurrent Any appends make
  // unsound.
  string tool_call_id = 7 [features.field_presence = LEGACY_REQUIRED];
  string turn_id = 8 [features.field_presence = LEGACY_REQUIRED];
  DiffSummary diff = 9;
}
