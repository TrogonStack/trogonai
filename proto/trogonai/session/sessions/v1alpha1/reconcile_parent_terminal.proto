edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "trogonai/session/sessions/v1alpha1/parent_terminated.proto";

// ReconcileParentTerminal is issued by the child-session reconciler when a
// parent reaches a terminal state, recording [ParentTerminated,
// SessionCancelled] against the child as one batch. Recording the observation
// and the consequence together is what closes the silent-orphan gap.
//
// Write precondition At on the child: a no-op if the child is already terminal.
// The cancellation reason is derived by the aggregate, not carried here.
message ReconcileParentTerminal {
  // The child session being reconciled.
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string parent_session_id = 2 [features.field_presence = LEGACY_REQUIRED];
  ParentTerminalCause cause = 3 [features.field_presence = LEGACY_REQUIRED];
  // The parent event that triggered this reconcile, so a redelivery is
  // recognisable as the same observation.
  string triggering_event_id = 4 [features.field_presence = LEGACY_REQUIRED];
}
