edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "trogonai/session/sessions/v1alpha1/execution_plan.proto";
import "trogonai/session/sessions/v1alpha1/workspace.proto";

// SessionStarted is the creation fact for a session's logical stream and stores
// the immutable StoredSessionExecutionPlan exactly once (ADR#0031 §6). The
// plan's working directory is immutable for the life of the session and
// bound to this plan; changing it requires a new session or a fork (D11). It
// is always the first event in a NoStream creation batch: alone for
// CreateSession, as [SessionStarted, SessionForked] for ForkSession (D2), or
// as [SessionStarted, ParentLinked] for a delegated child (D5) -- every case
// making creation atomic and exactly-once (ADR#0035 facet 2).
message SessionStarted {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  StoredSessionExecutionPlan execution_plan = 2 [features.field_presence = LEGACY_REQUIRED];
  // Workspace this session is bound to, carried inline so workspace-scoped
  // reads never decode plan_bytes. It must agree with the plan's working
  // directory; this field is the projection surface, the plan stays
  // authoritative.
  WorkspaceRef workspace = 3 [features.field_presence = LEGACY_REQUIRED];
}
