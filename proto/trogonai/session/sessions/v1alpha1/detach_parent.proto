edition = "2024";

package trogonai.session.sessions.v1alpha1;

// DetachParent releases a child from its parent, run against the child side,
// recording [ParentDetached]. It is the repair half of DetachDelegation: the
// two sides carry the same detach_operation_id, so a saga interrupted between
// them converges rather than leaving one side linked.
//
// Write precondition At: one detach per detach_operation_id.
message DetachParent {
  // The child session.
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string parent_session_id = 2 [features.field_presence = LEGACY_REQUIRED];
  string detach_operation_id = 3 [features.field_presence = LEGACY_REQUIRED];
}
