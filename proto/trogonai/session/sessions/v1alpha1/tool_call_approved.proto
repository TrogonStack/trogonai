edition = "2024";

package trogonai.session.sessions.v1alpha1;

// ToolCallApproved records that a requested tool call was approved. Approval
// and denial are mutually exclusive human-paced decisions guarding a
// transition whose outcome depends on current lifecycle state, so it is
// invariant-bearing (WRITE_PRECONDITION = At, ADR#0035 facet 2), not a
// commuting happened-fact.
message ToolCallApproved {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string tool_call_id = 2 [features.field_presence = LEGACY_REQUIRED];
  string tool_execution_id = 3 [features.field_presence = LEGACY_REQUIRED];
  string approved_by = 4 [features.field_presence = LEGACY_REQUIRED];
  // Turn the approved call belongs to (see UserMessageRecorded.turn_id).
  // Optional here, unlike on the lifecycle events the agent loop writes: an
  // approval may be recorded by an external approver that holds the call
  // identity without the turn context, and forcing a value would invite a
  // fabricated one.
  string turn_id = 5;
}
