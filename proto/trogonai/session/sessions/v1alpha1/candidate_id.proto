edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "buf/validate/validate.proto";

// CandidateId is the session package's own copy of the candidate identity, so
// the session package never imports the agents package. It carries the same
// value as trogonai.agents.candidates.v1alpha1.CandidateId.
message CandidateId {
  string value = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
