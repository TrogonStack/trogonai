edition = "2024";

package trogonai.session.sessions.v1alpha1;

// RequestOperationCancellation asks for an in-flight side effect to stop,
// recording [OperationCancellationRequested]. Asking is not settling: the
// operation still needs a recorded outcome before it leaves the ledger.
//
// Write precondition At: rejected if the operation is already terminal.
message RequestOperationCancellation {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string operation_id = 2 [features.field_presence = LEGACY_REQUIRED];
  string reason = 3;
}
