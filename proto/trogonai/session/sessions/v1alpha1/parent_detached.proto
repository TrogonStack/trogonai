edition = "2024";

package trogonai.session.sessions.v1alpha1;

// ParentDetached is the child-side counterpart to the parent's
// DelegationDetached: two causally linked local facts joined by one durable
// saga id (detach_operation_id) rather than a mirrored write -- each stream
// records its own invariant-bearing local fact, satisfying ADR#0024's
// record-once rule (ADR#0035 facet 6). Crash repair: the reconciler completes
// the missing side idempotently, deduped by detach_operation_id; a duplicate
// delivery no-ops because decide sees the operation id already folded. It is
// an invariant-bearing transition (WRITE_PRECONDITION = At).
message ParentDetached {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string parent_session_id = 2 [features.field_presence = LEGACY_REQUIRED];
  // Durable saga id joining this fact to the parent's own DelegationDetached.
  string detach_operation_id = 3 [features.field_presence = LEGACY_REQUIRED];
}
