edition = "2024";

package trogonai.session.sessions.v1alpha1;

// EraseArtifact removes claim-checked bytes an event referenced, recording
// [ArtifactErased]. The event that referenced them stays on the log; only the
// out-of-line payload goes.
//
// Write precondition At: the artifact must exist and be claim-checked, verified
// at the command boundary against the artifact store rather than from folded
// state.
message EraseArtifact {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string artifact_id = 2 [features.field_presence = LEGACY_REQUIRED];
  string reason = 3;
}
