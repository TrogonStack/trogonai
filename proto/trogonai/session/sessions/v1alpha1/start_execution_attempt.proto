edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "google/protobuf/timestamp.proto";
import "trogonai/session/sessions/v1alpha1/checkpoint.proto";
import "trogonai/session/sessions/v1alpha1/digest.proto";

// StartExecutionAttempt claims the session for a runner, recording
// [ExecutionAttemptStarted].
//
// Write precondition At: one active attempt at a time, monotonic attempt
// numbers, and a restored checkpoint that exactly equals the first admitted
// evidence for its id with no later redaction or erasure reaching at or before
// its covers_through (ADR#0035 harness recovery).
message StartExecutionAttempt {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string execution_attempt_id = 2 [features.field_presence = LEGACY_REQUIRED];
  // Must equal the session's stored plan digest; a mismatch means the runner
  // is about to execute a different plan than the session was started with.
  Digest session_execution_plan_digest = 3 [features.field_presence = LEGACY_REQUIRED];
  uint64 attempt_number = 4 [features.field_presence = LEGACY_REQUIRED];
  string previous_attempt_id = 5;
  // Unset when the attempt starts from scratch rather than restoring.
  Checkpoint restored_checkpoint = 6;
  string host_artifact_ref = 7 [features.field_presence = LEGACY_REQUIRED];
  Digest host_artifact_digest = 8 [features.field_presence = LEGACY_REQUIRED];
  string authenticated_remote_subject = 9;
  string isolation_placement = 10;
  // Supplied by the caller: deciding is deterministic and reads no clock.
  google.protobuf.Timestamp started_at = 11 [features.field_presence = LEGACY_REQUIRED];
}
