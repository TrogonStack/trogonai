edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "trogonai/session/sessions/v1alpha1/assistant_message_failed.proto";
import "trogonai/session/sessions/v1alpha1/token_usage.proto";

// FailAssistantMessage settles an assistant turn that was interrupted,
// cancelled, or errored, recording [AssistantMessageFailed], so every started
// message has a determinable outcome.
//
// Write precondition Any: per message_id this competes with
// CompleteAssistantMessage under first-terminal-outcome-wins.
message FailAssistantMessage {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string message_id = 2 [features.field_presence = LEGACY_REQUIRED];
  AssistantMessageFailureReason reason = 3 [features.field_presence = LEGACY_REQUIRED];
  string detail = 4;
  // Tokens billed for the partial turn, so a cost fold does not undercount
  // a turn that failed mid-generation.
  TokenUsage usage = 5;
  string turn_id = 6 [features.field_presence = LEGACY_REQUIRED];
}
