edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "buf/validate/validate.proto";

// SessionUnarchived reverses a prior SessionArchived, restoring a session to
// the default listing view: reversible organization state, distinct from the
// terminal SessionHidden (D11). It is a commuting happened-fact
// (WRITE_PRECONDITION = Any).
message SessionUnarchived {
  string session_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
