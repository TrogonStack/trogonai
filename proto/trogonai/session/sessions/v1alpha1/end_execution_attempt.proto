edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "trogonai/session/sessions/v1alpha1/execution_attempt_ended.proto";

// EndExecutionAttempt releases the session from an attempt, recording
// [ExecutionAttemptEnded].
//
// Write precondition At: one outcome per attempt.
message EndExecutionAttempt {
  string session_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string execution_attempt_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  AttemptOutcome outcome = 3 [features.field_presence = LEGACY_REQUIRED];
  string detail = 4;
  google.protobuf.Timestamp ended_at = 5 [features.field_presence = LEGACY_REQUIRED];
}
