edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "google/protobuf/duration.proto";
import "trogonai/session/sessions/v1alpha1/command_output_replay.proto";
import "trogonai/session/sessions/v1alpha1/command_termination.proto";
import "trogonai/session/sessions/v1alpha1/detached_work.proto";
import "trogonai/session/sessions/v1alpha1/resource_access.proto";
import "trogonai/session/sessions/v1alpha1/resource_observation.proto";
import "trogonai/session/sessions/v1alpha1/target_outcome.proto";
import "trogonai/session/sessions/v1alpha1/tool_call.proto";

// ToolCallCompleted records that a tool call finished successfully. Per
// tool_execution_id, this competes with ToolCallFailed under a
// first-terminal-outcome-wins fold rule: the first of the two to appear in
// fold order is authoritative, and a later conflicting outcome is retained as
// audit-only, surfaced by a projection flag, never folded into state (D4). It
// is a commuting happened-fact (WRITE_PRECONDITION = Any, ADR#0035 facet 2).
message ToolCallCompleted {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string tool_call_id = 2 [features.field_presence = LEGACY_REQUIRED];
  string tool_execution_id = 3 [features.field_presence = LEGACY_REQUIRED];
  ToolCallResult result = 4 [features.field_presence = LEGACY_REQUIRED];
  // Turn this call belongs to (see UserMessageRecorded.turn_id).
  string turn_id = 5 [features.field_presence = LEGACY_REQUIRED];
  // How the process ended, for a tool that executes one; unset for every other
  // tool. A command that ran and exited non-zero completes here with result
  // status TOOL_CALL_RESULT_STATUS_APPLICATION_ERROR and a termination set; a
  // command that never ran is a ToolCallFailed and has none.
  CommandTermination termination = 6;
  // Wall-clock execution time from start to this completion. Recorded rather
  // than derived from the two events' append times, which measure when the
  // writer got its append acknowledged, not how long the tool ran (D10).
  google.protobuf.Duration duration = 7;
  // Resources this call put into the model's context, with the digest each
  // hashed to when it was read. Empty for a call that observed nothing.
  repeated ResourceObservation observed = 8;
  // Claim-check to this command's captured stdout and stderr, for a tool that
  // executes a process and captured it; unset otherwise, including for a
  // command that ran with capture disabled.
  //
  // It sits here beside `termination` and not inside `result` for the reason
  // `termination` does (D11): captured output is the execution record, while
  // `result` is the transcript the model received. They routinely differ, since
  // what reaches the model is truncated or summarized, and folding raw output
  // into the replay shape would hand a later turn context the original turn
  // never had.
  CommandOutputReplayRef output_replay = 9;
  // Set when this call returned a handle to work that outlived the turn. Unset
  // is the ordinary case and means the call's result is its outcome; set means
  // the result is a handle and the outcome arrives later through the operation
  // ledger.
  DetachedWork detached = 10;
  // Namespaces this call listed, searched, or otherwise touched, as distinct
  // from the content it read. Empty for a call that accessed no namespace.
  repeated ResourceAccessRecord accessed = 11;
  // Targets of a multi-resource call that did not apply. Empty when every target
  // succeeded, and empty is also correct for a single-target call, which has
  // nothing partial to report.
  //
  // Successes are deliberately absent: they are already FileChanged facts, and a
  // second record of the same change is a second thing to keep consistent
  // through rewind and redaction.
  repeated TargetOutcome failed_targets = 12;
  // How many targets the call set out to apply, recorded so failed_targets can
  // be read as a fraction. Zero for a call with no target list, which is not the
  // same as a call that attempted zero targets and is why the count is here
  // rather than inferred from an empty list.
  uint32 targets_attempted = 13;
}
