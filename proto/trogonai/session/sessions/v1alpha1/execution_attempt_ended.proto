edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "google/protobuf/timestamp.proto";

// ExecutionAttemptEnded is a per-attempt outcome fact; ending an attempt is
// not itself a session terminal marker (ADR#0031 §4, ADR#0035 facet 6). It
// advances the same attempt counter's one-active-attempt invariant, so it is
// invariant-bearing (WRITE_PRECONDITION = At), not a commuting happened-fact.
message ExecutionAttemptEnded {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string execution_attempt_id = 2 [features.field_presence = LEGACY_REQUIRED];
  AttemptOutcome outcome = 3 [features.field_presence = LEGACY_REQUIRED];
  // Human-readable explanation of the outcome; empty when none. This is a
  // failure-only event (no success outcome exists), so an audit fold needs it to
  // explain, not just classify, why the attempt ended.
  string detail = 4;
  // Wall-clock instant the attempt actually ended: a real external occurrence
  // distinct from envelope append time (D10).
  google.protobuf.Timestamp ended_at = 5 [features.field_presence = LEGACY_REQUIRED];
}

// AttemptOutcome is how an execution attempt ended.
enum AttemptOutcome {
  ATTEMPT_OUTCOME_UNSPECIFIED = 0;
  ATTEMPT_OUTCOME_FAILED = 1;
  ATTEMPT_OUTCOME_CANCELLED = 2;
  ATTEMPT_OUTCOME_TERMINATED = 3;
}
