edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "buf/validate/validate.proto";
import "trogonai/session/sessions/v1alpha1/artifact.proto";

// ArtifactRecorded records an artifact by claim-check (sha256), never inlining
// its bytes (ADR#0035 facet 3); a commuting happened-fact (WRITE_PRECONDITION = Any).
message ArtifactRecorded {
  string session_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  ArtifactMetadata artifact = 2 [features.field_presence = LEGACY_REQUIRED];
  // Turn that produced the artifact, when a turn did; empty when the
  // producer holds no turn context (see UserMessageRecorded.turn_id).
  string turn_id = 3;
}
