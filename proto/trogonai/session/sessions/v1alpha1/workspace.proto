edition = "2024";

package trogonai.session.sessions.v1alpha1;

// WorkspaceRef identifies the workspace a session is bound to. SessionStarted
// carries it inline rather than leaving it inside the opaque
// StoredSessionExecutionPlan bytes, so "every session for this workspace" is a
// projection over decoded event fields and never a decode-and-verify pass over
// every plan in the store (ADR#0031 §6).
//
// The binding is immutable for the life of the session, exactly as the plan's
// working directory is: a different workspace requires a new session or a fork.
message WorkspaceRef {
  // Stable workspace id, assigned by the platform and independent of location.
  string workspace_id = 1 [features.field_presence = LEGACY_REQUIRED];
  // Location the workspace resolved to at session start, for example
  // "file:///srv/checkouts/api" or "git+ssh://host/org/repo".
  string uri = 2 [features.field_presence = LEGACY_REQUIRED];
  // Source-control revision the workspace was at when the session started;
  // empty when the workspace is not version controlled or was not resolved.
  string revision = 3;
}
