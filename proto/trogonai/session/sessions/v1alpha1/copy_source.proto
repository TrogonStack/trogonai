edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "trogonai/session/sessions/v1alpha1/digest.proto";

// CopySource records where a copied file came from.
//
// A copy recorded only as a create loses the one fact that makes it reviewable.
// "A new file appeared at deploy/prod.yaml" and "deploy/staging.yaml was
// duplicated to deploy/prod.yaml" are different events for a reviewer, and the
// second is the one that raises the question worth raising.
//
// This is a distinct field rather than a reuse of FileChanged.previous_path,
// even though both name an earlier location, because the two make opposite
// claims about the source. After a rename the previous path is gone. After a
// copy the source still exists, unchanged, and anything that treated the two the
// same would report a file as moved that is still sitting there.
message CopySource {
  // Workspace-relative path the content was copied from, in the same form as
  // FileChanged.path.
  string path = 1 [features.field_presence = LEGACY_REQUIRED];
  // What the source hashed to at the moment of the copy.
  //
  // This is what makes a copy checkable later, on the same reasoning as
  // ResourceObservation: without it, a reader can see that prod.yaml came from
  // staging.yaml but cannot tell whether it came from the staging.yaml that
  // exists now or from a version since edited. Unset when the source content was
  // not hashed.
  Digest source_digest = 2;
}
