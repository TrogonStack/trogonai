edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "trogonai/session/sessions/v1alpha1/model_settings.proto";

// AssistantMessageStarted is a coarse durable fact that an assistant turn
// began; streamed token deltas are delivered out of band and never appended
// per token. It is a commuting happened-fact (WRITE_PRECONDITION = Any,
// ADR#0035 facet 2).
message AssistantMessageStarted {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string message_id = 2 [features.field_presence = LEGACY_REQUIRED];
  string model = 3 [features.field_presence = LEGACY_REQUIRED];
  // Turn this generation belongs to (see UserMessageRecorded.turn_id). Several
  // assistant messages share one turn whenever the turn ran a tool loop.
  string turn_id = 4 [features.field_presence = LEGACY_REQUIRED];
  // Sampling configuration this generation ran with; unset when every setting
  // was left at the provider default. Recorded beside model for the same reason
  // model is recorded here rather than looked up: a replay must reproduce the
  // request that was made, not the request today's defaults would produce.
  ModelSettings settings = 5;
}
