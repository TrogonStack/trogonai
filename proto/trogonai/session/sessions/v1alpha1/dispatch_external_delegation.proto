edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "trogonai/session/sessions/v1alpha1/digest.proto";

// DispatchExternalDelegation hands work to an agent outside this store,
// recording [ExternalDelegationDispatched].
//
// Write precondition At: one dispatch per operation_id.
message DispatchExternalDelegation {
  string session_id = 1 [features.field_presence = LEGACY_REQUIRED];
  string operation_id = 2 [features.field_presence = LEGACY_REQUIRED];
  string delegate_reference = 3 [features.field_presence = LEGACY_REQUIRED];
  string authenticated_remote_subject = 4 [features.field_presence = LEGACY_REQUIRED];
  string authorization_reference = 5 [features.field_presence = LEGACY_REQUIRED];
  Digest request_digest = 6 [features.field_presence = LEGACY_REQUIRED];
  string correlation_id = 7 [features.field_presence = LEGACY_REQUIRED];
}
