edition = "2024";

package trogonai.session.sessions.v1alpha1;

import "buf/validate/validate.proto";

// RequestToolCall records that the model asked for a tool, recording
// [ToolCallRequested].
//
// Write precondition Any: this is the aggregate's highest-volume path and it
// commutes with everything else, so it never coordinates and never retries.
message RequestToolCall {
  string session_id = 1 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  // Identity of the request. Approval, denial, and start all join on it.
  string tool_call_id = 2 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  // Retry identity of this execution of the call. The terminal outcome joins
  // on it, so a re-execution settles the attempt it belongs to.
  string tool_execution_id = 3 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string tool_name = 4 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string input_json = 5 [features.field_presence = LEGACY_REQUIRED];
  string parent_tool_use_id = 6 [(buf.validate.field).string.min_len = 1];
  // The ledger operation guarding this call's side effect, when it reserves one.
  string operation_id = 7 [(buf.validate.field).string.min_len = 1];
  string turn_id = 8 [
    features.field_presence = LEGACY_REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
